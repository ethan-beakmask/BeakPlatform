# BeakPlatform CI/CD Pipeline
# CI: Runs on every push and PR
# CD: Auto-deploy to 192.168.0.15 after CI passes (push to main only)

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    name: Security Scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install semgrep bandit

      - name: Semgrep - Custom Rules (ERROR = blocking)
        run: |
          semgrep --config=.semgrep/ --severity=ERROR --error backend/ modules/

      - name: Semgrep - Flask Rules (non-blocking)
        run: |
          semgrep --config=p/flask backend/ modules/ || echo "Flask rules found issues (non-blocking)"

      - name: Bandit (non-blocking)
        run: |
          bandit -r backend/app/ modules/ -c pyproject.toml || echo "Bandit found issues (non-blocking)"

  test:
    runs-on: ubuntu-latest
    name: Tests
    needs: [security-scan]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: beakplatform
          POSTGRES_PASSWORD: postgres123
          POSTGRES_DB: beakplatform_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run tests
        env:
          FLASK_ENV: testing
          DATABASE_URL: postgresql://beakplatform:postgres123@postgres:5432/beakplatform_test
          SECRET_KEY: test-secret-key-for-ci
        run: |
          cd backend
          pytest tests/ -v --tb=short

  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Staging
    needs: [security-scan, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key ethan@192.168.0.15 /opt/BeakPlatform/deploy/deploy-remote.sh
          rm -f ~/.ssh/deploy_key
