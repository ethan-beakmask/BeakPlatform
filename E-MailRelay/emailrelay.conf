# BeakPlatform E-MailRelay Configuration
# ========================================
# 此檔案由系統設定頁面管理，通常不需要手動編輯
#
# 服務啟動指令：
# sudo systemctl start beakplatform-emailrelay
#
# 手動測試指令：
# /usr/sbin/emailrelay --no-daemon --no-smtp \
#   --forward-to smtp.gmail.com:587 \
#   --client-tls \
#   --client-auth /opt/BeakPlatform/E-MailRelay/emailrelay.auth \
#   --spool-dir /opt/BeakPlatform/E-MailRelay/spool \
#   --forward

# Spool 目錄
spool-dir /opt/BeakPlatform/E-MailRelay/spool

# 定期檢查 spool 目錄（秒）
poll 10

# 目標 SMTP 伺服器（Gmail）
forward-to smtp.gmail.com:587

# 啟用 TLS 加密
client-tls

# SMTP 認證檔案
client-auth /opt/BeakPlatform/E-MailRelay/emailrelay.auth

# 日誌設定
log-file /opt/BeakPlatform/E-MailRelay/logs/emailrelay-%d.log

# 不啟動 SMTP 監聽（使用 emailrelay-submit 提交）
no-smtp
