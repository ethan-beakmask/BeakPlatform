# ===========================================================================
# WAF nginx ModSecurity 自訂覆寫
# 由 /etc/modsecurity.d/setup.conf 在 crs-setup.conf 之前載入。
# ===========================================================================

# --- (1) 允許的 HTTP method（含 REST 寫入）---------------------------------
# crs-setup 的 SecAction id:900200 預設是註解掉的，導致規則 911100 對每個
# 非 GET/HEAD/POST 的 method 都記 CRITICAL → 異常分數 +5 → 直接命中
# ANOMALY_INBOUND=5 被擋。這裡補回並加入 REST 常用 method。
SecAction \
 "id:900200,\
  phase:1,\
  nolog,\
  pass,\
  t:none,\
  setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PUT DELETE PATCH'"

# --- (2) 針對特定路徑放寬檢查（範例，預設不啟用）---------------------------
# 若後端有「已登入使用者輸入任意內容」的 API（筆記、程式碼片段、SQL 範例），
# CRS 932/941/942 會誤判。可比照下面的寫法只對那些路徑移除 ARGS 目標，
# URL / header / cookie 仍照常檢查。把前面的 # 拿掉並改成自己的路徑即可。
