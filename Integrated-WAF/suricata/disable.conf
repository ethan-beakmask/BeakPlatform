# suricata-update 的停用清單（install.sh 更新規則時帶 --disable-conf 讀取）
# 三條 TCP stream 重組 sanity-check 規則：對正常流量誤判率極高
# （2026-05-13 曾在三小時內產生四千多筆告警灌爆平台），一律停用。
2210020
2210029
2210045
# cloudflared 每次連線都會查 <tunnel id>.argotunnel.com 這個網域，ET INFO 規則 2047122
# 「DNS Query to Cloudflare Tunneling Domain」會把本機自己的 tunnel 連線當事件、
# 每次重連建一張案件。tunnel 是本節點刻意的元件，不是威脅，停用。
# （沒用 Cloudflare Tunnel 的環境可以把下面這行拿掉，讓它偵測別人的 tunnel。）
2047122
# 同一件事的 TLS SNI 版本：ET INFO 規則 2047123「Observed Cloudflare Tunneling Domain
# (argotunnel .com in TLS SNI)」，cloudflared 連 argotunnel.com 時觸發，理由同上，停用。
# （沒用 Cloudflare Tunnel 的環境可以把下面這行拿掉，讓它偵測別人的 tunnel。）
2047123
# 節點自己的 apt 更新檢查會觸發 ET INFO 規則 2013504「GNU/Linux APT User-Agent Outbound
# likely related to package management」。規則集本身把它標為資訊、非可疑流量，
# 但它的嚴重度是「低」而不是「資訊」，不會被事件過濾丟掉，結果是一裝好就每小時
# 收到一張與攻擊無關的案件，停用。
# （想監看節點上套件安裝行為的環境可以把下面這行拿掉。）
2013504
# 工控協定 DNP3、Modbus 的解讀在本節點沒有啟用（suricata.yaml 的 app-layer 只開
# http、tls、dns），用到這兩種協定的規則每次載入都會失敗並留下錯誤訊息，停用。
# （要監看工控協定的環境：先在 suricata.yaml.tmpl 的 app-layer 啟用，再拿掉下面兩行。）
re:^alert dnp3\s
re:^alert modbus\s
