<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ org.name }} - 公開區</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .logo-container {
            text-align: center;
            margin-bottom: 20px;
        }
        .logo-container img {
            max-width: 200px;
            max-height: 80px;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 300px;
            margin: 0 auto;
        }
        .link-btn {
            display: block;
            padding: 15px 20px;
            text-align: center;
            text-decoration: none;
            border-radius: 6px;
            font-size: 16px;
        }
        .link-btn.primary {
            background: #2563eb;
            color: white;
        }
        .link-btn.secondary {
            background: #f3f4f6;
            color: #374151;
            border: 1px solid #d1d5db;
        }
        .link-btn:hover {
            opacity: 0.9;
        }
        .divider {
            text-align: center;
            color: #9ca3af;
            margin: 10px 0;
        }
        footer {
            text-align: center;
            margin-top: 50px;
            color: #9ca3af;
            font-size: 12px;
        }
    </style>
</head>
<body>
    {% if logo_url %}
    <div class="logo-container">
        <img src="{{ logo_url }}" alt="{{ org.name }}">
    </div>
    {% endif %}

    <h1>{{ org.name }}</h1>

    <div class="links">
        <a href="{{ url_for('auth.org_login', domain_name=domain_name) }}" class="link-btn primary">
            員工登入
        </a>

        <div class="divider">或</div>

        <a href="{{ url_for('auth.org_public_login', domain_name=domain_name) }}" class="link-btn secondary">
            外部人員登入
        </a>
    </div>

    <footer>
        <p>&copy; 2025 BeakMask. Security First.</p>
    </footer>
</body>
</html>
