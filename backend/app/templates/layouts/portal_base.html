<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Portal - BeakMask{% endblock %}</title>

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            font-size: 14px;
            line-height: 1.5;
            background: #1a1a2e;
            color: #e0e0e0;
        }
        a { color: #64b5f6; }
        a:hover { color: #90caf9; }

        .portal-header {
            background: #16213e;
            border-bottom: 1px solid #0f3460;
            padding: 12px 20px;
        }
        .portal-header-content {
            display: flex;
            align-items: center;
            max-width: 100%;
        }
        .portal-logo {
            font-weight: bold;
            font-size: 18px;
            color: #e94560;
            text-decoration: none;
        }
        .portal-nav {
            margin-left: 40px;
        }
        .portal-nav a {
            color: #b0b0b0;
            text-decoration: none;
            margin-right: 20px;
        }
        .portal-nav a:hover { color: #e0e0e0; }

        .portal-content {
            padding: 20px;
        }

        h1 { color: #e94560; margin-top: 0; }
        h2 { color: #64b5f6; border-bottom: 1px solid #333; padding-bottom: 8px; }

        .dev-badge {
            background: #e94560;
            color: white;
            padding: 2px 8px;
            font-size: 11px;
            border-radius: 3px;
            margin-left: 10px;
        }
    </style>

    {% block head %}{% endblock %}
</head>
<body>
    <div class="portal-header">
        <div class="portal-header-content">
            <a href="{{ url_for('main.dashboard') }}" class="portal-logo">BeakMask</a>
            <span class="dev-badge">DEV</span>
            <nav class="portal-nav">
                <a href="{{ url_for('hostconfig.index') }}">主機設定</a>
                <a href="http://192.168.0.16:5008" target="_blank">DevTools (5008)</a>
                <a href="{{ url_for('auth.login') }}">登入系統</a>
            </nav>
        </div>
    </div>

    <div class="portal-content">
        {% block content %}{% endblock %}
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
