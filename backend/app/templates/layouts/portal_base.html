<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Portal - BeakPlatform{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/portal.css') }}">

    {% block head %}{% endblock %}
</head>
<body>
    <div class="portal-header">
        <div class="portal-header-content">
            <a href="{{ url_for('main.dashboard') }}" class="portal-logo">BeakPlatform</a>
            <span class="dev-badge">DEV</span>
            <nav class="portal-nav">
                <a href="{{ url_for('hostconfig.index') }}">主機設定</a>
                <a href="http://192.168.0.16:7001" target="_blank">DevTools (7001)</a>
                <a href="{{ url_for('auth.login') }}">登入系統</a>
            </nav>
        </div>
    </div>

    <div class="portal-content">
        {% block content %}{% endblock %}
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
