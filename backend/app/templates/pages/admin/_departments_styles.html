<style>
    [x-cloak] { display: none !important; }

    /* 覆蓋 base.html 的 max-width 限制，讓頁面填滿可用寬度 */
    .main-content { max-width: none !important; }

    }
    .tree-panel.expanded {
        width: 504px;
        min-width: 504px;
    }

    .tree-header {
        padding: 8px 12px;
        background: #f0f0f0;
        border-bottom: 1px solid #ddd;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 8px;
    }
    .tree-header-left {
        font-weight: bold;
        padding-top: 2px;
    }
    .tree-header-left .conglomerate-name {
        font-size: 11px;

        color: #666;
        margin-top: 2px;

    .tree-header-right {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
    }
    .tree-header-right .btn {
        font-size: 11px;
        padding: 3px 8px;
        min-width: 70px;
    }

    .tree-content {
        padding: 8px;
        max-height: 550px;
        overflow-y: auto;
    }

    .tree-node {
        padding: 6px 8px;
        margin: 2px 0;
        border-radius: 4px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        user-select: none;

    .tree-node.drag-over { background: #cce5ff; border: 2px dashed #0066cc; }
    .tree-node.drag-over-member { background: #d4edda; border: 2px dashed #28a745; }
    .tree-node.root { font-weight: bold; background: #e0e0e0; cursor: default; }

    /* jstree 自訂樣式 */
    #dept-tree { padding: 5px; }
    .jstree-default .jstree-clicked { background: #0066cc !important; color: white !important; }
    .jstree-default .jstree-hovered { background: #e8e8e8 !important; }

    .jstree-default .jstree-node { margin-left: 15px; }

    .jstree-icon.icon-company { font-style: normal !important; color: #2c3e50; }
    .jstree-icon.icon-company::before { content: '■'; }
    .jstree-icon.icon-dept { font-style: normal !important; color: #3498db; }
    .jstree-icon.icon-dept::before { content: '□'; }
    .person-node { font-size: 11px; color: #666; }
    .person-node.leader { color: #d35400; }
    .person-node.employee { color: #2980b9; }
    .role-tag {
        display: inline-block;
        padding: 0 3px;
        border-radius: 2px;
        font-size: 11px;
        margin-right: 3px;
        font-weight: 500;
        background: transparent;
        line-height: 1.2;
    }
    .role-tag.leader { color: #c0392b; border: 1px solid #e74c3c; }
    .role-tag.employee { color: #2471a3; border: none; }

    /* jstree 拖放到外部區域的視覺反饋 */
    .jstree-drop-target {
        background: #d4edda !important;
        border-color: #28a745 !important;
        box-shadow: 0 0 8px rgba(40, 167, 69, 0.5);

        border-radius: 4px;
        background: white;

        border-bottom: 1px solid #ddd;
        font-weight: bold;

    .employee-item:hover {

    .deputy-col .column-label { color: #1565c0; }
    .employee-col .column-label { color: #0c5460; }

        border: 1px solid #ddd;
        border-radius: 4px;

        margin-bottom: 6px;
        cursor: grab;
        font-size: 12px;
    }

    .staff-person:hover { background: #f5f5f5; }
    .staff-person:last-child { margin-bottom: 0; }

    .staff-empty { color: #999; font-size: 11px; font-style: italic; }

    /* 代理人小字 */
    .proxy-section {
        margin-top: 10px;
        padding-top: 8px;
        border-top: 1px dashed #ddd;
    }

    .proxy-label {
        font-size: 10px;
        color: #7b1fa2;
        margin-bottom: 4px;
    }

    /* 保留舊的 leadership-cell 供 jstree drop 使用 */
    .leadership-cell {
        min-height: auto;
    }
    .leadership-cell.drag-over {
        background: #e8f5e9;
        border-color: #4caf50;
    }

    /* 表單樣式 */
    .form-row { margin-bottom: 10px; }

        border-radius: 4px;

    }
    .field-hint {
        font-size: 11px;
        color: #888;
        margin-top: 3px;
    }

    .btn-group { display: flex; gap: 6px; margin-top: 12px; }
    .btn { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
    .btn-primary { background: #0066cc; color: white; }
    .btn-secondary { background: #6c757d; color: white; }
    .btn-danger { background: #dc3545; color: white; }
    .btn-success { background: #28a745; color: white; }
    .btn-sm { padding: 4px 8px; font-size: 11px; }

    .empty-message { color: #888; font-style: italic; padding: 15px; text-align: center; font-size: 13px; }

    .toast {
        position: fixed;
        bottom: 20px;
        right: 20px;
        padding: 12px 20px;
        border-radius: 6px;
        color: white;
        font-weight: 500;
        z-index: 1000;
        animation: slideIn 0.3s ease;
    }
    .toast.success { background: #28a745; }
    .toast.error { background: #dc3545; }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    .drag-hint { font-size: 11px; color: #999; margin-top: 10px; }

    /* 跨部門人員區塊 */
    .cross-member-list {
        margin-bottom: 12px;

    .cross-member-item {

    .cross-add-form .form-row label {

    }
    .cross-add-form .btn-group {

    .cross-drop-hint {

</style>
