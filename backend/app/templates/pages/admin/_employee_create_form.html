{# 新增員工表單 -- 嵌入部門設定頁中間面板 #}
<div class="employee-create-form">
    <div class="emp-form-info" x-show="empTargetDept">
        歸屬部門: <strong x-text="empTargetDept ? empTargetDept.name : ''"></strong>
    </div>
    <div class="emp-form-info emp-form-info-warn" x-show="!empTargetDept">
        未選擇部門，建立後歸入「未分配員工」
    </div>

    <form @submit.prevent="submitEmployee()">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="section-title">必填欄位</div>
        <table class="emp-form-table" border="0" cellpadding="4" cellspacing="0">
            <tr>
                <td class="emp-label"><label class="required">本國姓名</label></td>
                <td>
                    <input type="text" x-model="uc_nativeName" required
                           @input="uc_onNativeNameChange()">
                </td>
            </tr>
            <tr>
                <td class="emp-label"><label class="required">英文姓名</label></td>
                <td>
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <input type="text" x-model="uc_englishName" required
                               @input="uc_onEnglishNameChange()" placeholder="English Name">
                        <button type="button" @click="uc_transliterateName()"
                                :disabled="!uc_nativeName || uc_transliterating"
                                class="btn btn-sm" style="background: #8b5cf6; color: white; white-space: nowrap;"
                                :style="(!uc_nativeName || uc_transliterating) ? 'opacity: 0.5; cursor: not-allowed;' : ''">
                            <span x-show="!uc_transliterating">自動翻譯</span>
                            <span x-show="uc_transliterating">翻譯中...</span>
                        </button>
                    </div>
                    <div class="field-hint" x-show="uc_detectedLang" style="color: #8b5cf6;">
                        偵測語言: <span x-text="uc_langNames[uc_detectedLang] || uc_detectedLang"></span>
                    </div>
                </td>
            </tr>
            <tr>
                <td class="emp-label"><label class="required">帳號</label></td>
                <td>
                    <input type="text" x-model="uc_usernameRaw" required style="width: 120px;"
                           @input="uc_onUsernameManualChange()">@<span x-text="empDomainName"></span>
                    <div class="field-hint" x-show="uc_usernameRaw && uc_usernameRaw !== uc_normalizedUsername()">
                        儲存時將轉換為: <code x-text="uc_normalizedUsername()"></code>
                    </div>
                    <div style="font-size: 12px; margin-top: 4px;">
                        <span x-show="uc_usernameChecking" style="color: #666;">檢查帳號中...</span>
                        <span x-show="uc_usernameChecked && uc_usernameAvailable && uc_normalizedUsername()" style="color: #16a34a;">帳號可用</span>
                        <span x-show="uc_usernameChecked && !uc_usernameAvailable && uc_normalizedUsername()" style="color: #dc2626;">帳號已存在</span>
                    </div>
                </td>
            </tr>
            <tr>
                <td class="emp-label" style="vertical-align: top;"><label>密碼</label></td>
                <td>
                    <div style="display: flex; gap: 8px; align-items: start;">
                        <input x-show="!uc_showPassword" type="password" x-model="uc_password"
                               @input="uc_validatePassword()" :placeholder="uc_suggestedPassword" style="flex:1;">
                        <input x-show="uc_showPassword" type="text" x-model="uc_password"
                               @input="uc_validatePassword()" :placeholder="uc_suggestedPassword" style="flex:1;">
                        <button type="button" @click="uc_showPassword = !uc_showPassword"
                                class="btn btn-sm btn-secondary" x-text="uc_showPassword ? '隱藏' : '顯示'"></button>
                        <button type="button" @click="uc_useSuggestedPassword()"
                                class="btn btn-sm" style="background: #10b981; color: white;">使用建議密碼</button>
                    </div>
                    <div class="field-hint" x-text="uc_passwordRequirements"></div>
                    <div class="field-hint">留空將自動產生強化密碼</div>
                    <div x-show="uc_passwordErrors.length > 0" style="margin-top: 4px;">
                        <template x-for="err in uc_passwordErrors" :key="err">
                            <div style="color: #dc2626; font-size: 12px;" x-text="err"></div>
                        </template>
                    </div>
                    <div x-show="uc_password && uc_passwordErrors.length === 0 && uc_passwordChecked"
                         style="margin-top: 4px; color: #16a34a; font-size: 12px;">密碼符合要求</div>
                </td>
            </tr>
            <tr>
                <td class="emp-label"><label class="required">用戶編號</label></td>
                <td>
                    <div style="display:flex;gap:8px;align-items:center;">
                        <input type="text" x-model="uc_employeeId" required
                               @input="uc_employeeIdManual = true"
                               placeholder="自動產生" style="width:150px;">
                        <select x-model="uc_selectedRule" @change="uc_onRuleChange()" x-show="uc_rules.length > 1" style="width:120px;">
                            <template x-for="rule in uc_rules" :key="rule.secure_code">
                                <option :value="rule.secure_code" x-text="rule.name"></option>
                            </template>
                        </select>
                    </div>
                    <div class="field-hint">
                        <span x-show="uc_hasRules() && !uc_employeeIdManual">將使用自動編號: <span style="font-family:monospace;background:#e8f4fc;padding:2px 6px;border-radius:4px;color:#0066cc;" x-text="uc_nextNumber"></span></span>
                        <span x-show="uc_hasRules() && uc_employeeIdManual" style="color:#666;">手動輸入模式</span>
                        <span x-show="!uc_hasRules()" style="color:#888;">尚未設定編號規則，請手動輸入</span>
                    </div>
                </td>
            </tr>
        </table>

        <details>
            <summary style="cursor:pointer; padding:6px 8px; background:#f9f9f9; border:1px solid #ddd; border-radius:4px; margin-top:8px;">選填欄位</summary>
            <div style="padding:8px; border:1px solid #ddd; border-top:none; border-radius:0 0 4px 4px;">
                <div class="section-title" style="margin-top:4px;">個人資料</div>
                <table class="emp-form-table" border="0" cellpadding="4" cellspacing="0">
                    <tr>
                        <td class="emp-label"><label>暱稱</label></td>
                        <td>
                            <input type="text" x-model="uc_nickname" @input="uc_onNicknameChange()" placeholder="自動遮罩">
                            <div class="field-hint">預設遮罩處理本國姓名</div>
                        </td>
                    </tr>
                    <tr>
                        <td class="emp-label"><label>語系</label></td>
                        <td>
                            <select x-model="uc_interfaceLanguage">
                                <option value="">-- 跟隨企業設定 --</option>
                                <option value="zh-TW">繁體中文 (zh-TW)</option>
                                <option value="zh-CN">简体中文 (zh-CN)</option>
                                <option value="en">English (en)</option>
                            </select>
                        </td>
                    </tr>
                </table>

                <div class="section-title">聯絡方式</div>
                <table class="emp-form-table" border="0" cellpadding="4" cellspacing="0">
                    <tr>
                        <td class="emp-label"><label>通知 Email</label></td>
                        <td><input type="email" x-model="uc_backupEmail1" placeholder="留空使用帳號 Email"></td>
                    </tr>
                    <tr>
                        <td class="emp-label"><label>備用 Email</label></td>
                        <td><input type="email" x-model="uc_backupEmail2"></td>
                    </tr>
                    <tr>
                        <td class="emp-label"><label>手機 1</label></td>
                        <td><input type="tel" x-model="uc_mobilePhone1" placeholder="+886-912-345-678"></td>
                    </tr>
                    <tr>
                        <td class="emp-label"><label>手機 2</label></td>
                        <td><input type="tel" x-model="uc_mobilePhone2"></td>
                    </tr>
                </table>
            </div>
        </details>

        <div class="btn-group" style="margin-top: 10px;">
            <button type="submit" class="btn btn-primary" :disabled="uc_submitting"
                    x-text="uc_submitting ? '建立中...' : '建立員工'"></button>
            <button type="button" class="btn btn-secondary" @click="cancelCreateEmployee()">取消</button>
        </div>
    </form>
</div>
