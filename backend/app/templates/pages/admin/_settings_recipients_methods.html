<script>
// 收件人群組管理
function recipientGroupManager() {
    return {
        groups: [],
        orgTree: [],
        userCache: {},  // 用戶 ID -> 用戶資料的快取
        unitCache: {},  // 部門 ID -> 部門資料的快取
        loading: true,
        showModal: false,
        showDeleteModal: false,
        showPreviewModal: false,
        isEditing: false,
        groupToDelete: null,
        previewGroup: null,
        previewRecipientsList: [],
        sourceTab: 'units',
        userSearch: '',
        searchedUsers: [],
        formData: {
            name: '',
            description: '',
            is_active: true,
            included_units: [],
            included_users: [],
            excluded_units: [],
            excluded_users: []
        },

        async init() {
            await Promise.all([
                this.loadGroups(),
                this.loadOrgTree()
            ]);
        },

        async loadGroups() {
            this.loading = true;
            try {
                const response = await fetch('/api/admin/settings/recipient-groups');
                const result = await response.json();
                if (result.success) {
                    this.groups = result.data;
                }
            } catch (error) {
                console.error('載入收件人群組失敗:', error);
            } finally {
                this.loading = false;
            }
        },

        async loadOrgTree() {
            try {
                const response = await fetch('/api/admin/settings/org-tree');
                const result = await response.json();
                if (result.success) {
                    this.orgTree = result.data;
                    // 建立快取
                    for (const unit of result.data) {
                        this.unitCache[unit.id] = unit;
                    }
                }
            } catch (error) {
                console.error('載入組織樹失敗:', error);
            }
        },

        async searchUsers() {
            if (!this.userSearch.trim()) {
                this.searchedUsers = [];
                return;
            }
            try {
                const response = await fetch(`/api/admin/settings/org-users?search=${encodeURIComponent(this.userSearch)}`);
                const result = await response.json();
                if (result.success) {
                    this.searchedUsers = result.data;
                    // 更新快取
                    for (const user of result.data) {
                        this.userCache[user.id] = user;
                    }
                }
            } catch (error) {
                console.error('搜尋用戶失敗:', error);
            }
        },

        getUnitName(unitId) {
            const unit = this.unitCache[unitId];
            return unit ? unit.name : unitId;
        },

        getUserName(userId) {
            const user = this.userCache[userId];
            return user ? user.name : userId;
        },

        isUnitSelected(unitId) {
            return this.formData.included_units.some(u => u.id === unitId);
        },

        isUserSelected(userId) {
            return this.formData.included_users.includes(userId);
        },

        toggleUnit(unit) {
            const idx = this.formData.included_units.findIndex(u => u.id === unit.id);
            if (idx >= 0) {
                this.formData.included_units.splice(idx, 1);
            } else {
                this.formData.included_units.push({
                    id: unit.id,
                    include_children: false
                });
            }
        },

        toggleUser(user) {
            const idx = this.formData.included_users.indexOf(user.id);
            if (idx >= 0) {
                this.formData.included_users.splice(idx, 1);
            } else {
                this.formData.included_users.push(user.id);
                this.userCache[user.id] = user;
            }
        },

        removeUnit(idx) {
            this.formData.included_units.splice(idx, 1);
        },

        removeUser(idx) {
            this.formData.included_users.splice(idx, 1);
        },

        openCreateModal() {
            this.isEditing = false;
            this.formData = {
                name: '',
                description: '',
                is_active: true,
                included_units: [],
                included_users: [],
                excluded_units: [],
                excluded_users: []
            };
            this.sourceTab = 'units';
            this.userSearch = '';
            this.searchedUsers = [];
            this.showModal = true;
        },

        async openEditModal(group) {
            this.isEditing = true;
            try {
                const response = await fetch(`/api/admin/settings/recipient-groups/${group.id}`);
                const result = await response.json();
                if (result.success) {
                    const data = result.data;
                    this.formData = {
                        id: data.id,
                        name: data.name,
                        description: data.description || '',
                        is_active: data.is_active,
                        included_units: data.included_units || [],
                        included_users: data.included_users || [],
                        excluded_units: data.excluded_units || [],
                        excluded_users: data.excluded_users || []
                    };
                    this.sourceTab = 'units';
                    this.userSearch = '';
                    this.searchedUsers = [];
                    this.showModal = true;
                }
            } catch (error) {
                alert('載入群組失敗：' + error.message);
            }
        },

        closeModal() {
            this.showModal = false;
        },

        async saveGroup() {
            const data = {
                name: this.formData.name,
                description: this.formData.description,
                is_active: this.formData.is_active,
                included_units: this.formData.included_units,
                included_users: this.formData.included_users,
                excluded_units: this.formData.excluded_units,
                excluded_users: this.formData.excluded_users
            };

            try {
                const url = this.isEditing
                    ? `/api/admin/settings/recipient-groups/${this.formData.id}`
                    : '/api/admin/settings/recipient-groups';
                const method = this.isEditing ? 'PUT' : 'POST';

                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCsrfToken()
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                if (result.success) {
                    this.closeModal();
                    await this.loadGroups();
                } else {
                    alert(result.message || '操作失敗');
                }
            } catch (error) {
                alert('操作失敗：' + error.message);
            }
        },

        async previewRecipients(group) {
            this.previewGroup = group;
            this.previewRecipientsList = [];
            this.showPreviewModal = true;

            try {
                const response = await fetch(`/api/admin/settings/recipient-groups/${group.id}/resolve`);
                const result = await response.json();
                if (result.success) {
                    this.previewRecipientsList = result.data.recipients;
                }
            } catch (error) {
                console.error('載入預覽失敗:', error);
            }
        },

        confirmDelete(group) {
            this.groupToDelete = group;
            this.showDeleteModal = true;
        },

        async deleteGroup() {
            if (!this.groupToDelete) return;

            try {
                const response = await fetch(`/api/admin/settings/recipient-groups/${this.groupToDelete.id}`, {
                    method: 'DELETE',
                    headers: {
                        'X-CSRFToken': getCsrfToken()
                    }
                });

                const result = await response.json();
                if (result.success) {
                    this.showDeleteModal = false;
                    this.groupToDelete = null;
                    await this.loadGroups();
                } else {
                    alert(result.message || '刪除失敗');
                }
            } catch (error) {
                alert('刪除失敗：' + error.message);
            }
        }
    };
}
</script>
