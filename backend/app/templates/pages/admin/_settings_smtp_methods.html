<script>
function smtpManager() {
    return {
        configs: [],
        loading: true,
        showModal: false,
        showDeleteModal: false,
        isEditing: false,
        configToDelete: null,
        presets: {},
        formData: {
            name: '',
            smtp_host: '',
            smtp_port: 587,
            use_tls: true,
            use_ssl: false,
            username: '',
            password: '',
            from_email: '',
            from_name: '',
            provider_type: 'generic',
            use_app_password: false,
            is_default: false,
            is_active: true
        },

        async init() {
            await Promise.all([
                this.loadConfigs(),
                this.loadPresets()
            ]);
        },

        async loadConfigs() {
            this.loading = true;
            try {
                const response = await fetch('/api/admin/settings/smtp');
                const result = await response.json();
                if (result.success) {
                    this.configs = result.data;
                }
            } catch (error) {
                console.error('載入 SMTP 設定失敗:', error);
            } finally {
                this.loading = false;
            }
        },

        async loadPresets() {
            try {
                const response = await fetch('/api/admin/settings/smtp/presets');
                const result = await response.json();
                if (result.success) {
                    this.presets = result.data;
                }
            } catch (error) {
                console.error('載入預設值失敗:', error);
            }
        },

        applyPreset() {
            const preset = this.presets[this.formData.provider_type];
            if (preset) {
                this.formData.smtp_host = preset.smtp_host;
                this.formData.smtp_port = preset.smtp_port;
                this.formData.use_tls = preset.use_tls;
                this.formData.use_ssl = preset.use_ssl;
            }
        },

        openCreateModal() {
            this.isEditing = false;
            this.formData = {
                name: '',
                smtp_host: '',
                smtp_port: 587,
                use_tls: true,
                use_ssl: false,
                username: '',
                password: '',
                from_email: '',
                from_name: '',
                provider_type: 'generic',
                use_app_password: false,
                is_default: false,
                is_active: true
            };
            this.showModal = true;
        },

        async openEditModal(config) {
            this.isEditing = true;
            // 取得完整資料（含密碼）
            try {
                const response = await fetch(`/api/admin/settings/smtp/${config.id}`);
                const result = await response.json();
                if (result.success) {
                    const data = result.data;
                    this.formData = {
                        id: data.id,
                        name: data.name,
                        smtp_host: data.smtp_host,
                        smtp_port: data.smtp_port,
                        use_tls: data.use_tls,
                        use_ssl: data.use_ssl,
                        username: data.username,
                        password: '',  // 不回填密碼
                        from_email: data.from_email,
                        from_name: data.from_name || '',
                        provider_type: data.provider_type,
                        use_app_password: data.use_app_password || false,
                        is_default: data.is_default,
                        is_active: data.is_active
                    };
                    this.showModal = true;
                }
            } catch (error) {
                alert('載入設定失敗：' + error.message);
            }
        },

        closeModal() {
            this.showModal = false;
        },

        async saveConfig() {
            const data = { ...this.formData };
            // 編輯時如果密碼為空，不送出
            if (this.isEditing && !data.password) {
                delete data.password;
            }

            try {
                const url = this.isEditing
                    ? `/api/admin/settings/smtp/${this.formData.id}`
                    : '/api/admin/settings/smtp';
                const method = this.isEditing ? 'PUT' : 'POST';

                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCsrfToken()
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                if (result.success) {
                    this.closeModal();
                    await this.loadConfigs();
                } else {
                    alert(result.message || '操作失敗');
                }
            } catch (error) {
                alert('操作失敗：' + error.message);
            }
        },

        async testConfig(config) {
            if (!confirm('要發送測試郵件嗎？')) return;
            const recipient = prompt('請輸入測試收件人信箱：');
            if (!recipient) return;

            try {
                const response = await fetch(`/api/admin/settings/smtp/${config.id}/test`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCsrfToken()
                    },
                    body: JSON.stringify({ test_recipient: recipient })
                });

                const result = await response.json();
                alert(result.message);
                if (result.success) {
                    await this.loadConfigs();  // 重新載入以更新測試狀態
                }
            } catch (error) {
                alert('測試失敗：' + error.message);
            }
        },

        confirmDelete(config) {
            this.configToDelete = config;
            this.showDeleteModal = true;
        },

        async deleteConfig() {
            if (!this.configToDelete) return;

            try {
                const response = await fetch(`/api/admin/settings/smtp/${this.configToDelete.id}`, {
                    method: 'DELETE',
                    headers: {
                        'X-CSRFToken': getCsrfToken()
                    }
                });

                const result = await response.json();
                if (result.success) {
                    this.showDeleteModal = false;
                    this.configToDelete = null;
                    await this.loadConfigs();
                } else {
                    alert(result.message || '刪除失敗');
                }
            } catch (error) {
                alert('刪除失敗：' + error.message);
            }
        }
    };
}
</script>
