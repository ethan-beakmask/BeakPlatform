{% extends 'layouts/base.html' %}

{% block title %}{% if is_admin %}社群設定{% else %}我的社群{% endif %} - BeakMask{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='vendor/beak-trellis/beak-tree.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/org-tree.css') }}">
<style>
    .grp-container {
        display: flex;
        gap: 6px;
        height: calc(100vh - 120px);
        min-height: 500px;
    }

    /* 左側：Tree */
    .grp-tree-panel {
        width: 500px;
        min-width: 320px;
        border: 1px solid #ddd;
        border-radius: 4px;
        display: flex;
        flex-direction: column;
        background: #fafafa;
        flex-shrink: 0;
    }
    .grp-tree-panel .tree-header {
        padding: 6px 10px;
        background: #f0f0f0;
        border-bottom: 1px solid #ddd;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 8px;
    }
    .grp-tree-panel .tree-header-left { font-weight: bold; padding-top: 2px; }
    .grp-tree-panel .tree-header-right {
        display: flex; gap: 4px;
    }
    .grp-tree-panel .tree-header-right .btn {
        font-size: 11px; padding: 3px 8px; min-width: 50px;
    }
    .grp-tree-panel .tree-body {
        flex: 1;
        overflow: auto;
        padding: 0;
    }
    /* Tree 元件樣式覆寫 */
    .grp-tree-panel .bk-tree-container .bt-row { cursor: pointer; }
    .grp-tree-panel .bk-tree-container .bt-row.tg-selected {
        background: #0066cc !important; color: white !important;
    }
    .grp-tree-panel .bk-tree-container .bt-row.tg-selected .bt-label { color: white; }
    .grp-tree-panel .bk-tree-container .bt-row.tg-selected .tg-node-icon { color: white; }
    .tg-node-icon { display: inline-block; width: 15px; text-align: center; margin-right: 3px; }
    .tg-node-icon.root { color: #2c3e50; }
    .tg-node-icon.grp { color: #27ae60; }

    /* 中間：詳情面板 */
    .grp-detail-panel {
        flex: 1;
        min-width: 300px;
        border: 1px solid #ddd;
        border-radius: 4px;
        display: flex;
        flex-direction: column;
        background: white;
        overflow: auto;
    }
    .grp-detail-panel > .panel-header-bar {
        padding: 6px 10px;
        background: #f0f0f0;
        border-bottom: 1px solid #ddd;
        font-weight: bold;
        font-size: 13px;
    }
    .grp-detail-panel > .panel-body { flex: 1; overflow: auto; padding: 10px; }

    /* 編輯區 */
    .grp-edit-section {
        border: 1px solid #ddd;
        border-radius: 4px;
        padding: 8px;
        margin-bottom: 10px;
    }
    .grp-edit-section .section-title {
        font-weight: bold; font-size: 12px; color: #374151;
        margin-bottom: 6px; border-bottom: 1px solid #ddd; padding-bottom: 4px;
    }

    /* 成員佈局 - 左右兩欄 */
    .grp-staff-header {
        font-size: 12px; font-weight: bold; color: #374151;
        margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center;
    }
    .grp-staff-layout {
        display: flex; gap: 8px;
    }
    .grp-staff-left {
        display: flex; flex-direction: column; gap: 6px;
        width: 330px; min-width: 270px;
    }
    .grp-staff-right { flex: 1; }

    /* 成員欄色碼 */
    .staff-column.leader-col { border-color: #ff9800; background: #fff8e1; }
    .staff-column.deputy-col { border-color: #2196f3; background: #e3f2fd; }
    .staff-column.member-col { border-color: #4caf50; background: #e8f5e9; }
    .leader-col .column-label { color: #e65100; }
    .deputy-col .column-label { color: #1565c0; }
    .member-col .column-label { color: #2e7d32; }

    /* 代理人 */
    .proxy-section {
        margin-top: 8px; padding-top: 6px; border-top: 1px dashed #ddd;
    }
    .proxy-label { font-size: 10px; color: #7b1fa2; margin-bottom: 3px; }

    /* 右側：所有帳號 */
    .grp-users-panel {
        width: 360px; min-width: 260px;
        border: 1px solid #ddd; border-radius: 4px;
        background: #fafbfc; flex-shrink: 0;
        display: flex; flex-direction: column;
    }
    .grp-users-panel .users-header {
        padding: 8px 10px; background: #e8eaf6;
        border-bottom: 1px solid #c5cae9;
        font-weight: bold; color: #283593; font-size: 13px;
    }
    .grp-users-panel .users-body { flex: 1; overflow: auto; padding: 6px; }
    .grp-users-panel .users-search {
        width: 100%; padding: 5px 8px; margin-bottom: 6px;
        border: 1px solid #ccc; border-radius: 3px; font-size: 12px;
        box-sizing: border-box;
    }

    /* 外部人員標籤 */
    .ext-badge {
        display: inline-block;
        background: #dc3545;
        color: white;
        font-size: 10px;
        padding: 0 3px;
        border-radius: 2px;
        margin-right: 2px;
        line-height: 14px;
        vertical-align: middle;
        font-weight: bold;
    }

    /* 外部人員擔任管理層: 名字紅字警示 */
    .ext-name {
        color: #dc3545 !important;
        font-weight: bold;
    }

    /* 外部面板拖入 Tree 時高亮 */
    .tree-drop-highlight { background: #e3f2fd !important; outline: 1px dashed #1976d2; }

    /* 拖放提示 */
    .drag-hint {
        font-size: 11px; color: #888; text-align: center;
        padding: 6px 0; border-top: 1px dashed #ddd; margin-top: 6px;
    }
</style>
{% endblock %}

{% block content %}
<h1 style="font-size:16px;margin-bottom:4px;">{% if is_admin %}社群設定{% else %}我的社群{% endif %}</h1>

<script>
window.__GROUPS_CONFIG = {
    orgName: {{ (organization.name if organization else '企業') | tojson }},
    isAdmin: {{ 'true' if is_admin else 'false' }}
};
</script>

<div class="grp-container" x-data="groupManager()" x-init="init()">
    <!-- 左側：Tree -->
    <div class="grp-tree-panel">
        <div class="tree-header">
            <div class="tree-header-left">
                社群分類
            </div>
            <div class="tree-header-right">
                <button class="btn" :class="!showPeopleInTree ? 'btn-primary' : 'btn-secondary'" @click="switchToGroupMode()">社群</button>
                <button class="btn" :class="showPeopleInTree ? 'btn-primary' : 'btn-secondary'" @click="switchToDetailMode()">成員</button>
                <template x-if="isAdmin">
                    <button class="btn btn-success" @click="startCreate()">新增</button>
                </template>
            </div>
        </div>
        <div class="tree-body" id="group-tree"></div>
    </div>

    <!-- 中間：詳情 -->
    <div class="grp-detail-panel">
        <div class="panel-header-bar" x-text="isCreating ? '新增社群' : (selectedGroup ? selectedGroup.name : '社群詳情')"></div>
        <div class="panel-body">
            <template x-if="!selectedGroup && !isCreating">
                <div class="empty-message">請從左側選擇社群</div>
            </template>
            <template x-if="selectedGroup || isCreating">
                <div>
                    <!-- 編輯區 -->
                    <div class="grp-edit-section">
                        <div class="section-title" x-text="isCreating ? '新增社群' : '社群資訊'"></div>
                        <template x-if="isAdmin && (isCreating || selectedGroup)">
                            <form @submit.prevent="isCreating ? createGroup() : updateGroup()">
                                <div class="form-row">
                                    <label>社群名稱 *</label>
                                    <input type="text" x-model="formData.name" required maxlength="255"
                                           @input.debounce.500ms="isCreating && ciGenerateCode(formData.name)">
                                    <div class="field-hint">最多 255 字元</div>
                                </div>
                                <div class="form-row">
                                    <label>社群代碼</label>
                                    <input type="text" x-model="formData.code" :disabled="!isCreating"
                                           maxlength="50" pattern="[A-Za-z0-9_\-]+"
                                           :placeholder="_ci_generatedCode || '留空自動產生'"
                                           @input.debounce.500ms="ciValidateCode(formData.code)">
                                    <div class="field-hint">選填，留空自動產生。僅限英文、數字、底線、連字號</div>
                                    {% include "partials/_code_input.html" %}
                                </div>
                                <div class="form-row">
                                    <label>父社群</label>
                                    <select x-model="formData.parent_id">
                                        <option value="">(頂層社群)</option>
                                        <template x-for="g in availableParents" :key="g.id">
                                            <option :value="g.id" x-text="'\u2500'.repeat(g.level) + ' ' + g.name"></option>
                                        </template>
                                    </select>
                                </div>
                                <div class="form-row">
                                    <label>描述</label>
                                    <textarea x-model="formData.description" rows="2" maxlength="500"></textarea>
                                    <div class="field-hint">選填，最多 500 字元</div>
                                </div>
                                <div class="btn-group">
                                    <button type="submit" class="btn btn-primary" x-text="isCreating ? '建立' : '儲存'"></button>
                                    <button type="button" class="btn btn-secondary" @click="cancelEdit()">取消</button>
                                    <button type="button" class="btn btn-danger" x-show="!isCreating && selectedGroup" @click="deleteGroup()">刪除</button>
                                </div>
                            </form>
                        </template>
                        <template x-if="!isAdmin && selectedGroup">
                            <div>
                                <div class="form-row">
                                    <label>社群名稱</label>
                                    <div style="padding: 4px 0; font-weight: 500;" x-text="selectedGroup.name"></div>
                                </div>
                                <div class="form-row" x-show="selectedGroup.description">
                                    <label>描述</label>
                                    <div style="padding: 4px 0; color: #666;" x-text="selectedGroup.description"></div>
                                </div>
                            </div>
                        </template>
                    </div>

                    <!-- 成員區 -->
                    <div x-show="selectedGroup">
                        <div class="grp-staff-header">
                            <span>社群成員</span>
                            <span style="font-weight:normal;color:#888;font-size:11px;" x-text="'共 '+totalCount+' 人'"></span>
                        </div>
                        <div class="grp-staff-layout">
                            <!-- 左: 團長+代理人(一) / 副團長+代理人(二) -->
                            <div class="grp-staff-left">
                                <!-- 團長 -->
                                <div class="staff-column leader-col leadership-cell"
                                     :class="{'drag-over': dragOverZone==='manager'}"
                                     @dragover.prevent="onZoneDragOver($event,'manager')"
                                     @dragleave="dragOverZone=null"
                                     @drop="dropToRole($event,'MANAGER')">
                                    <div class="column-label">團長</div>
                                    <template x-if="leadership.manager">
                                        <div class="staff-person" draggable="true" @dragstart="dragStartLeader($event, leadership.manager, 'manager')" @dragend="clearDrag()">
                                            <span class="emp-id" x-text="leadership.manager.employee_id||'-'"></span>
                                            <span class="emp-native" :class="{'ext-name': leadership.manager.user_type === 'EXTERNAL'}" x-text="leadership.manager.native_name||leadership.manager.display_name"></span>
                                            <span class="emp-english" x-text="leadership.manager.english_name||''"></span>
                                            <span class="remove-btn" @click.stop="removeMember(leadership.manager, 'manager')" title="移除">&times;</span>
                                        </div>
                                    </template>
                                    <template x-if="!leadership.manager">
                                        <div class="staff-empty">拖入設為團長</div>
                                    </template>
                                    <!-- 代理人(一) -->
                                    <div class="proxy-section leadership-cell"
                                         :class="{'drag-over': dragOverZone==='proxy1'}"
                                         @dragover.prevent.stop="onZoneDragOver($event,'proxy1')"
                                         @dragleave="dragOverZone=null"
                                         @drop.stop="dropToRole($event,'PROXY1')">
                                        <div class="proxy-label">代理人(一)</div>
                                        <template x-if="leadership.proxy1">
                                            <div class="staff-person" draggable="true" @dragstart="dragStartLeader($event, leadership.proxy1, 'proxy1')" @dragend="clearDrag()">
                                                <span class="emp-id" x-text="leadership.proxy1.employee_id||'-'"></span>
                                                <span class="emp-native" :class="{'ext-name': leadership.proxy1.user_type === 'EXTERNAL'}" x-text="leadership.proxy1.native_name||leadership.proxy1.display_name"></span>
                                            </div>
                                        </template>
                                        <template x-if="!leadership.proxy1">
                                            <div class="staff-empty">拖入設定</div>
                                        </template>
                                    </div>
                                </div>
                                <!-- 副團長 -->
                                <div class="staff-column deputy-col leadership-cell"
                                     :class="{'drag-over': dragOverZone==='deputy'}"
                                     @dragover.prevent="onZoneDragOver($event,'deputy')"
                                     @dragleave="dragOverZone=null"
                                     @drop="dropToRole($event,'DEPUTY')">
                                    <div class="column-label">副團長</div>
                                    <template x-if="leadership.deputy">
                                        <div class="staff-person" draggable="true" @dragstart="dragStartLeader($event, leadership.deputy, 'deputy')" @dragend="clearDrag()">
                                            <span class="emp-id" x-text="leadership.deputy.employee_id||'-'"></span>
                                            <span class="emp-native" :class="{'ext-name': leadership.deputy.user_type === 'EXTERNAL'}" x-text="leadership.deputy.native_name||leadership.deputy.display_name"></span>
                                            <span class="emp-english" x-text="leadership.deputy.english_name||''"></span>
                                            <span class="remove-btn" @click.stop="removeMember(leadership.deputy, 'deputy')" title="移除">&times;</span>
                                        </div>
                                    </template>
                                    <template x-if="!leadership.deputy">
                                        <div class="staff-empty">拖入設為副團長</div>
                                    </template>
                                    <!-- 代理人(二) -->
                                    <div class="proxy-section leadership-cell"
                                         :class="{'drag-over': dragOverZone==='proxy2'}"
                                         @dragover.prevent.stop="onZoneDragOver($event,'proxy2')"
                                         @dragleave="dragOverZone=null"
                                         @drop.stop="dropToRole($event,'PROXY2')">
                                        <div class="proxy-label">代理人(二)</div>
                                        <template x-if="leadership.proxy2">
                                            <div class="staff-person" draggable="true" @dragstart="dragStartLeader($event, leadership.proxy2, 'proxy2')" @dragend="clearDrag()">
                                                <span class="emp-id" x-text="leadership.proxy2.employee_id||'-'"></span>
                                                <span class="emp-native" :class="{'ext-name': leadership.proxy2.user_type === 'EXTERNAL'}" x-text="leadership.proxy2.native_name||leadership.proxy2.display_name"></span>
                                            </div>
                                        </template>
                                        <template x-if="!leadership.proxy2">
                                            <div class="staff-empty">拖入設定</div>
                                        </template>
                                    </div>
                                </div>
                            </div>
                            <!-- 右: 團員 -->
                            <div class="grp-staff-right">
                                <div class="staff-column member-col" style="height:100%;"
                                     :class="{'drag-over': dragOverZone==='member'}"
                                     @dragover.prevent="onZoneDragOver($event,'member')"
                                     @dragleave="dragOverZone=null"
                                     @drop="dropToRole($event,'MEMBER')">
                                    <div class="column-label">團員</div>
                                    <template x-if="regularMembers.length > 0">
                                        <div>
                                            <template x-for="m in regularMembers" :key="m.id">
                                                <div class="staff-person" draggable="true" @dragstart="dragStartMember($event, m)" @dragend="clearDrag()">
                                                    <span class="ext-badge" x-show="m.user?.user_type === 'EXTERNAL'" x-cloak>外</span>
                                                    <span class="emp-id" x-text="m.user?.employee_id || '-'"></span>
                                                    <span class="emp-native" x-text="m.user?.native_name || m.user?.display_name"></span>
                                                    <span class="emp-english" x-text="m.user?.english_name || ''"></span>
                                                    <span class="remove-btn" @click.stop="removeMemberDirect(m)" title="移除">&times;</span>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                    <template x-if="regularMembers.length===0">
                                        <div class="staff-empty">從右側拖入團員</div>
                                    </template>
                                </div>
                            </div>
                        </div>
                        <div class="drag-hint">
                            拖入團長/副團長欄設為管理層 | 拖入團員欄成為一般成員 | 點 x 移除成員
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <!-- 右側：所有帳號 -->
    <div class="grp-users-panel">
        <div class="users-header">
            所有帳號
            <span style="font-weight:normal;font-size:11px;" x-text="'('+filteredUsers.length+')'"></span>
        </div>
        <div class="users-body">
            <input type="text" class="users-search" placeholder="搜尋姓名/工號..."
                   x-model="userSearch" @input="filterUsers()">
            <template x-for="user in filteredUsers" :key="user.id">
                <div class="user-item"
                     :class="{ 'is-member': isMember(user.id) }"
                     draggable="true"
                     @dragstart="dragStartUser($event, user)">
                    <span class="ext-badge" x-show="user.user_type === 'EXTERNAL'" x-cloak>外</span>
                    <span class="emp-id" x-text="user.employee_id || '-'"></span>
                    <span class="emp-native" x-text="user.native_name || user.display_name"></span>
                    <span class="emp-english" x-text="user.english_name || ''"></span>
                </div>
            </template>
            <template x-if="filteredUsers.length === 0">
                <div class="empty-message">無符合的帳號</div>
            </template>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='vendor/beak-trellis/beak-tree-model.js') }}"></script>
<script src="{{ url_for('static', filename='vendor/beak-trellis/beak-tree.js') }}"></script>
<script src="{{ url_for('static', filename='vendor/beak-trellis/beak-tree-drag.js') }}"></script>
<script src="{{ url_for('static', filename='vendor/beak-trellis/renderers/beak-tree-lines-dom.js') }}"></script>
<script src="{{ url_for('static', filename='js/code-input.js') }}"></script>
<script src="{{ url_for('static', filename='js/groups.js') }}"></script>
{% endblock %}
