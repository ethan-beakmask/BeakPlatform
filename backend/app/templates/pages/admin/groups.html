{% extends 'layouts/base.html' %}

{% block title %}社群設定 - BeakMask{% endblock %}

{% block head %}
<!-- jQuery + jstree (本地) -->
<script src="{{ url_for('static', filename='vendor/jquery.min.js') }}"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='vendor/jstree.min.css') }}" />
<script src="{{ url_for('static', filename='vendor/jstree.min.js') }}"></script>
<!-- 共用樹狀面板樣式 -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/org-tree.css') }}">
<script src="{{ url_for('static', filename='js/code-input.js') }}"></script>
{% endblock %}

{% block content %}
<h1>社群設定</h1>

<div x-data="groupManager()" x-init="init()">
    <div class="main-container">
        <!-- 左側：樹狀目錄 -->
        <div class="tree-panel" :class="{ expanded: treeExpanded }">
            <div class="tree-header">
                <div class="tree-header-left">
                    社群分類
                    {% if conglomerate %}<div class="conglomerate-name">{{ conglomerate.name }}</div>{% endif %}
                </div>
                <div class="tree-header-right">
                    <!-- 1,2 上排 -->
                    <button class="btn" :class="!showPeopleInTree ? 'btn-primary' : 'btn-secondary'" @click="switchToGroupMode()">社群</button>
                    <button class="btn btn-success" @click="startCreate()">新增社群</button>
                    <!-- 3,4 下排 -->
                    <button class="btn" :class="showPeopleInTree ? 'btn-primary' : 'btn-secondary'" @click="switchToDetailMode()">成員</button>
                    <button class="btn" :class="treeExpanded ? 'btn-primary' : 'btn-secondary'" @click="treeExpanded = !treeExpanded" x-text="treeExpanded ? '◀ 收合' : '展開 ▶'"></button>
                </div>
            </div>
            <div class="tree-content">
                <!-- jstree 容器 -->
                <div id="group-tree"></div>
            </div>
        </div>

        <!-- 中間：詳情面板 -->
        <div class="detail-panel">
            <!-- 社群資訊 -->
            <div class="panel-section">
                <div class="section-header">
                    <span x-text="isCreating ? '新增社群' : (selectedGroup ? '編輯社群' : '社群資訊')"></span>
                </div>
                <div class="section-content">
                    <template x-if="isCreating || selectedGroup">
                        <form @submit.prevent="isCreating ? createGroup() : updateGroup()">
                            <div class="form-row">
                                <label>社群名稱 *</label>
                                <input type="text" x-model="formData.name" required maxlength="255"
                                       @input.debounce.500ms="isCreating && ciGenerateCode(formData.name)">
                                <div class="field-hint">最多 255 字元</div>
                            </div>
                            <div class="form-row">
                                <label>社群代碼</label>
                                <input type="text" x-model="formData.code" :disabled="!isCreating"
                                       maxlength="50" pattern="[A-Za-z0-9_\-]+"
                                       :placeholder="_ci_generatedCode || '留空自動產生'"
                                       @input.debounce.500ms="ciValidateCode(formData.code)">
                                <div class="field-hint">選填，留空自動產生。僅限英文、數字、底線、連字號</div>
                                {% include "partials/_code_input.html" %}
                            </div>
                            <div class="form-row">
                                <label>父社群</label>
                                <select x-model="formData.parent_id">
                                    <option value="">（頂層社群）</option>
                                    <template x-for="g in availableParents" :key="g.id">
                                        <option :value="g.id" x-text="'─'.repeat(g.level) + ' ' + g.name"></option>
                                    </template>
                                </select>
                            </div>
                            <div class="form-row">
                                <label>描述</label>
                                <textarea x-model="formData.description" rows="2" maxlength="500"></textarea>
                                <div class="field-hint">選填，最多 500 字元</div>
                            </div>
                            <div class="btn-group">
                                <button type="submit" class="btn btn-primary" x-text="isCreating ? '建立' : '儲存'"></button>
                                <button type="button" class="btn btn-secondary" @click="cancelEdit()">取消</button>
                                <button type="button" class="btn btn-danger" x-show="!isCreating && selectedGroup" @click="deleteGroup()">刪除</button>
                            </div>
                        </form>
                    </template>
                    <template x-if="!isCreating && !selectedGroup">
                        <div class="empty-message">請從左側選擇社群</div>
                    </template>
                </div>
            </div>

            <!-- 社群成員（三欄佈局） -->
            <div class="panel-section" x-show="selectedGroup">
                <div class="section-header">
                    <span>社群成員</span>
                    <span style="font-weight: normal; color: #666; font-size: 12px;" x-text="'共 ' + totalCount + ' 人'"></span>
                </div>
                <div class="section-content">
                    <div class="staff-layout">
                        <!-- 團長欄 -->
                        <div class="staff-column leader-col leadership-cell"
                             :class="{ 'drag-over': dragOverZone === 'leader' }"
                             @dragover.prevent="dragOverZone = 'leader'"
                             @dragleave="dragOverZone = null"
                             @drop="dropToRole($event, 'MANAGER')">
                            <div class="column-label">團長</div>
                            <template x-if="leadership.manager">
                                <div class="staff-person" draggable="true" @dragstart="dragStartLeader($event, leadership.manager, 'manager')">
                                    <span class="emp-id" x-text="leadership.manager.employee_id || '-'"></span>
                                    <span class="emp-native" x-text="leadership.manager.native_name || leadership.manager.display_name"></span>
                                    <span class="emp-english" x-text="leadership.manager.english_name || ''"></span>
                                    <span class="remove-btn" @click.stop="removeMember(leadership.manager, 'manager')" title="移除">×</span>
                                </div>
                            </template>
                            <template x-if="!leadership.manager">
                                <div class="staff-empty">拖入設為團長</div>
                            </template>
                            <!-- 代理人(一) -->
                            <div class="proxy-section leadership-cell"
                                 :class="{ 'drag-over': dragOverZone === 'proxy1' }"
                                 @dragover.prevent.stop="dragOverZone = 'proxy1'"
                                 @dragleave="dragOverZone = null"
                                 @drop.stop="dropToRole($event, 'PROXY1')">
                                <div class="proxy-label">代理人(一)</div>
                                <template x-if="leadership.proxy1">
                                    <div class="staff-person" draggable="true" @dragstart="dragStartLeader($event, leadership.proxy1, 'proxy1')">
                                        <span class="emp-id" x-text="leadership.proxy1.employee_id || '-'"></span>
                                        <span class="emp-native" x-text="leadership.proxy1.native_name || leadership.proxy1.display_name"></span>
                                        <span class="remove-btn" @click.stop="removeMember(leadership.proxy1, 'proxy1')" title="移除">×</span>
                                    </div>
                                </template>
                                <template x-if="!leadership.proxy1">
                                    <div class="staff-empty">拖入設定</div>
                                </template>
                            </div>
                        </div>

                        <!-- 副團長欄 -->
                        <div class="staff-column deputy-col leadership-cell"
                             :class="{ 'drag-over': dragOverZone === 'deputy' }"
                             @dragover.prevent="dragOverZone = 'deputy'"
                             @dragleave="dragOverZone = null"
                             @drop="dropToRole($event, 'DEPUTY')">
                            <div class="column-label">副團長</div>
                            <template x-if="leadership.deputy">
                                <div class="staff-person" draggable="true" @dragstart="dragStartLeader($event, leadership.deputy, 'deputy')">
                                    <span class="emp-id" x-text="leadership.deputy.employee_id || '-'"></span>
                                    <span class="emp-native" x-text="leadership.deputy.native_name || leadership.deputy.display_name"></span>
                                    <span class="emp-english" x-text="leadership.deputy.english_name || ''"></span>
                                    <span class="remove-btn" @click.stop="removeMember(leadership.deputy, 'deputy')" title="移除">×</span>
                                </div>
                            </template>
                            <template x-if="!leadership.deputy">
                                <div class="staff-empty">拖入設為副團長</div>
                            </template>
                            <!-- 代理人(二) -->
                            <div class="proxy-section leadership-cell"
                                 :class="{ 'drag-over': dragOverZone === 'proxy2' }"
                                 @dragover.prevent.stop="dragOverZone = 'proxy2'"
                                 @dragleave="dragOverZone = null"
                                 @drop.stop="dropToRole($event, 'PROXY2')">
                                <div class="proxy-label">代理人(二)</div>
                                <template x-if="leadership.proxy2">
                                    <div class="staff-person" draggable="true" @dragstart="dragStartLeader($event, leadership.proxy2, 'proxy2')">
                                        <span class="emp-id" x-text="leadership.proxy2.employee_id || '-'"></span>
                                        <span class="emp-native" x-text="leadership.proxy2.native_name || leadership.proxy2.display_name"></span>
                                        <span class="remove-btn" @click.stop="removeMember(leadership.proxy2, 'proxy2')" title="移除">×</span>
                                    </div>
                                </template>
                                <template x-if="!leadership.proxy2">
                                    <div class="staff-empty">拖入設定</div>
                                </template>
                            </div>
                        </div>

                        <!-- 團員欄 -->
                        <div class="staff-column member-col"
                             :class="{ 'drag-over': dragOverZone === 'member' }"
                             @dragover.prevent="dragOverZone = 'member'"
                             @dragleave="dragOverZone = null"
                             @drop="dropToRole($event, 'MEMBER')">
                            <div class="column-label">團員</div>
                            <template x-if="regularMembers.length > 0">
                                <div>
                                    <template x-for="m in regularMembers" :key="m.id">
                                        <div class="staff-person" draggable="true" @dragstart="dragStartMember($event, m)">
                                            <span class="emp-id" x-text="m.user?.employee_id || '-'"></span>
                                            <span class="emp-native" x-text="m.user?.native_name || m.user?.display_name"></span>
                                            <span class="emp-english" x-text="m.user?.english_name || ''"></span>
                                            <span class="remove-btn" @click.stop="removeMemberDirect(m)" title="移除">×</span>
                                        </div>
                                    </template>
                                </div>
                            </template>
                            <template x-if="regularMembers.length === 0">
                                <div class="staff-empty">從右側拖入團員</div>
                            </template>
                        </div>
                    </div>
                    <div class="drag-hint">
                        拖入團長/副團長欄設為管理層 | 拖入團員欄成為一般成員 | 點 × 移除成員
                    </div>
                </div>
            </div>
        </div>

        <!-- 右側：所有帳號 -->
        <div class="users-panel">
            <div class="users-header">
                所有帳號
                <span style="font-weight: normal; font-size: 12px;" x-text="'(' + filteredUsers.length + ')'"></span>
            </div>
            <div class="users-content">
                <input type="text" class="users-search" placeholder="搜尋姓名/工號..."
                       x-model="userSearch" @input="filterUsers()">
                <template x-for="user in filteredUsers" :key="user.id">
                    <div class="user-item"
                         :class="{ 'is-member': isMember(user.id) }"
                         draggable="true"
                         @dragstart="dragStartUser($event, user)">
                        <span class="emp-id" x-text="user.employee_id || '-'"></span>
                        <span class="emp-native" x-text="user.native_name || user.display_name"></span>
                        <span class="emp-english" x-text="user.english_name || ''"></span>
                    </div>
                </template>
                <template x-if="filteredUsers.length === 0">
                    <div class="empty-message">無符合的帳號</div>
                </template>
            </div>
        </div>
    </div>
</div>

<!-- Window Bridge: Jinja2 → JS -->
<script>
window.__GROUPS_CONFIG = {
    orgName: '{{ organization.name if organization else "企業" }}'
};
</script>
<script src="{{ url_for('static', filename='js/groups.js') }}"></script>
{% endblock %}
