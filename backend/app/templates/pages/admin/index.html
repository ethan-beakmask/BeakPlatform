{% extends 'layouts/base.html' %}

{% block title %}企業管理 - BeakMask{% endblock %}

{% block content %}
<h1>企業管理</h1>

<p>歡迎使用企業管理功能。</p>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 20px;">
    <div style="border: 1px solid #ddd; padding: 20px; border-radius: 8px;">
        <h3>系統設定</h3>
        <p>管理企業基本資訊、選單配置等設定。</p>
        <a href="{{ url_for('admin.settings') }}">[進入設定]</a>
    </div>

    <div style="border: 1px solid #ddd; padding: 20px; border-radius: 8px;">
        <h3>用戶管理</h3>
        <p>管理企業內的用戶帳號。</p>
        <a href="{{ url_for('users.list_users') }}">[管理用戶]</a>
    </div>

    <div style="border: 1px solid #ddd; padding: 20px; border-radius: 8px;">
        <h3>角色權限</h3>
        <p>設定角色及其權限。</p>
        <a href="{{ url_for('roles.list_roles') }}">[管理角色]</a>
    </div>

    <div style="border: 1px solid #ddd; padding: 20px; border-radius: 8px;">
        <h3>選單管理</h3>
        <p>自訂企業選單結構。</p>
        <a href="{{ url_for('menu.list_menu') }}">[管理選單]</a>
    </div>
</div>
{% endblock %}
