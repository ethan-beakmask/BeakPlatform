{% extends 'layouts/base.html' %}

{% block title %}共用月曆 - {{ schedule.name }} - BeakPlatform{% endblock %}

{% block head %}
<style>
    .page-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
    }
    .year-nav {
        display: flex;
        align-items: center;
        gap: 16px;
    }
    .year-nav button {
        background: #f5f5f5;
        border: 1px solid #ddd;
        padding: 6px 12px;
        border-radius: 4px;
        cursor: pointer;
    }
    .year-nav button:hover {
        background: #eee;
    }
    .year-nav span {
        font-size: 18px;
        font-weight: 600;
    }

    .calendar-container {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
        margin-bottom: 30px;
    }
    @media (max-width: 1200px) {
        .calendar-container {
            grid-template-columns: repeat(3, 1fr);
        }
    }
    @media (max-width: 900px) {
        .calendar-container {
            grid-template-columns: repeat(2, 1fr);
        }
    }
    @media (max-width: 600px) {
        .calendar-container {
            grid-template-columns: 1fr;
        }
    }

    .month-card {
        border: 1px solid #eee;
        border-radius: 8px;
        overflow: hidden;
    }
    .month-header {
        background: #f5f5f5;
        padding: 10px;
        text-align: center;
        font-weight: 600;
    }
    .month-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        text-align: center;
    }
    .weekday-header {
        padding: 6px 0;
        font-size: 11px;
        color: #666;
        border-bottom: 1px solid #eee;
    }
    .weekday-header:nth-child(1),
    .weekday-header:nth-child(7) {
        color: #dc2626;
    }
    .day-cell {
        padding: 8px 4px;
        font-size: 13px;
        cursor: pointer;
        position: relative;
    }
    .day-cell:hover {
        background: #f0f0f0;
    }
    .day-cell.empty {
        cursor: default;
    }
    .day-cell.empty:hover {
        background: transparent;
    }
    .day-cell.weekend {
        color: #dc2626;
    }
    .day-cell.holiday {
        background: #fee2e2;
        color: #dc2626;
        font-weight: 600;
    }
    .day-cell.workday {
        background: #dbeafe;
        color: #1d4ed8;
        font-weight: 600;
    }
    .day-cell.comp_off {
        background: #fef3c7;
        color: #d97706;
        font-weight: 600;
    }
    .day-cell.today {
        outline: 2px solid #0066cc;
        outline-offset: -2px;
    }
    .day-indicator {
        position: absolute;
        bottom: 2px;
        left: 50%;
        transform: translateX(-50%);
        width: 4px;
        height: 4px;
        border-radius: 50%;
    }
    .day-indicator.holiday {
        background: #dc2626;
    }
    .day-indicator.workday {
        background: #1d4ed8;
    }

    .legend {
        display: flex;
        gap: 20px;
        margin-bottom: 20px;
        flex-wrap: wrap;
    }
    .legend-item {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
    }
    .legend-box {
        width: 16px;
        height: 16px;
        border-radius: 3px;
    }
    .legend-box.holiday {
        background: #fee2e2;
        border: 1px solid #fca5a5;
    }
    .legend-box.workday {
        background: #dbeafe;
        border: 1px solid #93c5fd;
    }
    .legend-box.weekend {
        background: white;
        border: 1px solid #ddd;
        color: #dc2626;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
    }

    .holidays-list {
        margin-top: 30px;
    }
    .holidays-table {
        width: 100%;
        border-collapse: collapse;
    }
    .holidays-table th,
    .holidays-table td {
        padding: 10px 12px;
        text-align: left;
        border-bottom: 1px solid #eee;
    }
    .holidays-table th {
        background: #f5f5f5;
        font-weight: 600;
    }
    .holidays-table tr:hover {
        background: #fafafa;
    }
    .badge-holiday {
        background: #fee2e2;
        color: #dc2626;
        padding: 2px 8px;
        border-radius: 12px;
        font-size: 12px;
    }
    .badge-workday {
        background: #dbeafe;
        color: #1d4ed8;
        padding: 2px 8px;
        border-radius: 12px;
        font-size: 12px;
    }
    .badge-comp_off {
        background: #fef3c7;
        color: #d97706;
        padding: 2px 8px;
        border-radius: 12px;
        font-size: 12px;
    }
    .actions button {
        background: none;
        border: none;
        color: #0066cc;
        cursor: pointer;
        padding: 0;
        margin-right: 8px;
        font-size: 13px;
    }
    .actions button:hover {
        text-decoration: underline;
    }
    .actions .danger {
        color: #dc2626;
    }

    .btn-primary {
        background: #0066cc;
        color: white;
        padding: 8px 16px;
        border: none;
        border-radius: 4px;
        text-decoration: none;
        display: inline-block;
        cursor: pointer;
    }
    .btn-primary:hover {
        background: #0052a3;
    }
    .btn-secondary {
        background: #f5f5f5;
        color: #333;
        padding: 8px 16px;
        border: 1px solid #ddd;
        border-radius: 4px;
        cursor: pointer;
    }
    .btn-secondary:hover {
        background: #eee;
    }

    /* Modal */
    .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
    }
    .modal-content {
        background: white;
        border-radius: 8px;
        width: 90%;
        max-width: 500px;
        max-height: 90vh;
        overflow-y: auto;
    }
    .modal-header {
        padding: 16px 20px;
        border-bottom: 1px solid #eee;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .modal-header h3 {
        margin: 0;
    }
    .modal-body {
        padding: 20px;
    }
    .modal-footer {
        padding: 16px 20px;
        border-top: 1px solid #eee;
        display: flex;
        justify-content: flex-end;
        gap: 10px;
    }
    .close-btn {
        background: none;
        border: none;
        font-size: 24px;
        cursor: pointer;
        color: #666;
    }
    .form-group {
        margin-bottom: 16px;
    }
    .form-group label {
        display: block;
        margin-bottom: 6px;
        font-weight: 500;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
        width: 70%;
        padding: 8px 12px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 14px;
    }
    .form-group input:focus,
    .form-group select:focus {
        outline: none;
        border-color: #0066cc;
    }
    .form-hint {
        font-size: 12px;
        color: #666;
        margin-top: 4px;
    }
    .alert {
        padding: 12px;
        border-radius: 4px;
        margin-bottom: 16px;
    }
    .alert-success {
        background: #f0fdf4;
        color: #16a34a;
    }
    .alert-error {
        background: #fef2f2;
        color: #dc2626;
    }
    .import-section {
        margin-top: 20px;
        padding: 15px;
        background: #f9f9f9;
        border-radius: 4px;
    }
    .import-section h4 {
        margin-top: 0;
    }
</style>
{% endblock %}

{% block content %}
<div x-data="holidaysApp()">
    <p>
        <a href="{{ url_for('work_schedules.list_schedules') }}">&lt; 返回班表列表</a>
    </p>

    <div class="page-header">
        <div>
            <h1>共用月曆</h1>
            <p style="color: #666; margin: 5px 0 0;">{{ schedule.name }}</p>
        </div>
        <div style="display: flex; gap: 10px; align-items: center;">
            <div class="year-nav">
                <button @click="changeYear(-1)">&lt;</button>
                <span x-text="year"></span>
                <button @click="changeYear(1)">&gt;</button>
            </div>
            <button class="btn-primary" @click="openAddModal()">+ 新增假日</button>
        </div>
    </div>

    <!-- Alert -->
    <template x-if="message">
        <div class="alert" :class="messageType === 'success' ? 'alert-success' : 'alert-error'" x-text="message"></div>
    </template>

    <!-- Legend -->
    <div class="legend">
        <div class="legend-item">
            <div class="legend-box holiday"></div>
            <span>假日</span>
        </div>
        <div class="legend-item">
            <div class="legend-box" style="background: #fef3c7; border: 1px solid #fcd34d;"></div>
            <span>補假</span>
        </div>
        <div class="legend-item">
            <div class="legend-box workday"></div>
            <span>補班</span>
        </div>
        <div class="legend-item">
            <div class="legend-box weekend">六</div>
            <span>週末（依班表設定）</span>
        </div>
    </div>

    <!-- Calendar Grid -->
    <div class="calendar-container">
        <template x-for="month in 12" :key="month">
            <div class="month-card">
                <div class="month-header" x-text="monthNames[month - 1]"></div>
                <div class="month-grid">
                    <div class="weekday-header">日</div>
                    <div class="weekday-header">一</div>
                    <div class="weekday-header">二</div>
                    <div class="weekday-header">三</div>
                    <div class="weekday-header">四</div>
                    <div class="weekday-header">五</div>
                    <div class="weekday-header">六</div>
                    <template x-for="cell in getMonthCells(month)" :key="cell.key">
                        <div class="day-cell"
                             :class="getDayClass(cell)"
                             @click="cell.day && onDayClick(month, cell.day)">
                            <span x-text="cell.day || ''"></span>
                        </div>
                    </template>
                </div>
            </div>
        </template>
    </div>

    <!-- Holidays List -->
    <div class="holidays-list">
        <h3>假日/補班列表</h3>
        <template x-if="holidays.length > 0">
            <table class="holidays-table">
                <thead>
                    <tr>
                        <th>日期</th>
                        <th>類型</th>
                        <th>說明</th>
                        <th>工作時段</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <template x-for="h in holidays" :key="h.id">
                        <tr>
                            <td x-text="h.holiday_date"></td>
                            <td>
                                <span :class="getTypeBadgeClass(h.holiday_type)"
                                      x-text="getTypeLabel(h.holiday_type)"></span>
                            </td>
                            <td x-text="h.description || '-'"></td>
                            <td x-text="h.work_periods ? h.work_periods.join(', ') : '-'"></td>
                            <td class="actions">
                                <button @click="editHoliday(h)">編輯</button>
                                <button class="danger" @click="deleteHoliday(h)">刪除</button>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </template>
        <template x-if="holidays.length === 0">
            <p style="color: #666;">本年度尚未設定任何假日/補班</p>
        </template>
    </div>

    <!-- Import Section -->
    <div class="import-section">
        <h4>批次匯入</h4>
        <p style="font-size: 13px; color: #666; margin-bottom: 10px;">
            匯入 {{ year }} 年台灣國定假日
        </p>
        <button class="btn-secondary" @click="importTWHolidays()">匯入 {{ year }} 年台灣假日</button>
    </div>

    <!-- Add/Edit Modal -->
    <template x-if="showModal">
        <div class="modal-overlay">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 x-text="editingHoliday ? '編輯假日設定' : '假日/補班設定'"></h3>
                    <button class="close-btn" @click="closeModal()">×</button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label>開始日期 *</label>
                        <input type="date" x-model="form.holiday_date" :disabled="editingHoliday">
                    </div>
                    <template x-if="!editingHoliday">
                        <div class="form-group">
                            <label>結束日期</label>
                            <input type="date" x-model="form.end_date" :min="form.holiday_date">
                            <div class="form-hint">留空表示僅設定單日</div>
                        </div>
                    </template>

                    <!-- 取消設定勾選（非編輯模式） -->
                    <template x-if="!editingHoliday">
                        <div class="form-group" style="margin: 16px 0; padding: 12px; background: #fef2f2; border-radius: 4px;">
                            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; margin: 0;">
                                <input type="checkbox" x-model="form.cancelMode" style="width: auto;">
                                <span style="color: #dc2626;">取消設定（回復班表預設值）</span>
                            </label>
                            <div class="form-hint" style="margin-left: 24px;">勾選後將刪除範圍內的假日/補班設定</div>
                        </div>
                    </template>

                    <!-- 非取消模式才顯示的欄位 -->
                    <template x-if="!form.cancelMode">
                        <div>
                            <div class="form-group">
                                <label>類型 *</label>
                                <select x-model="form.holiday_type">
                                    <option value="HOLIDAY">假日（休假）</option>
                                    <option value="COMP_OFF">補假（休假）</option>
                                    <option value="WORKDAY">補班（上班）</option>
                                </select>
                            </div>
                            <template x-if="form.holiday_type === 'WORKDAY'">
                                <div class="form-group">
                                    <label>工作時段 *</label>
                                    <input type="text" x-model="form.work_periods_str"
                                           placeholder="09:00-12:00,13:00-17:00">
                                    <div class="form-hint">多時段用逗號分隔</div>
                                </div>
                            </template>
                            <div class="form-group">
                                <label>說明</label>
                                <input type="text" x-model="form.description" placeholder="例：中秋節">
                            </div>
                        </div>
                    </template>
                </div>
                <div class="modal-footer">
                    <button class="btn-secondary" @click="closeModal()">取消</button>
                    <button class="btn-primary"
                            :style="form.cancelMode ? 'background: #dc2626' : ''"
                            @click="saveHoliday()"
                            :disabled="saving">
                        <span x-text="saving ? '處理中...' : (form.cancelMode ? '確認取消設定' : '儲存')"></span>
                    </button>
                </div>
            </div>
        </div>
    </template>
</div>

<script>
function holidaysApp() {
    return {
        scheduleId: '{{ schedule.secure_code }}',
        year: {{ year }},
        holidays: [],
        holidayMap: {},
        showModal: false,
        editingHoliday: null,
        saving: false,
        message: '',
        messageType: '',
        monthNames: ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'],
        weeklyHours: {{ schedule.weekly_hours | tojson | safe }},
        form: {
            holiday_date: '',
            end_date: '',
            holiday_type: 'HOLIDAY',
            work_periods_str: '',
            description: '',
            cancelMode: false
        },

        init() {
            this.loadHolidays();
        },

        // 類型 badge 樣式
        getTypeBadgeClass(type) {
            const classes = {
                'HOLIDAY': 'badge-holiday',
                'COMP_OFF': 'badge-comp_off',
                'WORKDAY': 'badge-workday'
            };
            return classes[type] || 'badge-holiday';
        },

        // 類型顯示文字
        getTypeLabel(type) {
            const labels = {
                'HOLIDAY': '假日',
                'COMP_OFF': '補假',
                'WORKDAY': '補班'
            };
            return labels[type] || type;
        },

        async loadHolidays() {
            try {
                const response = await fetch(`/api/admin/work-schedules/${this.scheduleId}/holidays?year=${this.year}`);
                const result = await response.json();
                if (result.success) {
                    this.holidays = result.data;
                    this.buildHolidayMap();
                }
            } catch (error) {
                console.error('載入假日失敗:', error);
            }
        },

        buildHolidayMap() {
            this.holidayMap = {};
            for (const h of this.holidays) {
                this.holidayMap[h.holiday_date] = h;
            }
        },

        changeYear(delta) {
            this.year += delta;
            window.history.replaceState({}, '', `?year=${this.year}`);
            this.loadHolidays();
        },

        getMonthCells(month) {
            const cells = [];
            const firstDay = new Date(this.year, month - 1, 1).getDay();
            const daysInMonth = new Date(this.year, month, 0).getDate();

            // Empty cells before first day
            for (let i = 0; i < firstDay; i++) {
                cells.push({ key: `empty-${i}`, day: null });
            }

            // Day cells
            for (let d = 1; d <= daysInMonth; d++) {
                cells.push({ key: `day-${d}`, day: d, month });
            }

            return cells;
        },

        getDayClass(cell) {
            if (!cell.day) return 'empty';

            const classes = [];
            const dateStr = `${this.year}-${String(cell.month).padStart(2, '0')}-${String(cell.day).padStart(2, '0')}`;
            const dayOfWeek = new Date(this.year, cell.month - 1, cell.day).getDay();

            // Check holiday map
            if (this.holidayMap[dateStr]) {
                classes.push(this.holidayMap[dateStr].holiday_type.toLowerCase());
            } else {
                // Check weekly hours (weekend)
                const dayName = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'][dayOfWeek];
                const periods = this.weeklyHours[dayName];
                if (!periods || periods.length === 0) {
                    classes.push('weekend');
                }
            }

            // Today
            const today = new Date();
            if (this.year === today.getFullYear() &&
                cell.month === today.getMonth() + 1 &&
                cell.day === today.getDate()) {
                classes.push('today');
            }

            return classes.join(' ');
        },

        onDayClick(month, day) {
            const dateStr = `${this.year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;

            // 點擊任何日期都開啟設定對話窗（支援範圍選擇）
            this.form = {
                holiday_date: dateStr,
                end_date: '',
                holiday_type: 'HOLIDAY',
                work_periods_str: '',
                description: '',
                cancelMode: false
            };
            this.editingHoliday = null;
            this.showModal = true;
        },

        openAddModal() {
            this.editingHoliday = null;
            this.form = {
                holiday_date: '',
                end_date: '',
                holiday_type: 'HOLIDAY',
                work_periods_str: '',
                description: '',
                cancelMode: false
            };
            this.showModal = true;
        },

        editHoliday(h) {
            this.editingHoliday = h;
            this.form = {
                holiday_date: h.holiday_date,
                holiday_type: h.holiday_type,
                work_periods_str: h.work_periods ? h.work_periods.join(',') : '',
                description: h.description || ''
            };
            this.showModal = true;
        },

        closeModal() {
            this.showModal = false;
            this.editingHoliday = null;
        },

        // 檢查日期是否為班表休息日（週末）
        isScheduleRestDay(dateStr) {
            const d = new Date(dateStr);
            const dayOfWeek = d.getDay();
            const dayMap = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
            const dayKey = dayMap[dayOfWeek];
            const periods = this.weeklyHours[dayKey];
            return !periods || periods.length === 0;
        },

        // 產生日期範圍內的所有日期
        getDateRange(startStr, endStr) {
            const dates = [];
            const start = new Date(startStr);
            const end = endStr ? new Date(endStr) : start;

            for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
                dates.push(d.toISOString().split('T')[0]);
            }
            return dates;
        },

        async saveHoliday() {
            if (!this.form.holiday_date) {
                this.showMessage('請選擇日期', 'error');
                return;
            }

            // 編輯模式：單日更新
            if (this.editingHoliday) {
                await this.saveSingleHoliday();
                return;
            }

            // 取消模式：刪除範圍內的假日設定
            if (this.form.cancelMode) {
                await this.deleteHolidayRange();
                return;
            }

            // 新增模式：檢查日期範圍
            const dates = this.getDateRange(this.form.holiday_date, this.form.end_date);

            // 檢查範圍內是否有班表休息日（週末）
            const restDays = dates.filter(d => this.isScheduleRestDay(d));
            const workDays = dates.filter(d => !this.isScheduleRestDay(d));

            let datesToSave = dates;

            if (restDays.length > 0 && workDays.length > 0) {
                // 混合工作日和休息日
                const restDayNames = restDays.map(d => {
                    const date = new Date(d);
                    const dayNames = ['日', '一', '二', '三', '四', '五', '六'];
                    return `${d} (週${dayNames[date.getDay()]})`;
                }).join('\n');

                const choice = confirm(
                    `選取範圍包含以下班表休息日：\n${restDayNames}\n\n` +
                    `按「確定」：包含休息日一起設定\n` +
                    `按「取消」：僅設定工作日`
                );

                if (!choice) {
                    datesToSave = workDays;
                }
            }

            if (datesToSave.length === 0) {
                this.showMessage('選取範圍內沒有需要設定的日期', 'error');
                return;
            }

            // 準備批次資料
            const holidays = datesToSave.map(date => ({
                date: date,
                type: this.form.holiday_type,
                description: this.form.description,
                work_periods: this.form.holiday_type === 'WORKDAY'
                    ? this.form.work_periods_str.split(',').map(s => s.trim()).filter(s => s)
                    : null
            }));

            // 驗證補班日工作時段
            if (this.form.holiday_type === 'WORKDAY') {
                const periods = this.form.work_periods_str.split(',').map(s => s.trim()).filter(s => s);
                if (periods.length === 0) {
                    this.showMessage('補班日請設定工作時段', 'error');
                    return;
                }
            }

            this.saving = true;
            try {
                const response = await fetch(
                    `/api/admin/work-schedules/${this.scheduleId}/holidays/batch`,
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': document.querySelector('meta[name="csrf-token"]').content
                        },
                        body: JSON.stringify({ holidays, replace_year: false })
                    }
                );

                const result = await response.json();
                if (result.success) {
                    this.showMessage(`已新增 ${datesToSave.length} 天假日設定`, 'success');
                    this.closeModal();
                    await this.loadHolidays();
                } else {
                    this.showMessage(result.message, 'error');
                }
            } catch (error) {
                this.showMessage('操作失敗: ' + error.message, 'error');
            } finally {
                this.saving = false;
            }
        },

        // 單日儲存（編輯模式用）
        async saveSingleHoliday() {
            const data = {
                holiday_date: this.form.holiday_date,
                holiday_type: this.form.holiday_type,
                description: this.form.description
            };

            if (this.form.holiday_type === 'WORKDAY') {
                const periods = this.form.work_periods_str.split(',').map(s => s.trim()).filter(s => s);
                if (periods.length === 0) {
                    this.showMessage('補班日請設定工作時段', 'error');
                    return;
                }
                data.work_periods = periods;
            }

            this.saving = true;
            try {
                const response = await fetch(
                    `/api/admin/work-schedules/${this.scheduleId}/holidays/${this.editingHoliday.id}`,
                    {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': document.querySelector('meta[name="csrf-token"]').content
                        },
                        body: JSON.stringify(data)
                    }
                );

                const result = await response.json();
                if (result.success) {
                    this.showMessage(result.message, 'success');
                    this.closeModal();
                    await this.loadHolidays();
                } else {
                    this.showMessage(result.message, 'error');
                }
            } catch (error) {
                this.showMessage('操作失敗: ' + error.message, 'error');
            } finally {
                this.saving = false;
            }
        },

        async deleteHoliday(h) {
            if (!confirm(`確定要刪除 ${h.holiday_date} 的設定嗎？`)) return;

            try {
                const response = await fetch(
                    `/api/admin/work-schedules/${this.scheduleId}/holidays/${h.id}`,
                    {
                        method: 'DELETE',
                        headers: {
                            'X-CSRFToken': document.querySelector('meta[name="csrf-token"]').content
                        }
                    }
                );
                const result = await response.json();
                if (result.success) {
                    this.showMessage(result.message, 'success');
                    await this.loadHolidays();
                } else {
                    this.showMessage(result.message, 'error');
                }
            } catch (error) {
                this.showMessage('操作失敗: ' + error.message, 'error');
            }
        },

        // 批次刪除日期範圍內的假日（回復預設值）
        async deleteHolidayRange() {
            const dates = this.getDateRange(this.form.holiday_date, this.form.end_date);

            // 找出範圍內有設定的假日
            const holidaysToDelete = dates
                .filter(d => this.holidayMap[d])
                .map(d => this.holidayMap[d]);

            if (holidaysToDelete.length === 0) {
                this.showMessage('選取範圍內沒有假日/補班設定，無需取消', 'error');
                return;
            }

            this.saving = true;
            let successCount = 0;
            let failCount = 0;

            try {
                for (const h of holidaysToDelete) {
                    try {
                        const response = await fetch(
                            `/api/admin/work-schedules/${this.scheduleId}/holidays/${h.id}`,
                            {
                                method: 'DELETE',
                                headers: {
                                    'X-CSRFToken': document.querySelector('meta[name="csrf-token"]').content
                                }
                            }
                        );
                        const result = await response.json();
                        if (result.success) {
                            successCount++;
                        } else {
                            failCount++;
                        }
                    } catch {
                        failCount++;
                    }
                }

                if (failCount === 0) {
                    this.showMessage(`已取消 ${successCount} 筆設定，回復班表預設值`, 'success');
                } else {
                    this.showMessage(`取消完成：成功 ${successCount} 筆，失敗 ${failCount} 筆`, 'error');
                }
                this.closeModal();
                await this.loadHolidays();
            } catch (error) {
                this.showMessage('操作失敗: ' + error.message, 'error');
            } finally {
                this.saving = false;
            }
        },

        async importTWHolidays() {
            // 2026 年台灣國定假日
            const twHolidays2026 = [
                { date: '2026-01-01', type: 'HOLIDAY', description: '中華民國開國紀念日' },
                { date: '2026-01-02', type: 'HOLIDAY', description: '彈性放假' },
                { date: '2026-02-16', type: 'HOLIDAY', description: '農曆除夕' },
                { date: '2026-02-17', type: 'HOLIDAY', description: '春節' },
                { date: '2026-02-18', type: 'HOLIDAY', description: '春節' },
                { date: '2026-02-19', type: 'HOLIDAY', description: '春節' },
                { date: '2026-02-20', type: 'HOLIDAY', description: '春節補假' },
                { date: '2026-02-28', type: 'HOLIDAY', description: '和平紀念日' },
                { date: '2026-04-04', type: 'HOLIDAY', description: '兒童節' },
                { date: '2026-04-05', type: 'HOLIDAY', description: '清明節' },
                { date: '2026-04-06', type: 'HOLIDAY', description: '彈性放假' },
                { date: '2026-05-31', type: 'HOLIDAY', description: '端午節' },
                { date: '2026-10-04', type: 'HOLIDAY', description: '中秋節' },
                { date: '2026-10-05', type: 'HOLIDAY', description: '中秋節補假' },
                { date: '2026-10-10', type: 'HOLIDAY', description: '國慶日' }
            ];

            if (this.year !== 2026) {
                this.showMessage('目前僅支援 2026 年台灣假日資料', 'error');
                return;
            }

            if (!confirm('確定要匯入 2026 年台灣國定假日嗎？已存在的日期將略過。')) return;

            try {
                const response = await fetch(
                    `/api/admin/work-schedules/${this.scheduleId}/holidays/batch`,
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': document.querySelector('meta[name="csrf-token"]').content
                        },
                        body: JSON.stringify({ holidays: twHolidays2026, replace_year: false })
                    }
                );
                const result = await response.json();
                if (result.success) {
                    this.showMessage(result.message, 'success');
                    await this.loadHolidays();
                } else {
                    this.showMessage(result.message, 'error');
                }
            } catch (error) {
                this.showMessage('匯入失敗: ' + error.message, 'error');
            }
        },

        showMessage(msg, type) {
            this.message = msg;
            this.messageType = type;
            setTimeout(() => { this.message = ''; }, 5000);
        }
    };
}
</script>
