{% extends 'layouts/base.html' %}

{% block title %}基本班表 - BeakMask{% endblock %}

{% block head %}
<style>
    .page-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
    }
    .schedules-table {
        width: 100%;
        border-collapse: collapse;
    }
    .schedules-table th,
    .schedules-table td {
        padding: 12px;
        text-align: left;
        border-bottom: 1px solid #eee;
    }
    .schedules-table th {
        background: #f5f5f5;
        font-weight: 600;
    }
    .schedules-table tr:hover {
        background: #fafafa;
    }
    .badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 12px;
        font-size: 12px;
    }
    .badge-default {
        background: #0066cc;
        color: white;
    }
    .badge-active {
        background: #16a34a;
        color: white;
    }
    .badge-inactive {
        background: #888;
        color: white;
    }
    .time-display {
        font-family: monospace;
        font-size: 13px;
        background: #f0f0f0;
        padding: 2px 6px;
        border-radius: 4px;
        margin-right: 4px;
    }
    .day-cell {
        min-width: 100px;
    }
    .day-off {
        color: #999;
        font-style: italic;
    }
    /* 週間工時表格 */
    .weekly-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 2px;
        min-width: 350px;
    }
    .weekly-grid .day-header {
        text-align: center;
        font-weight: 600;
        font-size: 12px;
        padding: 4px 2px;
        background: #f5f5f5;
        border-radius: 3px 3px 0 0;
    }
    .weekly-grid .day-header.weekend {
        color: #dc2626;
    }
    .weekly-grid .day-time {
        text-align: center;
        font-size: 11px;
        padding: 4px 2px;
        background: #fafafa;
        border-radius: 0 0 3px 3px;
        min-height: 32px;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }
    .weekly-grid .day-time.off {
        color: #999;
        font-style: italic;
    }
    .actions a,
    .actions button {
        margin-right: 8px;
        font-size: 13px;
    }
    .actions button {
        background: none;
        border: none;
        color: #0066cc;
        cursor: pointer;
        padding: 0;
    }
    .actions button:hover,
    .actions a:hover {
        text-decoration: underline;
    }
    .actions .danger {
        color: #dc2626;
    }
    .empty-state {
        text-align: center;
        padding: 40px;
        color: #666;
    }
    .btn-primary {
        background: #0066cc;
        color: white;
        padding: 8px 16px;
        border: none;
        border-radius: 4px;
        text-decoration: none;
        display: inline-block;
        cursor: pointer;
    }
    .btn-primary:hover {
        background: #0052a3;
    }
    .btn-secondary {
        background: #f5f5f5;
        color: #333;
        padding: 8px 16px;
        border: 1px solid #ddd;
        border-radius: 4px;
        text-decoration: none;
        display: inline-block;
        cursor: pointer;
    }
    .btn-secondary:hover {
        background: #eee;
    }

    /* Modal */
    .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
    }
    .modal-content {
        background: white;
        border-radius: 8px;
        width: 90%;
        max-width: 1000px;
        max-height: 90vh;
        overflow-y: auto;
    }
    .modal-header {
        padding: 16px 20px;
        border-bottom: 1px solid #eee;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .modal-header h3 {
        margin: 0;
    }
    .modal-body {
        padding: 20px;
    }
    .modal-footer {
        padding: 16px 20px;
        border-top: 1px solid #eee;
        display: flex;
        justify-content: flex-end;
        gap: 10px;
    }
    .close-btn {
        background: none;
        border: none;
        font-size: 24px;
        cursor: pointer;
        color: #666;
    }
    .close-btn:hover {
        color: #333;
    }

    /* Form */
    .form-group {
        margin-bottom: 16px;
    }
    .form-group label {
        display: block;
        margin-bottom: 6px;
        font-weight: 500;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
        width: 80%;
        padding: 8px 12px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 14px;
    }
    .form-group input:focus,
    .form-group select:focus {
        outline: none;
        border-color: #0066cc;
    }
    .form-hint {
        font-size: 12px;
        color: #666;
        margin-top: 4px;
    }
    /* 週間工時設定 */
    .weekly-hours-section {
        margin-top: 10px;
    }
    .day-config {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 0;
        border-bottom: 1px solid #eee;
    }
    .day-config:last-child {
        border-bottom: none;
    }
    .day-label {
        width: 40px;
        font-weight: 600;
        text-align: center;
    }
    .day-label.weekend {
        color: #dc2626;
    }
    .day-config .is-workday {
        width: 60px;
    }
    .day-config select {
        width: auto;
        padding: 4px 8px;
        font-size: 13px;
    }
    .time-selects {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
    }
    .time-selects span {
        font-size: 12px;
        color: #666;
    }
    .break-group {
        display: flex;
        align-items: center;
        gap: 4px;
        background: #f5f5f5;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 12px;
    }
    .break-group select {
        padding: 2px 4px;
        font-size: 12px;
    }
    .add-break-btn, .remove-break-btn {
        background: none;
        border: 1px solid #ddd;
        border-radius: 4px;
        padding: 2px 8px;
        cursor: pointer;
        font-size: 12px;
    }
    .add-break-btn:hover {
        background: #e8f4ff;
        border-color: #0066cc;
    }
    .remove-break-btn {
        color: #dc2626;
        border-color: #fca5a5;
    }
    .remove-break-btn:hover {
        background: #fef2f2;
    }
    .copy-to-others {
        margin-top: 12px;
        padding: 10px;
        background: #f0f9ff;
        border-radius: 4px;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .copy-to-others label {
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        font-size: 13px;
        margin: 0;
    }
    .copy-to-others input[type="checkbox"] {
        width: auto;
    }
    .alert {
        padding: 12px;
        border-radius: 4px;
        margin-bottom: 16px;
    }
    .alert-success {
        background: #f0fdf4;
        color: #16a34a;
        border: 1px solid #86efac;
    }
    .alert-error {
        background: #fef2f2;
        color: #dc2626;
        border: 1px solid #fecaca;
    }
</style>
{% endblock %}

{% block content %}
<div x-data="schedulesApp()">
    <p><a href="{{ url_for('admin.settings') }}">&lt; 返回系統設定</a></p>

    <div class="page-header">
        <h1>基本班表</h1>
        <button class="btn-primary" @click="openCreateModal()">+ 新增班表</button>
    </div>

    <!-- Flash Messages -->
    <template x-if="message">
        <div class="alert" :class="messageType === 'success' ? 'alert-success' : 'alert-error'" x-text="message"></div>
    </template>

    <!-- Schedules Table -->
    <template x-if="schedules.length > 0">
        <table class="schedules-table">
            <thead>
                <tr>
                    <th>班表名稱</th>
                    <th>時區</th>
                    <th>週間工時</th>
                    <th>狀態</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <template x-for="schedule in schedules" :key="schedule.id">
                    <tr>
                        <td>
                            <span x-text="schedule.name"></span>
                            <template x-if="schedule.is_default">
                                <span class="badge badge-default">預設</span>
                            </template>
                        </td>
                        <td x-text="schedule.timezone"></td>
                        <td>
                            <div class="weekly-grid">
                                <!-- 星期標題列 -->
                                <template x-for="day in ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun']" :key="'h-'+day">
                                    <div class="day-header" :class="{ weekend: day === 'sat' || day === 'sun' }"
                                         x-text="dayNames[day]"></div>
                                </template>
                                <!-- 時間列 -->
                                <template x-for="day in ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun']" :key="'t-'+day">
                                    <div class="day-time" :class="{ off: !schedule.weekly_hours[day] || schedule.weekly_hours[day].length === 0 }">
                                        <template x-if="schedule.weekly_hours[day] && schedule.weekly_hours[day].length > 0">
                                            <span x-html="formatDaySchedule(schedule.weekly_hours[day])"></span>
                                        </template>
                                        <template x-if="!schedule.weekly_hours[day] || schedule.weekly_hours[day].length === 0">
                                            <span>休</span>
                                        </template>
                                    </div>
                                </template>
                            </div>
                        </td>
                        <td>
                            <template x-if="schedule.is_active">
                                <span class="badge badge-active">啟用</span>
                            </template>
                            <template x-if="!schedule.is_active">
                                <span class="badge badge-inactive">停用</span>
                            </template>
                        </td>
                        <td class="actions">
                            <a :href="'/admin/settings/work-schedules/' + schedule.id + '/holidays'">假日設定</a>
                            <button @click="openEditModal(schedule)">編輯</button>
                            <template x-if="!schedule.is_default">
                                <button @click="setDefault(schedule)">設為預設</button>
                            </template>
                            <template x-if="!schedule.is_default">
                                <button class="danger" @click="deleteSchedule(schedule)">刪除</button>
                            </template>
                        </td>
                    </tr>
                </template>
            </tbody>
        </table>
    </template>

    <template x-if="schedules.length === 0">
        <div class="empty-state">
            <p>尚未建立任何班表</p>
            <button class="btn-primary" @click="openCreateModal()">建立第一個班表</button>
        </div>
    </template>

    <!-- Help -->
    <div style="margin-top: 30px; padding: 15px; background: #f9f9f9; border-radius: 4px;">
        <h3 style="margin-top: 0;">說明</h3>
        <ul style="margin: 0; padding-left: 20px; color: #666;">
            <li>班表定義員工的標準工作時間</li>
            <li>「預設」班表會自動套用給未指定班表的員工</li>
            <li>週間工時格式：HH:MM-HH:MM，可設定多個時段（如午休分隔）</li>
            <li>留空或設為休表示休息日</li>
            <li>點擊「假日設定」可設定國定假日與補班日</li>
        </ul>
    </div>

    <!-- Create/Edit Modal -->
    <template x-if="showModal">
        <div class="modal-overlay">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 x-text="editingSchedule ? '編輯班表' : '新增班表'"></h3>
                    <button class="close-btn" @click="closeModal()">×</button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label>班表代碼 *</label>
                        <input type="text" x-model="form.schedule_code" placeholder="例：TW-STANDARD"
                               :disabled="editingSchedule">
                        <div class="form-hint">用於系統識別，建立後不可修改</div>
                    </div>
                    <div class="form-group">
                        <label>班表名稱 *</label>
                        <input type="text" x-model="form.name" placeholder="例：台灣標準班表">
                    </div>
                    <div class="form-group">
                        <label>時區</label>
                        <select x-model="form.timezone">
                            <option value="Asia/Taipei">Asia/Taipei (台北)</option>
                            <option value="Asia/Tokyo">Asia/Tokyo (東京)</option>
                            <option value="Asia/Shanghai">Asia/Shanghai (上海)</option>
                            <option value="Asia/Singapore">Asia/Singapore (新加坡)</option>
                            <option value="America/Los_Angeles">America/Los_Angeles (洛杉磯)</option>
                            <option value="America/New_York">America/New_York (紐約)</option>
                            <option value="Europe/London">Europe/London (倫敦)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>週間工時</label>
                        <div class="weekly-hours-section">
                            <template x-for="day in ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun']" :key="day">
                                <div class="day-config">
                                    <span class="day-label" :class="{ weekend: day === 'sat' || day === 'sun' }"
                                          x-text="'週' + dayNames[day]"></span>
                                    <select class="is-workday" x-model="dayConfig[day].isWorkday"
                                            @change="onWorkdayChange(day)">
                                        <option value="true">上班</option>
                                        <option value="false">休息</option>
                                    </select>
                                    <template x-if="dayConfig[day].isWorkday === 'true'">
                                        <div class="time-selects">
                                            <select x-model="dayConfig[day].startTime">
                                                <template x-for="t in timeOptions" :key="'s'+t">
                                                    <option :value="t" x-text="t"></option>
                                                </template>
                                            </select>
                                            <span>~</span>
                                            <select x-model="dayConfig[day].endTime">
                                                <template x-for="t in timeOptions" :key="'e'+t">
                                                    <option :value="t" x-text="t"></option>
                                                </template>
                                            </select>
                                            <!-- 休息時段 -->
                                            <template x-for="(brk, idx) in dayConfig[day].breaks" :key="day + '-brk-' + idx">
                                                <div class="break-group">
                                                    <span>休</span>
                                                    <select :value="brk.start" @change="brk.start = $event.target.value">
                                                        <template x-for="t in timeOptions" :key="day + '-bs-' + idx + '-' + t">
                                                            <option :value="t" x-text="t" :selected="t === brk.start"></option>
                                                        </template>
                                                    </select>
                                                    <span>~</span>
                                                    <select :value="brk.end" @change="brk.end = $event.target.value">
                                                        <template x-for="t in timeOptions" :key="day + '-be-' + idx + '-' + t">
                                                            <option :value="t" x-text="t" :selected="t === brk.end"></option>
                                                        </template>
                                                    </select>
                                                    <button type="button" class="remove-break-btn"
                                                            @click="removeBreak(day, idx)">×</button>
                                                </div>
                                            </template>
                                            <template x-if="dayConfig[day].breaks.length < 3">
                                                <button type="button" class="add-break-btn"
                                                        @click="addBreak(day)">+ 休息</button>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                            </template>
                            <!-- 複製到其他上班日 -->
                            <div class="copy-to-others">
                                <label>
                                    <input type="checkbox" x-model="copyToOthers">
                                    將目前設定的第一個上班日時間複製到所有上班日
                                </label>
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>描述</label>
                        <textarea x-model="form.description" rows="2" placeholder="選填"></textarea>
                    </div>
                    <div class="copy-to-others">
                        <label>
                            <input type="checkbox" x-model="form.is_default">
                            設為企業預設班表
                        </label>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn-secondary" @click="closeModal()">取消</button>
                    <button class="btn-primary" @click="saveSchedule()" :disabled="saving">
                        <span x-text="saving ? '儲存中...' : '儲存'"></span>
                    </button>
                </div>
            </div>
        </div>
    </template>
</div>

<script>
function schedulesApp() {
    // 產生時間選項 (00:00 ~ 23:30，每 30 分鐘)
    const times = [];
    for (let h = 0; h < 24; h++) {
        for (let m = 0; m < 60; m += 30) {
            times.push(`${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`);
        }
    }

    return {
        schedules: {{ schedules_json | tojson | safe }},
        showModal: false,
        editingSchedule: null,
        saving: false,
        message: '',
        messageType: '',
        copyToOthers: false,
        timeOptions: times,
        dayNames: {
            mon: '一', tue: '二', wed: '三', thu: '四',
            fri: '五', sat: '六', sun: '日'
        },
        form: {
            schedule_code: '',
            name: '',
            timezone: 'Asia/Taipei',
            weekly_hours: {},
            description: '',
            is_default: false
        },
        // 每日設定結構
        dayConfig: {
            mon: { isWorkday: 'true', startTime: '09:00', endTime: '18:00', breaks: [{ start: '12:00', end: '13:00' }] },
            tue: { isWorkday: 'true', startTime: '09:00', endTime: '18:00', breaks: [{ start: '12:00', end: '13:00' }] },
            wed: { isWorkday: 'true', startTime: '09:00', endTime: '18:00', breaks: [{ start: '12:00', end: '13:00' }] },
            thu: { isWorkday: 'true', startTime: '09:00', endTime: '18:00', breaks: [{ start: '12:00', end: '13:00' }] },
            fri: { isWorkday: 'true', startTime: '09:00', endTime: '18:00', breaks: [{ start: '12:00', end: '13:00' }] },
            sat: { isWorkday: 'false', startTime: '09:00', endTime: '18:00', breaks: [] },
            sun: { isWorkday: 'false', startTime: '09:00', endTime: '18:00', breaks: [] }
        },

        // 新增休息時段
        addBreak(day) {
            if (this.dayConfig[day].breaks.length < 3) {
                this.dayConfig[day].breaks.push({ start: '12:00', end: '13:00' });
            }
        },

        // 移除休息時段
        removeBreak(day, idx) {
            this.dayConfig[day].breaks.splice(idx, 1);
        },

        // 上班/休息變更
        onWorkdayChange(day) {
            // 不做特別處理，透過 x-model 自動更新
        },

        // 將 dayConfig 轉換為 weekly_hours 格式
        dayConfigToWeeklyHours() {
            const result = {};
            const days = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];

            // 若勾選複製，找第一個上班日的設定
            if (this.copyToOthers) {
                const firstWorkday = days.find(d => this.dayConfig[d].isWorkday === 'true');
                if (firstWorkday) {
                    const src = this.dayConfig[firstWorkday];
                    for (const day of days) {
                        if (this.dayConfig[day].isWorkday === 'true') {
                            this.dayConfig[day].startTime = src.startTime;
                            this.dayConfig[day].endTime = src.endTime;
                            this.dayConfig[day].breaks = JSON.parse(JSON.stringify(src.breaks));
                        }
                    }
                }
            }

            for (const day of days) {
                const cfg = this.dayConfig[day];
                if (cfg.isWorkday !== 'true') {
                    result[day] = null;
                } else {
                    // 建立工作時段（扣除休息時段）
                    const periods = this.buildPeriods(cfg.startTime, cfg.endTime, cfg.breaks);
                    result[day] = periods.length > 0 ? periods : null;
                }
            }
            return result;
        },

        // 建立工作時段字串陣列
        buildPeriods(start, end, breaks) {
            if (!start || !end) return [];

            // 排序休息時段
            const sortedBreaks = [...breaks]
                .filter(b => b.start && b.end)
                .sort((a, b) => a.start.localeCompare(b.start));

            const periods = [];
            let currentStart = start;

            for (const brk of sortedBreaks) {
                if (brk.start > currentStart && brk.start < end) {
                    periods.push(`${currentStart}-${brk.start}`);
                    currentStart = brk.end;
                }
            }

            if (currentStart < end) {
                periods.push(`${currentStart}-${end}`);
            }

            return periods;
        },

        // 從 weekly_hours 初始化 dayConfig
        weeklyHoursToDayConfig(weeklyHours) {
            const days = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
            const newConfig = {};
            for (const day of days) {
                const periods = weeklyHours[day];
                if (!periods || periods.length === 0) {
                    newConfig[day] = {
                        isWorkday: 'false',
                        startTime: '09:00',
                        endTime: '18:00',
                        breaks: []
                    };
                } else {
                    // 解析時段
                    const parsed = this.parsePeriodsToDayConfig(periods);
                    newConfig[day] = {
                        isWorkday: 'true',
                        startTime: parsed.startTime,
                        endTime: parsed.endTime,
                        breaks: parsed.breaks
                    };
                }
            }
            // 整體替換以觸發 Alpine 響應式更新
            this.dayConfig = newConfig;
        },

        // 解析時段字串為 dayConfig 格式
        parsePeriodsToDayConfig(periods) {
            if (!periods || periods.length === 0) {
                return { startTime: '09:00', endTime: '18:00', breaks: [] };
            }

            // 取得最早開始和最晚結束
            let startTime = '23:59';
            let endTime = '00:00';
            const breaks = [];

            for (let i = 0; i < periods.length; i++) {
                const [s, e] = periods[i].split('-');
                if (s < startTime) startTime = s;
                if (e > endTime) endTime = e;

                // 找出休息時段（相鄰時段之間的間隔）
                if (i > 0) {
                    const prevEnd = periods[i - 1].split('-')[1];
                    if (prevEnd < s) {
                        breaks.push({ start: prevEnd, end: s });
                    }
                }
            }

            return { startTime, endTime, breaks };
        },

        openCreateModal() {
            this.editingSchedule = null;
            this.copyToOthers = false;
            this.resetForm();
            this.resetDayConfig();
            this.showModal = true;
        },

        openEditModal(schedule) {
            this.editingSchedule = schedule;
            this.copyToOthers = false;
            this.form = {
                schedule_code: schedule.schedule_code,
                name: schedule.name,
                timezone: schedule.timezone,
                weekly_hours: JSON.parse(JSON.stringify(schedule.weekly_hours)),
                description: schedule.description || '',
                is_default: schedule.is_default
            };
            // 先顯示 modal，讓 select 渲染出來
            this.showModal = true;
            // 下一個 tick 再設定 dayConfig，確保 select options 已渲染
            this.$nextTick(() => {
                this.weeklyHoursToDayConfig(schedule.weekly_hours);
            });
        },

        closeModal() {
            this.showModal = false;
            this.editingSchedule = null;
        },

        resetForm() {
            this.form = {
                schedule_code: '',
                name: '',
                timezone: 'Asia/Taipei',
                weekly_hours: {},
                description: '',
                is_default: false
            };
        },

        resetDayConfig() {
            this.dayConfig = {
                mon: { isWorkday: 'true', startTime: '09:00', endTime: '18:00', breaks: [{ start: '12:00', end: '13:00' }] },
                tue: { isWorkday: 'true', startTime: '09:00', endTime: '18:00', breaks: [{ start: '12:00', end: '13:00' }] },
                wed: { isWorkday: 'true', startTime: '09:00', endTime: '18:00', breaks: [{ start: '12:00', end: '13:00' }] },
                thu: { isWorkday: 'true', startTime: '09:00', endTime: '18:00', breaks: [{ start: '12:00', end: '13:00' }] },
                fri: { isWorkday: 'true', startTime: '09:00', endTime: '18:00', breaks: [{ start: '12:00', end: '13:00' }] },
                sat: { isWorkday: 'false', startTime: '09:00', endTime: '18:00', breaks: [] },
                sun: { isWorkday: 'false', startTime: '09:00', endTime: '18:00', breaks: [] }
            };
        },

        async saveSchedule() {
            if (!this.form.schedule_code || !this.form.name) {
                this.showMessage('請填寫必填欄位', 'error');
                return;
            }

            // 轉換 dayConfig 為 weekly_hours
            this.form.weekly_hours = this.dayConfigToWeeklyHours();

            this.saving = true;
            try {
                const url = this.editingSchedule
                    ? `/api/admin/work-schedules/${this.editingSchedule.id}`
                    : '/api/admin/work-schedules';
                const method = this.editingSchedule ? 'PUT' : 'POST';

                const response = await fetch(url, {
                    method,
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': document.querySelector('meta[name="csrf-token"]').content
                    },
                    body: JSON.stringify(this.form)
                });

                const result = await response.json();
                if (result.success) {
                    // 刷新頁面以確保清單完全更新
                    window.location.reload();
                } else {
                    this.showMessage(result.message, 'error');
                }
            } catch (error) {
                this.showMessage('操作失敗: ' + error.message, 'error');
            } finally {
                this.saving = false;
            }
        },

        async setDefault(schedule) {
            try {
                const response = await fetch(`/api/admin/work-schedules/${schedule.id}/default`, {
                    method: 'PUT',
                    headers: {
                        'X-CSRFToken': document.querySelector('meta[name="csrf-token"]').content
                    }
                });
                const result = await response.json();
                if (result.success) {
                    this.showMessage(result.message, 'success');
                    await this.loadSchedules();
                } else {
                    this.showMessage(result.message, 'error');
                }
            } catch (error) {
                this.showMessage('操作失敗: ' + error.message, 'error');
            }
        },

        async deleteSchedule(schedule) {
            if (!confirm(`確定要刪除班表「${schedule.name}」嗎？`)) return;

            try {
                const response = await fetch(`/api/admin/work-schedules/${schedule.id}`, {
                    method: 'DELETE',
                    headers: {
                        'X-CSRFToken': document.querySelector('meta[name="csrf-token"]').content
                    }
                });
                const result = await response.json();
                if (result.success) {
                    this.showMessage(result.message, 'success');
                    await this.loadSchedules();
                } else {
                    this.showMessage(result.message, 'error');
                }
            } catch (error) {
                this.showMessage('操作失敗: ' + error.message, 'error');
            }
        },

        async loadSchedules() {
            try {
                const response = await fetch('/api/admin/work-schedules');
                const result = await response.json();
                if (result.success) {
                    this.schedules = result.data;
                }
            } catch (error) {
                console.error('載入班表失敗:', error);
            }
        },

        showMessage(msg, type) {
            this.message = msg;
            this.messageType = type;
            setTimeout(() => { this.message = ''; }, 5000);
        },

        // 格式化每日班表顯示（含休息時段）
        formatDaySchedule(periods) {
            if (!periods || periods.length === 0) return '休';

            const result = [];
            // 取得整體範圍
            const firstStart = periods[0].split('-')[0];
            const lastEnd = periods[periods.length - 1].split('-')[1];

            result.push(`<div style="font-weight:600;">${firstStart}~${lastEnd}</div>`);

            // 找出休息時段
            const breaks = [];
            for (let i = 0; i < periods.length - 1; i++) {
                const currEnd = periods[i].split('-')[1];
                const nextStart = periods[i + 1].split('-')[0];
                if (currEnd < nextStart) {
                    breaks.push(`${currEnd}~${nextStart}`);
                }
            }

            if (breaks.length > 0) {
                result.push(`<div style="font-size:10px;color:#888;">休: ${breaks.join(', ')}</div>`);
            }

            return result.join('');
        }
    };
}
</script>
{% endblock %}
