<!-- ==================== 收件人群組設定 ==================== -->
<div id="section-recipients" class="settings-section" :class="{ active: activeSection === 'recipients' }">
    <h2>收件人群組設定</h2>
    <p>系統級收件人群組，供流程節點批次發送通知使用。</p>

    <div x-show="message.recipients" x-cloak
         :class="'message ' + (message.recipientsError ? 'message-error' : 'message-success')"
         x-text="message.recipients"
         x-transition></div>

    <div class="settings-card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
            <h4 style="margin: 0;">收件人群組列表</h4>
            <button class="btn btn-primary" @click="openRecipientModal()">+ 新增群組</button>
        </div>

        <template x-if="loading.recipients">
            <div class="loading">載入中...</div>
        </template>

        <template x-if="!loading.recipients && recipients.groups.length === 0">
            <div class="empty-state">
                <p>尚無收件人群組</p>
                <p style="font-size: 13px;">點擊「新增群組」開始建立</p>
            </div>
        </template>

        <template x-if="!loading.recipients && recipients.groups.length > 0">
            <table class="config-table">
                <thead>
                    <tr>
                        <th>群組名稱</th>
                        <th>描述</th>
                        <th>優先順序</th>
                        <th>狀態</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <template x-for="group in recipients.groups" :key="group.id">
                        <tr>
                            <td x-text="group.name"></td>
                            <td x-text="group.description || '-'"></td>
                            <td x-text="group.priority"></td>
                            <td>
                                <span :class="'badge ' + (group.is_active ? 'badge-success' : 'badge-danger')"
                                      x-text="group.is_active ? '啟用' : '停用'"></span>
                            </td>
                            <td class="actions">
                                <button class="btn btn-secondary" @click="editRecipientGroup(group)">編輯</button>
                                <button class="btn btn-danger" @click="deleteRecipientGroup(group.id)">刪除</button>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </template>
    </div>

    <div class="settings-card" style="background: #f0f9ff; border-color: #bae6fd;">
        <h4 style="color: #0369a1;">說明</h4>
        <ul style="margin: 0; padding-left: 20px; font-size: 13px; color: #0369a1;">
            <li>系統級收件人群組用於跨企業的系統通知</li>
            <li>可指定多個收件人 Email 或用戶 ID</li>
            <li>流程節點可選擇使用這些群組發送通知</li>
        </ul>
    </div>
</div>
