{% extends 'layouts/base.html' %}

{% block title %}{{ _('%(title)s 說明', title=doc.title) }} - BeakPlatform{% endblock %}

{% block head %}
<style>
.help-doc {
    max-width: 880px;
    margin: 24px auto;
    padding: 24px 32px;
    background: var(--color-bg-white);
    border: 1px solid var(--color-border);
    border-radius: 6px;
}
.help-doc__back {
    margin-bottom: 18px;
}
.help-doc h1, .help-doc h2, .help-doc h3 {
    margin-top: 1.4em;
    margin-bottom: 0.6em;
}
.help-doc h2 { border-bottom: 1px solid var(--color-border); padding-bottom: 6px; }
.help-doc p { line-height: 1.7; margin: 0.8em 0; }
.help-doc ul, .help-doc ol { line-height: 1.7; padding-left: 24px; }
.help-doc code { background: var(--color-bg-light); padding: 2px 6px; border-radius: 3px; font-size: 0.92em; }
.help-doc pre { background: var(--color-bg-light); padding: 12px; border-radius: 4px; overflow-x: auto; }
.help-doc table { border-collapse: collapse; margin: 12px 0; }
.help-doc th, .help-doc td { border: 1px solid var(--color-border); padding: 6px 12px; }
.help-doc th { background: var(--color-bg-light); }
</style>
{% endblock %}

{% block content %}
<article class="help-doc">
    <div class="help-doc__back">
        <a href="{{ url_for('platform_help.index') }}">{{ _('返回說明目錄') }}</a>
    </div>
    {{ doc.html|safe }}
</article>
{% endblock %}
