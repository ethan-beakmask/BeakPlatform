# =============================================================================
# Vector — 收集 → 正規化（OCSF）→ 分送
# =============================================================================
# sources:    Suricata eve.json、WAF audit.log、本機測試用 HTTP 注入口
# transforms: 解析 → 對映成 OCSF → 過濾 → 速率封頂
# sinks:      clickhouse（全量）、od-bridge（過濾與封頂後，轉送 BeakPlatform）
#
# 設定值以 $${NAME} 形式從 .env 帶入（compose 的 env_file）。改值後 docker compose restart vector。
# =============================================================================

api:
  enabled: true
  address: 0.0.0.0:8686       # 唯讀 API；來源由主機 nftables 限制在 ADMIN_IPS

# ---------------- sources ----------------
sources:

  suricata_eve:
    type: file
    include:
      - /var/log/suricata/eve.json
    read_from: end
    ignore_older_secs: 600

  modsec_audit:
    type: file
    include:
      - /var/log/modsec/audit.log
    read_from: end
    ignore_older_secs: 600

  # 測試用：直接 POST 一筆 OCSF 事件（compose 只綁 127.0.0.1:8688）
  http_test:
    type: http_server
    address: 0.0.0.0:8688
    encoding: json
    method: POST


# ---------------- transforms ----------------
transforms:

  suricata_parsed:
    type: remap
    inputs: [suricata_eve]
    source: |
      . = parse_json!(.message)
      .timestamp = parse_timestamp!(.timestamp, "%+")

  suricata_alerts_only:
    type: filter
    inputs: [suricata_parsed]
    condition: '.event_type == "alert"'

  # Suricata alert → OCSF network_activity
  # actor.ip 直接讀 .src_ip：suricata.yaml 的 xff 模組（mode: overwrite,
  # header: CF-Connecting-IP）已在 Suricata 內部把 src_ip 覆寫成真實攻擊者；
  # 沒有該 header 時維持 TCP source。.http.xff 是 X-Forwarded-For 完整原文（證據欄位）。
  ocsf_from_suricata:
    type: remap
    inputs: [suricata_alerts_only]
    source: |
      sev_id = to_int(.alert.severity) ?? 3
      # Suricata: 1=High, 2=Medium, 3=Low, 4=Info  → OCSF: 4,3,2,1
      ocsf_sev = if sev_id == 1 { 4 } else if sev_id == 2 { 3 } else if sev_id == 3 { 2 } else { 1 }

      actor_ip = to_string(.src_ip) ?? "0.0.0.0"
      actor_xff = to_string(.http.xff) ?? ""

      out = {
        "correlation_id": uuid_v4(),
        "source_system": "suricata",
        "event_class": "network_activity",
        "occurred_at": format_timestamp!(.timestamp, "%+"),
        "severity_id": ocsf_sev,
        "finding": {
          "title": to_string(.alert.signature) ?? "suricata alert",
          "summary": to_string(.alert.category) ?? "",
          "rule_id": to_string(.alert.signature_id) ?? "",
          "rule_set": "Suricata-ET"
        },
        "actor": { "ip": actor_ip, "xff": actor_xff },
        "target": {
          "host": to_string(.dest_ip) ?? "",
          "url": "",
          "service": ""
        },
        "evidence": {
          "raw_log_ref": { "type": "vector", "locator": to_string(.flow_id) ?? "" },
          "snippet": ""
        }
      }
      . = out

  modsec_parsed:
    type: remap
    inputs: [modsec_audit]
    source: |
      . = parse_json!(.message)

  modsec_with_alerts_only:
    type: filter
    inputs: [modsec_parsed]
    condition: |
      msgs = array(.transaction.messages) ?? []
      code = to_int(.transaction.response.http_code) ?? 0
      length(msgs) > 0 || code >= 400

  # ModSecurity JSON audit → OCSF web_activity
  ocsf_from_modsec:
    type: remap
    inputs: [modsec_with_alerts_only]
    source: |
      # ModSecurity v3 的 JSON audit log 頂層只有 transaction；rule_id 取第一條命中規則。
      # 案件聚合需要 actor_ip + rule_id，rule_id 空就不聚合（一事件一張單）。
      msgs = array(.transaction.messages) ?? []
      first_rule_id = ""
      title = "ModSecurity rule trigger"
      # ModSecurity 沿用 syslog 等級：0=EMERGENCY … 7=DEBUG，取整筆最嚴重的一條
      worst_sev = 7
      if length(msgs) > 0 {
        m0 = object(msgs[0]) ?? {}
        det0 = object(m0.details) ?? {}
        first_rule_id = to_string(det0.ruleId) ?? ""
        t0 = to_string(m0.message) ?? ""
        if t0 != "" {
          title = if length(t0) > 200 { slice!(t0, 0, 200) } else { t0 }
        }
        for_each(msgs) -> |_i, msg| {
          det = object(object(msg).details ?? {}) ?? {}
          s = to_int(det.severity) ?? 7
          if s < worst_sev { worst_sev = s }
        }
      }

      # ModSec severity → OCSF severity_id (1=Low 2=Medium 3=High 4=Critical)
      sev = if worst_sev <= 2 { 4 } else if worst_sev == 3 { 3 } else if worst_sev == 4 { 2 } else { 1 }

      # 攻擊者 IP 的歸因：只有「可信的直連來源」送來的 Cf-Connecting-Ip / X-Forwarded-For
      # 才採信，否則以 TCP source（transaction.client_ip）為準。
      # 可信來源 = cloudflared 容器的固定 IP（+ .env 的 TRUSTED_INGRESS_EXTRA）。
      # 這與 WAF nginx 的 real_ip 模組無關：ModSecurity 讀到的是原始 header，
      # nginx 的 set_real_ip_from 濾不掉它，所以判定必須在這裡做。
      # 其他來源一律「誰打的就記誰」——不是丟棄事件，是正確歸因。
      trusted_ingress = split("${TRUSTED_INGRESS_LIST}", ",")
      hdrs = object(.transaction.request.headers) ?? {}
      cf_ip = string(hdrs."Cf-Connecting-Ip") ?? string(hdrs."CF-Connecting-IP") ?? string(hdrs."cf-connecting-ip") ?? ""
      xff_raw = string(hdrs."X-Forwarded-For") ?? string(hdrs."x-forwarded-for") ?? ""
      xff_first = ""
      if xff_raw != "" {
        xff_parts = split(xff_raw, ",")
        xff_first_raw = to_string(xff_parts[0])
        xff_first = strip_whitespace(xff_first_raw)
      }
      tcp_src = to_string(.transaction.client_ip) ?? "0.0.0.0"
      ingress_trusted = includes(trusted_ingress, tcp_src)
      actor_ip = if ingress_trusted && cf_ip != "" {
        cf_ip
      } else if ingress_trusted && xff_first != "" {
        xff_first
      } else {
        tcp_src
      }
      cf_country = string(hdrs."Cf-Ipcountry") ?? string(hdrs."CF-IPCountry") ?? string(hdrs."cf-ipcountry") ?? ""
      actor_country = if ingress_trusted { cf_country } else { "" }

      out = {
        "correlation_id": uuid_v4(),
        "source_system": "coraza",
        "event_class": "web_activity",
        "occurred_at": format_timestamp!(now(), "%+"),
        "severity_id": sev,
        "finding": {
          "title": title,
          "summary": to_string(.audit_data.messages_count) ?? "",
          "rule_id": first_rule_id,
          "rule_set": "OWASP CRS"
        },
        "actor": {
          "ip": actor_ip,
          "xff": xff_raw,
          "country": actor_country,
          "user_agent": to_string(.transaction.request.headers."User-Agent") ?? ""
        },
        "target": {
          "host": to_string(.transaction.request.headers.Host) ?? "",
          "url": to_string(.transaction.request.uri) ?? "",
          "service": "waf-nginx"
        },
        "evidence": {
          "raw_log_ref": { "type": "modsec", "locator": to_string(.transaction.id) ?? "" },
          "snippet": to_string(.transaction.request.method) ?? ""
        }
      }
      . = out

  # ClickHouse 寬表欄位抽取
  ch_events_from_ocsf:
    type: remap
    inputs: [ocsf_from_suricata, ocsf_from_modsec, http_test]
    source: |
      raw = encode_json(.)
      ts_input = to_string(.occurred_at) ?? ""
      ts_parsed = parse_timestamp(ts_input, "%+") ?? now()
      ts_ch = format_timestamp!(ts_parsed, "%Y-%m-%d %H:%M:%S%.3f")
      . = {
        "event_time":     ts_ch,
        "correlation_id": to_string(.correlation_id) ?? uuid_v4(),
        "source_system":  to_string(.source_system) ?? "unknown",
        "event_class":    to_string(.event_class) ?? "unknown",
        "severity_id":    to_int(.severity_id) ?? 0,
        "confidence":     to_int(.confidence) ?? 0,
        "actor_ip":       to_string(.actor.ip) ?? "::",
        "actor_asn":      to_int(.actor.asn) ?? 0,
        "actor_country":  to_string(.actor.country) ?? "",
        "actor_ua":       to_string(.actor.user_agent) ?? "",
        "actor_xff":      to_string(.actor.xff) ?? "",
        "target_host":    to_string(.target.host) ?? "",
        "target_url":     to_string(.target.url) ?? "",
        "target_service": to_string(.target.service) ?? "",
        "finding_title":  to_string(.finding.title) ?? "",
        "finding_rule_id": to_string(.finding.rule_id) ?? "",
        "finding_rule_set": to_string(.finding.rule_set) ?? "",
        "raw":            raw
      }

  # 進入案件流程前的過濾（ClickHouse 仍保留全部事件）
  intake_filter:
    type: filter
    inputs: [ocsf_from_suricata, ocsf_from_modsec, http_test]
    condition:
      type: vrl
      source: |
        actor_ip = to_string(.actor.ip) ?? ""
        target_h = to_string(.target.host) ?? ""
        sev = to_int(.severity_id) ?? 0
        src = to_string(.source_system) ?? ""

        # 內網 ↔ 內網 全 drop（自家服務互連、內網設備自連）
        internal_actor = (ip_cidr_contains("10.0.0.0/8", actor_ip) ?? false) || (ip_cidr_contains("172.16.0.0/12", actor_ip) ?? false) || (ip_cidr_contains("192.168.0.0/16", actor_ip) ?? false) || (ip_cidr_contains("127.0.0.0/8", actor_ip) ?? false)
        internal_target = starts_with(target_h, "192.168.") || starts_with(target_h, "10.") || starts_with(target_h, "127.") || starts_with(target_h, "172.")

        # 低嚴重度 Suricata：只 drop OCSF 1（Info）。WAF 是 inline 已實際阻擋，不過濾。
        low_sev_suricata = src == "suricata" && sev <= 1

        drop = (internal_actor && internal_target) || low_sev_suricata
        !drop

  # 送往平台的速率封頂（爆量止血）：在源頭壓，事件根本不離開本機。
  # throttle 是「丟棄」不是「聚合」；ClickHouse 路徑走另一條 input，仍是全量。
  intake_throttle_key:
    type: remap
    inputs: [intake_filter]
    source: |
      .throttle_key = join!([
        to_string(.source_system) ?? "?",
        to_string(.finding.rule_id) ?? "?",
        to_string(.actor.ip) ?? "?"
      ], "|")

  # 分來源封頂：suricata 是被動 IDS、同 rule+IP 重複性極高，收得最緊；
  # coraza 是 inline WAF，事件本身就是攻擊證據，放寬讓 SOC 看得到強度。
  intake_route:
    type: route
    inputs: [intake_throttle_key]
    route:
      suricata: '.source_system == "suricata"'
      coraza: '.source_system == "coraza"'

  intake_throttle_suricata:
    type: throttle
    inputs: [intake_route.suricata]
    threshold: ${THROTTLE_SURICATA_THRESHOLD:-1}
    window_secs: ${THROTTLE_SURICATA_WINDOW:-3600}
    key_field: "{{ throttle_key }}"

  intake_throttle_coraza:
    type: throttle
    inputs: [intake_route.coraza]
    threshold: ${THROTTLE_CORAZA_THRESHOLD:-5}
    window_secs: ${THROTTLE_CORAZA_WINDOW:-300}
    key_field: "{{ throttle_key }}"

  intake_throttle_other:
    type: throttle
    inputs: [intake_route._unmatched]
    threshold: 1
    window_secs: 300
    key_field: "{{ throttle_key }}"

  # 全域封頂（不分 key）：前三條各 IP 各有配額，擋得住單一來源爆量、
  # 擋不住分散式掃描；這裡保護平台主機（每張案件都會起工作流程序）。
  intake_global_throttle:
    type: throttle
    inputs:
      - intake_throttle_suricata
      - intake_throttle_coraza
      - intake_throttle_other
    threshold: ${THROTTLE_GLOBAL_THRESHOLD:-8}
    window_secs: ${THROTTLE_GLOBAL_WINDOW:-60}

  # throttle_key 是內部欄位，送出前移除，避免污染 od-bridge 契約 payload
  intake_throttled_clean:
    type: remap
    inputs: [intake_global_throttle]
    source: |
      del(.throttle_key)


# ---------------- sinks ----------------
sinks:

  ch_events:
    type: clickhouse
    inputs: [ch_events_from_ocsf]
    endpoint: http://clickhouse:8123
    database: ${CLICKHOUSE_DB}
    table: events
    auth:
      strategy: basic
      user: ${CLICKHOUSE_USER}
      password: ${CLICKHOUSE_PASSWORD}
    skip_unknown_fields: true
    batch:
      max_events: 500
      timeout_secs: 5
    healthcheck:
      enabled: false

  bridge_intake:
    type: http
    inputs: [intake_throttled_clean]
    uri: http://host.docker.internal:8500/events
    method: post
    encoding:
      codec: json
    framing:
      method: newline_delimited
    request:
      headers:
        Content-Type: application/json
        Authorization: "Bearer ${BRIDGE_INGEST_TOKEN}"
    batch:
      max_events: 1
      timeout_secs: 1
    healthcheck:
      enabled: false
