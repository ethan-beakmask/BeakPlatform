services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: beakmask-app
    restart: unless-stopped
    env_file: .env.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - beakmask
    volumes:
      - app-sessions:/tmp/beakplatform_sessions

  db:
    image: postgres:16-alpine
    container_name: beakmask-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: beakplatform
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
      POSTGRES_DB: beakplatform_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beakplatform -d beakplatform_dev"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - beakmask

  redis:
    image: redis:7-alpine
    container_name: beakmask-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - beakmask

  nginx:
    image: nginx:alpine
    container_name: beakmask-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - beakmask

volumes:
  pgdata:
  app-sessions:

networks:
  beakmask:
    driver: bridge
