# ============================================================
# Research mode override for Open Defense sec-vm.
# Activate:  sudo docker compose -f docker-compose.yml -f docker-compose.research.yml up -d waf-nginx
# Revert:    sudo docker compose up -d waf-nginx
#
# Suricata & Vector switch via symlink (suricata/suricata.yaml ->
# suricata.research.yaml etc.) handled by the `waf-mode` script — they don't
# need compose overrides because they read whichever file the symlink resolves
# to. Only WAF env vars are mode-specific in this override.
# ============================================================

services:
  waf-nginx:
    environment:
      # DetectionOnly: every rule still evaluates and contributes to anomaly
      # score, but no 403 returned. Use to diagnose "is WAF blocking or is .16
      # broken" via binary search, and to study attack patterns end-to-end.
      MODSEC_RULE_ENGINE: "DetectionOnly"
      # Audit every transaction (200 OK too), not just relevant 4xx/5xx
      MODSEC_AUDIT_ENGINE: "On"
      # Parts: A B C D E F G H I J K Z
      #   D = intermediate response body
      #   E = final response body
      #   K = list of every rule that matched, one per line  ← gold mine for research
      MODSEC_AUDIT_LOG_PARTS: "ABCDEFGHIJKZ"
      # Lower thresholds so nolog-tagged contributing rules show in error log
      ERRORLOG_LEVEL: "info"
      BLOCKING_LOG_LEVEL: "info"
    # Cap docker-logs volume — at ~200 MB × 6 = ~1.2 GB ceiling (covers ~6h of
    # access-log + audit at moderate load). Older log files dropped automatically.
    logging:
      driver: json-file
      options:
        max-size: "200m"
        max-file: "6"
