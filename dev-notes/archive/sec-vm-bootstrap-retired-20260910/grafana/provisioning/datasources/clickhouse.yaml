apiVersion: 1

datasources:
  - name: ClickHouse-secstack
    type: grafana-clickhouse-datasource
    uid: ClickHouse-secstack
    access: proxy
    isDefault: true
    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      username: secstack
      defaultDatabase: secstack
      tlsSkipVerify: false
    secureJsonData:
      password: ${CLICKHOUSE_PASSWORD}
    editable: true
