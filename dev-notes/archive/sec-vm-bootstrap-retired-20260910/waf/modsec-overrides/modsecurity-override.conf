# ===========================================================================
# WAF nginx ModSec custom override
# loaded by /etc/modsecurity.d/setup.conf BEFORE crs-setup.conf.
# ===========================================================================

# --- (1) Restore allowed HTTP methods including REST writes -----------------
# CRS-setup's SecAction id:900200 (which defines tx.allowed_methods) is
# commented out by default → rule 911100 fires CRITICAL on every method
# → anomaly +5 hits ANOMALY_INBOUND=5 → 949110 blocks. Restore with REST
# methods added.
SecAction \
 "id:900200,\
  phase:1,\
  nolog,\
  pass,\
  t:none,\
  setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PUT DELETE PATCH'"


# --- (2) Per-endpoint body inspection relaxation ----------------------------
# BeakBroodNest's /api/atoms/* endpoints accept authenticated user-typed
# content (notes, dev logs, code snippets, shell commands). CRS 932/941/942
# false-positives on legitimate content like "grep -rn", "2>/dev/null",
# "<table>", "SELECT * FROM". For these write paths, remove ARGS targets for
# common content-attack tags. URL/headers/cookies still inspected.
#
# Trade-off: trusts the application-layer auth (Flask session) to gate who
# can POST/PUT here. Anonymous endpoints not in this pattern keep full CRS.
SecRule REQUEST_URI "@beginsWith /beakbroodnest/api/atoms/" \
 "id:900300,\
  phase:1,\
  nolog,\
  pass,\
  ctl:ruleRemoveTargetByTag=attack-rce;ARGS,\
  ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS,\
  ctl:ruleRemoveTargetByTag=attack-injection-java;ARGS,\
  ctl:ruleRemoveTargetByTag=attack-injection-nodejs;ARGS,\
  ctl:ruleRemoveTargetByTag=attack-xss;ARGS,\
  ctl:ruleRemoveTargetByTag=attack-sqli;ARGS,\
  ctl:ruleRemoveTargetByTag=attack-lfi;ARGS,\
  ctl:ruleRemoveTargetByTag=attack-rfi;ARGS"
