# BeakPlatform 功能地圖索引
# 用途：AI 收到工單時，先查此索引定位 manifest，再讀 manifest 取得精確檔案清單
#
# 使用方式：
#   1. 用戶提供目標頁面 URL
#   2. AI 在此索引中找到對應的 manifest 檔案
#   3. AI 讀取該 manifest，只開啟列出的檔案
#   4. 不做額外探索，直接在目標檔案中作業

url_index:
  # === 認證 ===
  /auth/:                        auth.yaml

  # === 首頁/儀表板 ===
  /dashboard:                    profile.yaml
  /personal-settings:            profile.yaml
  /change-password:              profile.yaml
  /profile/:                     profile.yaml

  # === 帳號管理 ===
  /users/:                       users.yaml
  /admin/org-admins:             admin-accounts.yaml
  /admin/initial-setup:          admin-accounts.yaml
  /sys-accounts/:                admin-accounts.yaml
  /external-users/:              admin-accounts.yaml
  /organizations/*/admins:       admin-accounts.yaml

  # === 組織管理 ===
  /organizations/:               organizations.yaml
  /api/conglomerates/:           conglomerates.yaml
  /units/:                       units.yaml
  /admin/departments/:           units.yaml
  /admin/groups/:                units.yaml
  /my-groups/:                   units.yaml

  # === 角色與權限 ===
  /roles/:                       roles.yaml
  /permissions/:                 permissions.yaml
  /admin/account-roles/:         permissions.yaml
  /node-grants/:                 node-grants.yaml

  # === 選單 ===
  /menu/:                        menu.yaml
  /calendar/:                    calendar.yaml
  /api/calendar/:                calendar.yaml
  /help/:                        platform-help.yaml
  /help/manual/*:                platform-help.yaml

  # === 人資架構 ===
  /job-levels/:                  hr-structure.yaml
  /job-families/:                hr-structure.yaml
  /job-titles/:                  hr-structure.yaml
  /positions/:                   hr-structure.yaml

  # === 核決與代理 ===
  /job-approval-categories/:     approval-delegation.yaml
  /delegations/:                 approval-delegation.yaml

  # === 模組管理 ===
  /modules/:                     modules-mgmt.yaml
  /admin/module-permissions:     modules-mgmt.yaml
  /admin/module-list:            modules-mgmt.yaml

  # === 設定 ===
  /admin/settings:               settings.yaml
  /hostconfig/:                  hostconfig.yaml

  # === 主機管理 ===
  /server-manage/redis-monitor:  server-manage.yaml

  # === 安全 ===
  /security/:                    security-center.yaml

  # === 排程與編號 ===
  /admin/settings/work-schedules: work-schedules.yaml
  /admin/numbering:              numbering.yaml

  # === 資料庫監視 ===
  /organizations/databases:      org-databases.yaml
  /admin/org-database:           org-databases.yaml
  /admin/cg-databases:           cg-databases.yaml

  # === 頁面與查詢表 ===
  /p/*:                          pages-mgmt.yaml
  /api/pages/:                   pages-mgmt.yaml
  /api/lookup/:                  lookup.yaml
  /api/duties/:                  duties.yaml

  # === 工具 API ===
  /api/code/:                    code-service.yaml
  /api/transliterate/:           transliteration.yaml

  # === 模組 ===
  /form-workflow/:               mod-form-workflow.yaml
  /nocode/:                      mod-nocode-builder.yaml
  /spec-formulate/:              mod-spec-formulate.yaml
  /open-defense/:                mod-open-defense.yaml
  /api/open_defense/:            mod-open-defense.yaml

  # === 基礎設施（非 URL，關鍵字查找） ===
  base_template:                 global-infra.yaml
  navbar:                        global-infra.yaml
  menubar:                       global-infra.yaml
  security_interceptor:          security-core.yaml
  resource_gateway:              security-core.yaml
  egress:                        egress.yaml
  /api/egress/:                  egress.yaml
  csrf:                          security-core.yaml
  rate_limiter:                  security-core.yaml

manifest_files:
  - auth.yaml                    # 認證系統
  - users.yaml                   # 帳號管理
  - organizations.yaml           # 企業管理（含合約）
  - conglomerates.yaml           # 集團管理
  - units.yaml                   # 組織單位（部門+群組）
  - roles.yaml                   # 角色管理
  - menu.yaml                    # 選單管理
  - calendar.yaml                # 企業行事曆
  - permissions.yaml             # 權限中央+帳號角色
  - node-grants.yaml             # 流程節點企業授權
  - platform-help.yaml           # 平台說明與使用者手冊
  - admin-accounts.yaml          # 管理員與特殊帳號
  - hr-structure.yaml            # 人資架構
  - approval-delegation.yaml     # 核決+代理授權
  - duties.yaml                  # 職務管理
  - install-bootstrap.yaml       # 安裝／升級的 DB bootstrap（PF-211）
  - modules-mgmt.yaml            # 模組管理
  - settings.yaml                # 企業設定+系統設定
  - hostconfig.yaml              # 系統主機設定
  - server-manage.yaml           # 主機管理（Redis 監看）
  - security-center.yaml         # 安全中心
  - egress.yaml                  # 資料出口政策（欄位遮罩/揭示/計量）
  - work-schedules.yaml          # 班表設定
  - numbering.yaml               # 帳號編號規則
  - lookup.yaml                  # 查詢表
  - org-databases.yaml           # 企業資料庫監視
  - cg-databases.yaml            # 集團資料庫總覽
  - profile.yaml                 # 個人檔案
  - pages-mgmt.yaml              # 頁面管理
  - code-service.yaml            # 代碼生成服務
  - transliteration.yaml         # 轉寫服務
  - security-core.yaml           # 安全核心（禁區）
  - global-infra.yaml            # 全域基礎設施
  - mod-form-workflow.yaml       # 表單工作流模組
  - mod-nocode-builder.yaml      # 無程式碼建構模組
  - mod-spec-formulate.yaml      # 規格制定模組
  - mod-open-defense.yaml        # 對外安全事件接收 + 決策廣播表
