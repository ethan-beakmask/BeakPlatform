# 管理員與特殊帳號管理
# 企業管理員、管理員救援、系統帳號、外部廠商帳號
page:
  - /admin/org-admins
  - /admin/initial-setup
  - /organizations/<org_code>/admins
  - /sys-accounts/
  - /external-users/
description: 管理員帳號（企業管理員、救援、系統帳號、外部廠商）

files:
  route:
    - backend/app/web/org_admins.py          # 企業管理員 + 初始設定
    - backend/app/web/org_admin_rescue.py    # 管理員救援（系統管理員用）
    - backend/app/web/sys_accounts.py        # 系統帳號
    - backend/app/web/external_users.py      # 外部廠商帳號
  model:
    - backend/app/models/user.py             # 所有帳號共用 User model
    - backend/app/models/organization.py
  template:
    - backend/app/templates/pages/admin/initial_setup.html
    - backend/app/templates/pages/admin/org_admins/list.html
    - backend/app/templates/pages/admin/org_admins/create.html
    - backend/app/templates/pages/org_admin_rescue/list.html
    - backend/app/templates/pages/sys_accounts/list.html
    - backend/app/templates/pages/external_users/list.html
    - backend/app/templates/pages/external_users/create.html
    - backend/app/templates/pages/external_users/view.html
    - backend/app/templates/pages/external_users/edit.html
  js:
    - backend/app/static/js/org-admins.js
    - backend/app/static/js/org-admin-create.js
    - backend/app/static/js/org-admin-rescue.js
    - backend/app/static/js/sys-accounts.js
    - backend/app/static/js/password-form.js
    - backend/app/static/js/code-input.js
  css:
    - backend/app/static/css/org-admin-create.css
    - backend/app/static/css/org-admin-rescue.css
    - backend/app/static/css/master-detail.css

tables:
  primary: users
  related:
    - organizations
    - user_role_assignments
    - roles

security:
  decorator:
    org_admins: "@admin_required"
    org_admin_rescue: "@system_admin_required"
    sys_accounts: "@system_admin_required"
    external_users: "@admin_required"
  note: |
    User model 的 user_type 欄位區分帳號類型：
    SYSTEM_ADMIN, ORG_ADMIN, EMPLOYEE, EXTERNAL
    initial-setup 用 @login_required（首次設定流程）
