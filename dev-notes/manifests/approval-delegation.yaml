# 核決權限 + 角色代理指派
# 核決類別、職等核決上限、角色代理指派
page:
  - /job-approval-categories/
description: 核決權限類別管理 + 角色代理指派

files:
  route:
    - backend/app/web/approval_categories.py
    - backend/app/api/my_proxy_assignments.py    # 員工自助，被代理人限本人；頁面在 /personal-settings
  model:
    - backend/app/models/approval_category.py    # ApprovalCategory + JobLevelApprovalLimit
    - backend/app/models/associations.py         # UserRoleAssignment
    - backend/app/models/job_level.py
  service:
    - backend/app/services/proxy_assignment_service.py
    - backend/app/services/delegation_migration.py
  template:
    - backend/app/templates/pages/approval_categories/list.html
    - backend/app/templates/pages/approval_categories/create.html
    - backend/app/templates/pages/approval_categories/edit.html
    - backend/app/templates/pages/approval_categories/limits.html
  js:
    - backend/app/static/js/approval-limits.js
    - backend/app/static/js/approval-categories.js
  css:
    - backend/app/static/css/approval-limits.css
  test:
    - backend/tests/test_task_authorizer_delegate_from.py
    - backend/tests/test_task_authorizer_role_unit.py      # 角色@單位授權：proxy／standby 性質
    - backend/tests/test_role_holding_service.py
    - backend/tests/test_manager_gate_migration.py
    - backend/tests/test_my_proxy_assignments_api.py
    - backend/tests/test_delegation_migration.py
    - backend/tests/test_calendar_projection.py
  vendor:
    - backend/app/static/vendor/beak-trellis/    # 核決類別樹

tables:
  primary:
    - approval_categories
    - job_level_approval_limits
    - user_role_assignments
  related:
    - job_levels
    - users                    # delegator, delegate

security:
  decorator: "@admin_required"
  rls: true
