# 企業行事曆
# 第一期（PF-229）：資料模型、唯讀投影、API、選單 seed、月／週視圖頁面
page:
  - /calendar/
  - /calendar/me
description: 企業行事曆／我的行事曆（唯讀投影六種來源；寫入 UI 為第二期）

files:
  route:
    - backend/app/web/calendar.py
  api:
    - backend/app/api/calendar.py
  model:
    - backend/app/models/calendar_event.py
    - backend/app/models/schedule_adjustment.py
  service:
    - backend/app/services/approver_exposure_service.py
    - backend/app/services/calendar_event_service.py
    - backend/app/services/calendar_projection_service.py
    - backend/app/services/calendar_visibility.py
    - backend/app/services/time_context_service.py    # TimeContext 起步：who_on_duty / who_on_leave（第三期第 3 項）
  utils:
    - backend/app/utils/calendar_time.py
    - backend/app/utils/work_periods.py
  defaults:
    - backend/app/defaults/menu_defaults.py
    - backend/app/defaults/platform_menu_defaults.py
  script:
    - scripts/seed_missing_platform_menus.py
  template:
    - backend/app/templates/pages/calendar/calendar.html
    - backend/app/templates/pages/calendar/_event_modal.html
  js:
    - backend/app/static/js/calendar.js
  css:
    - backend/app/static/css/calendar.css
  docs:
    - docs/manual/07_daily_work/calendar.md
  test:
    - backend/tests/test_calendar_events_api.py
    - backend/tests/test_work_periods_util.py
    - backend/tests/test_time_context_service.py
    - backend/tests/test_calendar_projection.py
    - backend/tests/test_calendar_pages.py

tables:
  primary:
    - calendar_events
  related:
    - work_schedules
    - schedule_holidays
    - delegations
    - employee_positions
    - lookup_items
    - fw_node_execution_queue
    - schedule_adjustments
    - menu_items
    - menu_permissions
    - menu_role_requirements

security:
  decorator: "@page_keys_required('calendar') / @page_keys_required('calendar_me')；/api/calendar/time-context 是 @admin_required"
  rls: false   # calendar_events 沒有 RLS policy（dev 庫僅 10 張表有 RLS），隔離靠 service 層顯式 org_secure_code 過濾
