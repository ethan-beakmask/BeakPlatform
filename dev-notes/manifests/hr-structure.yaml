# 人資架構管理
# 職等、職系、職稱、職等職稱矩陣、企業成員職位
page:
  - /job-levels/
  - /job-levels/matrix
  - /job-families/
  - /job-titles/
  - /positions/
description: 人資架構（職等、職系、職稱、矩陣、企業成員職位管理）

files:
  route:
    - backend/app/web/job_levels.py
    - backend/app/web/job_families.py
    - backend/app/web/job_titles.py
    - backend/app/web/positions.py
  model:
    - backend/app/models/job_level.py
    - backend/app/models/job_family.py
    - backend/app/models/job_title.py
    - backend/app/models/employee_position.py
  template:
    - backend/app/templates/pages/job_levels/list.html
    - backend/app/templates/pages/job_levels/matrix.html
    - backend/app/templates/pages/job_families/list.html
    - backend/app/templates/pages/job_titles/list.html
    - backend/app/templates/pages/positions/list.html
    - backend/app/templates/pages/positions/create.html
    - backend/app/templates/pages/positions/view.html
    - backend/app/templates/pages/positions/edit.html
  js:
    - backend/app/static/js/job-matrix.js
    - backend/app/static/js/job-families.js
    - backend/app/static/js/job-titles.js
  css:
    - backend/app/static/css/job-matrix.css
  vendor:
    - backend/app/static/vendor/beak-trellis/    # 職系/職稱樹

tables:
  primary:
    - job_levels
    - job_families
    - job_titles
    - employee_positions
  related:
    - users                    # employee_positions.user_secure_code
    - organizational_units     # employee_positions.unit_secure_code

table_relations: |
  job_families (職系) 1:N job_titles (職稱)
  job_levels (職等) 1:N job_titles (職稱)
  job_titles (職稱) 1:N employee_positions (企業成員職位)
  employee_positions -> users, organizational_units

security:
  decorator: "@admin_required"
  rls: true
