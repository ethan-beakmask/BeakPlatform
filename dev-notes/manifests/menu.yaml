# 選單管理
# 選單樹、選單項目 CRUD、排序、角色需求、重置
page: /menu/
description: 選單管理（樹狀管理、排序、角色需求設定、重置預設）

files:
  route:    backend/app/web/menu.py
  api:      backend/app/api/menu.py
  service:
    - backend/app/services/menu_service.py           # 核心：選單可見性邏輯
    - backend/app/services/module_menu_service.py     # 模組選單註冊
  model:
    - backend/app/models/menu_item.py
    - backend/app/models/menu_permission.py
    - backend/app/models/menu_role_requirement.py
  template:
    - backend/app/templates/pages/menu/list.html
    - backend/app/templates/pages/menu/create.html
    - backend/app/templates/pages/menu/edit.html
  js:
    - backend/app/static/js/menu-tree.js
    - backend/app/static/js/code-input.js
    - backend/app/static/js/icon-picker.js
  css:
    - backend/app/static/css/menu-tree.css
  vendor:
    - backend/app/static/vendor/beak-trellis/

tables:
  primary: menu_items
  related:
    - menu_permissions          # Key1: RBAC 權限控制
    - menu_role_requirements    # Key2: 角色需求控制
    - modules                   # 模組關聯
    - roles                     # 角色需求參照

dependencies:
  - permission_service.check     # 雙鑰匙 Key1
  - module_access_service        # 模組存取控制

security:
  decorator: "@system_admin_required（頁面）；/api/menu/<sc>/roles 為 @admin_required（ORG_ADMIN 可自管本企業 Key2）"
  note: |
    重要：選單可見性由 menu_service 的雙鑰匙模型控制（定版文件 dev-notes/PERMISSION_MODEL.md）
    Key1 = menu_permissions (user_type 層界)
    Key2 = menu_role_requirements (角色需求，僅對 EMPLOYEE/EXTERNAL 生效)
    （已退役）menu_items.required_permission 不再參與選單可見性
    選單顯示問題的根因通常是 DB 資料設定錯誤，不是程式邏輯
    模組選單的 user_types 改模組定義後 flask module sync --force，直接改 DB 會被沖掉
