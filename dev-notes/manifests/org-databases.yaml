# 企業資料庫監視
# 系統管理員全域檢視、企業管理員檢視自己的表
page:
  - /organizations/databases
  - /admin/org-database
description: 企業資料庫監視（表預覽、參照檢查、表清除）

files:
  route:    backend/app/web/org_databases.py
  template:
    - backend/app/templates/pages/org_databases/monitor.html
    - backend/app/templates/pages/hostconfig/system_settings.html
    - backend/app/templates/pages/hostconfig/_system_settings_section_orgdatabases.html
    - backend/app/templates/pages/hostconfig/_system_settings_orgdatabases_methods.html
  js:
    - backend/app/static/js/org-databases.js
  css:
    - backend/app/static/css/org-databases.css

tables:
  note: 動態操作企業專屬 DB 的表，無固定主表

security:
  decorator:
    system_view: "@system_admin_required"
    org_view: "@admin_required"
  note: 涉及表清除操作，高危功能
