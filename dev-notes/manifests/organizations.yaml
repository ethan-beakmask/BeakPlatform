# 企業組織管理（含合約）
# 系統管理員管理企業、合約
page: /organizations/
description: 企業組織管理（CRUD、合約管理、統計）

files:
  route:    backend/app/web/organizations.py
  api:
    - backend/app/api/organizations.py
    - backend/app/api/contracts.py
  service:  backend/app/services/organization_service.py
  model:
    - backend/app/models/organization.py
    - backend/app/models/contract.py
    - backend/app/models/conglomerate.py
  template:
    - backend/app/templates/pages/organizations/list.html
    - backend/app/templates/pages/organizations/create.html
    - backend/app/templates/pages/organizations/edit.html
    - backend/app/templates/pages/organizations/admins.html
  js:
    - backend/app/static/js/organizations.js
    - backend/app/static/js/password-form.js
  css:
    - backend/app/static/css/organizations.css

tables:
  primary: organizations
  related:
    - contracts
    - conglomerates
    - users
    - blocked_email_domains

security:
  decorator: "@system_admin_required"
  note: 僅系統管理員可操作
