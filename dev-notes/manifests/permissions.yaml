# 權限中央管理 + 帳號角色權限表
# 角色權限總覽、衝突檢測、角色指派
page:
  - /permissions/
  - /admin/account-roles/
description: 權限中央管理（角色權限矩陣、衝突檢測）+ 帳號角色指派

files:
  route:
    - backend/app/web/permission_central.py
    - backend/app/web/account_roles.py
    - backend/app/web/access_center.py
  api:      backend/app/api/permission_central.py
  access_api: backend/app/api/access_center.py
  service:
    - backend/app/services/permission_central_service.py
    - backend/app/services/permission_service.py
    - backend/app/services/page_permission_service.py
    - backend/app/services/role_assignment_service.py
  model:
    - backend/app/models/permission.py
    - backend/app/defaults/permission_defaults.py   # 出廠 seed（逐 code 補缺）
    - backend/app/models/role_permission.py
    - backend/app/models/permission_condition.py
    - backend/app/models/role.py
    - backend/app/models/associations.py        # UserRoleAssignment
    - backend/app/models/menu_permission.py
    - backend/app/models/menu_role_requirement.py
  template:
    - backend/app/templates/pages/permission_central/index.html
    - backend/app/templates/pages/account_roles.html
    - backend/app/templates/pages/access_center/_tab_accounts.html
  js:
    - backend/app/static/js/permissions-central.js
    - backend/app/static/js/access-center/accounts.js
  css:
    - backend/app/static/css/permissions-central.css
    - backend/app/static/css/access-center.css
  test:
    - backend/tests/test_access_center_assign_kinds.py
    - backend/tests/test_role_assignment_kinds.py

tables:
  primary: permissions
  related:
    - role_permissions
    - permission_conditions
    - roles
    - user_role_assignments
    - menu_permissions
    - menu_role_requirements

security:
  decorator: "@admin_required"
  note: |
    此為安全核心功能，修改前務必確認影響範圍
    權限中央功能視角含「角色存取需求」編輯（寫入走 /api/menu/<sc>/roles）
    role-permission 矩陣僅服務 API/資源層（ResourceGateway、模組 API），不再影響選單可見性
    權限模型定版文件：dev-notes/PERMISSION_MODEL.md
