# 平台說明與使用者手冊
# /help/ 動態手冊目錄、手冊閱讀頁、頁內 help 文件
page: /help/
description: 平台說明與使用者手冊（依登入者身分顯示 docs/manual frontmatter 可見內容）

files:
  route: backend/app/web/platform_help.py
  service:
    - backend/app/services/doc_catalog_service.py
    - backend/app/services/help_service.py
  template:
    - backend/app/templates/pages/platform_help/index.html
    - backend/app/templates/pages/platform_help/manual_doc.html
    - backend/app/templates/pages/platform_help/_manual_nav.html
    - backend/app/templates/pages/platform_help/page_doc.html
    - backend/app/templates/pages/platform_help/org_admin.html
  css:
    - backend/app/static/css/platform-manual.css
    - backend/app/static/css/platform-help.css
  docs:
    - docs/manual/

tables:
  related:
    - menu_items
    - menu_permissions
    - menu_role_requirements

dependencies:
  - doc_catalog_service.list_manual
  - doc_catalog_service.get_manual_doc
  - help_service.load_doc

security:
  decorator: "@login_required"
  note: |
    使用者手冊可見性由 docs/manual/** frontmatter 與 doc_catalog_service 判定。
    選單入口由 menu_items + menu_permissions + menu_role_requirements 控制。
