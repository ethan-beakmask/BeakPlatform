# 角色管理
# 角色 CRUD、角色繼承、綁定部門
page: /roles/
description: 角色管理（CRUD、繼承、綁定部門、批次刪除）

files:
  route:    backend/app/web/roles.py
  api:      backend/app/api/roles.py
  service:
    - backend/app/services/permission_service.py
    - backend/app/services/role_holding_service.py
  script:
    - scripts/migrate_proxy_assignments.py
  model:
    - backend/app/models/role.py
    - backend/app/models/role_permission.py
    - backend/app/models/associations.py     # UserRoleAssignment
  template:
    - backend/app/templates/pages/roles/list.html
    - backend/app/templates/pages/roles/view.html
    - backend/app/templates/pages/roles/create.html
    - backend/app/templates/pages/roles/edit.html
  js:
    - backend/app/static/js/role-list.js
    - backend/app/static/js/role-create.js

tables:
  primary: roles
  related:
    - role_permissions
    - user_role_assignments
    - permissions
    - organizational_units     # bound_unit

security:
  decorator: "@admin_required"
  rls: true
