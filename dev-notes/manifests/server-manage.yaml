# 主機管理 - Redis 監看
# 系統管理員專用，Redis 伺服器狀態監看
page:
  - /server-manage/redis-monitor
description: Redis 監看（伺服器資訊、即時指標、Key 瀏覽、慢查詢）

files:
  route:    backend/app/web/server_manage.py
  template:
    - backend/app/templates/pages/server_manage/redis_monitor.html
  js:
    - backend/app/static/js/redis-monitor.js
  css:
    - backend/app/static/css/redis-monitor.css

tables:
  note: 無直接操作 DB 表，透過 Redis 連線取得資料

security:
  decorator: "@system_admin_required"
  note: Redis 系統級監看，僅限系統管理員
