# 班表設定
# 班表 CRUD、假日管理、個人班表、班別
page:
  - /admin/settings/work-schedules
  - /admin/settings/work-schedules/<sc>/holidays
  - /admin/settings/holiday-calendars/<sc>
description: 班表設定（班表 CRUD、假日管理、批次匯入）

files:
  route:    backend/app/web/work_schedules.py
  api:
    - backend/app/api/work_schedules.py
    - backend/app/api/holiday_calendars.py
  service:
    - backend/app/services/schedule_service.py
    - backend/app/services/holiday_calendar_service.py
  utility:
    - backend/app/utils/regions.py
    - backend/app/utils/work_periods.py
  model:
    - backend/app/models/work_schedule.py
    - backend/app/models/schedule_holiday.py
    - backend/app/models/holiday_calendar.py
    - backend/app/models/shift_type.py
    - backend/app/models/personal_schedule.py
    - backend/app/models/schedule_adjustment.py
  template:
    - backend/app/templates/pages/admin/time/schedules.html
    - backend/app/templates/pages/admin/time/holidays.html
    - backend/app/templates/pages/admin/time/holiday_calendar_edit.html
    - backend/app/templates/pages/admin/time/_holiday_calendars_section.html
    - backend/app/templates/pages/admin/time/_holiday_calendars_modals.html
  js:
    - backend/app/static/js/schedules.js
    - backend/app/static/js/holidays.js
    - backend/app/static/js/holiday-calendars.js
    - backend/app/static/js/holiday-calendar-edit.js
  css:
    - backend/app/static/css/schedules.css
    - backend/app/static/css/holidays.css
  script:
    - scripts/seed_default_work_schedules.py
  test:
    - backend/tests/test_regions_util.py
    - backend/tests/test_default_schedule_seed.py
    - backend/tests/test_enterprise_settings_country.py
    - backend/tests/test_holiday_calendar_service.py
    - backend/tests/test_holiday_calendars_api.py

tables:
  primary:
    - work_schedules
    - schedule_holidays
    - holiday_calendars
    - holiday_calendar_entries
  related:
    - shift_types
    - personal_schedules
    - schedule_adjustments
    - users                    # work_schedule_secure_code

security:
  decorator: "@admin_required"
  rls: true
