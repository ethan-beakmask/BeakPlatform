<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DevTools{% endblock %}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            font-size: 14px;
            line-height: 1.5;
            background: #1a1a2e;
            color: #e0e0e0;
        }
        a { color: #64b5f6; text-decoration: none; }
        a:hover { color: #90caf9; }

        .navbar {
            background: #16213e;
            border-bottom: 1px solid #0f3460;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .navbar-logo {
            font-weight: bold;
            font-size: 16px;
            color: #e94560;
        }
        .navbar-badge {
            background: #e94560;
            color: white;
            padding: 2px 8px;
            font-size: 11px;
            border-radius: 3px;
        }
        .navbar-nav {
            display: flex;
            gap: 16px;
            margin-left: 20px;
        }
        .navbar-nav a {
            color: #b0b0b0;
            padding: 6px 12px;
            border-radius: 4px;
        }
        .navbar-nav a:hover {
            color: #e0e0e0;
            background: #0f3460;
        }
        .navbar-nav a.active {
            color: #64b5f6;
            background: #0f3460;
        }
        .navbar-info {
            margin-left: auto;
            color: #666;
            font-size: 12px;
        }

        .main-content {
            padding: 20px;
        }

        h1 { color: #e94560; margin-top: 0; }
        h2 { color: #64b5f6; border-bottom: 1px solid #333; padding-bottom: 8px; }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <div class="navbar">
        <span class="navbar-logo">BeakMask DevTools</span>
        <span class="navbar-badge">DEV ONLY</span>
        <nav class="navbar-nav">
            <a href="/" {% if request.path == '/' %}class="active"{% endif %}>首頁</a>
            <a href="/db-viewer" {% if request.path == '/db-viewer' %}class="active"{% endif %}>DB Viewer</a>
        </nav>
        <span class="navbar-info">Port 5008 | 僅限內網存取</span>
    </div>

    <div class="main-content">
        {% block content %}{% endblock %}
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
