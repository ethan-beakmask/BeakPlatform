# 核決權限 + 代理授權
# 核決類別、職等核決上限、代理授權
page:
  - /job-approval-categories/
  - /delegations/
description: 核決權限類別管理 + 代理授權

files:
  route:
    - backend/app/web/approval_categories.py
    - backend/app/web/delegations.py
  model:
    - backend/app/models/approval_category.py    # ApprovalCategory + JobLevelApprovalLimit
    - backend/app/models/delegation.py
    - backend/app/models/job_level.py
  template:
    - backend/app/templates/pages/approval_categories/list.html
    - backend/app/templates/pages/approval_categories/create.html
    - backend/app/templates/pages/approval_categories/edit.html
    - backend/app/templates/pages/approval_categories/limits.html
    - backend/app/templates/pages/delegations/list.html
    - backend/app/templates/pages/delegations/view.html
    - backend/app/templates/pages/delegations/create.html
    - backend/app/templates/pages/delegations/edit.html
  js:
    - backend/app/static/js/approval-limits.js
    - backend/app/static/js/approval-categories.js
  css:
    - backend/app/static/css/approval-limits.css
  vendor:
    - backend/app/static/vendor/beak-trellis/    # 核決類別樹

tables:
  primary:
    - approval_categories
    - job_level_approval_limits
    - delegations
  related:
    - job_levels
    - users                    # delegator, delegate

security:
  decorator: "@admin_required"
  rls: true
