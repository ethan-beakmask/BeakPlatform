# 認證系統
# 登入、登出、密碼重設、密碼策略
page: /auth/
description: 認證系統（登入、登出、忘記密碼、密碼策略）

files:
  route:     backend/app/api/auth.py
  service:
    - backend/app/services/auth_service.py
    - backend/app/services/password_policy_service.py
    - backend/app/services/email_service.py
  model:
    - backend/app/models/user.py
    - backend/app/models/password_reset_token.py
    - backend/app/models/password_history.py
  template:
    - backend/app/templates/auth/login.html
    - backend/app/templates/auth/org_login.html
    - backend/app/templates/auth/forgot_password.html
    - backend/app/templates/auth/verify_reset.html
  js:
    - backend/app/static/js/auth.js
  security_core:
    - backend/app/security/auth_interceptor.py

tables:
  primary: users
  related:
    - password_reset_tokens
    - password_history
    - organizations

security:
  decorator: "@public_route"
  note: 登入頁為公開路由，其餘需登入
