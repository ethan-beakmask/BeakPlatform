# 全域基礎設施
# base 模板、全域 JS/CSS、共用元件
page: null
description: 全域基礎設施 -- base 模板、全域載入的 JS/CSS、共用 partial

files:
  base_templates:
    - backend/app/templates/base.html               # 主框架
    - backend/app/templates/partials/_navbar.html    # 導航列
    - backend/app/templates/partials/_menubar.html   # 選單列
    - backend/app/templates/partials/_code_input.html # code 建議元件
  global_js:
    - backend/app/static/js/timezone.js              # BkTime 時區處理
    - backend/app/static/js/sortable-table.js        # 表格排序
    - backend/app/static/js/broadcast-poller.js      # 廣播輪詢
    - backend/app/static/js/topbar-offset.js         # 頂列偏移
    - backend/app/static/js/auth.js                  # 認證工具
    - backend/app/static/js/code-input.js            # code 建議 mixin
    - backend/app/static/js/password-form.js         # 密碼表單 mixin
    - backend/app/static/js/user-create-mixin.js     # 用戶建立 mixin
  global_css:
    - backend/app/static/css/common.css
    - backend/app/static/css/base-layout.css
    - backend/app/static/css/broadcast.css
    - backend/app/static/css/themes.css              # 主題樣式（動態）
  vendor:
    - backend/app/static/vendor/alpine.min.js
    - backend/app/static/vendor/bootstrap.bundle.min.js
    - backend/app/static/vendor/bootstrap.min.css
    - backend/app/static/vendor/fontawesome/
    - backend/app/static/vendor/beak-trellis/        # 自製樹狀元件
    - backend/app/static/vendor/cytoscape.min.js     # 流程圖
    - backend/app/static/vendor/formio.full.min.js   # 動態表單
    - backend/app/static/vendor/gridstack/           # 柵欄佈局
    - backend/app/static/vendor/ace/                 # 程式碼編輯器
    - backend/app/static/fonts/remixicon/            # 圖示字型

note: |
  base.html 自動載入: alpine.js, timezone.js, sortable-table.js, common.css, base-layout.css
  已認證用戶額外載入: broadcast-poller.js, topbar-offset.js, broadcast.css
  beak-trellis 為自製樹狀表格元件，大量頁面使用
