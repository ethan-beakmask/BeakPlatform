# 查詢表管理
# 系統級 + 企業級查詢表（類別、項目）
page: /api/lookup/
description: 查詢表管理（類別 CRUD、項目 CRUD、系統級與企業級合併）

files:
  api:      backend/app/api/lookup.py
  service:
    - backend/app/services/lookup_service.py       # 系統級 + 合併邏輯
    - backend/app/services/lookup_org_service.py   # 企業級（raw SQL）
  model:
    - backend/app/models/lookup_category.py
    - backend/app/models/lookup_item.py

tables:
  primary:
    - lookup_categories
    - lookup_items
  note: 企業級查詢表存在企業專屬 DB（透過 FwOrgDatabase）

security:
  decorator: "@admin_required"
  note: |
    系統級查詢表由系統管理員管理
    企業級查詢表由企業管理員管理
    get_items_merged 會合併兩層結果
