# 安全核心（禁止隨意修改）
# 認證攔截、頁面權限守衛、CSRF、ResourceGateway
page: null
description: 安全核心基礎設施 -- 認證攔截、權限檢查、租戶隔離（修改前必須與用戶確認）

files:
  security:
    - backend/app/security/__init__.py
    - backend/app/security/auth_interceptor.py      # before_request 認證攔截
    - backend/app/security/decorators.py             # @public_route, @login_required 等
    - backend/app/security/page_role_guard.py        # 頁面角色守衛（雙鑰匙 Key2）
    - backend/app/security/resource_gateway.py       # ResourceGateway 租戶隔離查詢
    - backend/app/security/csrf.py                   # CSRF 保護
    - backend/app/security/rate_limiter.py           # 速率限制
  service:
    - backend/app/services/permission_service.py     # RBAC 權限核心
    - backend/app/services/page_permission_service.py
    - backend/app/services/menu_service.py           # 選單可見性（雙鑰匙）

warning: |
  這些檔案構成平台安全基礎，修改前必須：
  1. 確認不影響現有安全策略
  2. 與用戶討論後才能修改
  3. 絕對禁止為了「修 bug」而降低安全等級
  常見誤判：選單不顯示 → 不是 auth_interceptor 的問題，是 DB 資料設定問題
