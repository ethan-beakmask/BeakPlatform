      - 子系統開發:
          - manual/06_subsystem/index.md
          - 子系統開發總覽: manual/06_subsystem/overview.md
      - 日常操作:
          - manual/07_daily_work/index.md
          - 我的任務與簽核: manual/07_daily_work/my_tasks.md
          - 填寫與送出表單: manual/07_daily_work/fill_form.md
          - 設定代理人: manual/07_daily_work/my_delegation.md
          - 追蹤案件進度: manual/07_daily_work/track_case.md
      - 外部協作:
          - manual/08_external/index.md
          - 可存取的範圍: manual/08_external/scope.md
          - 受邀的表單作業: manual/08_external/external_tasks.md

plugins:
  - search:
      lang: [ja]            # lunr 沒有 zh 分詞器，ja 的 bigram 對中文檢索堪用

markdown_extensions:
  - admonition              # !!! warning "前置條件"
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details        # ??? 可摺疊區塊
  - pymdownx.tabbed:
      alternate_style: true # 同頁切換不同作業模式
  - pymdownx.superfences:
      custom_fences:
        # class 刻意不叫 mermaid：Material 內建的 mermaid 支援會從 unpkg CDN
        # 動態 import，封閉網路不能用。改名後由 docs/javascripts/mermaid-init.js
        # 以本地 docs/assets/mermaid.min.js 全權接手。
        - name: mermaid
          class: mermaid-diagram
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets

hooks:
  - scripts/mkdocs_hooks/doc_relations.py

extra_javascript:
  - assets/mermaid.min.js
  - javascripts/mermaid-init.js
