# BeakPlatform 使用者文件 -- MkDocs 設定
#
# 產出對象是「最終使用者」（企業管理員、資安人員、一般員工），不是開發者。
# 內部開發筆記在 dev-notes/，不在這裡，也不會被 build 進站台。
#
# 建置：venv-docs/bin/mkdocs build      （產出 site/，純靜態，可離線開）
# 預覽：venv-docs/bin/mkdocs serve -a 192.168.0.16:8899
# 撰寫規格：dev-notes/DOCS_AUTHORING_SPEC.md（動筆前先讀）
#
# 封閉網路要求：build 產出不得有任何外部請求。改設定後務必用
#   grep -rE 'https?://(unpkg|cdn|fonts)' site/ --include='*.html'
# 確認，theme.font 一旦沒設 false，Material 會去抓 Google Fonts。

site_name: BeakPlatform 使用手冊
site_description: 多租戶權限管理平台 -- 最終使用者文件
docs_dir: docs
site_dir: site
use_directory_urls: false   # 產出 xxx.html，file:// 可直接開（離線包用）

theme:
  name: material
  language: zh-TW
  font: false               # 關閉 Google Fonts，封閉網路必要，不要拿掉
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.highlight
  palette:
    - scheme: default
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切換深色
    - scheme: slate
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切換淺色

# docs/help/ 是站內 help 的資料來源（help_service.py 讀取），
# 內文包在 YAML 的 sections[].body 裡，MkDocs 直接渲染會是一片空白，
# 因此排除。兩個出口共用同一批檔的整併方式見撰寫規格。
exclude_docs: |
  help/
  *.en.md
  *.ja.md
  *.zh-cn.md

nav:
  - 開始使用: index.md
  - 使用手冊:
      - 開始使用:
          - manual/01_getting_started/index.md
          - 登入與登出: manual/01_getting_started/login.md
          - 介面導覽: manual/01_getting_started/interface_tour.md
          - 個人設定: manual/01_getting_started/personal_settings.md
          - 儀表板: manual/01_getting_started/dashboard.md
          - 取得說明與手冊: manual/01_getting_started/getting_help.md
      - 平台管理:
          - manual/02_platform_admin/index.md
          - 企業與合約管理: manual/02_platform_admin/organizations.md
          - 企業獨立資料庫管理: manual/02_platform_admin/org_databases.md
          - 集團資料庫總覽: manual/02_platform_admin/cg_databases.md
          - 系統管理員帳號: manual/02_platform_admin/sys_accounts.md
          - 模組管理: manual/02_platform_admin/modules.md
          - 內部商場: manual/02_platform_admin/store.md
          - 主機設定: manual/02_platform_admin/server_settings.md
