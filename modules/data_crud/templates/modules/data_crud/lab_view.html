{% extends "layouts/base.html" %}

{% block title %}{{ page_name or '頁面預覽' }} - 資料表工具{% endblock %}

{% block head %}
<link rel="stylesheet" href="/static/vendor/gridstack/gridstack.min.css">
<link rel="stylesheet" href="/static/modules/data_crud/css/datalist-widget.css">
<style>
    .viewer-container {
        padding: 16px;
        background: #f0f0f0;
        min-height: calc(100vh - 60px);
    }
    .viewer-container .grid-stack {
        background: #fff;
        min-height: 400px;
    }
    .viewer-container .grid-stack-item-content .dlw-root {
        border: 1px solid #ddd;
    }
    .viewer-container .grid-stack-item-content {
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }
    .viewer-error {
        text-align: center;
        padding: 60px 20px;
        color: #999;
        font-size: 14px;
    }
    .viewer-topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 16px;
        background: #fff;
        border-bottom: 1px solid #ddd;
    }
    .viewer-topbar-title { font-weight: 600; font-size: 16px; }
</style>
{% endblock %}

{% block content %}
<script>
window.__PAGE_CONFIG = {
    secureCode: {{ secure_code | tojson }}
};
</script>

<div x-data="labViewer()" x-cloak>
    <div class="viewer-topbar">
        <span class="viewer-topbar-title" x-text="pageName || '頁面預覽'"></span>
        <div>
            <a href="/data-crud/lab/{{ secure_code }}" class="dc-btn">編輯此頁</a>
            <a href="/data-crud/" class="dc-btn">返回</a>
        </div>
    </div>

    <div class="viewer-error" x-show="error" x-text="error"></div>

    <div class="viewer-container" x-show="!error">
        <div class="grid-stack"></div>
    </div>
</div>

<script src="/static/vendor/gridstack/gridstack-all.js"></script>
<script src="/static/modules/data_crud/js/page-context.js"></script>
<script src="/static/modules/data_crud/js/datalist-widget.js"></script>
<script src="/static/modules/data_crud/js/lab-viewer.js"></script>
{% endblock %}
