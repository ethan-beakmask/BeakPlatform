<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>Studio Grid Test</title>
<script defer src="/static/vendor/alpine.min.js"></script>
<link rel="stylesheet" href="/static/vendor/wunderbaum/wunderbaum.css">
<link rel="stylesheet" href="/static/modules/data_crud/css/studio.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: system-ui, sans-serif; font-size: 14px; background: #f5f5f5; }

.test-layout {
    display: flex;
    height: 100vh;
}
.test-left {
    width: 260px;
    min-width: 260px;
    border-right: 1px solid #ccc;
    background: #fff;
    display: flex;
    flex-direction: column;
}
.test-left-header {
    padding: 10px;
    border-bottom: 1px solid #eee;
    display: flex;
    gap: 6px;
}
.test-left-tree {
    flex: 1;
    overflow-y: auto;
    padding: 4px;
}
.test-right {
    flex: 1;
    padding: 16px;
    overflow: auto;
}
.test-debug {
    background: #1e293b;
    color: #94a3b8;
    font-family: monospace;
    font-size: 12px;
    padding: 8px 12px;
    border-bottom: 1px solid #334155;
    white-space: pre;
}
.test-debug b { color: #38bdf8; }
.test-debug .ok { color: #4ade80; }
.test-debug .err { color: #f87171; }

btn { display: inline-block; padding: 4px 10px; border: 1px solid #ccc; background: #fff;
      font-size: 13px; cursor: pointer; }
btn:hover { background: #f0f0f0; }
</style>
</head>
<body>

<div x-data="gridTest()">

<!-- Debug Bar -->
<div class="test-debug">
<b>Sub System:</b> <span x-text="subSystemSc"></span> |
<b>Loading:</b> <span x-text="loading"></span> |
<b>Tree nodes:</b> <span x-text="tree.length"></span> |
<b>Selected:</b> <span x-text="selectedNode ? selectedNode.name + ' (' + selectedNode.node_type + ')' : 'none'"></span> |
<b>Page SC:</b> <span x-text="currentPageSc || 'none'"></span> |
<b>Grid Editor:</b> <span :class="gridEditorReady ? 'ok' : 'err'" x-text="gridEditorReady ? 'OK' : 'null'"></span> |
<b>WB Tree:</b> <span :class="wbTreeReady ? 'ok' : 'err'" x-text="wbTreeReady ? 'OK' : 'null'"></span>
</div>

<!-- 載入中 -->
<div x-show="loading" style="padding: 40px; text-align: center; color: #999;">載入中...</div>

<!-- 主介面 -->
<div class="test-layout" x-show="!loading" x-cloak>

    <!-- 左側: 樹 -->
    <div class="test-left">
        <div class="test-left-header">
            <button style="padding:4px 10px; border:1px solid #ccc; background:#fff; cursor:pointer;"
                    @click="addNode()">+ Page</button>
            <button style="padding:4px 10px; border:1px solid #ccc; background:#fff; cursor:pointer;"
                    @click="addFolder()">+ Folder</button>
            <button style="padding:4px 10px; border:1px solid #ccc; background:#fff; cursor:pointer; color:red;"
                    @click="deleteSelectedNode()" :disabled="!selectedNode">Delete</button>
        </div>
        <div class="test-left-tree" id="test-tree"></div>
        <div x-show="tree.length === 0" style="padding: 20px; text-align:center; color:#999;">
            No nodes yet
        </div>
    </div>

    <!-- 右側: Grid Editor -->
    <div class="test-right">
        <div x-show="!selectedNode" style="color:#999; padding:40px; text-align:center;">
            Select a page node from the tree
        </div>
        <div x-show="selectedNode && selectedNode.node_type === 'folder'" style="color:#999; padding:40px; text-align:center;">
            Folder node - no layout
        </div>
        <div x-show="selectedNode && selectedNode.node_type === 'page'">
            <div style="margin-bottom: 8px; font-weight: 600;" x-text="selectedNode ? selectedNode.name : ''"></div>
            <div id="test-grid-canvas"></div>
        </div>
    </div>

</div>

</div>

<script src="/static/vendor/wunderbaum/wunderbaum.umd.min.js"></script>
<script src="/static/modules/data_crud/js/grid-layout-editor.js"></script>
<script>
function gridTest() {
    const config = window.__STUDIO_CONFIG || {};
    return {
        subSystemSc: config.subSystemSc || '',
        loading: true,
        tree: [],
        selectedNode: null,
        currentPageSc: null,

        // debug flags
        gridEditorReady: false,
        wbTreeReady: false,

        // internals
        _wbTree: null,
        _gridEditor: null,

        async init() {
            console.log('[gridTest] init, sc =', this.subSystemSc);
            if (!this.subSystemSc) {
                console.error('[gridTest] No subSystemSc');
                this.loading = false;
                return;
            }

            await this._loadTree();
            this.loading = false;
            console.log('[gridTest] loading=false, tree=', JSON.stringify(this.tree));

            // 等 DOM (x-show 切換後)
            this._waitForEl('test-tree', (el) => {
                console.log('[gridTest] #test-tree found, building Wunderbaum');
                this._buildTree(el);
            });
        },

        // === Robust DOM wait ===
        _waitForEl(id, cb) {
            const check = () => {
                const el = document.getElementById(id);
                if (el) {
                    cb(el);
                } else {
                    console.log('[gridTest] waiting for #' + id + '...');
                    requestAnimationFrame(check);
                }
            };
            requestAnimationFrame(check);
        },

        // === Tree ===
        async _loadTree() {
            try {
                const r = await fetch('/api/data-crud/sub-systems/' + this.subSystemSc + '/site-map');
                const d = await r.json();
                console.log('[gridTest] _loadTree response:', d);
                if (d.success) this.tree = d.data || [];
            } catch (e) {
                console.error('[gridTest] _loadTree error:', e);
            }
        },

        _buildTree(el) {
            // Destroy old
            if (this._wbTree) {
                try { this._wbTree.destroy(); } catch (e) {}
                this._wbTree = null;
                this.wbTreeReady = false;
            }
            el.innerHTML = '';

            const source = this._toWbSource(this.tree);
            console.log('[gridTest] Wunderbaum source:', JSON.stringify(source));

            if (typeof mar10 === 'undefined' || !mar10.Wunderbaum) {
                console.error('[gridTest] mar10.Wunderbaum not available');
                return;
            }

            this._wbTree = new mar10.Wunderbaum({
                element: el,
                source: source,
                selectMode: 'single',
                activate: (e) => {
                    console.log('[gridTest] activate e.node.data keys:', Object.keys(e.node.data || {}));
                    console.log('[gridTest] activate e.node.data:', JSON.stringify(e.node.data));
                    var d = e.node.data || {};
                    // 嘗試多種存取方式
                    var nodeData = d.refRaw || d;
                    console.log('[gridTest] resolved nodeData.name:', nodeData.name, 'type:', nodeData.node_type);
                    if (nodeData.name) {
                        this._onNodeSelect(nodeData);
                    }
                },
            });

            this.wbTreeReady = true;
            console.log('[gridTest] Wunderbaum created, nodes:', source.length);
        },

        _toWbSource(nodes) {
            if (!nodes || !nodes.length) return [];
            return nodes.map(n => {
                // 用展開取代 data: n，避免與 Wunderbaum 內部 data 屬性衝突
                return {
                    title: n.name,
                    key: n.secure_code,
                    expanded: true,
                    // 自訂屬性放頂層，Wunderbaum 會存入 node.data
                    refName: n.name,
                    refNodeType: n.node_type,
                    refPageLayoutSc: n.page_layout_secure_code || null,
                    refSecureCode: n.secure_code,
                    refRaw: JSON.parse(JSON.stringify(n)),
                    children: this._toWbSource(n.children || []),
                    icon: n.node_type === 'folder' ? 'bi bi-folder' : 'bi bi-file-earmark',
                };
            });
        },

        // === Node Selection ===
        _onNodeSelect(nodeData) {
            this.selectedNode = nodeData;
            console.log('[gridTest] selectedNode =', nodeData.name, 'type =', nodeData.node_type);

            if (nodeData.node_type === 'page') {
                const pageSc = nodeData.page_layout_secure_code;
                console.log('[gridTest] page_layout_secure_code =', pageSc);
                if (pageSc) {
                    // 等 canvas 可見
                    this._waitForEl('test-grid-canvas', (el) => {
                        this._ensureGridEditor(el);
                        this._loadPageLayout(pageSc);
                    });
                } else {
                    this.currentPageSc = null;
                    this._waitForEl('test-grid-canvas', (el) => {
                        this._ensureGridEditor(el);
                        this._gridEditor.loadLayout({ version: 3, mode: 'grid', gridSize: [4,4], zones: [], widgets: [] });
                    });
                }
            }
        },

        // === Grid Editor ===
        _ensureGridEditor(el) {
            if (this._gridEditor) return;
            console.log('[gridTest] Creating GridLayoutEditor on', el);

            this._gridEditor = new GridLayoutEditor(el, { rows: 4, cols: 4 });
            this._gridEditor.onZoneSelect = (zoneId) => {
                console.log('[gridTest] zone selected:', zoneId);
            };
            this._gridEditor.onWidgetSelect = (zoneId, wc) => {
                console.log('[gridTest] widget selected:', zoneId, wc);
            };
            this._gridEditor.onChanged = () => {
                console.log('[gridTest] layout changed');
            };
            this._gridEditor.render();
            this.gridEditorReady = true;
            console.log('[gridTest] GridLayoutEditor ready, matrix:', this._gridEditor.matrix.length + 'x' + (this._gridEditor.matrix[0] || []).length);
        },

        async _loadPageLayout(pageSc) {
            console.log('[gridTest] loading page layout:', pageSc);
            try {
                const r = await fetch('/api/data-crud/pages/' + pageSc);
                const d = await r.json();
                console.log('[gridTest] page layout response:', d);
                if (d.success) {
                    this.currentPageSc = pageSc;
                    const layout = d.data.layout_json || {};
                    if (this._gridEditor) {
                        const v3 = layout.version === 3 ? layout : { version: 3, mode: 'grid', gridSize: [4,4], zones: [], widgets: [] };
                        this._gridEditor.loadLayout(v3);
                        console.log('[gridTest] layout loaded into editor');
                    }
                }
            } catch (e) {
                console.error('[gridTest] loadPageLayout error:', e);
            }
        },

        // === CRUD ===
        async addNode(type) {
            type = type || 'page';
            const name = prompt('Node name:');
            if (!name) return;

            const body = {
                name: name,
                node_type: type,
                parent_secure_code: this.selectedNode ? this.selectedNode.secure_code : null,
            };

            // Auto-create page layout for page nodes
            if (type === 'page') {
                try {
                    const pr = await fetch('/api/data-crud/pages', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            name: name,
                            layout_json: { version: 3, mode: 'grid', gridSize: [4,4], zones: [], widgets: [] },
                        }),
                    });
                    const pd = await pr.json();
                    console.log('[gridTest] created page layout:', pd);
                    if (pd.success) body.page_layout_secure_code = pd.data.secure_code;
                } catch (e) {
                    console.error('[gridTest] create page layout error:', e);
                }
            }

            try {
                const r = await fetch('/api/data-crud/sub-systems/' + this.subSystemSc + '/site-map/nodes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                });
                const d = await r.json();
                console.log('[gridTest] addNode response:', d);
                if (d.success) {
                    await this._loadTree();
                    const el = document.getElementById('test-tree');
                    if (el) this._buildTree(el);
                }
            } catch (e) {
                console.error('[gridTest] addNode error:', e);
            }
        },

        addFolder() { this.addNode('folder'); },

        async deleteSelectedNode() {
            if (!this.selectedNode) return;
            if (!confirm('Delete node "' + this.selectedNode.name + '"?')) return;
            try {
                const r = await fetch(
                    '/api/data-crud/sub-systems/' + this.subSystemSc + '/site-map/nodes/' + this.selectedNode.secure_code,
                    { method: 'DELETE' }
                );
                const d = await r.json();
                console.log('[gridTest] deleteNode response:', d);
                if (d.success) {
                    this.selectedNode = null;
                    this.currentPageSc = null;
                    await this._loadTree();
                    const el = document.getElementById('test-tree');
                    if (el) this._buildTree(el);
                }
            } catch (e) {
                console.error('[gridTest] deleteNode error:', e);
            }
        },
    };
}
</script>
<script>
    window.__STUDIO_CONFIG = { subSystemSc: '{{ sub_system_sc }}' };
</script>
</body>
</html>
