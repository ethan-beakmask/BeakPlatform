{% extends "layouts/base.html" %}

{% block title %}視圖管理 - 資料表工具{% endblock %}

{% block head %}
<link rel="stylesheet" href="/static/modules/data_crud/css/data-crud.css">
{% endblock %}

{% block content %}
<div class="dc-container" x-data="viewListManager()" x-cloak>

    <!-- Header -->
    <div class="dc-header">
        <div>
            <h1>資料表工具 - 視圖管理</h1>
            <p>目標資料庫: <strong x-text="dbName" style="font-family: monospace;"></strong></p>
        </div>
        <div class="dc-toolbar">
            <button class="dc-btn" @click="loadViews()">重新載入</button>
            <a href="/data-crud/views/new" class="dc-btn primary">+ 新增視圖</a>
        </div>
    </div>

    <!-- Loading -->
    <div class="dc-card" x-show="loading">
        <div class="dc-loading">載入中...</div>
    </div>

    <!-- Empty -->
    <div class="dc-card" x-show="!loading && views.length === 0">
        <div class="dc-empty">
            <p>尚未建立任何視圖</p>
            <p><a href="/data-crud/views/new" class="dc-btn primary">建立第一個視圖</a></p>
        </div>
    </div>

    <!-- Table -->
    <div class="dc-card" x-show="!loading && views.length > 0">
        <table class="dc-table">
            <thead>
                <tr>
                    <th style="width: 200px;">視圖名稱</th>
                    <th style="width: 160px;">資料表</th>
                    <th>說明</th>
                    <th style="width: 60px;">新增</th>
                    <th style="width: 60px;">編輯</th>
                    <th style="width: 60px;">刪除</th>
                    <th style="width: 60px;">狀態</th>
                    <th style="width: 140px;">更新時間</th>
                    <th style="width: 200px;">操作</th>
                </tr>
            </thead>
            <tbody>
                <template x-for="v in views" :key="v.secure_code">
                    <tr>
                        <td style="font-weight: 500;" x-text="v.name"></td>
                        <td style="font-family: monospace; color: #666; font-size: 12px;" x-text="v.table_name"></td>
                        <td style="color: #666;" x-text="truncate(v.description, 40)"></td>
                        <td><span class="dc-badge" :class="v.allow_create ? 'yes' : 'no'" x-text="v.allow_create ? 'Y' : 'N'"></span></td>
                        <td><span class="dc-badge" :class="v.allow_edit ? 'yes' : 'no'" x-text="v.allow_edit ? 'Y' : 'N'"></span></td>
                        <td><span class="dc-badge" :class="v.allow_delete ? 'yes' : 'no'" x-text="v.allow_delete ? 'Y' : 'N'"></span></td>
                        <td><span class="dc-badge" :class="v.is_active ? 'active' : 'inactive'" x-text="v.is_active ? '啟用' : '停用'"></span></td>
                        <td style="color: #999; font-size: 12px;" x-text="formatDate(v.updated_at)"></td>
                        <td class="actions">
                            <a :href="'/data-crud/views/' + v.secure_code" class="dc-btn sm">瀏覽</a>
                            <a :href="'/data-crud/views/' + v.secure_code + '/config'" class="dc-btn sm">設定</a>
                            <button class="dc-btn sm danger" @click="confirmDelete(v)">刪除</button>
                        </td>
                    </tr>
                </template>
            </tbody>
        </table>
    </div>

    <!-- Delete Confirm Modal -->
    <div x-show="showDeleteModal" x-cloak class="dc-modal">
        <div class="dc-modal-content" style="width: 400px;">
            <div class="dc-modal-header">
                <h3>確認刪除</h3>
                <button class="dc-close-btn" @click="showDeleteModal = false">&times;</button>
            </div>
            <div class="dc-modal-body">
                <p>確定要刪除視圖「<strong x-text="deletingView?.name"></strong>」嗎?</p>
            </div>
            <div class="dc-modal-footer">
                <button class="dc-btn" @click="showDeleteModal = false">取消</button>
                <button class="dc-btn danger" @click="doDelete()" style="background: #dc2626; color: white;">確認刪除</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div x-show="toast.show" x-cloak class="dc-toast" :class="toast.type"
         x-text="toast.message" x-transition></div>
</div>

<script src="/static/modules/data_crud/js/view-list.js"></script>
{% endblock %}
