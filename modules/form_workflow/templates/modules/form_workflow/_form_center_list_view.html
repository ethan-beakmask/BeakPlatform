{# 表單中心 - 清單模式 (partial, 注入到 formCenterManager x-data 範圍內) #}

<!-- 清單模式 -->
<div class="fc-main" x-show="viewMode === 'list'" x-cloak style="flex: 1;">
    <!-- 返回按鈕 -->
    <div style="margin-bottom: 6px;">
        <button @click="viewMode = 'dashboard'" class="fc-btn" style="background: #f3f4f6; color: #374151; font-size: 12px; padding: 4px 10px;">
            &larr; 返回表單中心
        </button>
    </div>

    <!-- 三個主頁籤 -->
    <div class="fc-list-tabs">
        <button class="fc-list-tab" :class="{ active: listTab === 'pending' }"
                @click="listTab = 'pending'; listSubTab = 'mine'; listPage = 1;">
            待簽核
            <span x-show="pendingApprovals.length > 0" class="fc-badge fc-badge-pending" style="margin-left: 4px;" x-text="pendingApprovals.length"></span>
        </button>
        <button class="fc-list-tab" :class="{ active: listTab === 'tracking' }"
                @click="listTab = 'tracking'; listSubTab = 'mine'; listPage = 1;">
            追蹤中
            <span x-show="trackingList.length + signedList.length > 0" style="margin-left: 4px; color: #6b7280;"
                  x-text="'(' + (trackingList.length + signedList.length) + ')'"></span>
        </button>
        <button class="fc-list-tab" :class="{ active: listTab === 'history' }"
                @click="listTab = 'history'; listSubTab = 'mine'; listPage = 1;">
            歷史
            <span x-show="historyList.length + signedHistoryList.length > 0" style="margin-left: 4px; color: #6b7280;"
                  x-text="'(' + (historyList.length + signedHistoryList.length) + ')'"></span>
        </button>
    </div>

    <!-- 工具列：子頁籤(左) + 分頁(右) -->
    <div class="fc-list-toolbar">
        <!-- 左側：子頁籤 -->
        <div>
            <div x-show="listTab === 'tracking' || listTab === 'history'" class="fc-list-sub-tabs">
                <button class="fc-list-sub-tab" :class="{ active: listSubTab === 'mine' }"
                        @click="listSubTab = 'mine'; listPage = 1;">
                    我發起的表單(<span x-text="listTab === 'tracking' ? trackingList.length : historyList.length"></span>)
                </button>
                <button class="fc-list-sub-tab" :class="{ active: listSubTab === 'signed' }"
                        @click="listSubTab = 'signed'; listPage = 1;">
                    我簽過的表單(<span x-text="listTab === 'tracking' ? signedList.length : signedHistoryList.length"></span>)
                </button>
            </div>
            <span x-show="listTab === 'pending'" style="font-size: 12px; color: #6b7280;">
                共 <span x-text="pendingApprovals.length"></span> 筆
            </span>
        </div>
        <!-- 右側：分頁控制 -->
        <div x-show="listTotalPages > 1" class="fc-list-pager-compact">
            <span x-text="listPage + ' / ' + listTotalPages"></span>
            <button :disabled="listPage <= 1" @click="listPage--">&lt;</button>
            <button :disabled="listPage >= listTotalPages" @click="listPage++">&gt;</button>
        </div>
    </div>

    <!-- 表格內容 -->
    <div class="fc-section" style="margin-bottom: 0;">
        <div style="padding: 0;">

            <!-- 待簽核表格 -->
            <template x-if="listTab === 'pending'">
                <div>
                    <div x-show="loadingPending" class="fc-loading">載入中...</div>
                    <div x-show="!loadingPending && pendingApprovals.length === 0" class="fc-empty">目前沒有待簽核的表單</div>
                    <table x-show="!loadingPending && pendingApprovals.length > 0" class="fc-table fc-table-dense fc-table-pending">
                        <thead>
                            <tr>
                                <th class="fc-sortable" style="width: 140px;" @click="toggleSort('pending', 'serial_number')">單號<span x-text="sortIcon('pending', 'serial_number')"></span></th>
                                <th style="width: 100px;">表單</th>
                                <th>主旨</th>
                                <th style="width: 290px;">發起人</th>
                                <th style="width: 80px;">類別</th>
                                <th style="width: 150px;">目前關卡</th>
                                <th class="fc-sortable" style="width: 150px;" @click="toggleSort('pending', 'scheduled_at')">等待時間<span x-text="sortIcon('pending', 'scheduled_at')"></span></th>
                                <th style="width: 100px;">操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template x-for="item in pagedListData" :key="item.queue_secure_code">
                                <tr>
                                    <td>
                                        <span style="color: #3b82f6; font-family: monospace;" x-text="getShortSerial(item.serial_number)"></span>
                                        <span x-show="item.is_test" class="fc-badge fc-badge-test" style="margin-left: 4px;">TEST</span>
                                        <span x-show="!item.is_test" class="fc-badge fc-badge-proc" style="margin-left: 4px;">PROC</span>
                                    </td>
                                    <td style="font-weight: 500;" x-text="item.form_name || '未命名表單'"></td>
                                    <td style="color: #374151;" x-text="shortSubject(item.form_subject)" :title="item.form_subject || ''"></td>
                                    <td x-text="item.applicant_name || '-'"></td>
                                    <td style="color: #6b7280;" x-text="item.category || '-'"></td>
                                    <td><span class="fc-badge fc-badge-pending" x-text="item.node_name || '-'"></span></td>
                                    <td style="color: #92400e;" x-text="formatWaitTime(item.scheduled_at)"></td>
                                    <td style="display: flex; gap: 4px; align-items: center;">
                                        <button class="fc-btn fc-btn-sm" style="background: #f3f4f6; color: #6b7280;" @click="openPendingReadForm(item)" title="閱讀表單">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                                        </button>
                                        <button class="fc-btn fc-btn-warning fc-btn-sm" style="white-space: nowrap;" @click="openApprovalModal(item)"
                                                :disabled="item.is_locked && !item.locked_by_self">
                                            <span x-show="!(item.is_locked && !item.locked_by_self)">簽核</span>
                                            <span x-show="item.is_locked && !item.locked_by_self" style="font-size: 11px;">簽核中</span>
                                        </button>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </template>

            <!-- 追蹤中 - 我發起的 -->
            <template x-if="listTab === 'tracking' && listSubTab === 'mine'">
                <div>
                    <div x-show="loadingTracking" class="fc-loading">載入中...</div>
                    <div x-show="!loadingTracking && trackingList.length === 0" class="fc-empty">目前沒有執行中的流程</div>
                    <table x-show="!loadingTracking && trackingList.length > 0" class="fc-table fc-table-dense">
                        <thead>
                            <tr>
                                <th class="fc-sortable" style="width: 120px;" @click="toggleSort('tracking', 'serial_number')">單號<span x-text="sortIcon('tracking', 'serial_number')"></span></th>
                                <th style="width: 90px;">表單</th>
                                <th>主旨</th>
                                <th style="width: 70px;">類別</th>
                                <th style="width: 120px;">待簽關卡</th>
                                <th class="fc-sortable" style="width: 130px;" @click="toggleSort('tracking', 'submitted_at')">送單時間<span x-text="sortIcon('tracking', 'submitted_at')"></span></th>
                                <th style="width: 110px;"></th>
                            </tr>
                        </thead>
                        <tbody>
                            <template x-for="item in pagedListData" :key="item.secure_code">
                                <tr>
                                    <td>
                                        <span style="color: #3b82f6; font-family: monospace;" x-text="getShortSerial(item.serial_number)"></span>
                                        <span x-show="item.is_test" class="fc-badge fc-badge-test" style="margin-left: 4px;">TEST</span>
                                        <span x-show="!item.is_test" class="fc-badge fc-badge-proc" style="margin-left: 4px;">PROC</span>
                                    </td>
                                    <td style="font-weight: 500;" x-text="item.form_name"></td>
                                    <td style="color: #374151;" x-text="shortSubject(item.form_subject)" :title="item.form_subject || ''"></td>
                                    <td style="color: #6b7280;" x-text="item.category || '-'"></td>
                                    <td style="color: #0d9488;" x-text="item.current_approver || '尚未到簽核關卡'"></td>
                                    <td style="color: #6b7280;" x-text="formatDate(item.submitted_at)"></td>
                                    <td style="display: flex; gap: 4px;">
                                        <button @click="viewExecutionDetail(item)" class="fc-btn fc-btn-sm" style="background: #f3f4f6; color: #6b7280;" title="查看執行詳情">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                                        </button>
                                        <button @click="openFlowOverview(item)" class="fc-btn fc-btn-sm" style="background: #eff6ff; color: #3b82f6;" title="流程大圖">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="3" x2="6" y2="15"></line><circle cx="18" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><path d="M18 9a9 9 0 0 1-9 9"></path></svg>
                                        </button>
                                        <button @click="openReadForm(item)" class="fc-btn fc-btn-sm" style="background: #f3f4f6; color: #6b7280;" title="閱讀表單">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                                        </button>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </template>

            <!-- 追蹤中 - 我簽過的 -->
            <template x-if="listTab === 'tracking' && listSubTab === 'signed'">
                <div>
                    <div x-show="loadingSigned" class="fc-loading">載入中...</div>

                    <table x-show="!loadingSigned && signedList.length > 0" class="fc-table fc-table-dense">
                        <thead>
                            <tr>
                                <th class="fc-sortable" style="width: 120px;" @click="toggleSort('trackingSigned', 'serial_number')">單號<span x-text="sortIcon('trackingSigned', 'serial_number')"></span></th>
                                <th style="width: 90px;">表單</th>
                                <th>主旨</th>
                                <th style="width: 70px;">類別</th>
                                <th style="width: 80px;">發起人</th>
                                <th style="width: 120px;">待簽關卡</th>
                                <th class="fc-sortable" style="width: 120px;" @click="toggleSort('trackingSigned', 'submitted_at')">簽核後歷時<span x-text="sortIcon('trackingSigned', 'submitted_at')"></span></th>
                                <th style="width: 110px;"></th>
                            </tr>
                        </thead>
                        <tbody>
                            <template x-for="item in pagedListData" :key="item.secure_code">
                                <tr>
                                    <td>
                                        <span style="color: #3b82f6; font-family: monospace;" x-text="getShortSerial(item.serial_number)"></span>
                                        <span x-show="item.is_test" class="fc-badge fc-badge-test" style="margin-left: 4px;">TEST</span>
                                        <span x-show="!item.is_test" class="fc-badge fc-badge-proc" style="margin-left: 4px;">PROC</span>
                                    </td>
                                    <td style="font-weight: 500;" x-text="item.form_name"></td>
                                    <td style="color: #374151;" x-text="shortSubject(item.form_subject)" :title="item.form_subject || ''"></td>
                                    <td style="color: #6b7280;" x-text="item.category || '-'"></td>
                                    <td x-text="item.applicant_name || '-'"></td>
                                    <td style="color: #0d9488;" x-text="item.current_approver || '-'"></td>
                                    <td style="color: #6b7280;" x-text="formatWaitTime(item.my_acted_at)"></td>
                                    <td style="display: flex; gap: 4px;">
                                        <button @click="viewExecutionDetail(item)" class="fc-btn fc-btn-sm" style="background: #f3f4f6; color: #6b7280;" title="查看執行詳情">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                                        </button>
                                        <button @click="openFlowOverview(item)" class="fc-btn fc-btn-sm" style="background: #eff6ff; color: #3b82f6;" title="流程大圖">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="3" x2="6" y2="15"></line><circle cx="18" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><path d="M18 9a9 9 0 0 1-9 9"></path></svg>
                                        </button>
                                        <button @click="openReadForm(item)" class="fc-btn fc-btn-sm" style="background: #f3f4f6; color: #6b7280;" title="閱讀表單">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                                        </button>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </template>

            <!-- 歷史 - 我發起的 -->
            <template x-if="listTab === 'history' && listSubTab === 'mine'">
                <div>
                    <div x-show="loadingHistory" class="fc-loading">載入中...</div>
                    <div x-show="!loadingHistory && historyList.length === 0" class="fc-empty">沒有歷史記錄</div>
                    <table x-show="!loadingHistory && historyList.length > 0" class="fc-table fc-table-dense">
                        <thead>
                            <tr>
                                <th class="fc-sortable" style="width: 120px;" @click="toggleSort('history', 'serial_number')">單號<span x-text="sortIcon('history', 'serial_number')"></span></th>
                                <th style="width: 90px;">表單</th>
                                <th>主旨</th>
                                <th style="width: 70px;">類別</th>
                                <th style="width: 60px;">狀態</th>
                                <th class="fc-sortable" style="width: 130px;" @click="toggleSort('history', 'workflow_completed_at')">結束時間<span x-text="sortIcon('history', 'workflow_completed_at')"></span></th>
                                <th style="width: 100px;">流程耗時</th>
                                <th style="width: 110px;"></th>
                            </tr>
                        </thead>
                        <tbody>
                            <template x-for="item in pagedListData" :key="item.secure_code">
                                <tr>
                                    <td>
                                        <span style="color: #3b82f6; font-family: monospace;" x-text="getShortSerial(item.serial_number)"></span>
                                        <span x-show="item.is_test" class="fc-badge fc-badge-test" style="margin-left: 4px;">TEST</span>
                                        <span x-show="!item.is_test" class="fc-badge fc-badge-proc" style="margin-left: 4px;">PROC</span>
                                    </td>
                                    <td style="font-weight: 500;" x-text="item.form_name"></td>
                                    <td style="color: #374151;" x-text="shortSubject(item.form_subject)" :title="item.form_subject || ''"></td>
                                    <td style="color: #6b7280;" x-text="item.category || '-'"></td>
                                    <td><span class="fc-badge" :class="getStatusClass(item.workflow_status || item.status)" x-text="getStatusText(item.workflow_status || item.status)"></span></td>
                                    <td style="color: #6b7280;" x-text="formatDate(item.workflow_completed_at)"></td>
                                    <td style="color: #6b7280;" x-text="formatDuration(item.workflow_started_at, item.workflow_completed_at)"></td>
                                    <td style="display: flex; gap: 4px;">
                                        <button @click="viewExecutionDetail(item)" class="fc-btn fc-btn-sm" style="background: #f3f4f6; color: #6b7280;" title="查看執行詳情">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                                        </button>
                                        <button @click="openFlowOverview(item)" class="fc-btn fc-btn-sm" style="background: #eff6ff; color: #3b82f6;" title="流程大圖">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="3" x2="6" y2="15"></line><circle cx="18" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><path d="M18 9a9 9 0 0 1-9 9"></path></svg>
                                        </button>
                                        <button @click="openReadForm(item)" class="fc-btn fc-btn-sm" style="background: #f3f4f6; color: #6b7280;" title="閱讀表單">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                                        </button>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </template>

            <!-- 歷史 - 我簽過的 -->
            <template x-if="listTab === 'history' && listSubTab === 'signed'">
                <div>
                    <div x-show="loadingSignedHistory" class="fc-loading">載入中...</div>
                    <div x-show="!loadingSignedHistory && signedHistoryList.length === 0" class="fc-empty">沒有曾簽核過的已結束流程</div>
                    <table x-show="!loadingSignedHistory && signedHistoryList.length > 0" class="fc-table fc-table-dense">
                        <thead>
                            <tr>
                                <th class="fc-sortable" style="width: 120px;" @click="toggleSort('historySigned', 'serial_number')">單號<span x-text="sortIcon('historySigned', 'serial_number')"></span></th>
                                <th style="width: 90px;">表單</th>
                                <th>主旨</th>
                                <th style="width: 70px;">類別</th>
                                <th style="width: 80px;">發起人</th>
                                <th style="width: 60px;">狀態</th>
                                <th class="fc-sortable" style="width: 130px;" @click="toggleSort('historySigned', 'workflow_completed_at')">結束時間<span x-text="sortIcon('historySigned', 'workflow_completed_at')"></span></th>
                                <th style="width: 100px;">流程耗時</th>
                                <th style="width: 110px;"></th>
                            </tr>
                        </thead>
                        <tbody>
                            <template x-for="item in pagedListData" :key="item.secure_code">
                                <tr>
                                    <td>
                                        <span style="color: #3b82f6; font-family: monospace;" x-text="getShortSerial(item.serial_number)"></span>
                                        <span x-show="item.is_test" class="fc-badge fc-badge-test" style="margin-left: 4px;">TEST</span>
                                        <span x-show="!item.is_test" class="fc-badge fc-badge-proc" style="margin-left: 4px;">PROC</span>
                                    </td>
                                    <td style="font-weight: 500;" x-text="item.form_name"></td>
                                    <td style="color: #374151;" x-text="shortSubject(item.form_subject)" :title="item.form_subject || ''"></td>
                                    <td style="color: #6b7280;" x-text="item.category || '-'"></td>
                                    <td x-text="item.applicant_name || '-'"></td>
                                    <td><span class="fc-badge" :class="getStatusClass(item.workflow_status || item.status)" x-text="getStatusText(item.workflow_status || item.status)"></span></td>
                                    <td style="color: #6b7280;" x-text="formatDate(item.workflow_completed_at)"></td>
                                    <td style="color: #6b7280;" x-text="formatDuration(item.workflow_started_at, item.workflow_completed_at)"></td>
                                    <td style="display: flex; gap: 4px;">
                                        <button @click="viewExecutionDetail(item)" class="fc-btn fc-btn-sm" style="background: #f3f4f6; color: #6b7280;" title="查看執行詳情">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                                        </button>
                                        <button @click="openFlowOverview(item)" class="fc-btn fc-btn-sm" style="background: #eff6ff; color: #3b82f6;" title="流程大圖">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="3" x2="6" y2="15"></line><circle cx="18" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><path d="M18 9a9 9 0 0 1-9 9"></path></svg>
                                        </button>
                                        <button @click="openReadForm(item)" class="fc-btn fc-btn-sm" style="background: #f3f4f6; color: #6b7280;" title="閱讀表單">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                                        </button>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </template>

        </div>
    </div>

    <!-- 分頁控制 -->
    <div x-show="listTotalPages > 1" class="fc-list-pager">
        <div>
            共 <span x-text="listDataSource.length"></span> 筆，第 <span x-text="listPage"></span> / <span x-text="listTotalPages"></span> 頁
        </div>
        <div class="fc-list-pager-btns">
            <button class="fc-list-pager-btn" :disabled="listPage <= 1" @click="listPage--">&lt; 上一頁</button>
            <template x-for="p in listTotalPages" :key="p">
                <button class="fc-list-pager-btn" :class="{ active: listPage === p }" @click="listPage = p" x-text="p"
                        x-show="p === 1 || p === listTotalPages || (p >= listPage - 2 && p <= listPage + 2)"></button>
            </template>
            <button class="fc-list-pager-btn" :disabled="listPage >= listTotalPages" @click="listPage++">下一頁 &gt;</button>
        </div>
    </div>
</div>
