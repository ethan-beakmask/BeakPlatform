{% extends "layouts/base.html" %}

{% block title %}分類管理 - BeakPlatform{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='modules/form_workflow/css/category-list.css') }}">
{% endblock %}

{% block content %}
<div class="fw-container" x-data="categoryManager()">

    <!-- 頁首 -->
    <div class="fw-header">
        <div>
            <h1>分類管理</h1>
            <p style="margin: 4px 0 0 0; font-size: 13px; color: #666;">管理表單和流程的二層分類</p>
        </div>
        <div class="fw-toolbar">
            <button class="fw-btn" @click="loadCategories()">重新載入</button>
            <button class="fw-btn primary" @click="openCreateModal(null)">+ 新增父分類</button>
        </div>
    </div>

    <!-- 表格 -->
    <div class="fw-card">
        <div x-show="loading" class="fw-loading">載入中...</div>

        <div x-show="!loading && categories.length === 0" class="fw-empty">
            <p style="font-size: 16px; margin-bottom: 8px;">尚無分類</p>
            <p>點擊「新增父分類」開始建立</p>
        </div>

        <table x-show="!loading && categories.length > 0" class="fw-table">
            <thead>
                <tr>
                    <th style="width: 60px;">排序</th>
                    <th style="width: 200px;">名稱</th>
                    <th style="min-width: 400px;">描述</th>
                    <th style="width: 80px;">類型</th>
                    <th style="width: 200px;">顯示範圍</th>
                    <th style="width: 180px;" class="actions">操作</th>
                </tr>
            </thead>
            <template x-for="cat in categories" :key="cat.secure_code">
                <tbody>
                    <!-- 父分類列 -->
                    <tr class="parent-row">
                        <td style="text-align: center; color: #999;" x-text="cat.display_order"></td>
                        <td>
                            <button class="expand-btn" @click="toggleExpand(cat.secure_code)"
                                    x-text="expanded[cat.secure_code] ? '▼' : '▶'"></button>
                            <span x-text="cat.name"></span>
                            <span class="child-count" x-text="'(' + (cat.children || []).length + ')'"></span>
                        </td>
                        <td style="color: #666;" x-text="cat.description || '-'"></td>
                        <td>
                            <span class="fw-badge" :class="cat.is_system ? 'system' : 'custom'"
                                  x-text="cat.is_system ? '系統' : '自訂'"></span>
                        </td>
                        <td style="font-size: 11px; color: #666;">
                            <span x-show="cat.show_in_form_design" style="margin-right: 8px;">表單設計</span>
                            <span x-show="cat.show_in_workflow_design" style="margin-right: 8px;">流程設計</span>
                            <span x-show="cat.show_in_form_center">表單中心</span>
                        </td>
                        <td class="actions">
                            <button class="fw-btn sm" @click="openCreateModal(cat.secure_code)">+ 子分類</button>
                            <button class="fw-btn sm" @click="editCategory(cat)" :disabled="cat.is_system">編輯</button>
                            <button class="fw-btn sm danger" @click="confirmDelete(cat)" :disabled="cat.is_system">刪除</button>
                        </td>
                    </tr>
                    <!-- 子分類列 -->
                    <template x-for="child in (cat.children || [])" :key="child.secure_code">
                        <tr class="child-row" x-show="expanded[cat.secure_code]">
                            <td style="text-align: center; color: #bbb;" x-text="child.display_order"></td>
                            <td style="padding-left: 36px;" x-text="child.name"></td>
                            <td style="color: #666;" x-text="child.description || '-'"></td>
                            <td><span class="fw-badge child">子分類</span></td>
                            <td style="font-size: 11px; color: #999;">繼承父分類</td>
                            <td class="actions">
                                <button class="fw-btn sm" @click="editCategory(child)">編輯</button>
                                <button class="fw-btn sm danger" @click="confirmDelete(child)">刪除</button>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </template>
        </table>
    </div>

    <!-- 新增/編輯 Modal -->
    <div x-show="showModal" x-cloak class="fw-modal">
        <div class="fw-modal-content">
            <div class="fw-modal-header">
                <h3 x-text="modalTitle"></h3>
                <button @click="closeModal()" style="background: none; border: none; font-size: 20px; cursor: pointer;">&times;</button>
            </div>
            <form @submit.prevent="saveCategory()">
                <div class="fw-modal-body">
                    <!-- 父分類提示 -->
                    <div x-show="formData.parent_secure_code" class="fw-form-group">
                        <label>父分類</label>
                        <input type="text" :value="getParentName(formData.parent_secure_code)" disabled style="background: #f5f5f5;">
                    </div>
                    <div class="fw-form-group">
                        <label>名稱 *</label>
                        <input type="text" x-model="formData.name" required placeholder="例：人事表單">
                    </div>
                    <div class="fw-form-group">
                        <label>描述</label>
                        <textarea x-model="formData.description" placeholder="簡述此分類的用途"></textarea>
                    </div>
                    <div class="fw-form-group">
                        <label>排序</label>
                        <input type="number" x-model.number="formData.display_order" min="0" placeholder="數字越小越前面">
                    </div>
                    <!-- 顯示範圍（僅父分類） -->
                    <div class="fw-form-group" x-show="!formData.parent_secure_code">
                        <label style="margin-bottom: 8px;">顯示範圍</label>
                        <div class="fw-checkbox-group">
                            <label>
                                <input type="checkbox" x-model="formData.show_in_form_design"> 表單設計
                            </label>
                            <label>
                                <input type="checkbox" x-model="formData.show_in_workflow_design"> 流程設計
                            </label>
                            <label>
                                <input type="checkbox" x-model="formData.show_in_form_center"> 表單中心
                            </label>
                        </div>
                    </div>
                </div>
                <div class="fw-modal-footer">
                    <button type="button" class="fw-btn" @click="closeModal()">取消</button>
                    <button type="submit" class="fw-btn primary" :disabled="saving">
                        <span x-show="!saving" x-text="editingCategory ? '儲存變更' : '建立分類'"></span>
                        <span x-show="saving">處理中...</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- 刪除確認 Modal -->
    <div x-show="showDeleteModal" x-cloak class="fw-modal">
        <div class="fw-modal-content" style="width: 400px;">
            <div class="fw-modal-header">
                <h3>確認刪除</h3>
                <button @click="showDeleteModal = false" style="background: none; border: none; font-size: 20px; cursor: pointer;">&times;</button>
            </div>
            <div class="fw-modal-body">
                <p>確定要刪除「<strong x-text="deletingCategory?.name"></strong>」嗎？</p>
                <p style="color: #dc2626; font-size: 13px;">此操作無法復原。</p>
            </div>
            <div class="fw-modal-footer">
                <button class="fw-btn" @click="showDeleteModal = false">取消</button>
                <button class="fw-btn danger" @click="deleteCategory()">確認刪除</button>
            </div>
        </div>
    </div>

</div>

<script src="{{ url_for('static', filename='modules/form_workflow/js/category-list.js') }}"></script>
{% endblock %}
