{% extends "layouts/base.html" %}

{% block title %}分類管理 - BeakPlatform{% endblock %}

{% block head %}
<style>
    [x-cloak] { display: none !important; }

    .fw-container { max-width: 1000px; margin: 0 auto; padding: 16px; }
    .fw-header { background: white; border: 1px solid #ddd; padding: 16px 20px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
    .fw-header h1 { margin: 0; font-size: 20px; }
    .fw-toolbar { display: flex; gap: 12px; align-items: center; }
    .fw-btn { padding: 8px 16px; border: 1px solid #ddd; background: #f9f9f9; cursor: pointer; font-size: 13px; }
    .fw-btn:hover { background: #e9e9e9; }
    .fw-btn.primary { background: #0066cc; color: white; border-color: #0066cc; }
    .fw-btn.primary:hover { background: #0055aa; }
    .fw-btn.danger { background: #dc2626; color: white; border-color: #dc2626; }
    .fw-btn.sm { padding: 4px 8px; font-size: 11px; }
    .fw-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .fw-card { background: white; border: 1px solid #ddd; }
    .fw-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .fw-table th { background: #f5f5f5; padding: 10px 12px; text-align: left; border-bottom: 1px solid #ddd; font-weight: 600; }
    .fw-table td { padding: 10px 12px; border-bottom: 1px solid #eee; }
    .fw-table tr:hover { background: #fafafa; }
    .fw-table .actions { text-align: center; white-space: nowrap; }
    .fw-table .actions button { padding: 4px 8px; margin: 0 2px; font-size: 11px; }

    /* 父分類列 */
    .fw-table tr.parent-row { background: #fafbfc; }
    .fw-table tr.parent-row td { font-weight: 500; border-bottom: 1px solid #ddd; }
    .fw-table tr.parent-row .expand-btn { cursor: pointer; background: none; border: none; font-size: 14px; padding: 0 4px; color: #666; }
    .fw-table tr.parent-row .expand-btn:hover { color: #333; }

    /* 子分類列 */
    .fw-table tr.child-row td { padding-left: 36px; background: white; }
    .fw-table tr.child-row td:first-child { padding-left: 36px; }

    .fw-badge { padding: 2px 8px; font-size: 11px; border-radius: 2px; }
    .fw-badge.system { background: #dbeafe; color: #1e40af; }
    .fw-badge.custom { background: #f3e8ff; color: #7c3aed; }
    .fw-badge.child { background: #ecfdf5; color: #065f46; }

    .fw-empty { text-align: center; padding: 48px; color: #999; }
    .fw-loading { text-align: center; padding: 48px; color: #666; }

    .fw-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .fw-modal-content { background: white; width: 500px; max-width: 90%; max-height: 90vh; overflow-y: auto; }
    .fw-modal-header { padding: 16px 20px; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; }
    .fw-modal-header h3 { margin: 0; font-size: 16px; }
    .fw-modal-body { padding: 20px; }
    .fw-modal-footer { padding: 16px 20px; border-top: 1px solid #ddd; display: flex; justify-content: flex-end; gap: 8px; }

    .fw-form-group { margin-bottom: 16px; }
    .fw-form-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 4px; }
    .fw-form-group input, .fw-form-group textarea, .fw-form-group select { width: 100%; padding: 8px 12px; border: 1px solid #ddd; font-size: 13px; box-sizing: border-box; }
    .fw-form-group textarea { min-height: 80px; resize: vertical; }

    .fw-checkbox-group { display: flex; gap: 16px; flex-wrap: wrap; }
    .fw-checkbox-group label { display: flex; align-items: center; gap: 6px; font-weight: normal; cursor: pointer; }
    .fw-checkbox-group input[type="checkbox"] { width: auto; }

    .child-count { color: #999; font-size: 11px; font-weight: normal; margin-left: 6px; }
</style>
{% endblock %}

{% block content %}
<div class="fw-container" x-data="categoryManager()">

    <!-- 頁首 -->
    <div class="fw-header">
        <div>
            <h1>分類管理</h1>
            <p style="margin: 4px 0 0 0; font-size: 13px; color: #666;">管理表單和流程的二層分類</p>
        </div>
        <div class="fw-toolbar">
            <button class="fw-btn" @click="loadCategories()">重新載入</button>
            <button class="fw-btn primary" @click="openCreateModal(null)">+ 新增父分類</button>
        </div>
    </div>

    <!-- 表格 -->
    <div class="fw-card">
        <div x-show="loading" class="fw-loading">載入中...</div>

        <div x-show="!loading && categories.length === 0" class="fw-empty">
            <p style="font-size: 16px; margin-bottom: 8px;">尚無分類</p>
            <p>點擊「新增父分類」開始建立</p>
        </div>

        <table x-show="!loading && categories.length > 0" class="fw-table">
            <thead>
                <tr>
                    <th style="width: 60px;">排序</th>
                    <th style="width: 200px;">名稱</th>
                    <th>描述</th>
                    <th style="width: 80px;">類型</th>
                    <th style="width: 200px;">顯示範圍</th>
                    <th style="width: 180px;" class="actions">操作</th>
                </tr>
            </thead>
            <tbody>
                <template x-for="cat in categories" :key="cat.secure_code">
                    <template x-fragment>
                        <!-- 父分類列 -->
                        <tr class="parent-row">
                            <td style="text-align: center; color: #999;" x-text="cat.display_order"></td>
                            <td>
                                <button class="expand-btn" @click="toggleExpand(cat.secure_code)"
                                        x-text="expanded[cat.secure_code] ? '▼' : '▶'"></button>
                                <span x-text="cat.name"></span>
                                <span class="child-count" x-text="'(' + (cat.children || []).length + ')'"></span>
                            </td>
                            <td style="color: #666;" x-text="cat.description || '-'"></td>
                            <td>
                                <span class="fw-badge" :class="cat.is_system ? 'system' : 'custom'"
                                      x-text="cat.is_system ? '系統' : '自訂'"></span>
                            </td>
                            <td style="font-size: 11px; color: #666;">
                                <span x-show="cat.show_in_form_design" style="margin-right: 8px;">表單設計</span>
                                <span x-show="cat.show_in_workflow_design" style="margin-right: 8px;">流程設計</span>
                                <span x-show="cat.show_in_form_center">表單中心</span>
                            </td>
                            <td class="actions">
                                <button class="fw-btn sm" @click="openCreateModal(cat.secure_code)">+ 子分類</button>
                                <button class="fw-btn sm" @click="editCategory(cat)" :disabled="cat.is_system">編輯</button>
                                <button class="fw-btn sm danger" @click="confirmDelete(cat)" :disabled="cat.is_system">刪除</button>
                            </td>
                        </tr>
                        <!-- 子分類列 -->
                        <template x-for="child in (cat.children || [])" :key="child.secure_code">
                            <tr class="child-row" x-show="expanded[cat.secure_code]">
                                <td style="text-align: center; color: #bbb;" x-text="child.display_order"></td>
                                <td style="padding-left: 36px;" x-text="child.name"></td>
                                <td style="color: #666;" x-text="child.description || '-'"></td>
                                <td><span class="fw-badge child">子分類</span></td>
                                <td style="font-size: 11px; color: #999;">繼承父分類</td>
                                <td class="actions">
                                    <button class="fw-btn sm" @click="editCategory(child)">編輯</button>
                                    <button class="fw-btn sm danger" @click="confirmDelete(child)">刪除</button>
                                </td>
                            </tr>
                        </template>
                    </template>
                </template>
            </tbody>
        </table>
    </div>

    <!-- 新增/編輯 Modal -->
    <div x-show="showModal" x-cloak class="fw-modal">
        <div class="fw-modal-content">
            <div class="fw-modal-header">
                <h3 x-text="modalTitle"></h3>
                <button @click="closeModal()" style="background: none; border: none; font-size: 20px; cursor: pointer;">&times;</button>
            </div>
            <form @submit.prevent="saveCategory()">
                <div class="fw-modal-body">
                    <!-- 父分類提示 -->
                    <div x-show="formData.parent_secure_code" class="fw-form-group">
                        <label>父分類</label>
                        <input type="text" :value="getParentName(formData.parent_secure_code)" disabled style="background: #f5f5f5;">
                    </div>
                    <div class="fw-form-group">
                        <label>名稱 *</label>
                        <input type="text" x-model="formData.name" required placeholder="例：人事表單">
                    </div>
                    <div class="fw-form-group">
                        <label>描述</label>
                        <textarea x-model="formData.description" placeholder="簡述此分類的用途"></textarea>
                    </div>
                    <div class="fw-form-group">
                        <label>排序</label>
                        <input type="number" x-model.number="formData.display_order" min="0" placeholder="數字越小越前面">
                    </div>
                    <!-- 顯示範圍（僅父分類） -->
                    <div class="fw-form-group" x-show="!formData.parent_secure_code">
                        <label style="margin-bottom: 8px;">顯示範圍</label>
                        <div class="fw-checkbox-group">
                            <label>
                                <input type="checkbox" x-model="formData.show_in_form_design"> 表單設計
                            </label>
                            <label>
                                <input type="checkbox" x-model="formData.show_in_workflow_design"> 流程設計
                            </label>
                            <label>
                                <input type="checkbox" x-model="formData.show_in_form_center"> 表單中心
                            </label>
                        </div>
                    </div>
                </div>
                <div class="fw-modal-footer">
                    <button type="button" class="fw-btn" @click="closeModal()">取消</button>
                    <button type="submit" class="fw-btn primary" :disabled="saving">
                        <span x-show="!saving" x-text="editingCategory ? '儲存變更' : '建立分類'"></span>
                        <span x-show="saving">處理中...</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- 刪除確認 Modal -->
    <div x-show="showDeleteModal" x-cloak class="fw-modal">
        <div class="fw-modal-content" style="width: 400px;">
            <div class="fw-modal-header">
                <h3>確認刪除</h3>
                <button @click="showDeleteModal = false" style="background: none; border: none; font-size: 20px; cursor: pointer;">&times;</button>
            </div>
            <div class="fw-modal-body">
                <p>確定要刪除「<strong x-text="deletingCategory?.name"></strong>」嗎？</p>
                <p style="color: #dc2626; font-size: 13px;">此操作無法復原。</p>
            </div>
            <div class="fw-modal-footer">
                <button class="fw-btn" @click="showDeleteModal = false">取消</button>
                <button class="fw-btn danger" @click="deleteCategory()">確認刪除</button>
            </div>
        </div>
    </div>

</div>

<script>
function categoryManager() {
    return {
        categories: [],  // 樹狀結構
        loading: true,
        expanded: {},

        showModal: false,
        editingCategory: null,
        formData: {
            name: '',
            description: '',
            display_order: 0,
            parent_secure_code: null,
            show_in_form_design: true,
            show_in_workflow_design: true,
            show_in_form_center: true
        },
        saving: false,

        showDeleteModal: false,
        deletingCategory: null,

        get modalTitle() {
            if (this.editingCategory) {
                return this.editingCategory.parent_secure_code ? '編輯子分類' : '編輯父分類';
            }
            return this.formData.parent_secure_code ? '新增子分類' : '新增父分類';
        },

        async init() {
            await this.loadCategories();
        },

        async loadCategories() {
            this.loading = true;
            try {
                const res = await fetch('/api/form-workflow/categories');
                const data = await res.json();
                if (data.success) {
                    this.categories = data.data || [];
                    // 預設全部展開
                    for (const cat of this.categories) {
                        if (this.expanded[cat.secure_code] === undefined) {
                            this.expanded[cat.secure_code] = true;
                        }
                    }
                }
            } catch (e) {
                console.error('載入失敗:', e);
            } finally {
                this.loading = false;
            }
        },

        toggleExpand(sc) {
            this.expanded[sc] = !this.expanded[sc];
        },

        getParentName(parentSc) {
            if (!parentSc) return '';
            const cat = this.categories.find(c => c.secure_code === parentSc);
            return cat ? cat.name : '';
        },

        openCreateModal(parentSc) {
            this.editingCategory = null;
            this.formData = {
                name: '',
                description: '',
                display_order: 0,
                parent_secure_code: parentSc || null,
                show_in_form_design: true,
                show_in_workflow_design: true,
                show_in_form_center: true
            };
            this.showModal = true;
        },

        editCategory(cat) {
            if (cat.is_system) return;
            this.editingCategory = cat;
            this.formData = {
                name: cat.name,
                description: cat.description || '',
                display_order: cat.display_order || 0,
                parent_secure_code: cat.parent_secure_code || null,
                show_in_form_design: cat.show_in_form_design !== false,
                show_in_workflow_design: cat.show_in_workflow_design !== false,
                show_in_form_center: cat.show_in_form_center !== false
            };
            this.showModal = true;
        },

        closeModal() {
            this.showModal = false;
            this.editingCategory = null;
        },

        async saveCategory() {
            if (this.saving) return;
            this.saving = true;

            try {
                const url = this.editingCategory
                    ? `/api/form-workflow/categories/${this.editingCategory.secure_code}`
                    : '/api/form-workflow/categories';
                const method = this.editingCategory ? 'PUT' : 'POST';

                const res = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(this.formData)
                });
                const data = await res.json();

                if (data.success) {
                    this.closeModal();
                    this.loadCategories();
                } else {
                    alert('操作失敗: ' + (data.error || data.message));
                }
            } catch (e) {
                alert('操作失敗: ' + e.message);
            } finally {
                this.saving = false;
            }
        },

        confirmDelete(cat) {
            if (cat.is_system) return;
            this.deletingCategory = cat;
            this.showDeleteModal = true;
        },

        async deleteCategory() {
            if (!this.deletingCategory) return;

            try {
                const res = await fetch(`/api/form-workflow/categories/${this.deletingCategory.secure_code}`, {
                    method: 'DELETE'
                });
                const data = await res.json();

                if (data.success) {
                    this.showDeleteModal = false;
                    this.deletingCategory = null;
                    this.loadCategories();
                } else {
                    alert('刪除失敗: ' + (data.error || data.message));
                }
            } catch (e) {
                alert('刪除失敗: ' + e.message);
            }
        }
    };
}
</script>
{% endblock %}
