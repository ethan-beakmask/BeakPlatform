{% extends "layouts/base.html" %}

{% block title %}表單流程 - BeakPlatform{% endblock %}

{% block head %}
<style>
    [x-cloak] { display: none !important; }

    .fw-container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 16px;
    }

    .fw-header {
        background: white;
        border: 1px solid #ddd;
        padding: 16px 20px;
        margin-bottom: 16px;
    }

    .fw-header h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
    }

    .fw-header p {
        margin: 4px 0 0 0;
        font-size: 13px;
        color: #666;
    }

    .fw-stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
        margin-bottom: 16px;
    }

    .fw-stat-card {
        background: white;
        border: 1px solid #ddd;
        padding: 20px;
        text-align: center;
    }

    .fw-stat-value {
        font-size: 32px;
        font-weight: 600;
        color: #0066cc;
    }

    .fw-stat-label {
        font-size: 13px;
        color: #666;
        margin-top: 4px;
    }

    .fw-section {
        background: white;
        border: 1px solid #ddd;
        padding: 16px 20px;
        margin-bottom: 16px;
    }

    .fw-section-title {
        margin: 0 0 12px 0;
        font-size: 16px;
        font-weight: 600;
        padding-bottom: 8px;
        border-bottom: 1px solid #eee;
    }

    .fw-quick-actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
    }

    .fw-action-btn {
        padding: 12px 20px;
        border: 1px solid #ddd;
        background: #f9f9f9;
        cursor: pointer;
        font-size: 13px;
        display: flex;
        align-items: center;
        gap: 8px;
        transition: all 0.2s;
    }

    .fw-action-btn:hover {
        background: #e9e9e9;
        border-color: #ccc;
    }

    .fw-action-btn.primary {
        background: #0066cc;
        color: white;
        border-color: #0066cc;
    }

    .fw-action-btn.primary:hover {
        background: #0055aa;
    }

    .fw-list {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .fw-list-item {
        padding: 12px 0;
        border-bottom: 1px solid #eee;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .fw-list-item:last-child {
        border-bottom: none;
    }

    .fw-empty {
        text-align: center;
        padding: 32px;
        color: #999;
    }

    .fw-badge {
        padding: 2px 8px;
        font-size: 11px;
        border-radius: 2px;
    }

    .fw-badge.pending {
        background: #fef3c7;
        color: #92400e;
    }

    .fw-badge.running {
        background: #dbeafe;
        color: #1e40af;
    }

    .fw-badge.completed {
        background: #dcfce7;
        color: #166534;
    }
</style>
{% endblock %}

{% block content %}
<div class="fw-container" x-data="fwDashboard()">

    <!-- 頁面標題 -->
    <div class="fw-header">
        <h1>表單流程系統</h1>
        <p>管理表單模板、工作流程和簽核任務</p>
    </div>

    <!-- 統計卡片 -->
    <div class="fw-stats">
        <div class="fw-stat-card">
            <div class="fw-stat-value" x-text="stats.form_templates"></div>
            <div class="fw-stat-label">表單模板</div>
        </div>
        <div class="fw-stat-card">
            <div class="fw-stat-value" x-text="stats.workflow_templates"></div>
            <div class="fw-stat-label">工作流模板</div>
        </div>
        <div class="fw-stat-card">
            <div class="fw-stat-value" x-text="stats.form_instances"></div>
            <div class="fw-stat-label">表單實例</div>
        </div>
        <div class="fw-stat-card">
            <div class="fw-stat-value" style="color: #f59e0b;" x-text="stats.pending_instances"></div>
            <div class="fw-stat-label">待處理</div>
        </div>
    </div>

    <!-- 快速操作 -->
    <div class="fw-section">
        <h2 class="fw-section-title">快速操作</h2>
        <div class="fw-quick-actions">
            <button class="fw-action-btn primary" @click="goTo('templates')">
                <span>+</span> 建立表單模板
            </button>
            <button class="fw-action-btn primary" @click="goTo('workflows')">
                <span>+</span> 建立工作流
            </button>
            <button class="fw-action-btn" @click="goTo('instances')">
                查看我的表單
            </button>
            <button class="fw-action-btn" @click="goTo('pending')">
                待簽核任務
            </button>
        </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
        <!-- 最近表單模板 -->
        <div class="fw-section">
            <h2 class="fw-section-title">最近表單模板</h2>
            <div x-show="loading" class="fw-empty">載入中...</div>
            <div x-show="!loading && templates.length === 0" class="fw-empty">
                尚無表單模板
            </div>
            <ul x-show="!loading && templates.length > 0" class="fw-list">
                <template x-for="t in templates.slice(0, 5)" :key="t.secure_code">
                    <li class="fw-list-item">
                        <div>
                            <div style="font-weight: 500;" x-text="t.name"></div>
                            <div style="font-size: 12px; color: #999;" x-text="t.code || '-'"></div>
                        </div>
                        <span class="fw-badge" :class="t.is_active ? 'completed' : 'pending'"
                              x-text="t.is_active ? '啟用' : '停用'"></span>
                    </li>
                </template>
            </ul>
        </div>

        <!-- 最近工作流模板 -->
        <div class="fw-section">
            <h2 class="fw-section-title">最近工作流模板</h2>
            <div x-show="loading" class="fw-empty">載入中...</div>
            <div x-show="!loading && workflows.length === 0" class="fw-empty">
                尚無工作流模板
            </div>
            <ul x-show="!loading && workflows.length > 0" class="fw-list">
                <template x-for="w in workflows.slice(0, 5)" :key="w.secure_code">
                    <li class="fw-list-item">
                        <div>
                            <div style="font-weight: 500;" x-text="w.name"></div>
                            <div style="font-size: 12px; color: #999;" x-text="w.code || '-'"></div>
                        </div>
                        <span class="fw-badge" :class="w.is_active ? 'completed' : 'pending'"
                              x-text="w.is_active ? '啟用' : '停用'"></span>
                    </li>
                </template>
            </ul>
        </div>
    </div>

    <!-- 最近表單實例 -->
    <div class="fw-section">
        <h2 class="fw-section-title">我的最近表單</h2>
        <div x-show="loading" class="fw-empty">載入中...</div>
        <div x-show="!loading && instances.length === 0" class="fw-empty">
            尚無表單實例
        </div>
        <ul x-show="!loading && instances.length > 0" class="fw-list">
            <template x-for="i in instances.slice(0, 5)" :key="i.secure_code">
                <li class="fw-list-item">
                    <div>
                        <div style="font-weight: 500;" x-text="i.serial_number || i.secure_code"></div>
                        <div style="font-size: 12px; color: #999;">
                            <span x-text="formatDate(i.created_at)"></span>
                        </div>
                    </div>
                    <span class="fw-badge"
                          :class="getStatusClass(i.status)"
                          x-text="getStatusText(i.status)"></span>
                </li>
            </template>
        </ul>
    </div>

</div>

<script>
function fwDashboard() {
    return {
        loading: true,
        stats: {
            form_templates: 0,
            workflow_templates: 0,
            form_instances: 0,
            pending_instances: 0
        },
        templates: [],
        workflows: [],
        instances: [],

        async init() {
            await Promise.all([
                this.loadStats(),
                this.loadTemplates(),
                this.loadWorkflows(),
                this.loadInstances()
            ]);
            this.loading = false;
        },

        async loadStats() {
            try {
                const res = await fetch('/api/form-workflow/stats');
                const data = await res.json();
                if (data.success) {
                    this.stats = data.data;
                }
            } catch (e) {
                console.error('載入統計失敗:', e);
            }
        },

        async loadTemplates() {
            try {
                const res = await fetch('/api/form-workflow/templates');
                const data = await res.json();
                if (data.success) {
                    this.templates = data.data.templates || [];
                }
            } catch (e) {
                console.error('載入模板失敗:', e);
            }
        },

        async loadWorkflows() {
            try {
                const res = await fetch('/api/form-workflow/workflows');
                const data = await res.json();
                if (data.success) {
                    this.workflows = data.data.workflows || [];
                }
            } catch (e) {
                console.error('載入工作流失敗:', e);
            }
        },

        async loadInstances() {
            try {
                const res = await fetch('/api/form-workflow/instances');
                const data = await res.json();
                if (data.success) {
                    this.instances = data.data.instances || [];
                }
            } catch (e) {
                console.error('載入實例失敗:', e);
            }
        },

        goTo(page) {
            const urls = {
                'templates': '/forms/templates',
                'workflows': '/forms/workflows',
                'instances': '/forms/instances',
                'pending': '/forms/pending'
            };
            if (urls[page]) {
                window.location.href = urls[page];
            }
        },

        formatDate(dateStr) {
            if (!dateStr) return '-';
            const d = new Date(dateStr);
            return d.toLocaleDateString('zh-TW') + ' ' + d.toLocaleTimeString('zh-TW', {hour: '2-digit', minute: '2-digit'});
        },

        getStatusText(status) {
            const map = {
                'DRAFT': '草稿',
                'PENDING': '待處理',
                'RUNNING': '處理中',
                'COMPLETED': '已完成',
                'REJECTED': '已駁回',
                'CANCELLED': '已取消'
            };
            return map[status] || status;
        },

        getStatusClass(status) {
            const map = {
                'DRAFT': 'pending',
                'PENDING': 'pending',
                'RUNNING': 'running',
                'COMPLETED': 'completed',
                'REJECTED': 'pending',
                'CANCELLED': 'pending'
            };
            return map[status] || 'pending';
        }
    };
}
</script>
{% endblock %}
