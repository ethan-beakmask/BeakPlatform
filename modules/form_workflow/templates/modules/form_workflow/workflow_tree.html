{% extends "layouts/base.html" %}

{% block title %}流程樹系圖 - BeakPlatform{% endblock %}

{% block head %}
<link rel="stylesheet" href="/static/modules/form_workflow/css/fw-workflow-tree.css">
{% endblock %}

{% block content %}
<div class="tree-page" x-data="workflowTreePage()" x-cloak>

    <div class="tree-toolbar">
        <div>
            <div class="tree-title" x-text="treeName || '載入中...'"></div>
            <div class="tree-subtitle" x-show="treeCode" x-text="treeCode"></div>
        </div>
        <div class="spacer"></div>
        <button class="tb-btn" @click="window.close()">關閉</button>
    </div>

    <div class="tree-chart-area">
        <div x-show="loading" class="tree-loading">載入中...</div>
        <div x-show="error" class="tree-error" x-text="error"></div>
        <div x-show="!loading && !error" id="workflow-tree-chart" style="overflow:auto;background:#f9fafb;"></div>
    </div>

</div>
{% endblock %}

{% block scripts %}
<script>
window.__TREE_CONFIG = { secureCode: '{{ secure_code }}' };
</script>
<script src="/static/modules/form_workflow/js/fw-workflow-tree.js"></script>
{% endblock %}
