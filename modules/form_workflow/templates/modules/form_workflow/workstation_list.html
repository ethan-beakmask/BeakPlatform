{% extends "layouts/base.html" %}

{% block title %}工作站管理 - BeakPlatform{% endblock %}

{% block head %}
<style>
.ws-container { max-width: 1200px; margin: 0 auto; padding: 20px; }
.ws-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.ws-header h1 { font-size: 18px; font-weight: 500; margin: 0; }
.ws-toolbar { display: flex; gap: 8px; }
.ws-btn { padding: 6px 14px; font-size: 13px; border: 1px solid #d1d5db; border-radius: 4px; background: #fff; cursor: pointer; }
.ws-btn:hover { background: #f9fafb; }
.ws-btn.primary { background: #2563eb; color: #fff; border-color: #2563eb; }
.ws-btn.primary:hover { background: #1d4ed8; }
.ws-btn.danger { color: #dc2626; border-color: #dc2626; }
.ws-btn.danger:hover { background: #fef2f2; }
.ws-btn.sm { padding: 3px 8px; font-size: 12px; }
.ws-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 6px; overflow: hidden; }
.ws-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.ws-table th { background: #f9fafb; padding: 8px 12px; text-align: left; font-weight: 500; border-bottom: 1px solid #e5e7eb; }
.ws-table td { padding: 8px 12px; border-bottom: 1px solid #f3f4f6; vertical-align: middle; }
.ws-table tr:hover { background: #f9fafb; }
.ws-badge { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 11px; }
.ws-badge.active { background: #dcfce7; color: #166534; }
.ws-badge.inactive { background: #fee2e2; color: #991b1b; }
.ws-empty { padding: 40px; text-align: center; color: #9ca3af; }
.ws-loading { padding: 20px; text-align: center; color: #6b7280; }
.ws-tag { display: inline-block; padding: 1px 6px; margin: 1px 2px; border-radius: 3px; font-size: 11px; background: #e0e7ff; color: #3730a3; }
.ws-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 1000; display: flex; align-items: center; justify-content: center; }
.ws-modal { background: #fff; border-radius: 8px; width: 720px; max-height: 85vh; overflow-y: auto; padding: 0; }
.ws-modal-header { padding: 14px 20px; border-bottom: 1px solid #e5e7eb; font-size: 15px; font-weight: 500; display: flex; justify-content: space-between; align-items: center; }
.ws-modal-body { padding: 20px; }
.ws-modal-footer { padding: 12px 20px; border-top: 1px solid #e5e7eb; display: flex; justify-content: flex-end; gap: 8px; }
.ws-form-group { margin-bottom: 14px; }
.ws-form-group label { display: block; font-size: 12px; font-weight: 500; color: #374151; margin-bottom: 4px; }
.ws-form-group input, .ws-form-group select, .ws-form-group textarea { width: 100%; padding: 6px 10px; font-size: 13px; border: 1px solid #d1d5db; border-radius: 4px; box-sizing: border-box; }
.ws-form-group textarea { resize: vertical; min-height: 60px; }
.ws-form-row { display: flex; gap: 12px; }
.ws-form-row > .ws-form-group { flex: 1; }
.ws-section { margin-top: 16px; padding-top: 12px; border-top: 1px solid #f3f4f6; }
.ws-section-title { font-size: 13px; font-weight: 500; color: #374151; margin-bottom: 8px; }
.ws-chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; margin: 2px; border-radius: 3px; font-size: 12px; background: #f3f4f6; }
.ws-chip .remove { cursor: pointer; color: #9ca3af; font-size: 14px; line-height: 1; }
.ws-chip .remove:hover { color: #ef4444; }
.ws-perm-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
.ws-perm-table th { background: #f9fafb; padding: 4px 8px; text-align: left; border-bottom: 1px solid #e5e7eb; }
.ws-perm-table td { padding: 4px 8px; border-bottom: 1px solid #f3f4f6; }
</style>
{% endblock %}

{% block content %}
<div class="ws-container" x-data="workstationManager()">

    <!-- Header -->
    <div class="ws-header">
        <div>
            <h1>工作站管理</h1>
            <p style="margin: 4px 0 0 0; font-size: 13px; color: #666;">管理表單中心的專業視角工作站</p>
        </div>
        <div class="ws-toolbar">
            <button class="ws-btn" @click="loadAll()">重新載入</button>
            <button class="ws-btn primary" @click="openCreate()">+ 新增工作站</button>
        </div>
    </div>

    <!-- 工作站列表 -->
    <div class="ws-card">
        <div x-show="loading" class="ws-loading">載入中...</div>
        <div x-show="!loading && workstations.length === 0" class="ws-empty">
            <p style="font-size: 16px; margin-bottom: 8px;">尚無工作站</p>
            <p>點擊「新增工作站」開始建立</p>
        </div>

        <table x-show="!loading && workstations.length > 0" class="ws-table">
            <thead>
                <tr>
                    <th style="width: 50px;">排序</th>
                    <th style="width: 120px;">代碼</th>
                    <th style="width: 180px;">名稱</th>
                    <th>篩選規則</th>
                    <th style="width: 80px;">狀態</th>
                    <th style="width: 120px;">URL</th>
                    <th style="width: 160px;">操作</th>
                </tr>
            </thead>
            <tbody>
                <template x-for="ws in workstations" :key="ws.secure_code">
                    <tr>
                        <td style="text-align: center; color: #999;" x-text="ws.display_order"></td>
                        <td><code style="font-size: 12px;" x-text="ws.code"></code></td>
                        <td>
                            <span x-text="ws.name"></span>
                            <template x-if="ws.icon">
                                <i :class="ws.icon" style="margin-left: 4px; color: #6b7280;"></i>
                            </template>
                        </td>
                        <td style="font-size: 12px;">
                            <template x-if="ws.filter_rules && ws.filter_rules.categories && ws.filter_rules.categories.length">
                                <span class="ws-tag" x-text="'分類: ' + ws.filter_rules.categories.length + '個'"></span>
                            </template>
                            <template x-if="ws.filter_rules && ws.filter_rules.tags && ws.filter_rules.tags.length">
                                <span class="ws-tag" x-text="'標籤: ' + ws.filter_rules.tags.length + '個'"></span>
                            </template>
                            <template x-if="ws.filter_rules && ws.filter_rules.source_types && ws.filter_rules.source_types.length">
                                <span class="ws-tag" x-text="'來源: ' + ws.filter_rules.source_types.join(',')"></span>
                            </template>
                        </td>
                        <td>
                            <span class="ws-badge" :class="ws.is_active ? 'active' : 'inactive'"
                                  x-text="ws.is_active ? '啟用' : '停用'"></span>
                        </td>
                        <td>
                            <a :href="'/forms/center/' + ws.code.toLowerCase()" style="font-size: 12px; color: #2563eb;"
                               x-text="'/forms/center/' + ws.code.toLowerCase()"></a>
                        </td>
                        <td>
                            <button class="ws-btn sm" @click="openEdit(ws)">編輯</button>
                            <button class="ws-btn sm" @click="toggleActive(ws)" x-text="ws.is_active ? '停用' : '啟用'"></button>
                            <button class="ws-btn sm danger" @click="deleteWs(ws)">刪除</button>
                        </td>
                    </tr>
                </template>
            </tbody>
        </table>
    </div>

    <!-- 標籤管理區塊 -->
    <div style="margin-top: 24px;">
        <div class="ws-header">
            <div>
                <h1>表單標籤</h1>
                <p style="margin: 4px 0 0 0; font-size: 13px; color: #666;">供工作站篩選使用的標記維度</p>
            </div>
            <div class="ws-toolbar">
                <button class="ws-btn primary" @click="openCreateTag()">+ 新增標籤</button>
            </div>
        </div>
        <div class="ws-card">
            <div x-show="loadingTags" class="ws-loading">載入中...</div>
            <div x-show="!loadingTags && tags.length === 0" class="ws-empty">
                <p>尚無標籤</p>
            </div>
            <table x-show="!loadingTags && tags.length > 0" class="ws-table">
                <thead>
                    <tr>
                        <th style="width: 50px;">排序</th>
                        <th style="width: 120px;">代碼</th>
                        <th style="width: 180px;">名稱</th>
                        <th>說明</th>
                        <th style="width: 80px;">顏色</th>
                        <th style="width: 120px;">操作</th>
                    </tr>
                </thead>
                <tbody>
                    <template x-for="tag in tags" :key="tag.secure_code">
                        <tr>
                            <td style="text-align: center; color: #999;" x-text="tag.display_order"></td>
                            <td><code style="font-size: 12px;" x-text="tag.code"></code></td>
                            <td x-text="tag.name"></td>
                            <td style="font-size: 12px; color: #6b7280;" x-text="tag.description || '-'"></td>
                            <td>
                                <template x-if="tag.color">
                                    <span :style="'display:inline-block;width:16px;height:16px;border-radius:3px;background:'+tag.color"></span>
                                </template>
                            </td>
                            <td>
                                <button class="ws-btn sm" @click="openEditTag(tag)">編輯</button>
                                <button class="ws-btn sm danger" @click="deleteTag(tag)">刪除</button>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </div>

    <!-- 工作站建立/編輯 Modal -->
    <template x-if="showModal">
        <div class="ws-modal-overlay">
            <div class="ws-modal">
                <div class="ws-modal-header">
                    <span x-text="editingWs ? '編輯工作站' : '新增工作站'"></span>
                    <button @click="showModal = false" style="background: none; border: none; font-size: 18px; cursor: pointer; color: #9ca3af;">&times;</button>
                </div>
                <div class="ws-modal-body">
                    <div class="ws-form-row">
                        <div class="ws-form-group">
                            <label>代碼 *</label>
                            <input type="text" x-model="form.code" placeholder="如 SOC, CS_DISPATCH" style="text-transform: uppercase;">
                        </div>
                        <div class="ws-form-group">
                            <label>名稱 *</label>
                            <input type="text" x-model="form.name" placeholder="如 SOC 資安監控中心">
                        </div>
                    </div>
                    <div class="ws-form-row">
                        <div class="ws-form-group">
                            <label>圖示 (Remix Icon class)</label>
                            <input type="text" x-model="form.icon" placeholder="如 ri-shield-check-line">
                        </div>
                        <div class="ws-form-group">
                            <label>排序</label>
                            <input type="number" x-model.number="form.display_order" min="0">
                        </div>
                    </div>
                    <div class="ws-form-group">
                        <label>說明</label>
                        <textarea x-model="form.description" rows="2"></textarea>
                    </div>

                    <!-- 篩選規則 -->
                    <div class="ws-section">
                        <div class="ws-section-title">篩選規則</div>

                        <div class="ws-form-group">
                            <label>分類 (category secure_code，逗號分隔)</label>
                            <input type="text" x-model="form.filter_categories" placeholder="留空=不限">
                        </div>
                        <div class="ws-form-group">
                            <label>標籤 (tag code，逗號分隔)</label>
                            <input type="text" x-model="form.filter_tags" placeholder="如 SECURITY,INCIDENT">
                        </div>
                        <div class="ws-form-row">
                            <div class="ws-form-group">
                                <label>來源類型</label>
                                <select x-model="form.filter_source_type">
                                    <option value="">不限</option>
                                    <option value="SYSTEM">SYSTEM (程式觸發)</option>
                                    <option value="WEB">WEB (人工填單)</option>
                                </select>
                            </div>
                            <div class="ws-form-group">
                                <label>維度匹配模式</label>
                                <select x-model="form.match_mode">
                                    <option value="all">全部符合 (AND)</option>
                                    <option value="any">任一符合 (OR)</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- UI 配置 -->
                    <div class="ws-section">
                        <div class="ws-section-title">UI 配置</div>
                        <div class="ws-form-row">
                            <div class="ws-form-group">
                                <label>預設展開區塊</label>
                                <select x-model="form.default_section">
                                    <option value="available">新填表單</option>
                                    <option value="pending">待簽核</option>
                                    <option value="tracking">追蹤中</option>
                                </select>
                            </div>
                            <div class="ws-form-group">
                                <label>自動刷新間隔 (秒)</label>
                                <input type="number" x-model.number="form.auto_refresh_interval" min="3" max="60">
                            </div>
                        </div>
                    </div>

                    <!-- 權限管理（編輯模式才顯示） -->
                    <template x-if="editingWs">
                        <div class="ws-section">
                            <div class="ws-section-title">存取權限</div>
                            <p style="font-size: 12px; color: #6b7280; margin-bottom: 8px;">未設定權限時，所有企業成員皆可存取此工作站。</p>
                            <div style="display: flex; gap: 8px; margin-bottom: 8px;">
                                <select x-model="permForm.grant_type" style="padding: 4px 8px; font-size: 12px; border: 1px solid #d1d5db; border-radius: 4px;">
                                    <option value="department">部門</option>
                                    <option value="group">群組</option>
                                    <option value="user">個人</option>
                                </select>
                                <input type="text" x-model="permForm.grant_target" placeholder="secure_code" style="flex: 1; padding: 4px 8px; font-size: 12px; border: 1px solid #d1d5db; border-radius: 4px;">
                                <input type="text" x-model="permForm.grant_target_name" placeholder="名稱" style="width: 120px; padding: 4px 8px; font-size: 12px; border: 1px solid #d1d5db; border-radius: 4px;">
                                <label style="font-size: 12px; display: flex; align-items: center; gap: 4px;">
                                    <input type="checkbox" x-model="permForm.include_children"> 含子層
                                </label>
                                <button class="ws-btn sm primary" @click="addPermission()">新增</button>
                            </div>
                            <table class="ws-perm-table" x-show="wsPermissions.length > 0">
                                <thead>
                                    <tr>
                                        <th>類型</th>
                                        <th>目標</th>
                                        <th>名稱</th>
                                        <th>含子層</th>
                                        <th style="width: 60px;"></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template x-for="p in wsPermissions" :key="p.secure_code">
                                        <tr>
                                            <td x-text="p.grant_type"></td>
                                            <td style="font-family: monospace; font-size: 11px;" x-text="p.grant_target"></td>
                                            <td x-text="p.grant_target_name"></td>
                                            <td x-text="p.include_children ? 'Y' : '-'"></td>
                                            <td><button class="ws-btn sm danger" @click="removePermission(p.secure_code)">刪除</button></td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </template>
                </div>
                <div class="ws-modal-footer">
                    <button class="ws-btn" @click="showModal = false">取消</button>
                    <button class="ws-btn primary" @click="saveWorkstation()" :disabled="saving" x-text="saving ? '儲存中...' : '儲存'"></button>
                </div>
            </div>
        </div>
    </template>

    <!-- 標籤建立/編輯 Modal -->
    <template x-if="showTagModal">
        <div class="ws-modal-overlay">
            <div class="ws-modal" style="width: 480px;">
                <div class="ws-modal-header">
                    <span x-text="editingTag ? '編輯標籤' : '新增標籤'"></span>
                    <button @click="showTagModal = false" style="background: none; border: none; font-size: 18px; cursor: pointer; color: #9ca3af;">&times;</button>
                </div>
                <div class="ws-modal-body">
                    <div class="ws-form-row">
                        <div class="ws-form-group">
                            <label>代碼 *</label>
                            <input type="text" x-model="tagForm.code" placeholder="如 SECURITY" style="text-transform: uppercase;">
                        </div>
                        <div class="ws-form-group">
                            <label>名稱 *</label>
                            <input type="text" x-model="tagForm.name" placeholder="如 資安相關">
                        </div>
                    </div>
                    <div class="ws-form-row">
                        <div class="ws-form-group">
                            <label>顏色</label>
                            <input type="color" x-model="tagForm.color">
                        </div>
                        <div class="ws-form-group">
                            <label>排序</label>
                            <input type="number" x-model.number="tagForm.display_order" min="0">
                        </div>
                    </div>
                    <div class="ws-form-group">
                        <label>說明</label>
                        <textarea x-model="tagForm.description" rows="2"></textarea>
                    </div>
                </div>
                <div class="ws-modal-footer">
                    <button class="ws-btn" @click="showTagModal = false">取消</button>
                    <button class="ws-btn primary" @click="saveTag()" :disabled="savingTag" x-text="savingTag ? '儲存中...' : '儲存'"></button>
                </div>
            </div>
        </div>
    </template>

</div>

<script src="/static/modules/form_workflow/js/workstation-manager.js"></script>
{% endblock %}
