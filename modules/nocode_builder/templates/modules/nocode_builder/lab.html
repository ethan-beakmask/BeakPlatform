{% extends "layouts/base.html" %}

{% block title %}Web Builder Lab - 資料表工具{% endblock %}

{% block head %}
<link rel="stylesheet" href="/bp/static/vendor/gridstack/gridstack.min.css">
<link rel="stylesheet" href="/bp/static/modules/nocode_builder/css/nocode-builder.css">
<link rel="stylesheet" href="/bp/static/css/bk-file-attachment.css">
<link rel="stylesheet" href="/bp/static/modules/nocode_builder/css/datalist-widget.css">
<link rel="stylesheet" href="/bp/static/modules/nocode_builder/css/sitemenu-widget.css">
<link rel="stylesheet" href="/bp/static/modules/nocode_builder/css/formgrid-widget.css">
{% endblock %}

{% block content %}
<div x-data="labDesigner()" x-cloak>

    <!-- Top Bar -->
    <div class="lab-topbar">
        <div style="display:flex; align-items:center; gap:12px;">
            <span class="lab-topbar-title">Web Builder</span>
            <span style="color:#666; font-size:13px;" x-text="pageName || '(未儲存)'"></span>
            <template x-if="pageSecureCode">
                <span style="font-size:12px; padding:2px 8px; border-radius:3px;"
                      :style="pageStatus === 'published'
                          ? 'background:#d4edda; color:#155724;'
                          : 'background:#e2e8f0; color:#555;'"
                      x-text="pageStatus === 'published' ? 'Published' : 'Draft'"></span>
            </template>
            <template x-if="publishedUrl">
                <a :href="publishedUrl" target="_blank"
                   style="font-size:12px; color:#0066cc;"
                   x-text="publishedUrl"></a>
            </template>
        </div>
        <div class="lab-topbar-actions">
            <button class="dc-btn" @click="newPage()">新頁面</button>
            <button class="dc-btn" @click="openPageList()">開啟</button>
            <button class="dc-btn primary" @click="savePage()">儲存</button>
            <button class="dc-btn" @click="previewLayout()">預覽</button>
            <template x-if="pageSecureCode && pageStatus !== 'published'">
                <button class="dc-btn" style="background:#28a745; color:#fff; border-color:#28a745;"
                        @click="publishPage()">發布</button>
            </template>
            <template x-if="pageSecureCode && pageStatus === 'published'">
                <button class="dc-btn" style="background:#dc3545; color:#fff; border-color:#dc3545;"
                        @click="unpublishPage()">取消發布</button>
            </template>
            <a href="/bp/nocode-builder/" class="dc-btn">返回</a>
        </div>
    </div>

    <div class="lab-layout">

        <!-- 左: 元件庫 -->
        <div class="lab-sidebar">
            <div class="lab-sidebar-title">元件庫</div>
            <div class="lab-component-list">
                <div class="lab-component-item" @click="addWidgetByClick()">
                    <div class="label">DATALIST</div>
                    <div class="desc">資料清單元件</div>
                </div>
            </div>
        </div>

        <!-- 中: 畫布 -->
        <div class="lab-canvas">
            <div class="grid-stack"></div>
        </div>

        <!-- 右: 設定面板 -->
        <div class="lab-settings">
            <div class="lab-settings-title">元件設定</div>

            <div class="lab-settings-body">
                <template x-if="!selectedWidgetId">
                    <div class="lab-settings-empty">點擊畫布上的元件進行設定</div>
                </template>
                <template x-if="selectedWidgetId">
                    <div>
                        <div class="lab-field">
                            <label>Widget ID</label>
                            <input type="text" :value="selectedWidgetId" disabled
                                   style="width:100%; padding:4px 8px; border:1px solid #ddd; font-size:11px; font-family:monospace; color:#999; box-sizing:border-box;">
                        </div>
                        <div class="lab-field">
                            <label>資料來源 (View)</label>
                            <select x-model="settingViewCode">
                                <option value="">-- 請選擇 --</option>
                                <template x-for="v in availableViews" :key="v.secure_code">
                                    <option :value="v.secure_code"
                                            x-text="v.name + ' (' + v.table_name + ')'"></option>
                                </template>
                            </select>
                        </div>
                        <div class="lab-field">
                            <label>每頁筆數</label>
                            <select x-model="settingPageSize">
                                <option value="5">5</option>
                                <option value="10">10</option>
                                <option value="20">20</option>
                                <option value="50">50</option>
                            </select>
                        </div>
                        <div class="lab-field">
                            <label>顯示功能</label>
                            <div class="lab-field-check">
                                <input type="checkbox" x-model="settingShowSearch" id="chkSearch">
                                <label for="chkSearch">搜尋列</label>
                            </div>
                            <div class="lab-field-check">
                                <input type="checkbox" x-model="settingShowPagination" id="chkPager">
                                <label for="chkPager">分頁</label>
                            </div>
                        </div>
                        <div class="lab-field">
                            <label>操作權限</label>
                            <div class="lab-field-check">
                                <input type="checkbox" x-model="settingAllowCreate" id="chkCreate">
                                <label for="chkCreate">允許新增</label>
                            </div>
                            <div class="lab-field-check">
                                <input type="checkbox" x-model="settingAllowEdit" id="chkEdit">
                                <label for="chkEdit">允許編輯</label>
                            </div>
                            <div class="lab-field-check">
                                <input type="checkbox" x-model="settingAllowDelete" id="chkDelete">
                                <label for="chkDelete">允許刪除</label>
                            </div>
                        </div>
                        <div style="display:flex; gap:8px; margin-top:16px;">
                            <button class="dc-btn primary" @click="applySettings()" style="flex:1;">套用設定</button>
                            <button class="dc-btn danger" @click="removeSelectedWidget()">移除</button>
                        </div>

                        <!-- ===== 輸出設定 ===== -->
                        <hr style="margin:16px 0 12px; border:none; border-top:1px solid #ddd;">
                        <div class="lab-section-title">輸出設定 (Output)</div>

                        <template x-for="(o, idx) in settingContextOutputs" :key="idx">
                            <div class="lab-context-item">
                                <div class="lab-context-desc">
                                    <span x-text="o.event"></span> :
                                    <span x-text="o.sourceColumn"></span> ->
                                    <span style="font-weight:500;" x-text="o.contextKey"></span>
                                </div>
                                <button class="dlw-btn sm danger" @click="removeContextOutput(idx)">移除</button>
                            </div>
                        </template>

                        <div class="lab-context-add">
                            <div class="lab-field" style="margin-bottom:6px;">
                                <label>觸發事件</label>
                                <select x-model="newOutputEvent" style="width:100%;">
                                    <option value="row-select">row-select</option>
                                </select>
                            </div>
                            <div class="lab-field" style="margin-bottom:6px;">
                                <label>來源欄位</label>
                                <select x-model="newOutputCol" style="width:100%;">
                                    <option value="">-- 請選擇 --</option>
                                    <template x-for="c in selectedWidgetColumns" :key="c.column">
                                        <option :value="c.column" x-text="(c.label||c.column) + ' [' + c.column + ']'"></option>
                                    </template>
                                </select>
                            </div>
                            <div class="lab-field" style="margin-bottom:6px;">
                                <label>Context Key</label>
                                <input type="text" x-model="newOutputKey" placeholder="例: order_no"
                                       style="width:100%; padding:4px 8px; border:1px solid #ccc; font-size:12px; box-sizing:border-box;">
                            </div>
                            <button class="dc-btn" @click="addContextOutput()" style="width:100%;">+ 新增輸出</button>
                        </div>

                        <!-- ===== 輸入設定 ===== -->
                        <hr style="margin:16px 0 12px; border:none; border-top:1px solid #ddd;">
                        <div class="lab-section-title">輸入設定 (Input)</div>

                        <template x-for="(inp, idx) in settingContextInputs" :key="idx">
                            <div class="lab-context-item">
                                <div class="lab-context-desc">
                                    <span style="font-weight:500;" x-text="inp.contextKey"></span> ->
                                    <span x-text="inp.filterColumn"></span>
                                </div>
                                <button class="dlw-btn sm danger" @click="removeContextInput(idx)">移除</button>
                            </div>
                        </template>

                        <div class="lab-context-add">
                            <div class="lab-field" style="margin-bottom:6px;">
                                <label>Context Key</label>
                                <input type="text" x-model="newInputKey" placeholder="例: order_no"
                                       style="width:100%; padding:4px 8px; border:1px solid #ccc; font-size:12px; box-sizing:border-box;">
                            </div>
                            <div class="lab-field" style="margin-bottom:6px;">
                                <label>篩選欄位</label>
                                <select x-model="newInputCol" style="width:100%;">
                                    <option value="">-- 請選擇 --</option>
                                    <template x-for="c in selectedWidgetColumns" :key="c.column">
                                        <option :value="c.column" x-text="(c.label||c.column) + ' [' + c.column + ']'"></option>
                                    </template>
                                </select>
                            </div>
                            <button class="dc-btn" @click="addContextInput()" style="width:100%;">+ 新增輸入</button>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <!-- ===== 開啟頁面 Modal ===== -->
    <div x-show="showPageListModal" x-cloak class="dc-modal">
        <div class="dc-modal-content" style="width:500px;">
            <div class="dc-modal-header">
                <h3>開啟頁面</h3>
                <button class="dc-close-btn" @click="showPageListModal=false">&times;</button>
            </div>
            <div class="dc-modal-body">
                <template x-if="savedPages.length === 0">
                    <div style="text-align:center; color:#999; padding:20px;">尚無已儲存的頁面</div>
                </template>
                <template x-for="p in savedPages" :key="p.secure_code">
                    <div class="lab-page-item" @click="openPage(p.secure_code)">
                        <div style="font-weight:500;" x-text="p.name"></div>
                        <div style="font-size:11px; color:#999;" x-text="p.description || ''"></div>
                        <div style="font-size:11px; color:#bbb;" x-text="p.updated_at"></div>
                    </div>
                </template>
            </div>
            <div class="dc-modal-footer">
                <button class="dc-btn" @click="showPageListModal=false">關閉</button>
            </div>
        </div>
    </div>

    <!-- ===== 另存新頁 Modal ===== -->
    <div x-show="showSaveAsModal" x-cloak class="dc-modal">
        <div class="dc-modal-content" style="width:400px;">
            <div class="dc-modal-header">
                <h3>儲存新頁面</h3>
                <button class="dc-close-btn" @click="showSaveAsModal=false">&times;</button>
            </div>
            <div class="dc-modal-body">
                <div class="lab-field">
                    <label>頁面名稱</label>
                    <input type="text" x-model="saveAsName" placeholder="輸入頁面名稱"
                           style="width:100%; padding:6px 10px; border:1px solid #ccc; font-size:13px; box-sizing:border-box;">
                </div>
            </div>
            <div class="dc-modal-footer">
                <button class="dc-btn" @click="showSaveAsModal=false">取消</button>
                <button class="dc-btn primary" @click="saveAsPage()">儲存</button>
            </div>
        </div>
    </div>

</div>

<script src="/bp/static/vendor/gridstack/gridstack-all.js"></script>
<script src="/bp/static/modules/nocode_builder/js/page-context.js"></script>
<script src="/bp/static/js/bk-file-attachment.js"></script>
<script src="/bp/static/modules/nocode_builder/js/datalist-widget.js"></script>
<script src="/bp/static/modules/nocode_builder/js/sitemenu-widget.js"></script>
<script src="/bp/static/modules/nocode_builder/js/formgrid-widget.js"></script>
<script src="/bp/static/modules/nocode_builder/js/lab-designer.js"></script>
{% endblock %}
