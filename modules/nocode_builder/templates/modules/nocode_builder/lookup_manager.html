{% extends "layouts/base.html" %}

{% block title %}選項清單管理 - 資料表工具{% endblock %}

{% block head %}
<link rel="stylesheet" href="/static/vendor/wunderbaum/bootstrap-icons.css">
<link rel="stylesheet" href="/static/vendor/wunderbaum/wunderbaum.css">
<link rel="stylesheet" href="/static/modules/nocode_builder/css/nocode-builder.css">
{% endblock %}

{% block content %}
<div class="dc-container" x-data="lookupManager()" x-cloak>

    <!-- Header -->
    <div class="dc-header">
        <div>
            <h1>選項清單管理</h1>
            <p>管理 Lookup Table 類別與選項</p>
        </div>
        <div class="dc-toolbar">
            <button class="dc-btn primary" @click="openCategoryModal()">新增類別</button>
        </div>
    </div>

    <!-- Main layout: sidebar + detail -->
    <div class="dc-lk-layout">

        <!-- Left: Category list -->
        <div class="dc-lk-sidebar">
            <div class="dc-lk-search">
                <input type="text" class="dc-search-input" style="width: 100%;"
                       x-model="catFilter" placeholder="搜尋類別...">
            </div>
            <div class="dc-lk-cat-list">
                <div x-show="loading" class="dc-loading" style="padding: 20px;">載入中...</div>
                <template x-for="cat in filteredCategories" :key="cat.secure_code">
                    <div class="dc-lk-cat-item"
                         :class="selectedCat && selectedCat.secure_code === cat.secure_code ? 'selected' : ''"
                         @click="selectCategory(cat)">
                        <div class="dc-lk-cat-name">
                            <span x-text="cat.name"></span>
                            <span x-show="cat.is_system" class="dc-sys-badge" style="margin-left: 4px;">SYS</span>
                        </div>
                        <div class="dc-lk-cat-code" x-text="cat.code"></div>
                    </div>
                </template>
                <div x-show="!loading && filteredCategories.length === 0" style="padding: 20px; text-align: center; color: #999; font-size: 13px;">
                    無符合的類別
                </div>
            </div>
        </div>

        <!-- Right: Item editor -->
        <div class="dc-lk-detail">
            <template x-if="!selectedCat">
                <div class="dc-empty" style="padding: 60px;">
                    <p>請從左側選擇一個類別</p>
                </div>
            </template>
            <template x-if="selectedCat">
                <div style="display: flex; flex-direction: column; height: 100%;">
                    <!-- Category info bar -->
                    <div class="dc-lk-detail-header">
                        <div>
                            <strong x-text="selectedCat.name"></strong>
                            <span style="margin-left: 8px; font-family: monospace; color: #666; font-size: 12px;" x-text="selectedCat.code"></span>
                            <span x-show="selectedCat.is_hierarchical" class="dc-badge" style="margin-left: 6px; background: #e0e7ff; color: #3730a3;">階層</span>
                        </div>
                        <div style="display: flex; gap: 6px;">
                            <button class="dc-btn sm" @click="openCategoryModal(selectedCat)" :disabled="selectedCat.is_system">編輯</button>
                            <button class="dc-btn sm danger" @click="deleteCategory()" :disabled="selectedCat.is_system">刪除</button>
                            <button class="dc-btn sm primary" @click="openItemModal()">新增選項</button>
                        </div>
                    </div>
                    <div x-show="selectedCat.description" style="padding: 6px 12px; font-size: 12px; color: #666; border-bottom: 1px solid #eee;">
                        <span x-text="selectedCat.description"></span>
                    </div>

                    <!-- Wunderbaum treegrid container -->
                    <div x-show="itemsLoading" class="dc-loading" style="padding: 30px;">載入選項中...</div>
                    <div x-show="!itemsLoading && items.length === 0" class="dc-empty" style="padding: 40px;">
                        <p>此類別尚無選項，拖拉列可調整排序</p>
                    </div>
                    <div id="wb-tree" x-show="!itemsLoading && items.length > 0"
                         style="flex: 1; min-height: 200px;"></div>
                </div>
            </template>
        </div>
    </div>

    <!-- Category Modal -->
    <div x-show="showCatModal" x-cloak class="dc-modal">
        <div class="dc-modal-content" style="width: 500px;">
            <div class="dc-modal-header">
                <h3 x-text="catForm.secure_code ? '編輯類別' : '新增類別'"></h3>
                <button class="dc-close-btn" @click="showCatModal = false">&times;</button>
            </div>
            <div class="dc-modal-body">
                <div class="dc-form-group">
                    <label>類別代碼 *</label>
                    <input type="text" x-model="catForm.code" placeholder="例: PRIORITY"
                           :disabled="!!catForm.secure_code"
                           style="font-family: monospace; text-transform: uppercase;">
                </div>
                <div class="dc-form-group">
                    <label>類別名稱 *</label>
                    <input type="text" x-model="catForm.name" placeholder="例: 優先程度">
                </div>
                <div class="dc-form-group">
                    <label>說明</label>
                    <textarea x-model="catForm.description" placeholder="類別用途說明"></textarea>
                </div>
                <div class="dc-form-inline">
                    <label><input type="checkbox" x-model="catForm.is_hierarchical"> 支援階層結構</label>
                </div>
            </div>
            <div class="dc-modal-footer">
                <button class="dc-btn" @click="showCatModal = false">取消</button>
                <button class="dc-btn primary" @click="saveCategory()" :disabled="catSaving">
                    <span x-show="!catSaving">確認</span>
                    <span x-show="catSaving">處理中...</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Item Modal -->
    <div x-show="showItemModal" x-cloak class="dc-modal">
        <div class="dc-modal-content" style="width: 500px;">
            <div class="dc-modal-header">
                <h3 x-text="itemForm.secure_code ? '編輯選項' : '新增選項'"></h3>
                <button class="dc-close-btn" @click="showItemModal = false">&times;</button>
            </div>
            <div class="dc-modal-body">
                <div class="dc-form-group">
                    <label>選項代碼 *</label>
                    <input type="text" x-model="itemForm.code" placeholder="例: HIGH"
                           :disabled="!!itemForm.secure_code"
                           style="font-family: monospace;">
                </div>
                <div class="dc-form-group">
                    <label>顯示文字 *</label>
                    <input type="text" x-model="itemForm.label" placeholder="例: 高">
                </div>
                <div class="dc-form-group" x-show="selectedCat && selectedCat.is_hierarchical">
                    <label>父項代碼</label>
                    <select x-model="itemForm.parent_code">
                        <option value="">-- 無 (頂層) --</option>
                        <template x-for="pi in items.filter(i => !itemForm.secure_code || i.secure_code !== itemForm.secure_code)" :key="pi.secure_code">
                            <option :value="pi.code" x-text="pi.code + ' - ' + pi.label"></option>
                        </template>
                    </select>
                </div>
                <div class="dc-form-group">
                    <label>排序順序</label>
                    <input type="number" x-model.number="itemForm.sort_order" min="0">
                </div>
                <div class="dc-form-group">
                    <label>附加資料 (JSON)</label>
                    <textarea x-model="itemForm.valueJson" placeholder='{"key": "value"}' style="font-family: monospace; font-size: 12px;"></textarea>
                </div>
                <div class="dc-form-inline">
                    <label><input type="checkbox" x-model="itemForm.is_active"> 啟用</label>
                </div>
            </div>
            <div class="dc-modal-footer">
                <button class="dc-btn" @click="showItemModal = false">取消</button>
                <button class="dc-btn primary" @click="saveItem()" :disabled="itemSaving">
                    <span x-show="!itemSaving">確認</span>
                    <span x-show="itemSaving">處理中...</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div x-show="toast.show" x-cloak class="dc-toast" :class="toast.type"
         x-text="toast.message" x-transition></div>
</div>

<script src="/static/vendor/wunderbaum/wunderbaum.umd.min.js"></script>
<script src="/static/modules/nocode_builder/js/lookup-manager.js"></script>
{% endblock %}
