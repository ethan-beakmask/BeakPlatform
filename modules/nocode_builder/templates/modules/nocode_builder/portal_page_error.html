<!DOCTYPE html>
<html lang="{{ current_locale|default('zh-TW') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ _('頁面無法顯示') }}</title>
    <link rel="icon" href="{{ app_prefix }}/static/favicon.ico">
    <link rel="stylesheet" href="{{ app_prefix }}/static/css/common.css">
    <link rel="stylesheet" href="{{ app_prefix }}/static/css/pageir.css">
    <style>
        body { background: var(--color-bg); color: var(--color-text); margin: 0; }
        .portal-shell { min-height: 100vh; }
        .portal-topbar { background: var(--color-bg-white); border-bottom: 1px solid var(--color-border); padding: 16px 24px; display: flex; align-items: center; gap: 12px; }
        .portal-topbar h1 { font-size: 18px; margin: 0; font-weight: 600; overflow-wrap: anywhere; }
        .portal-content { max-width: 1180px; margin: 0 auto; padding: 24px; }
    </style>
</head>
<body>
    <div class="portal-shell">
        {% if sub_system_name %}
        <header class="portal-topbar">
            {% if sub_system_icon %}<span><i class="{{ sub_system_icon }}"></i></span>{% endif %}
            <h1>{{ sub_system_name }}</h1>
        </header>
        {% endif %}
        <main class="portal-content">
            <div class="pir-page pir-error">
                <h1 class="pir-page-title">{{ _('頁面無法顯示') }}</h1>
                <p>{{ _('頁面定義無效或引用了未註冊的資源') }}</p>
            </div>
        </main>
    </div>
</body>
</html>
