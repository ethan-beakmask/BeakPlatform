<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ sub_system_name }}</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="/static/vendor/bootstrap/css/bootstrap.min.css">
    <style>
        body {
            background: #f5f6f8;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #333;
        }
        .public-portal-wrapper {
            max-width: 720px;
            margin: 80px auto;
            padding: 0 16px;
        }
        .public-portal-card {
            background: #fff;
            border: 1px solid #ddd;
            padding: 40px 32px;
            text-align: center;
        }
        .public-portal-card h1 {
            font-size: 24px;
            margin: 0 0 12px;
            font-weight: 600;
        }
        .public-portal-card .description {
            color: #666;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .public-portal-card .status-badge {
            display: inline-block;
            padding: 4px 12px;
            font-size: 13px;
            border: 1px solid #0d6efd;
            color: #0d6efd;
            background: #e7f1ff;
        }
        .public-portal-footer {
            margin-top: 32px;
            text-align: center;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="public-portal-wrapper">
        <div class="public-portal-card">
            {% if sub_system_icon %}
            <div style="font-size: 36px; margin-bottom: 12px;">
                <i class="{{ sub_system_icon }}"></i>
            </div>
            {% endif %}
            <h1>{{ sub_system_name }}</h1>
            {% if sub_system_description %}
            <p class="description">{{ sub_system_description }}</p>
            {% endif %}
            <span class="status-badge">Portal 準備中</span>
        </div>
        <div class="public-portal-footer">
            Powered by BeakPlatform
        </div>
    </div>
</body>
</html>
