<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Studio 設計器 - BeakPlatform</title>
    <link rel="stylesheet" href="/static/css/themes.css">
    <link rel="stylesheet" href="/static/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/static/vendor/beak-trellis/beak-tree.css">
    <link rel="stylesheet" href="/static/vendor/gridstack/gridstack.min.css">
    <link rel="stylesheet" href="/static/modules/nocode_builder/css/nocode-builder.css">
    <link rel="stylesheet" href="/static/modules/nocode_builder/css/studio.css">
    <style>[x-cloak] { display: none !important; }</style>
    <script defer src="/static/vendor/alpine.min.js"></script>
</head>
<body>

<div class="stu-app" x-data="studioManager()" x-cloak>

    <!-- Loading / Not Found -->
    <div x-show="loading" class="stu-splash">載入中...</div>
    <div x-show="!loading && !subSystem" class="stu-splash">開發案不存在</div>

    <!-- Main Layout -->
    <div x-show="!loading && subSystem" class="stu-layout">

        <!-- ===== Top Bar ===== -->
        <div class="stu-topbar">
            <div class="stu-topbar-left">
                <a href="/nocode-builder/sub-systems" class="stu-btn sm" title="返回列表">
                    <i class="fas fa-arrow-left"></i>
                </a>
                <h2 x-text="subSystem ? subSystem.name : ''"></h2>
                <span class="stu-badge" :class="subSystem ? subSystem.status : ''"
                      x-text="subSystem && subSystem.status === 'published' ? '上線中' : '開發中'"></span>
                <span x-show="dirty" class="stu-unsaved">(未儲存)</span>
            </div>
            <div class="stu-topbar-right">
                <button class="stu-btn" @click="savePage()" :disabled="!currentPageSc">
                    <i class="fas fa-save"></i> 儲存
                </button>
                <button class="stu-btn" @click="previewPage()">
                    <i class="fas fa-eye"></i> 預覽
                </button>
                <button class="stu-btn" @click="togglePublish()"
                        x-text="subSystem && subSystem.status === 'draft' ? '上線' : '下線'"></button>
                <div class="stu-topbar-sep"></div>
                <span class="stu-topbar-user">{{ current_user.display_name }}</span>
                <form action="{{ url_for('auth.logout') }}" method="POST" style="margin:0;">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <button type="submit" class="stu-btn sm">登出</button>
                </form>
            </div>
        </div>

        <!-- ===== Body: 3 Panels ===== -->
        <div class="stu-body">

            <!-- Left Panel -->
            <div class="stu-sidebar">
                <!-- Component Library -->
                <div class="stu-panel-section">
                    <div class="stu-panel-title"><i class="fas fa-puzzle-piece"></i> 元件庫</div>
                    <div class="stu-component-list">
                        <template x-for="comp in componentTypes" :key="comp.type">
                            <div class="stu-component-item"
                                 draggable="true"
                                 @dragstart="onComponentDragStart($event, comp.type)"
                                 @click="onComponentClick(comp.type)">
                                <i :class="'fas ' + comp.icon" class="stu-comp-icon"></i>
                                <div>
                                    <div class="stu-comp-label" x-text="comp.label"></div>
                                    <div class="stu-comp-desc" x-text="comp.desc"></div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- Site Map Tree -->
                <div class="stu-panel-section stu-panel-flex">
                    <div class="stu-panel-title"><i class="fas fa-sitemap"></i> Site Map</div>
                    <div class="stu-tree-toolbar">
                        <button class="stu-btn sm" @click="openAddNode()"><i class="fas fa-plus"></i> 節點</button>
                        <button class="stu-btn sm" @click="openAccessRoles()" :disabled="!selectedNode">准入</button>
                        <button class="stu-btn sm danger" @click="deleteNode()" :disabled="!selectedNode">刪除</button>
                    </div>
                    <div class="stu-tree-wrap">
                        <div id="stu-tree"></div>
                        <div x-show="tree.length === 0" class="stu-tree-empty">
                            尚無節點，點擊 [+ 節點] 建立
                        </div>
                    </div>
                </div>
            </div>

            <!-- Center Panel (Canvas) -->
            <div class="stu-canvas">
                <!-- Canvas toolbar: mode toggle + node info -->
                <div class="stu-canvas-toolbar" x-show="selectedNode && selectedNode.node_type === 'page'">
                    <div class="stu-mode-toggle">
                        <button :class="{ active: editMode === 'grid' }" @click="switchMode('grid')">
                            <i class="fas fa-th"></i> 框架模式
                        </button>
                        <button :class="{ active: editMode === 'free' }" @click="switchMode('free')">
                            <i class="fas fa-arrows-alt"></i> 自由模式
                        </button>
                    </div>
                    <div class="stu-canvas-info">
                        <span x-text="selectedNode ? selectedNode.name : ''"></span>
                    </div>
                </div>

                <!-- Empty state -->
                <div x-show="!selectedNode || selectedNode.node_type !== 'page'" class="stu-canvas-empty">
                    <i class="fas fa-mouse-pointer"></i>
                    <span>點擊左側 Site Map 的頁面節點開始設計</span>
                </div>

                <!-- Grid mode canvas -->
                <div x-show="selectedNode && selectedNode.node_type === 'page' && editMode === 'grid'"
                     id="stu-grid-canvas" class="stu-editor-area"></div>

                <!-- Free mode canvas -->
                <div x-show="selectedNode && selectedNode.node_type === 'page' && editMode === 'free'"
                     class="stu-editor-area stu-free-area">
                    <div class="grid-stack" id="stu-gridstack"></div>
                </div>
            </div>

            <!-- Right Panel (Properties) -->
            <div class="stu-props" :class="{ 'stu-props-hidden': !showProps }">

                <!-- Access Roles mode -->
                <template x-if="propsMode === 'perm'">
                    <div>
                        <div class="stu-panel-title">
                            准入設定
                            <button class="stu-btn sm" @click="showProps = false" style="float:right;">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                        <div class="stu-props-body">
                            <p class="stu-hint">勾選可進入此頁面的角色。未勾選任何角色 = 禁止所有人進入。</p>
                            <div class="stu-section-divider">准入角色</div>
                            <template x-for="role in accessRoleOptions" :key="role.value">
                                <div class="stu-field-check">
                                    <input type="checkbox"
                                           :id="'ar-' + role.value"
                                           :checked="editAccessRoles.indexOf(role.value) >= 0"
                                           @change="toggleAccessRole(role.value, $event.target.checked)">
                                    <label :for="'ar-' + role.value">
                                        <span x-text="role.label"></span>
                                        <span class="stu-hint" x-show="role.hint" x-text="role.hint" style="margin-left:4px;"></span>
                                    </label>
                                </div>
                            </template>
                            <div class="stu-section-divider">目前狀態</div>
                            <div class="stu-hint" x-text="accessRolesStatus()"></div>
                            <div style="margin-top:12px;">
                                <button class="stu-btn primary" @click="saveAccessRoles()">儲存</button>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- Widget settings mode -->
                <div x-show="propsMode === 'widget'">
                    <div class="stu-panel-title">元件設定</div>
                    <div class="stu-props-body">
                        <div class="stu-field">
                            <label>資料來源</label>
                            <select x-model="settingDataSource" @change="onDataSourceChange()">
                                <option value="">-- 選擇來源 --</option>
                                <template x-for="ds in dataSources" :key="ds.key">
                                    <option :value="ds.key" x-text="ds.label"></option>
                                </template>
                            </select>
                            <div x-show="dataSources.length === 0" style="margin-top: 4px; font-size: 11px; color: #999;">
                                無可用資料來源
                            </div>
                        </div>
                        <div class="stu-field" x-show="settingDataSource">
                            <label>資料表</label>
                            <select x-model="settingTableName" @change="onTableNameChange()"
                                    x-effect="sourceTables.length; $nextTick(() => { if (settingTableName) $el.value = settingTableName })"
                                    :disabled="loadingTables">
                                <option value="">-- 選擇資料表 --</option>
                                <template x-for="t in sourceTables" :key="t.name">
                                    <option :value="t.name" x-text="t.name + (t.comment ? ' (' + t.comment + ')' : '')"></option>
                                </template>
                            </select>
                            <div x-show="loadingTables" style="font-size: 11px; color: #999;">載入中...</div>
                            <div x-show="!loadingTables && settingDataSource && sourceTables.length === 0"
                                 style="font-size: 11px; color: #999;">此來源無可用表</div>
                        </div>
                        <div x-show="resolvingView" style="font-size: 11px; color: #999; padding: 4px 0;">
                            正在準備視圖配置...
                        </div>
                        <div class="stu-field">
                            <label>標題</label>
                            <input type="text" x-model="settingTitle" placeholder="自訂標題">
                        </div>
                        <div class="stu-field">
                            <label>每頁筆數</label>
                            <input type="number" x-model="settingPageSize" min="1" max="100">
                        </div>
                        <div class="stu-section-divider">顯示選項</div>
                        <div class="stu-field-check">
                            <input type="checkbox" x-model="settingShowSearch" id="stu-search">
                            <label for="stu-search">顯示搜尋</label>
                        </div>
                        <div class="stu-field-check">
                            <input type="checkbox" x-model="settingShowPagination" id="stu-pager">
                            <label for="stu-pager">顯示分頁</label>
                        </div>
                        <div class="stu-section-divider">CRUD 權限</div>
                        <div class="stu-field-check">
                            <input type="checkbox" id="stu-use-role-perms"
                                   :checked="settingUseRolePerms"
                                   @change="toggleRolePermMode($event.target.checked)">
                            <label for="stu-use-role-perms">依角色設定</label>
                        </div>

                        <!-- 全域 CRUD (未啟用角色權限時) -->
                        <div x-show="!settingUseRolePerms">
                            <div class="stu-field-check">
                                <input type="checkbox" x-model="settingAllowCreate" id="stu-create">
                                <label for="stu-create">允許新增</label>
                            </div>
                            <div class="stu-field-check">
                                <input type="checkbox" x-model="settingAllowEdit" id="stu-edit">
                                <label for="stu-edit">允許編輯</label>
                            </div>
                            <div class="stu-field-check">
                                <input type="checkbox" x-model="settingAllowDelete" id="stu-delete">
                                <label for="stu-delete">允許刪除</label>
                            </div>
                        </div>

                        <!-- 角色權限矩陣 (啟用角色權限時) -->
                        <div x-show="settingUseRolePerms" class="stu-role-matrix">
                            <table>
                                <thead>
                                    <tr>
                                        <th>角色</th>
                                        <th title="新增">C</th>
                                        <th title="編輯">E</th>
                                        <th title="刪除">D</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template x-for="role in rolePermRoles" :key="role">
                                        <tr>
                                            <td class="stu-rm-role" x-text="roleLabels[role] || role"></td>
                                            <td><input type="checkbox"
                                                       :checked="getRolePerm(role, 'create')"
                                                       @change="setRolePerm(role, 'create', $event.target.checked)"></td>
                                            <td><input type="checkbox"
                                                       :checked="getRolePerm(role, 'edit')"
                                                       @change="setRolePerm(role, 'edit', $event.target.checked)"></td>
                                            <td><input type="checkbox"
                                                       :checked="getRolePerm(role, 'delete')"
                                                       @change="setRolePerm(role, 'delete', $event.target.checked)"></td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                            <p class="stu-hint" style="margin-top:4px;">C=新增 E=編輯 D=刪除 (讀取恆開)</p>
                        </div>

                        <!-- 角色資料篩選 -->
                        <div class="stu-section-divider">角色資料篩選</div>
                        <div class="stu-filter-section">
                            <div class="stu-field" style="margin-bottom:6px;">
                                <select @change="selectFilterRole($event.target.value)"
                                        :value="settingFilterRole">
                                    <option value="">-- 選擇角色 --</option>
                                    <template x-for="role in rolePermRoles" :key="'f-'+role">
                                        <option :value="role" x-text="roleLabels[role] || role"></option>
                                    </template>
                                </select>
                            </div>

                            <!-- 目前角色的篩選條件 -->
                            <div x-show="settingFilterRole">
                                <template x-for="(entry, idx) in settingFilterEntries" :key="'fe-'+idx">
                                    <div class="stu-filter-row">
                                        <input type="text" x-model="entry.key" placeholder="欄位名">
                                        <span class="stu-filter-eq">=</span>
                                        <input type="text" x-model="entry.value" placeholder="值 / $變數"
                                               list="stu-filter-vars">
                                        <button class="stu-btn sm danger" @click="removeFilterEntry(idx)">x</button>
                                    </div>
                                </template>
                                <button class="stu-btn sm" @click="addFilterEntry()"
                                        style="margin-top:4px;">+ 條件</button>
                            </div>

                            <!-- 變數提示 -->
                            <datalist id="stu-filter-vars">
                                <template x-for="v in filterVarOptions" :key="v">
                                    <option :value="v"></option>
                                </template>
                            </datalist>

                            <!-- 已設定篩選摘要 -->
                            <div class="stu-hint" style="margin-top:8px;">
                                已設定: <span x-text="getFilterSummary()"></span>
                            </div>
                        </div>

                        <div class="stu-section-divider">
                            Context Outputs
                            <button class="stu-btn sm" style="float:right;" @click="addContextOutput()">+</button>
                        </div>
                        <template x-for="(out, idx) in settingContextOutputs" :key="idx">
                            <div class="stu-ctx-row">
                                <input type="text" x-model="out.contextKey" placeholder="contextKey">
                                <select x-model="out.sourceColumn"
                                        x-effect="getViewColumns(); $nextTick(() => { if (out.sourceColumn) $el.value = out.sourceColumn })">
                                    <option value="">--</option>
                                    <template x-for="col in getViewColumns()" :key="col.column">
                                        <option :value="col.column" x-text="col.label + ' [' + col.column + ']'"></option>
                                    </template>
                                </select>
                                <button class="stu-btn sm danger" @click="removeContextOutput(idx)">x</button>
                            </div>
                        </template>
                        <div class="stu-section-divider">
                            Context Inputs
                            <button class="stu-btn sm" style="float:right;" @click="addContextInput()">+</button>
                        </div>
                        <template x-for="(inp, idx) in settingContextInputs" :key="idx">
                            <div class="stu-ctx-row">
                                <input type="text" x-model="inp.contextKey" placeholder="contextKey">
                                <select x-model="inp.filterColumn"
                                        x-effect="getViewColumns(); $nextTick(() => { if (inp.filterColumn) $el.value = inp.filterColumn })">
                                    <option value="">--</option>
                                    <template x-for="col in getViewColumns()" :key="col.column">
                                        <option :value="col.column" x-text="col.label + ' [' + col.column + ']'"></option>
                                    </template>
                                </select>
                                <button class="stu-btn sm danger" @click="removeContextInput(idx)">x</button>
                            </div>
                        </template>
                        <div class="stu-actions">
                            <button class="stu-btn primary" @click="applyWidgetSettings()">套用</button>
                            <button class="stu-btn danger" @click="removeSelectedWidget()">移除元件</button>
                        </div>
                    </div>
                </div>
            </div>

        </div><!-- stu-body -->
    </div><!-- stu-layout -->

    <!-- ===== Add Node Modal ===== -->
    <div x-show="showAddNodeModal" x-cloak class="dc-modal">
        <div class="dc-modal-content" style="width:400px;">
            <div class="dc-modal-header">
                <h3>新增節點</h3>
                <button class="dc-close-btn" @click="showAddNodeModal = false">&times;</button>
            </div>
            <div class="dc-modal-body">
                <div class="stu-field">
                    <label>名稱 *</label>
                    <input type="text" x-model="addNodeForm.name">
                </div>
                <div class="stu-field">
                    <label>類型</label>
                    <div style="display:flex; gap:16px;">
                        <label style="display:flex; align-items:center; gap:4px; cursor:pointer;">
                            <input type="radio" value="page" x-model="addNodeForm.node_type"> 頁面
                        </label>
                        <label style="display:flex; align-items:center; gap:4px; cursor:pointer;">
                            <input type="radio" value="folder" x-model="addNodeForm.node_type"> 資料夾
                        </label>
                    </div>
                </div>
                <div x-show="selectedNode" class="stu-field">
                    <label style="display:flex; align-items:center; gap:4px;">
                        <input type="checkbox"
                               :checked="addNodeForm.parent_sc !== ''"
                               @change="addNodeForm.parent_sc = $event.target.checked
                                   ? (selectedNode ? selectedNode.secure_code : '') : ''">
                        建立為「<span x-text="selectedNode ? selectedNode.name : ''"></span>」的子節點
                    </label>
                </div>
            </div>
            <div class="dc-modal-footer">
                <button class="dc-btn" @click="showAddNodeModal = false">取消</button>
                <button class="dc-btn primary" @click="doAddNode()">建立</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div x-show="toast.show" x-cloak class="stu-toast" :class="toast.type"
         x-text="toast.message" x-transition></div>

</div><!-- stu-app -->

<script>
window.__STUDIO_CONFIG = {
    subSystemSc: '{{ sub_system_sc }}',
};
</script>
<script src="/static/vendor/beak-trellis/beak-tree-model.js"></script>
<script src="/static/vendor/beak-trellis/beak-tree.js"></script>
<script src="/static/vendor/beak-trellis/renderers/beak-tree-lines-dom.js"></script>
<script src="/static/vendor/beak-trellis/beak-tree-drag.js"></script>
<script src="/static/vendor/gridstack/gridstack-all.js"></script>
<script src="/static/modules/nocode_builder/js/page-context.js"></script>
<script src="/static/modules/nocode_builder/js/datalist-widget.js"></script>
<script src="/static/modules/nocode_builder/js/grid-layout-editor.js"></script>
<script src="/static/modules/nocode_builder/js/studio.js"></script>
<script src="/static/js/auth.js"></script>
</body>
</html>
