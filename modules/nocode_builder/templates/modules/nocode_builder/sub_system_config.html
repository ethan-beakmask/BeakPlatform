{% extends "layouts/base.html" %}

{% block title %}子系統配置 - 資料表工具{% endblock %}

{% block head %}
<link rel="stylesheet" href="/static/modules/nocode_builder/css/nocode-builder.css">
<link rel="stylesheet" href="/static/vendor/wunderbaum/bootstrap-icons.css">
<link rel="stylesheet" href="/static/vendor/wunderbaum/wunderbaum.css">
<link rel="stylesheet" href="/static/vendor/beak-trellis/beak-trellis.css">
<style>
    .ssc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .ssc-section {
        background: #fff;
        border: 1px solid #ddd;
        margin-bottom: 16px;
    }
    .ssc-section-title {
        padding: 12px 16px;
        border-bottom: 1px solid #ddd;
        font-weight: 600;
        font-size: 14px;
        background: #f9f9f9;
    }
    .ssc-section-body { padding: 16px; }
    .ssc-field { margin-bottom: 12px; }
    .ssc-field label {
        display: block;
        margin-bottom: 4px;
        font-weight: 500;
        font-size: 13px;
    }
    .ssc-field input, .ssc-field select, .ssc-field textarea {
        width: 100%;
        padding: 6px 8px;
        border: 1px solid #ddd;
        font-size: 13px;
        box-sizing: border-box;
    }
    .ssc-page-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border-bottom: 1px solid #eee;
    }
    .ssc-page-item:last-child { border-bottom: none; }
    .ssc-page-name { flex: 1; font-weight: 500; }
    .ssc-page-order { width: 50px; text-align: center; }
    .ssc-tag {
        display: inline-block;
        padding: 1px 6px;
        font-size: 11px;
        border: 1px solid #ddd;
        margin-right: 4px;
        background: #f9f9f9;
    }
    .ssc-tag.active { border-color: #16a34a; color: #16a34a; }
    .ssc-roles-editor { margin-top: 8px; }
    .ssc-roles-editor label {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        margin-right: 12px;
        font-weight: normal;
        font-size: 12px;
    }
    .ssc-crud-grid {
        display: grid;
        grid-template-columns: 100px repeat(3, 1fr);
        gap: 4px;
        font-size: 12px;
        margin-top: 8px;
    }
    .ssc-crud-grid .header { font-weight: 600; text-align: center; }
    .ssc-crud-grid .role-name { font-weight: 500; }
    .ssc-crud-grid .check { text-align: center; }
    .ssc-filter-row { display: flex; gap: 4px; margin-bottom: 4px; align-items: center; }
    .ssc-filter-row input { font-size: 12px; padding: 4px 6px; }

    /* Tabs */
    .ssc-tabs {
        display: flex;
        border-bottom: 2px solid #ddd;
        margin-bottom: 16px;
    }
    .ssc-tab {
        padding: 10px 20px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 500;
        color: #666;
        border-bottom: 2px solid transparent;
        margin-bottom: -2px;
    }
    .ssc-tab:hover { color: #333; }
    .ssc-tab.active { color: #0066cc; border-bottom-color: #0066cc; }

    /* Site Map Editor */
    .sm-layout { display: grid; grid-template-columns: 300px 1fr; gap: 16px; min-height: 500px; }
    .sm-tree-panel {
        background: #fff;
        border: 1px solid #ddd;
        display: flex;
        flex-direction: column;
    }
    .sm-tree-toolbar {
        padding: 8px 12px;
        border-bottom: 1px solid #eee;
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
    }
    .sm-tree-body {
        flex: 1;
        overflow: auto;
        min-height: 300px;
    }
    .sm-props-panel {
        background: #fff;
        border: 1px solid #ddd;
    }
    .sm-props-empty {
        padding: 40px;
        text-align: center;
        color: #999;
    }
    .sm-perm-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 0;
        border-bottom: 1px solid #f0f0f0;
        font-size: 13px;
    }
    .sm-perm-item:last-child { border-bottom: none; }
    .sm-perm-type {
        display: inline-block;
        padding: 1px 6px;
        font-size: 11px;
        border: 1px solid #ddd;
        background: #f5f5f5;
        min-width: 40px;
        text-align: center;
    }
</style>
{% endblock %}

{% block content %}
<script>
window.__SSC_CONFIG = {
    secureCode: {{ secure_code | tojson }}
};
</script>

<div class="dc-container" x-data="subSystemConfigManager()" x-cloak>

    <!-- Header -->
    <div class="dc-header">
        <div>
            <h1>子系統配置: <span x-text="form.name || '載入中...'"></span></h1>
        </div>
        <div class="dc-toolbar">
            <a href="/nocode-builder/sub-systems" class="dc-btn">返回列表</a>
            <button class="dc-btn primary" @click="save()">儲存基本資訊</button>
        </div>
    </div>

    <div class="dc-card" x-show="loading" style="padding: 40px; text-align: center; color: #999;">載入中...</div>

    <template x-if="!loading">
        <div>
            <div class="ssc-grid">
                <!-- 基本資訊 -->
                <div class="ssc-section">
                    <div class="ssc-section-title">基本資訊</div>
                    <div class="ssc-section-body">
                        <div class="ssc-field">
                            <label>名稱 *</label>
                            <input type="text" x-model="form.name">
                        </div>
                        <div class="ssc-field">
                            <label>說明</label>
                            <textarea x-model="form.description" rows="2"></textarea>
                        </div>
                        <div class="ssc-field">
                            <label>圖示</label>
                            <input type="text" x-model="form.icon" style="width: 100px;">
                        </div>
                        <div class="ssc-field">
                            <label>綁定社群 *</label>
                            <select x-model="form.group_unit_secure_code">
                                <option value="">-- 請選擇 --</option>
                                <template x-for="g in groups" :key="g.secure_code">
                                    <option :value="g.secure_code" x-text="g.name"></option>
                                </template>
                            </select>
                        </div>
                        <div class="ssc-field">
                            <label>綁定選單項</label>
                            <select x-model="form.menu_item_secure_code">
                                <option value="">-- 不綁定 --</option>
                                <template x-for="m in menuItems" :key="m.secure_code">
                                    <option :value="m.secure_code" x-text="m.title"></option>
                                </template>
                            </select>
                        </div>
                        <div class="ssc-field">
                            <label>
                                <input type="checkbox" x-model="form.is_active"> 啟用
                            </label>
                        </div>
                    </div>
                </div>

                <!-- 快速導覽 -->
                <div class="ssc-section">
                    <div class="ssc-section-title">角色類型說明</div>
                    <div class="ssc-section-body" style="font-size: 13px; color: #666;">
                        <p style="margin: 0 0 8px 0; font-weight: 500;">准入角色:</p>
                        <table style="width: 100%; font-size: 12px; border-collapse: collapse;">
                            <tr><td style="padding: 4px 0; font-weight: 500;">GUEST</td><td>任何人 (含非成員)</td></tr>
                            <tr><td style="padding: 4px 0; font-weight: 500;">MANAGER</td><td>團長 (管理層)</td></tr>
                            <tr><td style="padding: 4px 0; font-weight: 500;">DEPUTY</td><td>副團長 (管理層)</td></tr>
                            <tr><td style="padding: 4px 0; font-weight: 500;">PROXY1</td><td>代理人一 (管理層)</td></tr>
                            <tr><td style="padding: 4px 0; font-weight: 500;">PROXY2</td><td>代理人二 (管理層)</td></tr>
                            <tr><td style="padding: 4px 0; font-weight: 500;">MEMBER</td><td>一般團員</td></tr>
                        </table>
                        <hr style="margin: 12px 0; border: none; border-top: 1px solid #eee;">
                        <p style="margin: 0; font-weight: 500;">准入規則:</p>
                        <p style="margin: 4px 0 0 0;">空 (NONE) = 任何人都無法進入 (安全防呆)</p>
                        <p style="margin: 2px 0 0 0;">GUEST = 任何人都能進入</p>
                        <p style="margin: 2px 0 0 0;">角色清單 = 只有符合角色的成員能進入</p>
                        <p style="margin: 2px 0 0 0;">管理層自動有所有網頁的存取權</p>
                    </div>
                </div>
            </div>

            <!-- Tab 切換 -->
            <div class="ssc-tabs">
                <div class="ssc-tab" :class="activeTab === 'sitemap' ? 'active' : ''"
                     @click="activeTab = 'sitemap'">網站地圖</div>
                <div class="ssc-tab" :class="activeTab === 'matrix' ? 'active' : ''"
                     @click="activeTab = 'matrix'">准入矩陣</div>
                <div class="ssc-tab" :class="activeTab === 'pages' ? 'active' : ''"
                     @click="activeTab = 'pages'">頁面管理 (舊)</div>
            </div>

            <!-- Tab: 網站地圖 -->
            <div x-show="activeTab === 'sitemap'" x-data="siteMapEditor(secureCode)">
                <div class="sm-layout">
                    <!-- 左側: 樹 -->
                    <div class="sm-tree-panel">
                        <div class="sm-tree-toolbar">
                            <button class="dc-btn sm" @click="openAddModal(null)">+ 根資料夾</button>
                            <button class="dc-btn sm" @click="addForm.node_type='page'; openAddModal(null)">+ 根頁面</button>
                            <template x-if="selectedNode">
                                <button class="dc-btn sm" @click="openAddModal(selectedNode.secure_code)">+ 子節點</button>
                            </template>
                        </div>
                        <div class="sm-tree-body" id="sm-tree"></div>
                    </div>

                    <!-- 右側: 屬性面板 -->
                    <div class="sm-props-panel">
                        <div class="sm-props-empty" x-show="!selectedNode">
                            選擇左側節點以編輯屬性
                        </div>
                        <div x-show="selectedNode" style="padding: 0;">
                            <!-- 節點屬性 -->
                            <div class="ssc-section-title" style="display: flex; justify-content: space-between; align-items: center;">
                                <span>節點屬性</span>
                                <div style="display: flex; gap: 4px;">
                                    <button class="dc-btn sm primary" @click="saveNode()">儲存</button>
                                    <button class="dc-btn sm danger" @click="deleteNode()">刪除</button>
                                </div>
                            </div>
                            <div class="ssc-section-body">
                                <div class="ssc-field">
                                    <label>名稱 *</label>
                                    <input type="text" x-model="nodeForm.name">
                                </div>
                                <div class="ssc-field">
                                    <label>類型</label>
                                    <span style="font-size: 13px;" x-text="nodeForm.node_type === 'folder' ? '資料夾' : '頁面'"></span>
                                </div>
                                <div class="ssc-field">
                                    <label>圖示</label>
                                    <input type="text" x-model="nodeForm.icon" style="width: 150px;" placeholder="bi bi-xxx">
                                </div>
                                <div class="ssc-field" x-show="nodeForm.node_type === 'page'">
                                    <label>連結頁面</label>
                                    <select x-model="nodeForm.page_layout_secure_code">
                                        <option value="">-- 自動建立 --</option>
                                        <template x-for="layout in availableLayouts" :key="layout.secure_code">
                                            <option :value="layout.secure_code" x-text="layout.name"></option>
                                        </template>
                                    </select>
                                </div>
                                <div class="ssc-field">
                                    <label>
                                        <input type="checkbox" x-model="nodeForm.is_active"> 啟用
                                    </label>
                                </div>
                            </div>

                            <!-- CRUD 權限覆蓋 (僅 page) -->
                            <template x-if="nodeForm.node_type === 'page'">
                                <div>
                                    <div class="ssc-section-title">CRUD 權限覆蓋</div>
                                    <div class="ssc-section-body">
                                        <div class="ssc-crud-grid">
                                            <div class="header"></div>
                                            <div class="header">新增</div>
                                            <div class="header">編輯</div>
                                            <div class="header">刪除</div>
                                            <template x-for="role in ['MANAGER','MEMBER']" :key="'sm_crud_' + role">
                                                <div style="display: contents;">
                                                    <div class="role-name" x-text="role"></div>
                                                    <div class="check"><input type="checkbox" :checked="getCrud(role, 'create')" @change="setCrud(role, 'create', $event.target.checked)"></div>
                                                    <div class="check"><input type="checkbox" :checked="getCrud(role, 'edit')" @change="setCrud(role, 'edit', $event.target.checked)"></div>
                                                    <div class="check"><input type="checkbox" :checked="getCrud(role, 'delete')" @change="setCrud(role, 'delete', $event.target.checked)"></div>
                                                </div>
                                            </template>
                                        </div>
                                    </div>

                                    <div class="ssc-section-title">資料篩選</div>
                                    <div class="ssc-section-body">
                                        <template x-for="role in ['MANAGER','MEMBER']" :key="'sm_filter_' + role">
                                            <div style="margin-bottom: 8px;">
                                                <span style="font-size: 12px; font-weight: 500;" x-text="role + ':'"></span>
                                                <template x-for="(val, col) in getFilters(role)" :key="role + '_' + col">
                                                    <div class="ssc-filter-row">
                                                        <input type="text" :value="col" @change="renameFilter(role, col, $event.target.value)" placeholder="欄位" style="width: 120px;">
                                                        <span>=</span>
                                                        <input type="text" :value="val" @change="setFilterValue(role, col, $event.target.value)" placeholder="值" style="width: 160px;">
                                                        <button class="dc-btn sm danger" @click="removeFilter(role, col)" style="padding: 2px 6px;">x</button>
                                                    </div>
                                                </template>
                                                <button class="dc-btn sm" @click="addFilter(role)" style="margin-top: 2px;">+ 篩選</button>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </template>

                            <!-- 准入控制 (access_roles) -->
                            <div class="ssc-section-title">准入控制</div>
                            <div class="ssc-section-body">
                                <p style="font-size: 12px; color: #666; margin: 0 0 8px 0;">
                                    目前: <strong x-text="getAccessLabel()"></strong>
                                </p>

                                <div style="display: flex; flex-wrap: wrap; gap: 8px;">
                                    <template x-for="role in ['GUEST','MANAGER','DEPUTY','PROXY1','PROXY2','MEMBER']" :key="'ar_' + role">
                                        <label style="display: inline-flex; align-items: center; gap: 4px; font-size: 12px; cursor: pointer;">
                                            <input type="checkbox"
                                                   :checked="hasAccessRole(role)"
                                                   @change="toggleAccessRole(role)">
                                            <span x-text="role"></span>
                                        </label>
                                    </template>
                                </div>

                                <div class="ssc-field" style="margin-top: 12px;" x-show="nodeForm.node_type === 'page'">
                                    <label style="font-size: 12px;">拒絕時轉向</label>
                                    <input type="text" x-model="nodeForm.redirect_to"
                                           style="width: 200px; font-size: 12px;" placeholder="/dashboard">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Add Node Modal -->
                <div x-show="showAddModal" x-cloak class="dc-modal">
                    <div class="dc-modal-content" style="width: 480px;">
                        <div class="dc-modal-header">
                            <h3>新增節點</h3>
                            <button class="dc-close-btn" @click="showAddModal = false">&times;</button>
                        </div>
                        <div class="dc-modal-body">
                            <div class="ssc-field">
                                <label>名稱 *</label>
                                <input type="text" x-model="addForm.name" style="width: 100%; padding: 6px 8px; border: 1px solid #ddd;">
                            </div>
                            <div class="ssc-field">
                                <label>類型</label>
                                <select x-model="addForm.node_type" style="width: 200px; padding: 6px 8px; border: 1px solid #ddd;">
                                    <option value="folder">資料夾</option>
                                    <option value="page">頁面</option>
                                </select>
                            </div>
                            <div class="ssc-field">
                                <label>圖示</label>
                                <input type="text" x-model="addForm.icon" placeholder="bi bi-xxx" style="width: 200px; padding: 6px 8px; border: 1px solid #ddd;">
                            </div>
                            <div class="ssc-field" x-show="addForm.node_type === 'page'">
                                <label>連結既有頁面 (留空自動建立)</label>
                                <select x-model="addForm.page_layout_secure_code" style="width: 100%; padding: 6px 8px; border: 1px solid #ddd;">
                                    <option value="">-- 自動建立空白頁面 --</option>
                                    <template x-for="layout in availableLayouts" :key="layout.secure_code">
                                        <option :value="layout.secure_code" x-text="layout.name"></option>
                                    </template>
                                </select>
                            </div>
                        </div>
                        <div class="dc-modal-footer">
                            <button class="dc-btn" @click="showAddModal = false">取消</button>
                            <button class="dc-btn primary" @click="doAddNode()">建立</button>
                        </div>
                    </div>
                </div>

                <!-- Toast (site map) -->
                <div x-show="toast.show" x-cloak class="dc-toast" :class="toast.type"
                     x-text="toast.message" x-transition></div>
            </div>

            <!-- Tab: 准入矩陣 -->
            <div x-show="activeTab === 'matrix'" x-data="accessMatrixManager(secureCode)">
                <div class="ssc-section">
                    <div class="ssc-section-title" style="display: flex; justify-content: space-between; align-items: center;">
                        <span>准入矩陣 -- 網頁 x 角色</span>
                        <div style="display: flex; gap: 8px; align-items: center;">
                            <span x-show="dirty" style="font-size: 12px; color: #e65100;">有未儲存的變更</span>
                            <button class="dc-btn sm primary" @click="saveAll()"
                                    :disabled="saving || !dirty"
                                    x-text="saving ? '儲存中...' : '儲存'"></button>
                            <button class="dc-btn sm" @click="loadAndRender()">重新載入</button>
                        </div>
                    </div>
                    <div class="ssc-section-body" style="padding: 0;">
                        <div x-show="loading" style="padding: 40px; text-align: center; color: #999;">載入中...</div>
                        <div id="access-matrix" style="min-height: 200px;"></div>
                    </div>
                </div>
                <div style="margin-top: 8px; font-size: 12px; color: #999;">
                    GUEST = 任何人 (含非成員) | 空 = NONE (預設拒絕) | GUEST 與角色互斥
                </div>
                <div x-show="toast.show" x-cloak class="dc-toast" :class="toast.type"
                     x-text="toast.message" x-transition></div>
            </div>

            <!-- Tab: 頁面管理 (舊) -->
            <div x-show="activeTab === 'pages'">
                <div class="ssc-section">
                    <div class="ssc-section-title" style="display: flex; justify-content: space-between; align-items: center;">
                        <span>頁面管理</span>
                        <button class="dc-btn sm primary" @click="showAddPageModal = true">+ 新增頁面</button>
                    </div>
                    <div class="ssc-section-body" style="padding: 0;">
                        <div x-show="pages.length === 0" style="padding: 40px; text-align: center; color: #999;">
                            尚未加入任何頁面
                        </div>
                        <template x-for="(p, idx) in pages" :key="p.secure_code">
                            <div class="ssc-page-item" style="flex-direction: column; align-items: stretch;">
                                <div style="display: flex; align-items: center; gap: 8px;">
                                    <span class="ssc-page-order" x-text="idx + 1" style="color: #999; font-size: 12px;"></span>
                                    <span class="ssc-page-name" x-text="p.display_name || p.page_name"></span>
                                    <span class="ssc-tag" style="font-size: 11px; color: #999;" x-text="'排序: ' + p.display_order"></span>
                                    <button class="dc-btn sm" @click="togglePageDetail(idx)">
                                        <span x-text="expandedPage === idx ? '收合' : '展開'"></span>
                                    </button>
                                    <button class="dc-btn sm danger" @click="removePage(p)">移除</button>
                                </div>
                                <!-- 展開的詳細設定 -->
                                <div x-show="expandedPage === idx" style="margin-top: 12px; padding: 12px; border: 1px solid #eee; background: #fafafa;">
                                    <div class="ssc-field">
                                        <label>顯示名稱</label>
                                        <input type="text" x-model="p.display_name">
                                    </div>
                                    <div class="ssc-field">
                                        <label>排序</label>
                                        <input type="number" x-model.number="p.display_order" style="width: 80px;">
                                    </div>

                                    <!-- visible_roles -->
                                    <div class="ssc-field">
                                        <label>可見角色</label>
                                        <div class="ssc-roles-editor">
                                            <label><input type="checkbox" :checked="hasRole(p, '*')" @change="toggleRole(p, '*')"> 全部</label>
                                            <label><input type="checkbox" :checked="hasRole(p, 'MANAGER')" @change="toggleRole(p, 'MANAGER')"> MANAGER</label>
                                            <label><input type="checkbox" :checked="hasRole(p, 'DEPUTY')" @change="toggleRole(p, 'DEPUTY')"> DEPUTY</label>
                                            <label><input type="checkbox" :checked="hasRole(p, 'MEMBER')" @change="toggleRole(p, 'MEMBER')"> MEMBER</label>
                                        </div>
                                    </div>

                                    <!-- crud_overrides -->
                                    <div class="ssc-field">
                                        <label>CRUD 權限覆蓋 (按角色)</label>
                                        <div class="ssc-crud-grid">
                                            <div class="header"></div>
                                            <div class="header">新增</div>
                                            <div class="header">編輯</div>
                                            <div class="header">刪除</div>

                                            <template x-for="role in ['MANAGER','MEMBER']" :key="role">
                                                <div style="display: contents;">
                                                    <div class="role-name" x-text="role"></div>
                                                    <div class="check"><input type="checkbox" :checked="getCrud(p, role, 'create')" @change="setCrud(p, role, 'create', $event.target.checked)"></div>
                                                    <div class="check"><input type="checkbox" :checked="getCrud(p, role, 'edit')" @change="setCrud(p, role, 'edit', $event.target.checked)"></div>
                                                    <div class="check"><input type="checkbox" :checked="getCrud(p, role, 'delete')" @change="setCrud(p, role, 'delete', $event.target.checked)"></div>
                                                </div>
                                            </template>
                                        </div>
                                    </div>

                                    <!-- data_filters -->
                                    <div class="ssc-field">
                                        <label>資料篩選 (按角色)</label>
                                        <template x-for="role in ['MANAGER','MEMBER']" :key="role + '_filter'">
                                            <div style="margin-bottom: 8px;">
                                                <span style="font-size: 12px; font-weight: 500;" x-text="role + ':'"></span>
                                                <template x-for="(val, col) in getFilters(p, role)" :key="role + '_' + col">
                                                    <div class="ssc-filter-row">
                                                        <input type="text" :value="col" @change="renameFilter(p, role, col, $event.target.value)" placeholder="欄位" style="width: 120px;">
                                                        <span>=</span>
                                                        <input type="text" :value="val" @change="setFilterValue(p, role, col, $event.target.value)" placeholder="值" style="width: 160px;">
                                                        <button class="dc-btn sm danger" @click="removeFilter(p, role, col)" style="padding: 2px 6px;">x</button>
                                                    </div>
                                                </template>
                                                <button class="dc-btn sm" @click="addFilter(p, role)" style="margin-top: 2px;">+ 篩選</button>
                                            </div>
                                        </template>
                                    </div>

                                    <div style="text-align: right; margin-top: 8px;">
                                        <button class="dc-btn sm primary" @click="savePage(p)">儲存此頁設定</button>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- Add Page Modal -->
    <div x-show="showAddPageModal" x-cloak class="dc-modal">
        <div class="dc-modal-content" style="width: 500px;">
            <div class="dc-modal-header">
                <h3>新增頁面</h3>
                <button class="dc-close-btn" @click="showAddPageModal = false">&times;</button>
            </div>
            <div class="dc-modal-body">
                <div class="ssc-field">
                    <label>選擇頁面佈局 *</label>
                    <select x-model="addPageForm.page_layout_secure_code" style="width: 100%; padding: 6px 8px; border: 1px solid #ddd;">
                        <option value="">-- 請選擇 --</option>
                        <template x-for="layout in availableLayouts" :key="layout.secure_code">
                            <option :value="layout.secure_code" x-text="layout.name"></option>
                        </template>
                    </select>
                </div>
                <div class="ssc-field">
                    <label>顯示名稱 (留空使用頁面原名)</label>
                    <input type="text" x-model="addPageForm.display_name" style="width: 100%; padding: 6px 8px; border: 1px solid #ddd;">
                </div>
                <div class="ssc-field">
                    <label>排序</label>
                    <input type="number" x-model.number="addPageForm.display_order" style="width: 80px; padding: 6px 8px; border: 1px solid #ddd;">
                </div>
            </div>
            <div class="dc-modal-footer">
                <button class="dc-btn" @click="showAddPageModal = false">取消</button>
                <button class="dc-btn primary" @click="doAddPage()">加入</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div x-show="toast.show" x-cloak class="dc-toast" :class="toast.type"
         x-text="toast.message" x-transition></div>
</div>

<script src="/static/vendor/wunderbaum/wunderbaum.umd.min.js"></script>
<script src="/static/vendor/beak-trellis/beak-tree-model.js"></script>
<script src="/static/vendor/beak-trellis/beak-trellis.js"></script>
<script src="/static/vendor/beak-trellis/renderers/beak-tree-lines-dom.js"></script>
<script src="/static/modules/nocode_builder/js/site-map-editor.js"></script>
<script src="/static/modules/nocode_builder/js/access-matrix.js"></script>
<script src="/static/modules/nocode_builder/js/sub-system-config.js"></script>
{% endblock %}
