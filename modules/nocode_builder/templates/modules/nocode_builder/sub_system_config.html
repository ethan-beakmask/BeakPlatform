{% extends "layouts/base.html" %}

{% block title %}子系統設定{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ app_prefix }}/static/modules/nocode_builder/css/nocode-builder.css">
<style>
    .ssc-section {
        background: #fff;
        border: 1px solid #ddd;
        margin-bottom: 16px;
    }
    .ssc-section-title {
        padding: 12px 16px;
        border-bottom: 1px solid #ddd;
        font-weight: 600;
        font-size: 14px;
        background: #f9f9f9;
    }
    .ssc-section-body { padding: 16px; }
    .ssc-field { margin-bottom: 12px; }
    .ssc-field label {
        display: block;
        margin-bottom: 4px;
        font-weight: 500;
        font-size: 13px;
    }
    .ssc-field input:not([type="checkbox"]),
    .ssc-field select,
    .ssc-field textarea {
        width: 100%;
        padding: 6px 8px;
        border: 1px solid #ddd;
        font-size: 13px;
        box-sizing: border-box;
    }
    .ssc-info-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
    }
    .ssc-readonly {
        padding: 6px 0;
        font-size: 13px;
        color: #333;
    }

    /* 政策組列表 */
    .pp-item {
        border: 1px solid #e0e0e0;
        margin-bottom: 8px;
        background: #fff;
    }
    .pp-item-header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        cursor: pointer;
    }
    .pp-item-header:hover { background: #fafafa; }
    .pp-item-name { font-weight: 600; font-size: 14px; flex: 1; }
    .pp-item-summary {
        font-size: 11px;
        color: #888;
        max-width: 300px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .pp-item-usage {
        font-size: 11px;
        color: #666;
        background: #f0f0f0;
        padding: 2px 8px;
        white-space: nowrap;
    }
    .pp-item-actions { display: flex; gap: 4px; }

    /* 規則面板 */
    .pp-rules-panel {
        border-top: 1px solid #e0e0e0;
        padding: 12px 16px;
        background: #fafafa;
    }
    .pp-rule-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 0;
        border-bottom: 1px solid #f0f0f0;
        font-size: 13px;
    }
    .pp-rule-row:last-child { border-bottom: none; }
    .pp-type-tag {
        display: inline-block;
        padding: 1px 6px;
        font-size: 11px;
        border: 1px solid #ddd;
        background: #f5f5f5;
        min-width: 40px;
        text-align: center;
    }
    .pp-type-tag.dept { border-color: #93c5fd; color: #1e40af; background: #eff6ff; }
    .pp-type-tag.group { border-color: #fbbf24; color: #92400e; background: #fefce8; }
    .pp-type-tag.user { border-color: #86efac; color: #166534; background: #f0fdf4; }
    .pp-rule-name { flex: 1; }
    .pp-rule-note { font-size: 11px; color: #888; }

    /* 新增規則區 */
    .pp-add-rule {
        margin-top: 12px;
        padding: 12px;
        border: 1px dashed #ddd;
        background: #fff;
    }
    .pp-add-rule-title {
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 8px;
        color: #555;
    }
    .pp-empty {
        padding: 24px;
        text-align: center;
        color: #999;
        font-size: 13px;
    }
</style>
{% endblock %}

{% block content %}
<script>
window.__SSC_CONFIG = {
    secureCode: {{ secure_code | tojson }},
    orgName: {{ org_name | tojson }}
};
</script>

<div class="dc-container" x-data="subSystemConfigManager()" x-cloak>

    <!-- Header -->
    <div class="dc-header">
        <div>
            <h1>子系統設定: <span x-text="form.name || '載入中...'"></span></h1>
        </div>
        <div class="dc-toolbar">
            <a href="{{ app_prefix }}/nocode-builder/sub-systems" class="dc-btn">返回列表</a>
            <button class="dc-btn primary" @click="save()">儲存基本資訊</button>
        </div>
    </div>

    <div class="dc-card" x-show="loading" style="padding: 40px; text-align: center; color: #999;">載入中...</div>

    <template x-if="!loading">
        <div>
            <!-- 基本資訊 -->
            <div class="ssc-section">
                <div class="ssc-section-title">基本資訊</div>
                <div class="ssc-section-body">
                    <div class="ssc-info-grid">
                        <div>
                            <div class="ssc-field">
                                <label>名稱 *</label>
                                <input type="text" x-model="form.name">
                            </div>
                            <div class="ssc-field">
                                <label>說明</label>
                                <textarea x-model="form.description" rows="2"></textarea>
                            </div>
                            <div class="ssc-field">
                                <label>圖示</label>
                                <input type="text" x-model="form.icon" style="width: 160px;">
                            </div>
                        </div>
                        <div>
                            <div class="ssc-field">
                                <label>架構師</label>
                                <div class="ssc-readonly">
                                    <template x-if="developerNames.length > 0">
                                        <span x-text="developerNames.join(', ')"></span>
                                    </template>
                                    <template x-if="developerNames.length === 0">
                                        <span style="color: #999;">-- 未指定 --</span>
                                    </template>
                                </div>
                                <div style="font-size: 11px; color: #999; margin-top: 4px;">
                                    透過 SubSystemProvision 流程指定
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 權限政策組 -->
            <div class="ssc-section">
                <div class="ssc-section-title" style="display: flex; justify-content: space-between; align-items: center;">
                    <span>權限政策組</span>
                    <button class="dc-btn sm primary" @click="quickAddPolicy()">+ 新增政策組</button>
                </div>
                <div class="ssc-section-body" style="padding: 0;">
                    <div x-show="policyGroups.length === 0" class="pp-empty">
                        尚未建立任何權限政策組。<br>
                        <span style="font-size: 12px;">點擊「+ 新增政策組」一鍵建立，可立即新增規則。</span>
                    </div>

                    <div x-show="policyGroups.length > 0" style="padding: 12px;">
                        <template x-for="pg in policyGroups" :key="pg.secure_code">
                            <div class="pp-item">
                                <div class="pp-item-header" @click="toggleRulePanel(pg)">
                                    <span class="pp-item-name" x-text="pg.name"></span>
                                    <span class="pp-item-summary" x-text="ruleSummary(pg)"></span>
                                    <span class="pp-item-usage"
                                          x-text="pg.usage_count + ' 個網頁使用'"></span>
                                    <div class="pp-item-actions" @click.stop>
                                        <button class="dc-btn sm" @click="openEditPolicy(pg)">重新命名</button>
                                        <button class="dc-btn sm danger" @click="deletePolicy(pg)">刪除</button>
                                    </div>
                                </div>

                                <!-- 規則展開面板 -->
                                <div class="pp-rules-panel" x-show="showRulePanel === pg.secure_code" x-cloak>
                                    <!-- 已設定的規則列表 -->
                                    <div x-show="getPolicyRules(pg.secure_code).length === 0"
                                         style="padding: 8px 0; font-size: 12px; color: #999;">
                                        尚無規則 (此政策組無效果，套用時將禁止所有人)
                                    </div>
                                    <template x-for="rule in getPolicyRules(pg.secure_code)" :key="rule.secure_code">
                                        <div class="pp-rule-row">
                                            <span class="pp-type-tag"
                                                  :class="getPermTypeCss(rule.grant_type)"
                                                  x-text="getPermTypeLabel(rule.grant_type)"></span>
                                            <span class="pp-rule-name" x-text="rule.grant_target_name || rule.grant_target"></span>
                                            <span class="pp-rule-note"
                                                  x-show="rule.grant_type === 'department' && rule.include_children">(含子部門)</span>
                                            <span class="pp-rule-note"
                                                  x-show="rule.grant_type === 'group' && rule.include_children">(含下層群組)</span>
                                            <button class="dc-btn sm danger"
                                                    @click="deleteRule(pg.secure_code, rule.secure_code)"
                                                    style="padding: 2px 6px;">&times;</button>
                                        </div>
                                    </template>

                                    <!-- 新增規則 -->
                                    <div class="pp-add-rule">
                                        <div class="pp-add-rule-title">+ 新增規則</div>
                                        <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
                                            <div>
                                                <label style="font-size: 11px; display: block; margin-bottom: 2px;">類型</label>
                                                <select x-model="newRule.grant_type"
                                                        @change="onRuleTypeChange()"
                                                        style="width: 90px; padding: 4px 6px; font-size: 12px;">
                                                    <option value="department">部門</option>
                                                    <option value="group">社群</option>
                                                    <option value="user">個人</option>
                                                </select>
                                            </div>
                                            <div x-show="newRule.grant_type === 'department' || newRule.grant_type === 'group'"
                                                 style="margin-top: 14px;">
                                                <label style="font-size: 11px; white-space: nowrap;">
                                                    <input type="checkbox" x-model="newRule.include_children">
                                                    <span x-text="newRule.grant_type === 'department' ? '含子部門' : '含下層群組'"></span>
                                                </label>
                                            </div>
                                            <button class="dc-btn sm primary"
                                                    @click="addRule(pg.secure_code)"
                                                    :disabled="!newRule.grant_target"
                                                    style="white-space: nowrap; margin-top: 14px;">新增</button>
                                        </div>

                                        <!-- 樹狀選擇器 (部門/社群) -->
                                        <div x-show="newRule.grant_type === 'department' || newRule.grant_type === 'group'">
                                            <div x-show="ruleTreeLoading" style="text-align: center; padding: 10px; color: #999; font-size: 11px;">載入中...</div>
                                            <div class="dc-perm-tree-box" x-show="!ruleTreeLoading" style="margin-top: 6px;">
                                                <div :id="'pp-rule-tree-' + pg.secure_code"></div>
                                            </div>
                                        </div>

                                        <!-- 下拉選單 (個人) -->
                                        <div x-show="newRule.grant_type === 'user'" style="margin-top: 6px;">
                                            <select x-model="newRule.grant_target"
                                                    @change="newRule._selectedName = $event.target.selectedOptions[0]?.text || ''"
                                                    style="width: 100%; padding: 4px 6px; font-size: 12px;">
                                                <option value="">-- 請選擇 --</option>
                                                <template x-for="opt in ruleTargetOptions" :key="opt.value">
                                                    <option :value="opt.value" x-text="opt.label"></option>
                                                </template>
                                            </select>
                                        </div>

                                        <div x-show="newRule.grant_target" style="font-size: 11px; color: #0066cc; margin-top: 4px;">
                                            已選擇: <strong x-text="newRule._selectedName || newRule.grant_target_name || ''"></strong>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>

            <!-- 使用說明 -->
            <div class="ssc-section">
                <div class="ssc-section-title">使用說明</div>
                <div class="ssc-section-body" style="font-size: 13px; color: #666;">
                    <p style="margin: 0 0 8px 0; font-weight: 500;">權限政策組的用途:</p>
                    <p style="margin: 0 0 4px 0;">在此建立可複用的准入規則包，每組包含多條部門/社群/個人規則。</p>
                    <p style="margin: 0 0 4px 0;">建立後到設計器 (Studio) 的網頁屬性中，選擇要套用的政策組。</p>
                    <hr style="margin: 12px 0; border: none; border-top: 1px solid #eee;">
                    <p style="margin: 0 0 4px 0; font-weight: 500;">網頁的三種權限模式:</p>
                    <table style="width: 100%; font-size: 12px; border-collapse: collapse;">
                        <tr>
                            <td style="padding: 4px 8px 4px 0; font-weight: 500; color: #0066cc; white-space: nowrap;">A. 權限政策組</td>
                            <td>選擇已建立的政策組，直接套用其規則</td>
                        </tr>
                        <tr>
                            <td style="padding: 4px 8px 4px 0; font-weight: 500; color: #16a34a; white-space: nowrap;">B. 向上繼承</td>
                            <td>沿用父節點的權限（新增網頁的預設值）</td>
                        </tr>
                        <tr>
                            <td style="padding: 4px 8px 4px 0; font-weight: 500; color: #9333ea; white-space: nowrap;">C. 自訂權限</td>
                            <td>在網頁屬性中逐一設定部門/社群/個人規則</td>
                        </tr>
                    </table>
                    <p style="margin: 8px 0 0 0; font-size: 12px; color: #999;">
                        未設定權限的網頁預設為禁止狀態（僅設計者預覽可見）。管理層自動擁有所有存取權。
                    </p>
                </div>
            </div>
        </div>
    </template>

    <!-- 政策組 重新命名 Modal -->
    <div x-show="showPolicyModal" x-cloak class="dc-modal">
        <div class="dc-modal-content" style="width: 450px;">
            <div class="dc-modal-header">
                <h3>重新命名政策組</h3>
                <button class="dc-close-btn" @click="showPolicyModal = false">&times;</button>
            </div>
            <div class="dc-modal-body">
                <div class="ssc-field">
                    <label>名稱 *</label>
                    <input type="text" x-model="policyForm.name"
                           style="width: 100%; padding: 6px 8px; border: 1px solid #ddd;">
                </div>
                <div class="ssc-field">
                    <label>說明</label>
                    <textarea x-model="policyForm.description" rows="2"
                              style="width: 100%; padding: 6px 8px; border: 1px solid #ddd;"></textarea>
                </div>
            </div>
            <div class="dc-modal-footer">
                <button class="dc-btn" @click="showPolicyModal = false">取消</button>
                <button class="dc-btn primary" @click="savePolicy()">更新</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div x-show="toast.show" x-cloak class="dc-toast" :class="toast.type"
         x-text="toast.message" x-transition></div>
</div>

<script src="{{ app_prefix }}/static/modules/nocode_builder/js/sub-system-config.js"></script>
{% endblock %}
