{% extends "layouts/base.html" %}

{% block title %}{{ sub_system_name }} - 子系統{% endblock %}

{% block head %}
<link rel="stylesheet" href="/static/modules/nocode_builder/css/nocode-builder.css">
<link rel="stylesheet" href="/static/vendor/wunderbaum/bootstrap-icons.css">
<link rel="stylesheet" href="/static/vendor/wunderbaum/wunderbaum.css">
<link rel="stylesheet" href="/static/vendor/gridstack/gridstack.min.css">
<link rel="stylesheet" href="/static/css/bk-file-attachment.css">
<link rel="stylesheet" href="/static/modules/nocode_builder/css/datalist-widget.css">
<link rel="stylesheet" href="/static/modules/nocode_builder/css/studio.css">
<style>
    .sp2-layout {
        display: grid;
        grid-template-columns: 250px 1fr;
        height: calc(100vh - 56px);
        overflow: hidden;
    }
    .sp2-sidebar {
        background: #fff;
        border-right: 1px solid #ddd;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }
    .sp2-sidebar-header {
        padding: 16px;
        border-bottom: 1px solid #ddd;
    }
    .sp2-sidebar-header h2 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
    }
    .sp2-sidebar-meta {
        margin-top: 4px;
        font-size: 12px;
        color: #666;
    }
    .sp2-sidebar-tree {
        flex: 1;
        overflow: auto;
    }
    .sp2-main {
        background: #f0f0f0;
        overflow: auto;
        display: flex;
        flex-direction: column;
    }
    .sp2-breadcrumb {
        padding: 8px 16px;
        font-size: 13px;
        color: #666;
        background: #fff;
        border-bottom: 1px solid #ddd;
    }
    .sp2-breadcrumb span { color: #333; }
    .sp2-content {
        flex: 1;
        padding: 16px;
        overflow: auto;
    }
    .sp2-content .grid-stack {
        background: #fff;
        min-height: 400px;
    }
    .sp2-content .grid-stack-item-content .dlw-root {
        border: 1px solid #ddd;
    }
    .sp2-content .grid-stack-item-content {
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }
    .sp2-empty {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: #999;
        font-size: 14px;
    }
    .sp2-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: #999;
    }
    .sp2-error {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: #dc2626;
        font-size: 14px;
    }
    .role-badge {
        display: inline-block;
        padding: 1px 6px;
        font-size: 11px;
        border: 1px solid #ddd;
        background: #f5f5f5;
    }
    .role-badge.admin { border-color: #0066cc; color: #0066cc; background: #eef4ff; }
</style>
{% endblock %}

{% block content %}
<script>
window.__PORTAL_CONFIG = {
    subSystemSc: {{ sub_system_sc | tojson }},
    subSystemName: {{ sub_system_name | tojson }}
};
</script>

<div x-data="siteMapPortal()" x-cloak>
    <!-- Loading -->
    <div class="sp2-loading" x-show="loading">載入中...</div>
    <!-- Error -->
    <div class="sp2-error" x-show="error" x-text="error"></div>

    <!-- Main Layout -->
    <div class="sp2-layout" x-show="!loading && !error">
        <!-- Sidebar -->
        <div class="sp2-sidebar">
            <div class="sp2-sidebar-header">
                <h2 x-text="subSystemName || '子系統'"></h2>
                <div class="sp2-sidebar-meta">
                    <span class="role-badge" :class="isAdmin ? 'admin' : ''"
                          x-text="roleLabel"></span>
                </div>
            </div>
            <div class="sp2-sidebar-tree" id="sp2-tree"></div>
        </div>

        <!-- Main Content -->
        <div class="sp2-main">
            <div class="sp2-breadcrumb" x-show="breadcrumb.length > 0">
                <template x-for="(b, idx) in breadcrumb" :key="idx">
                    <span>
                        <span x-show="idx > 0"> / </span>
                        <span x-text="b"></span>
                    </span>
                </template>
            </div>
            <div class="sp2-content">
                <div class="sp2-empty" x-show="!currentNode && !pageLoading">
                    從左側選單選擇頁面
                </div>
                <div class="sp2-loading" x-show="pageLoading" style="padding: 40px;">
                    載入頁面中...
                </div>
                <div x-show="pageError" style="padding: 20px; color: #dc2626;" x-text="pageError"></div>
                <div class="grid-stack" x-show="currentNode && !pageLoading && !pageError"></div>
            </div>
        </div>
    </div>
</div>

<script src="/static/vendor/wunderbaum/wunderbaum.umd.min.js"></script>
<script src="/static/vendor/gridstack/gridstack-all.js"></script>
<script src="/static/modules/nocode_builder/js/page-context.js"></script>
<script src="/static/js/bk-file-attachment.js"></script>
<script src="/static/modules/nocode_builder/js/datalist-widget.js"></script>
<script src="/static/modules/nocode_builder/js/site-map-portal.js"></script>
{% endblock %}
