{% extends "layouts/base.html" %}

{% block title %}視圖配置 - 資料表工具{% endblock %}

{% block head %}
<link rel="stylesheet" href="/static/modules/nocode_builder/css/nocode-builder.css">
{% endblock %}

{% block content %}
<script>
window.__DC_CONFIG = {
    secureCode: {{ (secure_code | tojson) if secure_code else 'null' }}
};
</script>

<div class="dc-container" x-data="viewConfigManager()" x-cloak>

    <!-- Header -->
    <div class="dc-header">
        <div>
            <h1 x-text="isEdit ? '編輯視圖: ' + form.name : '建立新視圖'"></h1>
            <p>目標資料庫: <strong x-text="dbName" style="font-family: monospace;"></strong>
                <span x-show="form.data_source === 'conglomerate'" style="display: inline-block; padding: 1px 6px; font-size: 11px; background: #e8f4fd; color: #0b6faa; border-radius: 3px; margin-left: 6px;">集團共享</span>
            </p>
        </div>
        <div class="dc-toolbar">
            <a href="/nocode-builder/" class="dc-btn">返回列表</a>
            <button class="dc-btn primary" @click="save()" :disabled="saving">
                <span x-show="!saving" x-text="isEdit ? '儲存變更' : '建立視圖'"></span>
                <span x-show="saving">處理中...</span>
            </button>
        </div>
    </div>

    <!-- Basic Info -->
    <div class="dc-card" style="padding: 20px; margin-bottom: 16px;">
        <h3 style="margin: 0 0 16px 0; font-size: 15px;">基本資訊</h3>
        <div style="display: flex; gap: 16px;">
            <div class="dc-form-group" style="flex: 1;">
                <label>視圖名稱 *</label>
                <input type="text" x-model="form.name" placeholder="例: 使用者列表">
            </div>
            <div class="dc-form-group" style="width: 220px;">
                <label>資料來源 *</label>
                <select x-model="form.data_source" @change="onDataSourceChange()" :disabled="isEdit">
                    <option value="org">企業資料庫</option>
                    <option value="conglomerate" x-show="cgInfo.available" x-text="'集團: ' + (cgInfo.conglomerate_name || '共享資料庫')"></option>
                </select>
                <small x-show="!cgInfo.available" style="color: #999; font-size: 11px;">企業未加入集團或集團無共享 DB</small>
            </div>
            <div class="dc-form-group" style="flex: 1;">
                <label>資料表 *</label>
                <select x-model="form.table_name" @change="onTableChange()" :disabled="isEdit">
                    <option value="">-- 選擇資料表 --</option>
                    <template x-for="t in tables" :key="t.name">
                        <option :value="t.name" x-text="t.name + (t.comment ? ' (' + t.comment + ')' : '')"></option>
                    </template>
                </select>
            </div>
        </div>
        <div class="dc-form-group">
            <label>說明</label>
            <textarea x-model="form.description" placeholder="視圖用途說明"></textarea>
        </div>
    </div>

    <!-- Options -->
    <div class="dc-card" style="padding: 20px; margin-bottom: 16px;">
        <h3 style="margin: 0 0 12px 0; font-size: 15px;">操作權限與選項</h3>
        <div class="dc-form-inline" style="margin-bottom: 12px;">
            <label><input type="checkbox" x-model="form.allow_create"> 允許新增</label>
            <label><input type="checkbox" x-model="form.allow_edit"> 允許編輯</label>
            <label><input type="checkbox" x-model="form.allow_delete"> 允許刪除</label>
            <label><input type="checkbox" x-model="form.is_active"> 啟用</label>
        </div>
        <div style="display: flex; gap: 16px;">
            <div class="dc-form-group" style="width: 200px;">
                <label>每頁筆數</label>
                <input type="number" x-model.number="form.page_size" min="5" max="100">
            </div>
            <div class="dc-form-group" style="width: 200px;">
                <label>預設排序欄位</label>
                <select x-model="form.default_sort_column">
                    <option value="">-- 不指定 --</option>
                    <template x-for="c in columns" :key="c.column">
                        <option :value="c.column" x-text="c.column"></option>
                    </template>
                </select>
            </div>
            <div class="dc-form-group" style="width: 120px;">
                <label>排序方向</label>
                <select x-model="form.default_sort_dir">
                    <option value="ASC">ASC</option>
                    <option value="DESC">DESC</option>
                </select>
            </div>
            <div class="dc-form-group" style="width: 200px;">
                <label>軟刪除欄位</label>
                <select x-model="form.soft_delete_column">
                    <option value="">-- 無 --</option>
                    <template x-for="c in columns" :key="'sd_' + c.column">
                        <option :value="c.column" x-text="c.column"></option>
                    </template>
                </select>
            </div>
        </div>
    </div>

    <!-- Columns Config -->
    <div class="dc-card" style="padding: 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <h3 style="margin: 0; font-size: 15px;">欄位配置</h3>
            <span style="font-size: 12px; color: #999;" x-show="columns.length > 0" x-text="columns.length + ' 個欄位'"></span>
        </div>

        <div x-show="loadingCols" class="dc-loading">讀取欄位中...</div>
        <div x-show="!loadingCols && columns.length === 0 && form.table_name" class="dc-empty" style="padding: 30px;">
            <p>無法取得欄位資訊</p>
        </div>
        <div x-show="!loadingCols && !form.table_name" class="dc-empty" style="padding: 30px;">
            <p>請先選擇資料表</p>
        </div>

        <!-- Column header -->
        <div x-show="!loadingCols && columns.length > 0"
             style="display: flex; gap: 10px; padding: 6px 12px; font-size: 12px; font-weight: 600; color: #666; background: #f5f5f5; border: 1px solid #eee;">
            <span style="width: 30px;"></span>
            <span style="min-width: 150px;">欄位名</span>
            <span style="min-width: 120px;">型別</span>
            <span style="flex: 1;">標籤</span>
            <span style="width: 220px; text-align: center;">選項</span>
            <span style="width: 140px;">Lookup</span>
        </div>

        <!-- Column items -->
        <ul class="dc-col-list" x-show="!loadingCols && columns.length > 0">
            <template x-for="(col, idx) in columns" :key="col.column">
                <li class="dc-col-item" :class="col.is_system ? 'dc-system-col' : ''">
                    <span class="drag-handle" style="width: 30px; text-align: center;">
                        <i class="ri-draggable" style="font-size: 14px;"></i>
                        <span style="font-size: 11px; color: #bbb;" x-text="idx + 1"></span>
                    </span>
                    <span class="col-name">
                        <span x-text="col.column"></span>
                        <span x-show="col.is_system" class="dc-sys-badge"
                              :title="col.system_reason === 'approval_table' ? '签核表系统欄位'
                                     : col.system_reason === 'pii_encrypted' ? 'PII 加密欄位'
                                     : '系統欄位'">SYS</span>
                    </span>
                    <span class="col-type" x-text="col.db_type"></span>
                    <span class="col-label">
                        <input type="text" x-model="col.label" :placeholder="col.column">
                    </span>
                    <span class="col-checks">
                        <label><input type="checkbox" x-model="col.visible"> 列表</label>
                        <label><input type="checkbox" x-model="col.visible_in_form"> 表單</label>
                        <label><input type="checkbox" x-model="col.readonly"
                                      :disabled="col.is_system"
                                      @change="if(col.is_system) col.readonly = true"> 唯讀</label>
                    </span>
                    <span style="min-width: 140px;"
                          x-show="col.db_type && (col.db_type.indexOf('VARCHAR') >= 0 || col.db_type.indexOf('TEXT') >= 0 || col.db_type.indexOf('character') >= 0)">
                        <select x-model="col.lookup_category_code" style="padding: 3px 6px; font-size: 11px; width: 100%;">
                            <option value="">-- Lookup --</option>
                            <template x-for="lk in lookupCategories" :key="lk.code">
                                <option :value="lk.code" x-text="lk.name + ' (' + lk.code + ')'"></option>
                            </template>
                        </select>
                    </span>
                </li>
            </template>
        </ul>
    </div>

    <!-- Toast -->
    <div x-show="toast.show" x-cloak class="dc-toast" :class="toast.type"
         x-text="toast.message" x-transition></div>
</div>

<script src="/static/modules/nocode_builder/js/view-config.js"></script>
{% endblock %}
