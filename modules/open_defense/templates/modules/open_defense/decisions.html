{% extends "layouts/base.html" %}
{% block title %}決策列表 - OpenDefense{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ app_prefix }}/static/modules/open_defense/css/od-common.css">
{% endblock %}

{% block content %}
<div class="od-container" x-data="odDecisions()" x-init="load()">

    <div class="od-header">
        <div>
            <h1>防禦決策</h1>
            <p>所有經本平台簽發的決策。pending = 等執行端拉取;applied = 已落地;expired/revoked = 已結束。</p>
        </div>
        <button class="btn btn-secondary" @click="load()">重新整理</button>
    </div>

    <div class="od-section">
        <div class="od-filters">
            <label>狀態</label>
            <select x-model="filters.status" @change="load()">
                <option value="">全部</option>
                <option value="pending">pending</option>
                <option value="picked_up">picked_up</option>
                <option value="applied">applied</option>
                <option value="partial">partial</option>
                <option value="failed">failed</option>
                <option value="expired">expired</option>
                <option value="revoked">revoked</option>
            </select>
            <label>動作</label>
            <select x-model="filters.action" @change="load()">
                <option value="">全部</option>
                <option value="block">block</option>
                <option value="unblock">unblock</option>
                <option value="allow">allow</option>
                <option value="escalate">escalate</option>
                <option value="observe">observe</option>
            </select>
            <label>目標包含</label>
            <input type="text" x-model="filters.target" @keyup.enter="load()" placeholder="如 203.0">
            <label>筆數</label>
            <select x-model="filters.limit" @change="load()">
                <option>50</option><option>100</option><option>200</option><option>500</option>
            </select>
            <span style="margin-left:auto;font-size:12px;color:#666;" x-text="`共 ${decisions.length} 筆`"></span>
        </div>
        <div x-show="loading" class="od-empty">載入中...</div>
        <div x-show="!loading && decisions.length===0" class="od-empty">無資料</div>
        <table x-show="!loading && decisions.length>0" class="od-table">
            <thead>
                <tr>
                    <th>建立時間</th>
                    <th>動作</th>
                    <th>目標</th>
                    <th>EP</th>
                    <th>嚴重度</th>
                    <th>TTL</th>
                    <th>狀態</th>
                    <th>執行方</th>
                    <th>來源</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <template x-for="d in decisions" :key="d.secure_code">
                    <tr>
                        <td x-text="OD.formatTime(d.created_at, 'short')"></td>
                        <td><span class="od-mono" x-text="d.action"></span></td>
                        <td>
                            <div style="font-size:11px;color:#888;" x-text="d.target_type"></div>
                            <div class="od-mono" x-text="d.target_value"></div>
                        </td>
                        <td>
                            <template x-for="ep in d.enforcement_points">
                                <span class="od-badge od-badge-active" style="margin-right:4px;" x-text="ep"></span>
                            </template>
                        </td>
                        <td x-text="d.severity || '-'"></td>
                        <td>
                            <span x-show="d.ttl_seconds" x-text="d.ttl_seconds + 's'"></span>
                            <span x-show="!d.ttl_seconds" style="color:#999;">永久</span>
                        </td>
                        <td>
                            <span class="od-badge"
                                  :class="`od-badge-${d.status === 'picked_up' ? 'picked' : d.status}`"
                                  x-text="d.status"></span>
                        </td>
                        <td>
                            <div x-text="d.applied_by || '-'" style="font-size:12px;"></div>
                            <div x-show="d.error_message" style="font-size:11px;color:#dc2626;" x-text="d.error_message"></div>
                        </td>
                        <td>
                            <div style="font-size:11px;" x-text="d.decided_via"></div>
                        </td>
                        <td class="od-actions">
                            <button x-show="d.status==='applied' && d.action!=='unblock'"
                                    class="btn btn-sm btn-secondary"
                                    @click="revoke(d)">撤銷</button>
                        </td>
                    </tr>
                </template>
            </tbody>
        </table>
    </div>

</div>
<script>
window.__OD_API = '{{ app_prefix }}/api/open_defense/admin';
</script>
<script src="{{ app_prefix }}/static/modules/open_defense/js/od-common.js"></script>
<script src="{{ app_prefix }}/static/modules/open_defense/js/od-decisions.js"></script>
{% endblock %}
