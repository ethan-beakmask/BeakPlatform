{% extends "layouts/base.html" %}

{% block title %}多面向規格 - BeakPlatform{% endblock %}

{% block head %}
<link rel="stylesheet" href="/static/modules/spec_formulate/css/spec-multifaceted.css">
{% endblock %}

{% block content %}
<div class="mf-container" x-data="specMultifacetedManager()">

    <!-- Header -->
    <div class="mf-header">
        <div>
            <h1>多面向規格管理</h1>
        </div>
        <div class="mf-toolbar">
            <button class="mf-btn" @click="loadSpecs()" :disabled="loading">重新載入</button>
            <button class="mf-btn primary" @click="openCreate()">新增規格</button>
        </div>
    </div>

    <!-- Loading -->
    <div x-show="loading" class="mf-loading">載入中...</div>

    <!-- Empty -->
    <div x-show="!loading && specs.length === 0" class="mf-empty">
        <p>尚未建立任何多面向規格</p>
        <button class="mf-btn primary" @click="openCreate()" style="margin-top: 8px;">建立第一個規格</button>
    </div>

    <!-- List -->
    <div x-show="!loading && specs.length > 0" class="mf-card">
        <table class="mf-table">
            <thead>
                <tr>
                    <th style="width: 200px;">規格名稱</th>
                    <th style="width: 60px;">版本</th>
                    <th style="width: 70px;">欄位數</th>
                    <th style="width: 180px;">已啟用格式</th>
                    <th style="width: 100px;">狀態</th>
                    <th style="width: 120px;">最後修改</th>
                    <th style="width: 160px;">更新時間</th>
                    <th class="mf-actions" style="width: 140px;">操作</th>
                </tr>
            </thead>
            <tbody>
                <template x-for="s in specs" :key="s.secure_code">
                    <tr>
                        <td>
                            <a href="#" @click.prevent="openEdit(s)"
                               style="font-weight: 500; text-decoration: none;"
                               x-text="s.name"></a>
                        </td>
                        <td x-text="'v' + s.version"></td>
                        <td x-text="s.field_count"></td>
                        <td>
                            <template x-for="f in (s.active_facets || [])" :key="f">
                                <span class="mf-facet-badge" :class="f" x-text="f"></span>
                            </template>
                            <span x-show="!s.active_facets || s.active_facets.length === 0"
                                  style="font-size: 11px; color: #9ca3af;">-</span>
                        </td>
                        <td>
                            <span class="mf-badge" :class="s.status" x-text="s.status"></span>
                        </td>
                        <td style="font-size: 12px; color: #6b7280;" x-text="s.last_modified_by_name || '-'"></td>
                        <td style="font-size: 12px; color: #6b7280;" x-text="formatDate(s.updated_at)"></td>
                        <td class="mf-actions">
                            <button @click="openEdit(s)">編輯</button>
                            <button class="danger" @click="confirmDelete(s)">刪除</button>
                        </td>
                    </tr>
                </template>
            </tbody>
        </table>
    </div>

    <!-- Create Modal -->
    <div x-show="showCreateModal" x-cloak class="mf-modal">
        <div class="mf-modal-content">
            <div class="mf-modal-header">
                <h3>新增多面向規格</h3>
                <button @click="showCreateModal = false"
                        style="background: none; border: none; font-size: 20px; cursor: pointer;">&times;</button>
            </div>
            <div class="mf-modal-body">
                <div class="mf-form-group">
                    <label>規格名稱</label>
                    <input type="text" x-model="createForm.name" placeholder="例如：訂單資料表" autofocus>
                </div>
                <div class="mf-form-group">
                    <label>描述（選填）</label>
                    <textarea x-model="createForm.description" placeholder="規格用途說明"></textarea>
                </div>
            </div>
            <div class="mf-modal-footer">
                <button class="mf-btn" @click="showCreateModal = false">取消</button>
                <button class="mf-btn primary" @click="confirmCreate()" :disabled="creating">
                    <span x-show="!creating">建立</span>
                    <span x-show="creating">建立中...</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Delete Confirm Modal -->
    <div x-show="showDeleteModal" x-cloak class="mf-modal">
        <div class="mf-modal-content" style="width: 400px;">
            <div class="mf-modal-header">
                <h3>確認刪除</h3>
                <button @click="showDeleteModal = false"
                        style="background: none; border: none; font-size: 20px; cursor: pointer;">&times;</button>
            </div>
            <div class="mf-modal-body">
                <p>確定要刪除規格「<strong x-text="deleteTarget ? deleteTarget.name : ''"></strong>」？</p>
                <p style="font-size: 12px; color: #6b7280;">此操作為軟刪除，資料不會真正移除。</p>
            </div>
            <div class="mf-modal-footer">
                <button class="mf-btn" @click="showDeleteModal = false">取消</button>
                <button class="mf-btn danger" @click="doDelete()" :disabled="deleting">
                    <span x-show="!deleting">確認刪除</span>
                    <span x-show="deleting">刪除中...</span>
                </button>
            </div>
        </div>
    </div>

</div>

<script src="/static/modules/spec_formulate/js/spec-multifaceted.js"></script>
{% endblock %}
