{% extends "layouts/base.html" %}

{% block title %}多面向規格編輯器 - BeakPlatform{% endblock %}

{% block head %}
<link rel="stylesheet" href="/static/modules/spec_formulate/vendor/tabulator_bootstrap5.min.css">
<link rel="stylesheet" href="/static/modules/spec_formulate/css/spec-multifaceted-editor.css">
<script src="/static/modules/spec_formulate/vendor/tabulator.min.js"></script>
{% endblock %}

{% block content %}
<script>
window.__MF_SPEC_CONFIG = {
    specSc: '{{ spec_sc or "" }}'
};
</script>

<div class="mfe-container" x-data="specMultifacetedEditor()">

    <!-- Header -->
    <div class="mfe-header">
        <h1>多面向規格編輯器</h1>
        <div class="mfe-meta">
            <input type="text" x-model="specName" placeholder="規格名稱"
                   @input.debounce.500ms="autoTranslateTableName()">
            <input type="text" x-model="specTableName" placeholder="資料表名稱"
                   style="font-family: Consolas, monospace; font-size: 12px; max-width: 200px; margin-left: 6px;">
            <template x-if="specVersion">
                <span> | v<span x-text="specVersion"></span></span>
            </template>
            <template x-if="activeFacets.length > 0">
                <span> | 已啟用:
                    <template x-for="af in activeFacets" :key="af">
                        <span class="mf-facet-badge" :class="af" x-text="af" style="margin-left: 2px;"></span>
                    </template>
                </span>
            </template>
        </div>
    </div>

    <!-- Toolbar -->
    <div class="mfe-toolbar">
        <div class="toolbar-group">
            <button class="mfe-btn" @click="addColumn()">+ 欄位</button>
            <button class="mfe-btn danger" @click="deleteSelectedRows()">刪除選取</button>
        </div>
        <div class="toolbar-group">
            <button class="mfe-btn primary" @click="saveSpec()" :disabled="saving">
                <span x-show="!saving">儲存</span>
                <span x-show="saving">儲存中...</span>
            </button>
            <button class="mfe-btn" @click="loadHistory()" :disabled="!specVersion || historyLoading">版本</button>
        </div>
        <div class="toolbar-group">
            <span style="font-size: 11px; color: #6b7280; padding-right: 4px;">啟用格式:</span>
            <button class="mfe-btn facet-postgresql"
                    :class="{'facet-active': activeFacets.indexOf('postgresql') >= 0}"
                    @click="populateFacet('postgresql')"
                    :disabled="saving">PostgreSQL</button>
            <button class="mfe-btn facet-formio"
                    :class="{'facet-active': activeFacets.indexOf('formio') >= 0}"
                    @click="populateFacet('formio')"
                    :disabled="saving">FormIO</button>
            <button class="mfe-btn facet-excel"
                    :class="{'facet-active': activeFacets.indexOf('excel') >= 0}"
                    @click="populateFacet('excel')"
                    :disabled="saving">Excel</button>
            <button class="mfe-btn facet-csv"
                    :class="{'facet-active': activeFacets.indexOf('csv') >= 0}"
                    @click="populateFacet('csv')"
                    :disabled="saving">CSV</button>
        </div>
        <div class="toolbar-group" x-show="specSc">
            <span style="font-size: 11px; color: #6b7280; padding-right: 4px;">FormIO:</span>
            <template x-if="!linkedFormTemplateSc">
                <span style="display: inline-flex; gap: 4px;">
                    <button class="mfe-btn" @click="openLinkFormModal()">關聯表單</button>
                    <button class="mfe-btn" @click="openCreateFormModal()"
                            :disabled="activeFacets.indexOf('formio') < 0">建立表單</button>
                </span>
            </template>
            <template x-if="linkedFormTemplateSc">
                <span style="display: inline-flex; align-items: center; gap: 4px;">
                    <span style="font-size: 12px;" x-text="'已關聯: ' + (linkedFormTemplateName || linkedFormTemplateSc)"></span>
                    <button class="mfe-btn danger" style="padding: 2px 6px; font-size: 11px;"
                            @click="unlinkForm()">解除</button>
                </span>
            </template>
        </div>
        <div class="toolbar-group" x-show="specSc">
            <span style="font-size: 11px; color: #6b7280; padding-right: 4px;">PG:</span>
            <template x-if="!linkedSqlTable">
                <span style="display: inline-flex; gap: 4px;">
                    <button class="mfe-btn" @click="openReadTableModal()">讀入資料表</button>
                    <button class="mfe-btn" @click="pgCreateTable()"
                            :disabled="activeFacets.indexOf('postgresql') < 0 || !specTableName">新建資料表</button>
                </span>
            </template>
            <template x-if="linkedSqlTable">
                <span style="display: inline-flex; align-items: center; gap: 4px;">
                    <span style="font-size: 12px; font-family: Consolas, monospace;" x-text="'已關聯: ' + linkedSqlTable"></span>
                    <button class="mfe-btn danger" style="padding: 2px 6px; font-size: 11px;"
                            @click="pgUnlinkTable()">解除</button>
                </span>
            </template>
        </div>
    </div>

    <!-- Loading -->
    <div x-show="loading" style="padding: 40px; text-align: center; color: #9ca3af;">載入中...</div>

    <!-- Field Grid -->
    <div x-show="!loading" class="mfe-card">
        <div class="mfe-summary">
            <span>共 <strong x-text="projectionFields.length"></strong> 個欄位</span>
            <span x-show="projectionFields.filter(function(f){return f.core && f.core.is_pii;}).length > 0">
                PII: <strong x-text="projectionFields.filter(function(f){return f.core && f.core.is_pii;}).length"></strong>
            </span>
        </div>
        <div id="mf-field-grid"></div>
        <div class="mfe-add-row-bar">
            <button class="mfe-btn" @click="addEmptyRows(10)" style="font-size: 12px; padding: 3px 12px;">
                [+] 新增 10 列空白欄位
            </button>
        </div>
    </div>

    <!-- Facet Projection Panel -->
    <template x-if="activeFacets.length > 0 && !loading">
        <div class="mfe-facet-panel">
            <div class="mfe-facet-tabs">
                <template x-for="af in activeFacets" :key="af">
                    <div class="mfe-facet-tab" :class="[af, activeFacetTab === af ? 'active' : '']"
                         @click="activeFacetTab = af" x-text="af"></div>
                </template>
            </div>
            <div class="mfe-facet-body" x-show="activeFacetTab">
                <table class="mfe-facet-table">
                    <thead>
                        <tr>
                            <th style="width: 140px;">Field Key</th>
                            <th style="width: 120px;">Label</th>
                            <th style="width: 100px;">Data Class</th>
                            <th>格式映射</th>
                            <th style="width: 80px;">狀態</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template x-for="f in projectionFields" :key="f.field_key">
                            <tr>
                                <td class="mono" x-text="f.field_key"></td>
                                <td x-text="f.label"></td>
                                <td x-text="_dcValues[(f.core||{}).data_class] || (f.core||{}).data_class || '-'"></td>
                                <td>
                                    <template x-if="getFacetProjection(f, activeFacetTab)">
                                        <span class="mono" x-text="JSON.stringify(getFacetProjection(f, activeFacetTab))"></span>
                                    </template>
                                    <template x-if="!getFacetProjection(f, activeFacetTab)">
                                        <span class="unsupported"
                                              x-text="getFacetSupportInfo((f.core||{}).data_class, activeFacetTab).supported ? '(未填充)' : '不支援'"></span>
                                    </template>
                                </td>
                                <td>
                                    <template x-if="getFacetSupportInfo((f.core||{}).data_class, activeFacetTab).supported">
                                        <span style="color: #059669; font-size: 11px;">支援</span>
                                    </template>
                                    <template x-if="!getFacetSupportInfo((f.core||{}).data_class, activeFacetTab).supported">
                                        <span style="color: #dc2626; font-size: 11px;">不支援</span>
                                    </template>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>
    </template>

    <!-- History Panel -->
    <template x-if="showHistory">
        <div class="mfe-history-panel">
            <div class="mfe-history-header">
                <span>版本歷史</span>
                <button class="mfe-btn" style="padding: 3px 10px; font-size: 12px;" @click="showHistory = false">關閉</button>
            </div>
            <div class="mfe-history-list">
                <template x-if="histories.length === 0">
                    <p style="padding: 16px; text-align: center; color: #9ca3af; font-size: 13px;">無歷史記錄</p>
                </template>
                <template x-for="h in histories" :key="h.secure_code">
                    <div class="mfe-history-item">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <div>
                                <span class="mfe-history-version">v<span x-text="h.version"></span></span>
                                <span style="margin-left: 8px; color: #6b7280;" x-text="h.change_description || ''"></span>
                            </div>
                        </div>
                        <div class="mfe-history-meta">
                            <span x-text="h.changed_by_name || '系統'"></span> |
                            <span x-text="formatDate(h.created_at)"></span> |
                            <span x-text="(h.fields_snapshot || []).length + ' 個欄位'"></span>
                            <template x-if="h.active_facets_snapshot && h.active_facets_snapshot.length > 0">
                                <span> | 格式:
                                    <template x-for="af in h.active_facets_snapshot" :key="af">
                                        <span class="mf-facet-badge" :class="af" x-text="af" style="margin-left: 2px;"></span>
                                    </template>
                                </span>
                            </template>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </template>

    <!-- Detail Modal -->
    <div x-show="showDetailModal" x-cloak class="mfe-modal">
        <div class="mfe-modal-content">
            <div class="mfe-modal-header">
                <h3>進階設定</h3>
                <button @click="closeDetail()" style="background: none; border: none; font-size: 20px; cursor: pointer;">&times;</button>
            </div>
            <div class="mfe-modal-body">
                <!-- 基本資訊 -->
                <div class="mfe-detail-info">
                    <div><span class="info-label">Field Key:</span><span x-text="detailForm.field_key || '-'"></span></div>
                    <div><span class="info-label">Label:</span><span x-text="detailForm.label || '-'"></span></div>
                    <div><span class="info-label">Data Class:</span><span x-text="_dcValues[(detailForm.core||{}).data_class] || '-'"></span></div>
                </div>

                <!-- Core 設定 -->
                <div class="mfe-form-group">
                    <label>預設值</label>
                    <input type="text" x-model="detailForm.core.default_value" placeholder="(無)">
                </div>

                <!-- Facet 區塊 -->
                <template x-for="af in activeFacets" :key="af">
                    <div class="mfe-facet-section">
                        <div class="mfe-facet-section-title">
                            <span class="badge" :class="af" x-text="af"></span>
                            <span>格式設定</span>
                            <template x-if="!getFacetSupportInfo((detailForm.core||{}).data_class, af).supported">
                                <span style="color: #dc2626; font-size: 11px; margin-left: 8px;">(此 data_class 不支援)</span>
                            </template>
                        </div>
                        <template x-if="detailForm.facets && detailForm.facets[af]">
                            <div style="font-size: 12px;">
                                <pre style="margin: 0; padding: 8px; background: #f3f4f6; border-radius: 3px; font-size: 11px; overflow-x: auto;"
                                     x-text="JSON.stringify(detailForm.facets[af], null, 2)"></pre>
                            </div>
                        </template>
                        <template x-if="!detailForm.facets || !detailForm.facets[af]">
                            <div style="font-size: 12px; color: #9ca3af;">尚未填充</div>
                        </template>
                    </div>
                </template>
            </div>
            <div class="mfe-modal-footer">
                <button class="mfe-btn" @click="closeDetail()">取消</button>
                <button class="mfe-btn primary" @click="saveDetail()">確認</button>
            </div>
        </div>
    </div>

    <!-- Link Form Modal -->
    <div x-show="showLinkFormModal" x-cloak class="mfe-modal">
        <div class="mfe-modal-content" style="width: 480px;">
            <div class="mfe-modal-header">
                <h3>關聯表單模板</h3>
                <button @click="showLinkFormModal = false"
                        style="background: none; border: none; font-size: 20px; cursor: pointer;">&times;</button>
            </div>
            <div class="mfe-modal-body">
                <div x-show="linkTemplatesLoading" style="padding: 16px; text-align: center; color: #9ca3af;">載入中...</div>
                <div x-show="!linkTemplatesLoading && linkTemplates.length === 0"
                     style="padding: 16px; text-align: center; color: #9ca3af; font-size: 13px;">
                    目前沒有可關聯的表單模板
                </div>
                <div x-show="!linkTemplatesLoading && linkTemplates.length > 0" class="mfe-form-group">
                    <label>選擇表單模板</label>
                    <select x-model="linkSelectedSc">
                        <option value="">-- 選擇 --</option>
                        <template x-for="t in linkTemplates" :key="t.secure_code">
                            <option :value="t.secure_code" x-text="t.name + ' (' + t.code + ')'"></option>
                        </template>
                    </select>
                </div>
            </div>
            <div class="mfe-modal-footer">
                <button class="mfe-btn" @click="showLinkFormModal = false">取消</button>
                <button class="mfe-btn primary" @click="confirmLinkForm()"
                        :disabled="!linkSelectedSc || linkSubmitting">
                    <span x-show="!linkSubmitting">確認關聯</span>
                    <span x-show="linkSubmitting">關聯中...</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Create Form Modal -->
    <div x-show="showCreateFormModal" x-cloak class="mfe-modal">
        <div class="mfe-modal-content" style="width: 480px;">
            <div class="mfe-modal-header">
                <h3>建立 FormIO 表單</h3>
                <button @click="showCreateFormModal = false"
                        style="background: none; border: none; font-size: 20px; cursor: pointer;">&times;</button>
            </div>
            <div class="mfe-modal-body">
                <div class="mfe-form-group">
                    <label>表單名稱</label>
                    <input type="text" x-model="createFormName" :placeholder="specName">
                </div>
                <div class="mfe-form-group">
                    <label>表單代碼（選填，留空自動產生）</label>
                    <input type="text" x-model="createFormCode" placeholder="FT_XXXXXXXX">
                </div>
            </div>
            <div class="mfe-modal-footer">
                <button class="mfe-btn" @click="showCreateFormModal = false">取消</button>
                <button class="mfe-btn primary" @click="confirmCreateForm()"
                        :disabled="createFormSubmitting">
                    <span x-show="!createFormSubmitting">建立並關聯</span>
                    <span x-show="createFormSubmitting">建立中...</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Read Table Modal -->
    <div x-show="showReadTableModal" x-cloak class="mfe-modal">
        <div class="mfe-modal-content" style="width: 600px;">
            <div class="mfe-modal-header">
                <h3>讀入資料表</h3>
                <button @click="showReadTableModal = false"
                        style="background: none; border: none; font-size: 20px; cursor: pointer;">&times;</button>
            </div>
            <div class="mfe-modal-body">
                <div x-show="pgTablesLoading" style="padding: 16px; text-align: center; color: #9ca3af;">載入中...</div>

                <!-- 選擇表 -->
                <div x-show="!pgTablesLoading" class="mfe-form-group">
                    <label>選擇資料表</label>
                    <select x-model="pgSelectedTable" @change="pgCompareTable()">
                        <option value="">-- 選擇 --</option>
                        <template x-for="t in pgTables" :key="t">
                            <option :value="t" x-text="t"></option>
                        </template>
                    </select>
                </div>

                <!-- 比對結果 -->
                <div x-show="pgCompareResult" style="margin-top: 8px;">
                    <template x-if="pgCompareResult && pgCompareResult.match">
                        <div style="padding: 12px; background: #d1fae5; border-radius: 4px; font-size: 13px; color: #065f46;">
                            結構完全一致
                        </div>
                    </template>
                    <template x-if="pgCompareResult && !pgCompareResult.match">
                        <div>
                            <div x-show="pgCompareResult.spec_only.length > 0" style="margin-bottom: 6px;">
                                <div style="font-size: 12px; font-weight: 600; color: #b45309;">SPEC 有但資料表無:</div>
                                <template x-for="c in pgCompareResult.spec_only" :key="c.field_key">
                                    <div style="font-size: 12px; padding-left: 12px; font-family: Consolas, monospace;"
                                         x-text="c.field_key + ' (' + c.pg_type + ')'"></div>
                                </template>
                            </div>
                            <div x-show="pgCompareResult.db_only.length > 0" style="margin-bottom: 6px;">
                                <div style="font-size: 12px; font-weight: 600; color: #6b7280;">資料表有但 SPEC 無:</div>
                                <template x-for="c in pgCompareResult.db_only" :key="c.column_name">
                                    <div style="font-size: 12px; padding-left: 12px; font-family: Consolas, monospace;"
                                         x-text="c.column_name + ' (' + c.display_type + ')'"></div>
                                </template>
                            </div>
                            <div x-show="pgCompareResult.type_mismatch.length > 0" style="margin-bottom: 6px;">
                                <div style="font-size: 12px; font-weight: 600; color: #dc2626;">型別不符:</div>
                                <template x-for="c in pgCompareResult.type_mismatch" :key="c.field_key">
                                    <div style="font-size: 12px; padding-left: 12px; font-family: Consolas, monospace;"
                                         x-text="c.field_key + ': SPEC=' + c.spec_type + ' / DB=' + c.db_type"></div>
                                </template>
                            </div>
                            <div x-show="pgCompareResult.matched.length > 0" style="margin-bottom: 6px;">
                                <div style="font-size: 12px; font-weight: 600; color: #059669;">
                                    相符: <span x-text="pgCompareResult.matched.length"></span> 個欄位
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
            <div class="mfe-modal-footer">
                <button class="mfe-btn" @click="showReadTableModal = false">取消</button>
                <template x-if="pgCompareResult && pgCompareResult.match">
                    <button class="mfe-btn primary" @click="pgLinkTable(pgSelectedTable)">直接關聯</button>
                </template>
                <template x-if="pgCompareResult && !pgCompareResult.match">
                    <span style="display: inline-flex; gap: 4px;">
                        <button class="mfe-btn" @click="pgApplySpecToTable()"
                                :disabled="pgApplying"
                                title="SPEC 的欄位定義覆蓋到資料表">
                            <span x-show="!pgApplying">SPEC 覆蓋資料表</span>
                            <span x-show="pgApplying">執行中...</span>
                        </button>
                        <button class="mfe-btn primary" @click="pgLinkTable(pgSelectedTable)"
                                title="直接關聯，不修改資料表">僅關聯</button>
                    </span>
                </template>
            </div>
        </div>
    </div>

</div>

<script src="/static/modules/spec_formulate/js/spec-multifaceted-editor.js"></script>
{% endblock %}
