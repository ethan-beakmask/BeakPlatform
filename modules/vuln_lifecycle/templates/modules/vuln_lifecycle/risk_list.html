{% extends "layouts/base.html" %}
{% block title %}風險調整{% endblock %}

{% block head %}
<link rel="stylesheet" href="/static/modules/vuln_lifecycle/css/vuln-common.css">
{% endblock %}

{% block content %}
<div class="vlc-container">

    <div class="vlc-page-header">
        <h1>風險調整紀錄</h1>
    </div>

    <!-- 篩選列 -->
    <div class="vlc-filter-bar">
        <label>狀態</label>
        <select id="filter-status" onchange="loadAdj()">
            <option value="ACTIVE">生效中</option>
            <option value="EXPIRED">已過期</option>
            <option value="REVOKED">已撤銷</option>
            <option value="SUPERSEDED">已取代</option>
        </select>
        <span class="vlc-filter-count" id="adj-count"></span>
    </div>

    <!-- 風險調整表 -->
    <div class="vlc-section">
        <div class="vlc-section-body">
            <table class="vlc-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>資產</th>
                        <th>弱點</th>
                        <th>調整類型</th>
                        <th>調整後嚴重度</th>
                        <th>審核人</th>
                        <th>到期日</th>
                        <th>理由</th>
                    </tr>
                </thead>
                <tbody id="adj-table">
                    <tr><td colspan="8" class="vlc-empty">載入中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
{% endblock %}

{% block scripts %}
<script>
(function() {
    var ADJ_LABEL = {
        'ACCEPTED': '已接受', 'MITIGATED': '已緩解',
        'FALSE_POSITIVE': '誤報', 'DEFERRED': '延後處理'
    };

    window.loadAdj = function() {
        var st = document.getElementById('filter-status').value;
        fetch('/api/vuln-lifecycle/risk/adjustments?status=' + st)
        .then(function(r) {
            if (r.status === 503) {
                document.getElementById('adj-count').innerHTML =
                    '<span style="color:#dc3545;font-weight:bold;">未安裝弱點管理模組</span>';
                return null;
            }
            return r.json();
        })
        .then(function(r) {
            if (!r || !r.success) return;
            document.getElementById('adj-count').textContent = r.data.length + ' 筆紀錄';
            var html = '';
            r.data.forEach(function(a) {
                var exp = a.expires_at ? a.expires_at.substring(0, 10) : '-';
                var adjType = ADJ_LABEL[a.adjustment_type] || a.adjustment_type;
                var adjClass = 'vlc-adj-badge vlc-adj-' + (a.adjustment_type || '').toLowerCase();
                var vn = (a.vuln_name || '-');
                var short = vn.length > 40 ? vn.substring(0, 40) + '...' : vn;
                html += '<tr>';
                html += '<td>' + a.id + '</td>';
                html += '<td><a href="/vuln/assets/' + a.asset_id + '">' + (a.ip || '-') + '</a></td>';
                html += '<td title="' + vn.replace(/"/g, '&quot;') + '">' + short;
                if (a.cve) html += ' <small style="color:#999">' + a.cve + '</small>';
                html += '</td>';
                html += '<td><span class="' + adjClass + '">' + adjType + '</span></td>';
                html += '<td>' + (a.adjusted_severity != null ? Number(a.adjusted_severity).toFixed(1) : '-') + '</td>';
                html += '<td>' + (a.reviewer || '-') + '</td>';
                html += '<td>' + exp + '</td>';
                html += '<td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" ' +
                    'title="' + (a.justification || '').replace(/"/g, '&quot;') + '">' +
                    (a.justification || '-') + '</td>';
                html += '</tr>';
            });
            document.getElementById('adj-table').innerHTML =
                html || '<tr><td colspan="8" class="vlc-empty">無紀錄</td></tr>';
        });
    };

    loadAdj();
})();
</script>
{% endblock %}
