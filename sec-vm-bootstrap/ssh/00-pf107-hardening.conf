# PF-107（2026-08-16）：停用密碼認證，只收公鑰。
#
# 檔名的 00- 是必要的：sshd_config 的語意是 first obtained value wins，
# 而 Include 按字典序讀 /etc/ssh/sshd_config.d/*.conf。
# 50-cloud-init.conf 寫死 PasswordAuthentication yes，
# 用 99- 之類的名字會被它先設定的值蓋過去，而且不會有任何錯誤訊息。
#
# 決策脈絡（Ethan 2026-08-16）：與其輪替 OS 密碼，不如把密碼強度這個變數
# 從攻擊面移除。密碼一定會流進對話記錄與交接文件，交談式 AI 遲早讓它再外洩一次。
# 22 埠另有 nftables 來源白名單（.10/.16/.100），見 nftables-bootstrap.sh。
#
# 影響：claude 這個 OS 帳號沒有 ~/.ssh/authorized_keys，本設定生效後它
# 完全失去遠端入口（僅剩主控台）。這是預期結果，不是副作用。
#
# 鎖死時的退路：PVE Web UI → VM 110 (sec-vm) → Console，不經過網路堆疊。
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
