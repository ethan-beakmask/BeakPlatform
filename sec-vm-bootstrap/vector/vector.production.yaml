# =============================================================
# Vector — collect → normalize (OCSF) → fan-out
# =============================================================
# sources:  suricata EVE file, internal HTTP for testing
# transforms: parse + map → OCSF
# sinks:  clickhouse (raw + extracted),  od-bridge (HTTP)
# =============================================================

api:
  enabled: true
  address: 0.0.0.0:8686       # LAN-accessible playground; bind 127.0.0.1 in 多人/外網環境

# ---------------- sources ----------------
sources:

  # Suricata EVE JSON (one event per line)
  suricata_eve:
    type: file
    include:
      - /var/log/suricata/eve.json
    read_from: end
    ignore_older_secs: 600

  # ModSecurity audit log (JSON-per-line via MODSEC_AUDIT_LOG_FORMAT=JSON)
  modsec_audit:
    type: file
    include:
      - /var/log/modsec/audit.log
    read_from: end
    ignore_older_secs: 600

  # Test source: HTTP server for synthetic events (e.g. curl test from PVE host)
  http_test:
    type: http_server
    address: 0.0.0.0:8688
    encoding: json
    method: POST


# ---------------- transforms ----------------
transforms:

  # Parse Suricata EVE then keep only alerts of interest
  suricata_parsed:
    type: remap
    inputs: [suricata_eve]
    source: |
      . = parse_json!(.message)
      .timestamp = parse_timestamp!(.timestamp, "%+")

  suricata_alerts_only:
    type: filter
    inputs: [suricata_parsed]
    condition: '.event_type == "alert"'

  # Map Suricata alert → OCSF (network_activity)
  # PF-105 2026-08-15 修正：
  #   - actor.ip 直接讀 .src_ip。suricata.yaml 的 xff 模組（mode: overwrite,
  #     header: CF-Connecting-IP）已經在 Suricata 內部把 src_ip 覆寫成該 header 值，
  #     XFF/CF-Connecting-IP 不存在時維持 TCP source（此檔原本讀頂層 .xff 欄位其實
  #     不存在——eve.json 實際只有 .alert.xff / .http.xff，這裡的舊寫法從未生效過，
  #     一直是靠 src_ip 已被覆寫這件事在運作，現在把邏輯寫對）。
  #   - actor.xff 新增：完整 X-Forwarded-For 原文（證據欄位，不影響 actor.ip 判定）。
  #     來源是 .http.xff——實測發現（見 suricata.production.yaml 同段註解）這個
  #     欄位不受 xff.header 設定影響，固定就是 X-Forwarded-For 的完整原文，
  #     跟 suricata xff 模組（現在抓 CF-Connecting-IP 覆寫 src_ip）完全分開，
  #     兩者不會互相污染。只在 event_type=="alert" 且該 alert 有 HTTP context
  #     （.http 存在）時才有值，非 HTTP 的 alert（如 STREAM 類）不會有這個欄位。
  ocsf_from_suricata:
    type: remap
    inputs: [suricata_alerts_only]
    source: |
      sev_id = to_int(.alert.severity) ?? 3
      # Suricata: 1=High, 2=Medium, 3=Low, 4=Info  → OCSF: 4,3,2,1
      ocsf_sev = if sev_id == 1 { 4 } else if sev_id == 2 { 3 } else if sev_id == 3 { 2 } else { 1 }

      actor_ip = to_string(.src_ip) ?? "0.0.0.0"
      actor_xff = to_string(.http.xff) ?? ""

      out = {
        "correlation_id": uuid_v4(),
        "source_system": "suricata",
        "event_class": "network_activity",
        "occurred_at": format_timestamp!(.timestamp, "%+"),
        "severity_id": ocsf_sev,
        "finding": {
          "title": to_string(.alert.signature) ?? "suricata alert",
          "summary": to_string(.alert.category) ?? "",
          "rule_id": to_string(.alert.signature_id) ?? "",
          "rule_set": "Suricata-ET"
        },
        "actor": { "ip": actor_ip, "xff": actor_xff },
        "target": {
          "host": to_string(.dest_ip) ?? "",
          "url": "",
          "service": ""
        },
        "evidence": {
          "raw_log_ref": { "type": "vector", "locator": to_string(.flow_id) ?? "" },
          "snippet": ""
        }
      }
      . = out

  # ModSecurity JSON audit → OCSF (web_activity)
  modsec_parsed:
    type: remap
    inputs: [modsec_audit]
    source: |
      . = parse_json!(.message)

  modsec_with_alerts_only:
    type: filter
    inputs: [modsec_parsed]
    condition: |
      msgs = array(.transaction.messages) ?? []
      code = to_int(.transaction.response.http_code) ?? 0
      length(msgs) > 0 || code >= 400

  ocsf_from_modsec:
    type: remap
    inputs: [modsec_with_alerts_only]
    source: |
      # 2026-08-08 修正：ModSecurity v3 的 JSON audit log 頂層只有 transaction，
      # 沒有 audit_data。原本讀 .audit_data.messages 恆為空，導致 rule_id 永遠是空字串
      # ——而 BeakPlatform 的案件聚合需要 actor_ip + rule_id，rule_id 空就不聚合，
      # 這就是「一事件一張單」對 WAF 永遠成立的真因。
      msgs = array(.transaction.messages) ?? []
      first_rule_id = ""
      title = "ModSecurity rule trigger"
      # ModSecurity 沿用 syslog 等級：0=EMERGENCY … 7=DEBUG，數字越小越嚴重。
      # 取整筆 transaction 中最嚴重的一條當案件嚴重度。
      worst_sev = 7
      if length(msgs) > 0 {
        m0 = object(msgs[0]) ?? {}
        det0 = object(m0.details) ?? {}
        first_rule_id = to_string(det0.ruleId) ?? ""
        t0 = to_string(m0.message) ?? ""
        if t0 != "" {
          title = if length(t0) > 200 { slice!(t0, 0, 200) } else { t0 }
        }
        for_each(msgs) -> |_i, msg| {
          det = object(object(msg).details ?? {}) ?? {}
          s = to_int(det.severity) ?? 7
          if s < worst_sev { worst_sev = s }
        }
      }

      # ModSec severity → OCSF severity_id (1=Low 2=Medium 3=High 4=Critical)
      sev = if worst_sev <= 2 { 4 } else if worst_sev == 3 { 3 } else if worst_sev == 4 { 2 } else { 1 }

      # actor.ip 優先取 Cloudflare 權威 header (Cf-Connecting-Ip), 退而求其次 X-Forwarded-For
      # 最左側那一筆, 最後才 fallback transaction.client_ip (TCP source = cloudflared@.16).
      # ModSec 保留 client 原始 header casing — production cloudflared 送 "Cf-Connecting-Ip",
      # 手動 curl 可能送 "CF-Connecting-IP",所以多 case fallback。
      # PF-105 2026-08-15 備忘（範圍外,留給下一張工單）：cf_ip 這條 fallback 鏈本身
      # 對「直接打 .20:8080、繞過 Cloudflare」的來源沒有防偽——WAF nginx 的
      # set_real_ip_from/real_ip_header 只影響 nginx 自己的 $$remote_addr，不會濾掉
      # ModSecurity 直接讀到的原始 Cf-Connecting-Ip header 值。本工單只加 actor.xff
      # 證據欄位，不動這條 fallback 順序。
      # xff_raw 除了原本的 fallback 用途，PF-105 起也整段原文寫進 actor.xff 當證據欄位。
      hdrs = object(.transaction.request.headers) ?? {}
      cf_ip = string(hdrs."Cf-Connecting-Ip") ?? string(hdrs."CF-Connecting-IP") ?? string(hdrs."cf-connecting-ip") ?? ""
      xff_raw = string(hdrs."X-Forwarded-For") ?? string(hdrs."x-forwarded-for") ?? ""
      xff_first = ""
      if xff_raw != "" {
        xff_parts = split(xff_raw, ",")
        xff_first_raw = to_string(xff_parts[0])
        xff_first = strip_whitespace(xff_first_raw)
      }
      tcp_src = to_string(.transaction.client_ip) ?? "0.0.0.0"
      actor_ip = if cf_ip != "" {
        cf_ip
      } else if xff_first != "" {
        xff_first
      } else {
        tcp_src
      }
      actor_country = string(hdrs."Cf-Ipcountry") ?? string(hdrs."CF-IPCountry") ?? string(hdrs."cf-ipcountry") ?? ""

      out = {
        "correlation_id": uuid_v4(),
        "source_system": "coraza",
        "event_class": "web_activity",
        "occurred_at": format_timestamp!(now(), "%+"),
        "severity_id": sev,
        "finding": {
          "title": title,
          "summary": to_string(.audit_data.messages_count) ?? "",
          "rule_id": first_rule_id,
          "rule_set": "OWASP CRS"
        },
        "actor": {
          "ip": actor_ip,
          "xff": xff_raw,
          "country": actor_country,
          "user_agent": to_string(.transaction.request.headers."User-Agent") ?? ""
        },
        "target": {
          "host": to_string(.transaction.request.headers.Host) ?? "",
          "url": to_string(.transaction.request.uri) ?? "",
          "service": "waf-nginx"
        },
        "evidence": {
          "raw_log_ref": { "type": "modsec", "locator": to_string(.transaction.id) ?? "" },
          "snippet": to_string(.transaction.request.method) ?? ""
        }
      }
      . = out

  # ClickHouse-shaped row (column extraction from OCSF JSON)
  ch_events_from_ocsf:
    type: remap
    inputs: [ocsf_from_suricata, ocsf_from_modsec, http_test]
    source: |
      raw = encode_json(.)
      ts_input = to_string(.occurred_at) ?? ""
      ts_parsed = parse_timestamp(ts_input, "%+") ?? now()
      ts_ch = format_timestamp!(ts_parsed, "%Y-%m-%d %H:%M:%S%.3f")
      . = {
        "event_time":     ts_ch,
        "correlation_id": to_string(.correlation_id) ?? uuid_v4(),
        "source_system":  to_string(.source_system) ?? "unknown",
        "event_class":    to_string(.event_class) ?? "unknown",
        "severity_id":    to_int(.severity_id) ?? 0,
        "confidence":     to_int(.confidence) ?? 0,
        "actor_ip":       to_string(.actor.ip) ?? "::",
        "actor_asn":      to_int(.actor.asn) ?? 0,
        "actor_country":  to_string(.actor.country) ?? "",
        "actor_ua":       to_string(.actor.user_agent) ?? "",
        "actor_xff":      to_string(.actor.xff) ?? "",
        "target_host":    to_string(.target.host) ?? "",
        "target_url":     to_string(.target.url) ?? "",
        "target_service": to_string(.target.service) ?? "",
        "finding_title":  to_string(.finding.title) ?? "",
        "finding_rule_id": to_string(.finding.rule_id) ?? "",
        "finding_rule_set": to_string(.finding.rule_set) ?? "",
        "raw":            raw
      }



  # 過濾規則：避免內網雜訊、自家域名、低嚴重度 Suricata 噪音灌爆 BeakPlatform
  # (ClickHouse 仍保留全部事件供事後查詢，只過濾「進入 case 流程」的部份)
  intake_filter:
    type: filter
    inputs: [ocsf_from_suricata, ocsf_from_modsec, http_test]
    condition:
      type: vrl
      source: |
        actor_ip = to_string(.actor.ip) ?? ""
        target_h = to_string(.target.host) ?? ""
        sev = to_int(.severity_id) ?? 0
        src = to_string(.source_system) ?? ""

        # 內網 ↔ 內網 全 drop (sec-stack 自家 webhook、內網設備自連)
        internal_actor = starts_with(actor_ip, "192.168.") || starts_with(actor_ip, "10.") || starts_with(actor_ip, "127.")
        internal_target = starts_with(target_h, "192.168.") || starts_with(target_h, "10.") || starts_with(target_h, "127.")

        # 2026-08-08 移除 self_domain（原：ends_with(target_h,"beakmask.org") 等）
        # 原意是排除「自家系統對自家發的 webhook」，但 target.host 對 Coraza 而言
        # 就是被攻擊站台的 Host header——打 beakmask.org 的真實攻擊全部命中此條，
        # 導致 2026-05-13~08-08 期間 intake_filter in=823 out=0，三個月零案件。
        # 「自家對自家」的情境已由 internal_actor && internal_target 涵蓋。

        # 低嚴重度 Suricata: OCSF 1=Info 才 drop. Low(2) 以上保留，避免漏掉真實低嚴重度告警。
        # ModSec/Coraza 是 inline WAF 已實際阻擋, severity 不過濾.
        low_sev_suricata = src == "suricata" && sev <= 1

        drop = (internal_actor && internal_target) || low_sev_suricata
        !drop


  # 2026-08-08 新增：送往 BeakPlatform 的速率封頂（爆量止血）
  # 緣由：2026-05-13 Suricata STREAM FP 3 小時湧入 4063 筆，.16 executor 對每事件
  # 開進程，RAM 9.4GB / load 70 整台雪崩。此處在【源頭】封頂，事件根本不離開 .20，
  # 比在 BeakPlatform 端擋更早也更省（取代 handoff_burst_protection_ABC 的急迫性）。
  # 量級依據：正常期約 150 筆/天，雪崩期 1350 筆/小時，兩者差 200 倍，好切。
  # 注意：throttle 是「丟棄」不是「聚合」，被壓掉的事件不會留下計數；
  #       ClickHouse 路徑（ch_events）走另一條 input，不受影響仍為全量。
  intake_throttle_key:
    type: remap
    inputs: [intake_filter]
    source: |
      .throttle_key = join!([
        to_string(.source_system) ?? "?",
        to_string(.finding.rule_id) ?? "?",
        to_string(.actor.ip) ?? "?"
      ], "|")

  # 2026-08-08 二次調整：throttle 由「單一閾值」改為「分來源」。
  # 起因：首版 threshold=1/300s 是為 Coraza 雪崩情境設的，Suricata 沿用同一組後，
  # 實測 intake_throttle in=110 → out=5（壓掉 95%），真攻擊與引擎雜訊被一起壓。
  # 各來源性質不同，節奏也該不同：
  #   suricata -- passive IDS，同一 rule+IP 重複性極高，且是 5/13 雪崩來源 → 收得最緊
  #   coraza   -- inline WAF 已實際阻擋，事件本身就是攻擊證據，要讓 SOC 看得到強度 → 放寬
  #   其他     -- http_test 等測試來源，維持首版設定
  # 注意 throttle 是「丟棄」不是「聚合」，被壓掉的事件不留計數；
  # ClickHouse 路徑（ch_events）走另一條 input，仍為全量。
  intake_route:
    type: route
    inputs: [intake_throttle_key]
    route:
      suricata: '.source_system == "suricata"'
      coraza: '.source_system == "coraza"'

  intake_throttle_suricata:
    type: throttle
    inputs: [intake_route.suricata]
    threshold: 1
    window_secs: 3600
    key_field: "{{ throttle_key }}"

  intake_throttle_coraza:
    type: throttle
    inputs: [intake_route.coraza]
    threshold: 5
    window_secs: 300
    key_field: "{{ throttle_key }}"

  intake_throttle_other:
    type: throttle
    inputs: [intake_route._unmatched]
    threshold: 1
    window_secs: 300
    key_field: "{{ throttle_key }}"

  # 2026-08-08 加入：全域速率上限（不分 key）。
  # 前面三條 throttle 的 key 含 actor_ip，每個 IP 各有配額——擋得住單一來源爆量，
  # 擋不住分散式掃描（17 個不同 IP 同時打就超過 .16 的安全線）。
  # .16 的實測上限：飽和點 7-8 筆/秒，但那是短時爆發；穩態安全值約 1000 筆/小時，
  # 因為每張案件會觸發 3.07 個工作流節點，而每個節點是一個 105MB 的獨立 Python 進程，
  # 且 workflow_executor 每 5 秒無條件再開 10 個、沒有併發上限。
  # 這裡取安全值的一半：8 筆 / 60 秒 ≈ 480 筆/小時。
  # 用 60 秒短窗而不是 3600 秒長窗，是為了擋瞬間爆量（長窗允許一秒內湧入 500 筆）。

  # 合成演習的事件先分流出來，繞過全域封頂——否則真被攻擊時監控訊號會被攻擊流量
  # 擠掉，變成「系統出事時監控剛好也瞎了」。canary 每小時只有 2 筆，影響可忽略。
  intake_canary_route:
    type: route
    inputs:
      - intake_throttle_suricata
      - intake_throttle_coraza
      - intake_throttle_other
    route:
      canary: |
        ip = to_string(.actor.ip) ?? ""
        rid = to_string(.finding.rule_id) ?? ""
        src = to_string(.source_system) ?? ""
        ip == "203.0.113.1" || (src == "suricata" && rid == "2013224" && ip == "192.168.0.20")

  intake_global_throttle:
    type: throttle
    inputs: [intake_canary_route._unmatched]
    threshold: 8
    window_secs: 60

  # throttle_key 是內部用欄位，送出前移除，避免污染 od-bridge 契約 payload
  intake_throttled_clean:
    type: remap
    inputs:
      - intake_canary_route.canary
      - intake_global_throttle
    source: |
      del(.throttle_key)


# ---------------- sinks ----------------
sinks:


  # Persist all OCSF events to ClickHouse
  ch_events:
    type: clickhouse
    inputs: [ch_events_from_ocsf]
    endpoint: http://clickhouse:8123
    database: ${CLICKHOUSE_DB}
    table: events
    auth:
      strategy: basic
      user: ${CLICKHOUSE_USER}
      password: ${CLICKHOUSE_PASSWORD}
    skip_unknown_fields: true
    batch:
      max_events: 500
      timeout_secs: 5
    healthcheck:
      enabled: false

  # Forward to od-bridge for upstream BeakPlatform intake
  bridge_intake:
    type: http
    inputs: [intake_throttled_clean]
    uri: http://host.docker.internal:8500/events
    method: post
    encoding:
      codec: json
    framing:
      method: newline_delimited
    request:
      headers:
        Content-Type: application/json
    batch:
      max_events: 1
      timeout_secs: 1
    healthcheck:
      enabled: false
