<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SQL Form POC{% endblock %}</title>
    <link rel="stylesheet" href="/static/vendor/bootstrap.min.css">
    <link rel="stylesheet" href="/static/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/static/vendor/formio.full.min.css">
    <style>
        body { background: #f5f5f5; }
        .navbar { background: #343a40; }
        .navbar-brand { color: #fff; font-weight: 600; }
        .navbar-brand:hover { color: #ccc; }
        .nav-link-custom { color: #adb5bd; text-decoration: none; margin-left: 1rem; }
        .nav-link-custom:hover { color: #fff; }
        .card { border: 1px solid #dee2e6; border-radius: 4px; }
        .card-header { background: #f8f9fa; font-weight: 600; }
        .btn-sm { font-size: 0.8rem; }
        .warning-box { background: #fff3cd; border: 1px solid #ffc107; border-radius: 4px; padding: 0.75rem; margin-bottom: 1rem; }
        .warning-box ul { margin-bottom: 0; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar px-3 mb-3">
        <a class="navbar-brand" href="/">SQL Form POC</a>
        <div>
            <a class="nav-link-custom" href="/">
                <i class="fas fa-list"></i> 資料表列表
            </a>
        </div>
    </nav>
    <div class="container-fluid px-4">
        {% block content %}{% endblock %}
    </div>

    <script src="/static/vendor/bootstrap.bundle.min.js"></script>
    <script src="/static/vendor/formio.full.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
