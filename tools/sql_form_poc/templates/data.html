{% extends "base.html" %}
{% block title %}資料管理 - {{ table_name }}{% endblock %}

{% block extra_css %}
<style>
    #form-container { border: 1px solid #dee2e6; border-radius: 4px; padding: 1rem; background: #fff; min-height: 100px; }
    .data-table th { font-size: 0.85rem; background: #f8f9fa; white-space: nowrap; }
    .data-table td { font-size: 0.85rem; vertical-align: middle; }
    .data-table td.actions { white-space: nowrap; }
    .edit-mode-indicator { display: inline-block; background: #ffc107; color: #000; padding: 2px 8px; border-radius: 3px; font-size: 0.8rem; font-weight: 600; }
</style>
{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-8">
        <!-- 表單區域 -->
        <div class="card mb-3">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span>
                    <i class="fas fa-edit"></i> 資料輸入:
                    <code>{{ table_name }}</code>
                    <span id="editIndicator" class="edit-mode-indicator ms-2" style="display:none;">
                        編輯模式 #<span id="editId"></span>
                    </span>
                </span>
                <a href="/tables/{{ table_name }}/designer" class="btn btn-sm btn-outline-secondary">
                    <i class="fas fa-pencil-ruler"></i> 設計版面
                </a>
            </div>
            <div class="card-body">
                <div id="warnings"></div>
                <div id="form-container"></div>
                <div class="mt-2" id="formActions" style="display:none;">
                    <button id="btnSubmit" class="btn btn-primary btn-sm" onclick="submitForm()">
                        <i class="fas fa-plus"></i> 新增
                    </button>
                    <button id="btnCancel" class="btn btn-outline-secondary btn-sm" onclick="cancelEdit()" style="display:none;">
                        <i class="fas fa-times"></i> 取消編輯
                    </button>
                </div>
            </div>
        </div>

        <!-- 資料清單 -->
        <div class="card">
            <div class="card-header">
                <i class="fas fa-list"></i> 資料清單
                <small class="text-muted ms-2">(最新 10 筆)</small>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-sm table-hover data-table mb-0" id="dataTable">
                        <thead><tr></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
                <div id="dataLoading" class="text-center py-3 text-muted">載入中...</div>
                <div id="dataEmpty" class="text-center py-3 text-muted" style="display:none;">尚無資料</div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
const TABLE_NAME = '{{ table_name }}';
let formInstance = null;
let editingId = null;
let currentColumns = [];

function showWarnings(warnings) {
    const container = document.getElementById('warnings');
    if (!warnings || warnings.length === 0) {
        container.innerHTML = '';
        return;
    }
    container.innerHTML = `
        <div class="warning-box">
            <strong><i class="fas fa-exclamation-triangle"></i> 注意</strong>
            <ul class="mt-1">${warnings.map(w => `<li>${w}</li>`).join('')}</ul>
        </div>
    `;
}

function initForm() {
    fetch(`/api/tables/${TABLE_NAME}/layout`)
        .then(r => r.json())
        .then(data => {
            showWarnings(data.warnings);
            const schema = data.layout;
            // 加 submit button
            schema.components = schema.components || [];

            Formio.createForm(document.getElementById('form-container'), schema, {
                noDefaultSubmitButton: true,
                language: 'zh-TW',
            }).then(form => {
                formInstance = form;
                document.getElementById('formActions').style.display = '';
            });
        })
        .catch(err => {
            document.getElementById('form-container').innerHTML =
                '<div class="text-danger">表單載入失敗: ' + err.message + '</div>';
        });
}

function submitForm() {
    if (!formInstance) return;

    const submission = formInstance.submission.data;
    const url = editingId
        ? `/api/tables/${TABLE_NAME}/data/${editingId}`
        : `/api/tables/${TABLE_NAME}/data`;
    const method = editingId ? 'PUT' : 'POST';

    fetch(url, {
        method: method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(submission),
    })
    .then(r => r.json())
    .then(data => {
        if (data.ok || data.id) {
            if (editingId) {
                cancelEdit();
            } else {
                formInstance.submission = { data: {} };
            }
            loadData();
        } else {
            alert('操作失敗: ' + (data.error || '未知錯誤'));
        }
    })
    .catch(err => alert('操作失敗: ' + err.message));
}

function editRow(id) {
    fetch(`/api/tables/${TABLE_NAME}/data/${id}`)
        .then(r => r.json())
        .then(row => {
            if (row.error) {
                alert(row.error);
                return;
            }
            // 日期欄位轉換為 form.io day 格式
            const data = {};
            for (const [key, value] of Object.entries(row)) {
                if (key === 'id') continue;
                data[key] = value;
            }
            formInstance.submission = { data: data };
            editingId = id;

            document.getElementById('editIndicator').style.display = '';
            document.getElementById('editId').textContent = id;
            document.getElementById('btnSubmit').innerHTML =
                '<i class="fas fa-save"></i> 更新';
            document.getElementById('btnCancel').style.display = '';
        })
        .catch(err => alert('載入失敗: ' + err.message));
}

function cancelEdit() {
    editingId = null;
    if (formInstance) {
        formInstance.submission = { data: {} };
    }
    document.getElementById('editIndicator').style.display = 'none';
    document.getElementById('btnSubmit').innerHTML =
        '<i class="fas fa-plus"></i> 新增';
    document.getElementById('btnCancel').style.display = 'none';
}

function deleteRow(id) {
    if (!confirm(`確定要刪除 #${id} 嗎？`)) return;

    fetch(`/api/tables/${TABLE_NAME}/data/${id}`, { method: 'DELETE' })
        .then(r => r.json())
        .then(data => {
            if (data.ok) {
                if (editingId === id) cancelEdit();
                loadData();
            } else {
                alert('刪除失敗: ' + (data.error || '未知錯誤'));
            }
        })
        .catch(err => alert('刪除失敗: ' + err.message));
}

function formatValue(val) {
    if (val === null || val === undefined) return '<span class="text-muted">-</span>';
    if (typeof val === 'boolean') return val ? '<i class="fas fa-check text-success"></i>' : '<i class="fas fa-times text-danger"></i>';
    if (typeof val === 'string' && val.length > 50) return val.substring(0, 50) + '...';
    return String(val);
}

function loadData() {
    fetch(`/api/tables/${TABLE_NAME}/data`)
        .then(r => r.json())
        .then(rows => {
            const loading = document.getElementById('dataLoading');
            const empty = document.getElementById('dataEmpty');
            const table = document.getElementById('dataTable');
            const thead = table.querySelector('thead tr');
            const tbody = table.querySelector('tbody');

            loading.style.display = 'none';

            if (rows.length === 0) {
                empty.style.display = '';
                thead.innerHTML = '';
                tbody.innerHTML = '';
                return;
            }

            empty.style.display = 'none';
            currentColumns = Object.keys(rows[0]);

            // 表頭
            thead.innerHTML = currentColumns.map(c => `<th>${c}</th>`).join('')
                + '<th>操作</th>';

            // 表身
            tbody.innerHTML = rows.map(row => {
                const cells = currentColumns.map(c => `<td>${formatValue(row[c])}</td>`).join('');
                return `<tr>${cells}<td class="actions">
                    <button class="btn btn-sm btn-outline-primary me-1" onclick="editRow(${row.id})">
                        <i class="fas fa-edit"></i>
                    </button>
                    <button class="btn btn-sm btn-outline-danger" onclick="deleteRow(${row.id})">
                        <i class="fas fa-trash"></i>
                    </button>
                </td></tr>`;
            }).join('');
        })
        .catch(err => {
            document.getElementById('dataLoading').textContent = '載入失敗: ' + err.message;
        });
}

document.addEventListener('DOMContentLoaded', function() {
    initForm();
    loadData();
});
</script>
{% endblock %}
