{% extends "base.html" %}
{% block title %}設計版面 - {{ table_name }}{% endblock %}

{% block extra_css %}
<style>
    #builder-container { min-height: 400px; border: 1px solid #dee2e6; border-radius: 4px; padding: 1rem; background: #fff; }
    .toolbar { margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }
    .formio-component-label { font-weight: normal !important; }
</style>
{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span>
                    <i class="fas fa-pencil-ruler"></i> 版面設計:
                    <code>{{ table_name }}</code>
                </span>
                <a href="/tables/{{ table_name }}/data" class="btn btn-sm btn-outline-primary">
                    <i class="fas fa-table"></i> 資料管理
                </a>
            </div>
            <div class="card-body">
                <div id="warnings"></div>
                <div class="toolbar">
                    <button id="btnSave" class="btn btn-primary btn-sm" onclick="saveLayout()">
                        <i class="fas fa-save"></i> 儲存版面
                    </button>
                    <button id="btnReset" class="btn btn-outline-danger btn-sm" onclick="resetLayout()">
                        <i class="fas fa-undo"></i> 重置為自動版面
                    </button>
                    <span id="statusMsg" class="text-muted ms-2"></span>
                </div>
                <div id="builder-container"></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
const TABLE_NAME = '{{ table_name }}';
let builder = null;

function showStatus(msg, isError) {
    const el = document.getElementById('statusMsg');
    el.textContent = msg;
    el.className = isError ? 'text-danger ms-2' : 'text-success ms-2';
    setTimeout(() => { el.textContent = ''; }, 3000);
}

function showWarnings(warnings) {
    const container = document.getElementById('warnings');
    if (!warnings || warnings.length === 0) {
        container.innerHTML = '';
        return;
    }
    container.innerHTML = `
        <div class="warning-box">
            <strong><i class="fas fa-exclamation-triangle"></i> 注意</strong>
            <ul class="mt-1">${warnings.map(w => `<li>${w}</li>`).join('')}</ul>
        </div>
    `;
}

function initBuilder(schema) {
    if (builder) {
        builder.destroy();
    }
    Formio.builder(document.getElementById('builder-container'), schema, {
        builder: {
            basic: false,
            advanced: false,
            data: false,
            premium: false,
            layout: {
                title: '版面元件',
                default: true,
                weight: 10,
                components: {
                    panel: true,
                    columns: true,
                    fieldset: true,
                    tabs: true,
                    well: true,
                    htmlelement: true,
                    content: true,
                }
            },
            custom: {
                title: '資料欄位',
                weight: 20,
                components: {
                    textfield: true,
                    textarea: true,
                    number: true,
                    checkbox: true,
                    select: true,
                    day: true,
                    datetime: true,
                    email: true,
                    hidden: true,
                }
            }
        },
        noDefaultSubmitButton: true,
        language: 'zh-TW',
    }).then(b => {
        builder = b;
    });
}

function loadLayout() {
    fetch(`/api/tables/${TABLE_NAME}/layout`)
        .then(r => r.json())
        .then(data => {
            showWarnings(data.warnings);
            initBuilder(data.layout);
        })
        .catch(err => showStatus('載入失敗: ' + err.message, true));
}

function saveLayout() {
    if (!builder) return;
    const schema = builder.schema;

    fetch(`/api/tables/${TABLE_NAME}/layout`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(schema),
    })
    .then(r => r.json())
    .then(data => {
        if (data.ok) {
            showStatus('版面已儲存', false);
        } else {
            showStatus('儲存失敗: ' + (data.error || '未知錯誤'), true);
        }
    })
    .catch(err => showStatus('儲存失敗: ' + err.message, true));
}

function resetLayout() {
    if (!confirm('確定要重置版面？將刪除已儲存的版面配置，恢復為自動產生的版面。')) return;

    fetch(`/api/tables/${TABLE_NAME}/layout`, { method: 'DELETE' })
        .then(r => r.json())
        .then(data => {
            if (data.ok) {
                showStatus('已重置', false);
                loadLayout();
            }
        })
        .catch(err => showStatus('重置失敗: ' + err.message, true));
}

document.addEventListener('DOMContentLoaded', loadLayout);
</script>
{% endblock %}
