{% extends "base.html" %}
{% block title %}SQL Form POC - 資料表列表{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header">
                <i class="fas fa-database"></i> 資料表列表
                <small class="text-muted ms-2">(僅顯示 fw_data_* 前綴)</small>
            </div>
            <div class="card-body">
                <table class="table table-sm table-hover mb-0" id="tableList">
                    <thead>
                        <tr>
                            <th>資料表名稱</th>
                            <th style="width: 250px;">操作</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
                <div id="loading" class="text-center py-3 text-muted">載入中...</div>
                <div id="empty" class="text-center py-3 text-muted" style="display:none;">
                    沒有找到 fw_data_* 資料表
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    fetch('/api/tables')
        .then(r => r.json())
        .then(tables => {
            const loading = document.getElementById('loading');
            const empty = document.getElementById('empty');
            const tbody = document.querySelector('#tableList tbody');
            loading.style.display = 'none';

            if (tables.length === 0) {
                empty.style.display = '';
                return;
            }

            tables.forEach(name => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><code>${name}</code></td>
                    <td>
                        <a href="/tables/${name}/designer" class="btn btn-sm btn-outline-secondary me-1">
                            <i class="fas fa-pencil-ruler"></i> 設計版面
                        </a>
                        <a href="/tables/${name}/data" class="btn btn-sm btn-outline-primary">
                            <i class="fas fa-table"></i> 資料管理
                        </a>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        })
        .catch(err => {
            document.getElementById('loading').textContent = '載入失敗: ' + err.message;
        });
});
</script>
{% endblock %}
